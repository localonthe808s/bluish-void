name: ARGO floats

# The Argo floats round North America with their newest profile to R2 argo/latest.json for WATER's ARGO FLOATS (_argobake/bake.py).
# Daily: a float surfaces every ten days, so a day is plenty.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '41 7 * * *'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _argobake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python _argobake/bake.py
