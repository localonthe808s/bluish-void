name: Beaches

# Every US beach monitoring station (EPA BEACH Act list) with its newest bacteria result (Water Quality Portal) to R2
# beach/beaches_v1.json for WATER > COAST > BEACHES (_beachbake/bake.py). Daily: in season, states upload through the week.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 9 * * *'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _beachbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: python _beachbake/bake.py beaches_v1.json
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp beaches_v1.json "s3://bluishvoid-bg/beach/beaches_v1.json" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=3600" --only-show-errors
