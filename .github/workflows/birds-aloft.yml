# EUROPE'S MIGRATION ON RADAR (2026-11-23). Bakes the latest complete night from Aloft (aloftdata.eu, CC0): ~140 European weather
# radars' vertical profiles of birds, per radar the birds crossing each km of front, heading, speed, height and an hourly curve, to
# R2 birds/aloft/latest.json, which BIRDS > FLYWAYS draws on the map. Aloft's daily files land ~03:40Z about two days after the night.
# Uses the same R2 secrets as birds-rare.yml.
name: Europe radar migration bake

on:
  schedule:
    - cron: '25 5 * * *'          # 05:25Z daily, after Aloft's ~03:40Z upload
    - cron: '25 15 * * *'         # and mid-afternoon, for radars that land late
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: birds-aloft
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _birds/aloft_bake.py
          sparse-checkout-cone-mode: false
      - name: Bake the latest night
        run: python3 -I -u _birds/aloft_bake.py out
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp out/aloft/latest.json "s3://bluishvoid-bg/birds/aloft/latest.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=1800"
