# RARE BIRDS ACROSS THE CONTINENT (2026-11-01). Bakes the RARE BIRDS tab's 36 species at the continent's scale -- every
# spot each was reported from in the US and Canada over the last 30 days (eBird's regional species feed, 72 calls) -- to
# R2 birds/rare/<code>.json, which the BIRDS map draws when zoomed out with that species picked. See _birds/rare_bake.py.
#
# Uses the same R2 secrets as foliage.yml: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY. EBIRD_KEY is optional
# (the page's own key is the fallback).
name: Rare birds bake

on:
  schedule:
    - cron: '20 11 * * *'          # 11:20Z daily, after the night's eBird checklists have landed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: birds-rare
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bake the 36 species
        env:
          EBIRD_KEY: ${{ secrets.EBIRD_KEY }}
        run: python3 -u _birds/rare_bake.py out
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp out/rare "s3://bluishvoid-bg/birds/rare" --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=3600"
