# Build and deploy the site to GitHub Pages (since 2026-10-09).
#
# Pages used to serve the main branch as-is. Now every push to main is copied into
# dist/, index.html is minified there by _build/minify.mjs (inline scripts and styles
# only; the source keeps its comments), and dist/ is deployed as the Pages artifact.
# Measured: index.html 2.18 MB -> 1.33 MB gzip on the wire. The deploy creates a
# github-pages deployment, which is what purge-cloudflare.yml listens for.
#
# To go back to the old behaviour: Settings -> Pages -> Source: "Deploy from a branch",
# main, / (root). Nothing else depends on this workflow.
name: build and deploy pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# the bake workflows push several times a day; only the newest push needs to deploy
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install esbuild
        run: npm install --no-save --no-package-lock --silent esbuild@0.28.2
      - name: Copy the site into dist/
        run: rsync -a --exclude .git --exclude .github --exclude node_modules --exclude dist --exclude _build ./ dist/
      - name: Minify index.html into dist/ (fails the build if anything looks wrong)
        run: node _build/minify.mjs index.html dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
