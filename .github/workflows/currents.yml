# TIDAL CURRENTS + TIDE GAUGES (2026-10-17). NOAA CO-OPS current predictions for every station, four days from yesterday,
# sharded by 2-degree cell, and the tidal gauge list -- baked daily so the TIDES view reads two small cached files instead
# of asking NOAA per station. See _currentbake/bake.py.
name: Currents bake

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _currentbake/bake.py
      - name: Bake
        run: python3 -u _currentbake/bake.py out
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp out/currents "s3://bluishvoid-bg/sea/currents" --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=3600"
          aws s3 cp out/tide_stations.json "s3://bluishvoid-bg/sea/tide_stations.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=86400"
