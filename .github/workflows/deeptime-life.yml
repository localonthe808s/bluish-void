# DEEP TIME's life silhouettes (2026-11-02): PhyloPic's CC0 / CC BY figures for the plants and animals of each age, curated
# by _maplab/deeptime_life.py, to R2 deeptime/life/. One-off; rerun when the list changes. Same R2 secrets as foliage.yml.
name: Deep time life bake

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the silhouettes
        run: python3 -u _maplab/deeptime_life.py out
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp out/deeptime/life "s3://bluishvoid-bg/deeptime/life" --recursive --endpoint-url "$EP" \
            --exclude "*" --include "*.png" --content-type image/png --cache-control "public, max-age=604800"
          aws s3 cp out/deeptime/life/index.json "s3://bluishvoid-bg/deeptime/life/index.json" --endpoint-url "$EP" \
            --content-type application/json --cache-control "public, max-age=3600"
