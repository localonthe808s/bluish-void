name: Bake CAMS dust

# EARTH SYSTEMS -> DESERT DUST: the model haze under the satellite footprints. _maplab/dust_bake.py samples ECMWF's CAMS
# surface-dust forecast for the current hour on a 4-degree grid through Open-Meteo (keyless, CC BY 4.0) and uploads
# earth/dust/cams.json (~20 KB) to R2. Every 3 h. Same three secrets as helio.yml.

on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch: {}

concurrency:
  group: dust
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _maplab/dust_bake.py
          sparse-checkout-cone-mode: false
      - name: Bake and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 _maplab/dust_bake.py out
          test "$(stat -c%s out/cams.json)" -gt 10000
          E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp out/cams.json s3://bluishvoid-bg/earth/dust/cams.json --endpoint-url "$E" --content-type application/json --cache-control "public, max-age=3600" --only-show-errors
          echo "Published earth/dust/cams.json"
