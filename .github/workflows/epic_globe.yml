name: Bake EPIC globe

# BEHIND THE BLUE -> TONIGHT + EARTH VIEW: the spinning Earth. _maplab/epic_globe_bake.py stitches the newest day of NASA
# DSCOVR/EPIC natural-colour frames (13 or so, keyless, public domain) into a 2048x1024 map and uploads
# earth/globe/epic.jpg + epic.json to R2; _solarlab/earthglobe.js turns it to the true sunward face. Daily (EPIC posts
# a day's frames a day or two late). Same three secrets as helio.yml.

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch: {}

concurrency:
  group: epic-globe
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04   # pinned 2026-10-11: ubuntu-latest becomes Ubuntu 26 from 2026-10-19
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _maplab/epic_globe_bake.py
          sparse-checkout-cone-mode: false
      - name: Bake and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pip install --quiet numpy pillow
          python3 _maplab/epic_globe_bake.py out
          test "$(stat -c%s out/epic.jpg)" -gt 150000
          python3 -c "import json; m=json.load(open('out/epic.json')); assert m['frames'] >= 8, m"
          E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp out/epic.jpg s3://bluishvoid-bg/earth/globe/epic.jpg --endpoint-url "$E" --content-type image/jpeg --cache-control "public, max-age=21600" --only-show-errors
          aws s3 cp out/epic.json s3://bluishvoid-bg/earth/globe/epic.json --endpoint-url "$E" --content-type application/json --cache-control "public, max-age=21600" --only-show-errors
          echo "Published earth/globe/epic.jpg"
