name: FLOCK cameras

# Every license-plate reader mapped in OpenStreetMap (DeFlock's query) to R2 flock/alpr_v1.json for TRAFFIC's YOU'RE FLOCKED
# switch (_flockbake/bake.py). Daily: volunteers add a few hundred a day.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 9 * * *'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _flockbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python _flockbake/bake.py
