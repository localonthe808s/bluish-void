# FALL FOLIAGE (2026-09-13). Bakes the foliage tab's frame and readout once a
# day through the season -- NASA MODIS greenness against the August peak, plus
# the USA-NPN "colored leaves" reports -- and puts them on R2 at
# foliage/latest.{webp,json}. See _maplab/foliage_bake.py.
name: Foliage bake

on:
  schedule:
    - cron: '30 10 * 9-11 *'      # 10:30Z daily, September through November
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the bake's libraries
        run: pip install --quiet numpy pillow shapely
      - name: Bake the frame and the readout
        run: python3 -u _maplab/foliage_bake.py out
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp out/latest.webp "s3://bluishvoid-bg/foliage/latest.webp" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type image/webp --cache-control "public, max-age=1800"
          aws s3 cp out/latest.json "s3://bluishvoid-bg/foliage/latest.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=600"
          # the banded twin of today's frame, and the forest (rendered once)
          aws s3 cp out/latest_bands.webp "s3://bluishvoid-bg/foliage/latest_bands.webp" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type image/webp --cache-control "public, max-age=1800"
          for f in forest_v1.webp forest_codes.png; do
            if [ -f "out/$f" ]; then
              aws s3 cp "out/$f" "s3://bluishvoid-bg/foliage/$f" \
                --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                --cache-control "public, max-age=86400"
            fi
          done
          # the county outlines (static, ~100 KB)
          aws s3 cp out/counties.json "s3://bluishvoid-bg/foliage/counties.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=86400"
          # the season frames (last autumn's, rendered once; this autumn's, one a week)
          if [ -d out/season ]; then
            aws s3 cp out/season "s3://bluishvoid-bg/foliage/season" --recursive \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --content-type image/webp --cache-control "public, max-age=86400"
          fi
