# FALL FOLIAGE, NORTH AMERICA (2026-10-17). The Northeast tab's method (_maplab/foliage_bake.py) as a tile pyramid for the
# continent, baked daily through the season by _foliagebake/na.py and put on R2 at foliage/na/{z}/{x}/{y}.webp + meta.json.
# The August baseline and forest mask per block are cached on R2 (foliage/na_base) so a day fetches only two composites.
name: Foliage bake (North America)

on:
  schedule:
    - cron: '50 10 * 9-11 *'      # 10:50Z daily, September through November (after the Northeast bake)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _foliagebake/na.py
      - name: Install the bake's libraries
        run: pip install --quiet numpy pillow
      - name: Fetch the cached baseline
        run: |
          mkdir -p base
          aws s3 cp "s3://bluishvoid-bg/foliage/na_base" base --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" || true
          rm -f base/p_*.npy
      - name: Bake
        run: python3 -u _foliagebake/na.py out base
      - name: Upload to R2
        run: |
          aws s3 cp out "s3://bluishvoid-bg/foliage/na" --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --cache-control "public, max-age=3600"
          aws s3 cp base "s3://bluishvoid-bg/foliage/na_base" --recursive --exclude "p_*" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
