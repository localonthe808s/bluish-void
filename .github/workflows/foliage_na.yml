# FALL FOLIAGE, NORTH AMERICA (2026-10-17). The Northeast tab's method (_maplab/foliage_bake.py) as a tile pyramid for the
# continent, baked daily through the season by _foliagebake/na.py and put on R2 at foliage/na/{z}/{x}/{y}.webp + meta.json.
# The August baseline and forest mask per block are cached on R2 (foliage/na_base9 since the z9 pyramid of 2026-10-18; the
# z8 cache foliage/na_base8 is no longer read) so a day fetches only two composites. The first z9 run builds the cache:
# baseline, IGBP and FIA for ~140 forest blocks of 308, the slow day; afterwards ~2 composites x ~140 blocks.
# Since 2026-10-17 the run also writes the UPSTATE view's numbers into meta.json (regions, history, counties, last season's
# curves carried forward) and, once a week, archives the day's pyramid under foliage/na/season/<year>/<date>/. The county
# label grids (l_*.npz) and carry.json ride in the same cache; last season's frames and the forest tiles are one-off local
# bakes (_foliagebake/na_season.py, na_forest.py).
name: Foliage bake (North America)

on:
  schedule:
    - cron: '50 10 * 9-11 *'      # 10:50Z daily, September through November (after the Northeast bake)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _foliagebake
      - name: Install the bake's libraries
        run: pip install --quiet numpy pillow
      - name: Fetch the cached baseline
        run: |
          mkdir -p base
          aws s3 cp "s3://bluishvoid-bg/foliage/na_base9" base --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" || true
          rm -f base/p_*.npy
      - name: Bake
        run: python3 -u _foliagebake/na.py out base
      - name: Upload to R2
        run: |
          aws s3 cp out "s3://bluishvoid-bg/foliage/na" --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --cache-control "public, max-age=3600"
          aws s3 cp base "s3://bluishvoid-bg/foliage/na_base9" --recursive --exclude "p_*" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
