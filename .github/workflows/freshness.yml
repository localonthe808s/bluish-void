name: Freshness watch

# Reads the age of every baked file on the CDN (_ops/freshness.py). A file past its first limit has its bake started again
# (GitHub's schedule drops runs: the 3-hourly bakes were running 2-3 times a day in mid-November 2026); a file past its
# second limit fails this run, and the failed run is the alert. Add a row to _ops/freshness.py for every new bake.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '8 * * * *'

permissions:
  actions: write      # to start a stale bake
  contents: read

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _ops
      - name: Ages, restarts, alarm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -u _ops/freshness.py
