name: GLM lightning snapshot

# THE CITY's lightning comes from GOES-19's Geostationary Lightning Mapper,
# not a crowdsourced network: every 5 minutes this distils the last ~12 min of
# GLM L2 flash data (20-second granules on the NOAA open-data bucket) into a
# tiny JSON of flash positions around NYC, published to R2 as glm/latest.json.
# The widget polls it and fades flashes by age; if this job stalls the client
# sees a stale timestamp and draws nothing rather than old lightning.
#
# Same R2 secrets as the moon frame: R2_ACCOUNT_ID / R2_ACCESS_KEY_ID /
# R2_SECRET_ACCESS_KEY (write to bluishvoid-bg).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: glm-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Distil GLM flashes near NYC
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          pip install --quiet netCDF4 numpy
          mkdir -p gran
          : > listing.txt
          for OFF in 0 -1; do
          H=$(date -u -d "${OFF} hour" +%Y/%j/%H)
          aws s3 ls --no-sign-request "s3://noaa-goes19/GLM-L2-LCFA/${H}/" 2>/dev/null | awk '{print $4}' >> listing.txt || true
          done
          CUT=$(date -u -d '12 minutes ago' +%Y%j%H%M%S)
          grep -oE 'OR_GLM[^ ]*\.nc' listing.txt | while read -r F; do
          TS=$(echo "$F" | sed -E 's/.*_s([0-9]{14}).*/\1/')
          if [ "${TS:0:13}" \> "${CUT:0:13}" ]; then echo "$F"; fi
          done > keep.txt
          echo "$(wc -l < keep.txt) granules newer than ${CUT}"
          while read -r F; do
          [ -z "$F" ] && continue
          H=$(echo "$F" | sed -E 's/.*_s([0-9]{4})([0-9]{3})([0-9]{2}).*/\1\/\2\/\3/')
          aws s3 cp --no-sign-request --only-show-errors "s3://noaa-goes19/GLM-L2-LCFA/${H}/${F}" "gran/${F}" || true
          done < keep.txt
          python3 .github/scripts/parse_glm.py
        shell: bash
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -s latest.json
          aws s3 cp latest.json "s3://bluishvoid-bg/glm/latest.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/json" \
            --cache-control "public, max-age=60" \
            --only-show-errors
          echo "Published glm/latest.json"
