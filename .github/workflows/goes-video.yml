name: LIVE CLOUDS videos

# Bakes the LIVE CLOUDS satellite loops into MP4s on R2 (_goesvid/bake.py): 6 h at 1200 px for desktop, 2 h at 600 px for
# phones, per GOES sector the site opens on. Started every 10 minutes by the Kalshi cron worker (_kalshi/cron-worker,
# minute % 10 === 3), because GitHub's own schedule runs 10-30 minutes late; the hourly schedule below is only a fallback
# should the worker stop. Old videos are deleted by the bake (two generations kept) and by an R2 lifecycle rule (1 day).
#
# Uses the same R2 secrets as moon-frame.yml: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '47 * * * *'

concurrency:
  group: goes-video
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _goesvid
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Bake and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python3 _goesvid/bake.py
