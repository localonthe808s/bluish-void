name: LIVE CLOUDS videos

# Bakes the LIVE CLOUDS satellite loops into MP4s on R2 (_goesvid/bake.py): 6 h at 1600 x 1000 for desktop, 2 h at 800 x 500
# for phones, per GOES sector the site opens on, cut from NESDIS's full-disk GeoColor since 2026-10-23 (no baked-in lines). Started every 10 minutes by the Kalshi cron worker (_kalshi/cron-worker,
# minute % 10 === 3), because GitHub's own schedule runs 10-30 minutes late; the hourly schedule below is only a fallback
# should the worker stop. Old videos are deleted by the bake (two generations kept) and by an R2 lifecycle rule (1 day).
#
# Uses the same R2 secrets as moon-frame.yml: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '47 * * * *'

concurrency:
  group: goes-video
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # the first run after a cache loss cuts 6 h of full disks (~70); later runs one per satellite
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _goesvid
      - name: ffmpeg
        # apt's mirror has hung this step for the whole 15-minute job (twice on 2026-10-24): time-boxed, retried
        run: |
          which ffmpeg && exit 0
          for i in 1 2 3; do
            sudo timeout 90 apt-get update -qq && sudo timeout 180 apt-get install -y -qq ffmpeg && exit 0
            echo "apt attempt $i timed out or failed"; sleep 5
          done
          exit 1
      - name: Python libraries
        run: pip3 install --quiet --break-system-packages pillow numpy netCDF4 opencv-python-headless   # netCDF4: B13 / Air Mass from NOAA's L2 files
      - name: Bake and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python3 _goesvid/bake.py
      - name: Himawari-9 and Meteosat-12 GeoColor loops (FORECASTS)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python3 _goesvid/sliderbake.py
      - name: The whole Earth, stitched (LIVE's globe)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python3 _goesvid/worldbake.py
