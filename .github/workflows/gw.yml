# GRAVITATIONAL WAVES (2026-10-11). LIGO/Virgo/KAGRA public alerts (GraceDB) + the GWOSC catalogue, baked daily to R2
# at gw/gw.json and gw/sky/<id>.png. See _maplab/gw_bake.py. Between observing runs daily is plenty.
name: Gravitational-wave bake

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bake
        run: |
          python3 -m pip install -q pillow
          python3 -u _maplab/gw_bake.py out
          test "$(stat -c%s out/gw.json)" -gt 20000
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp out/gw.json s3://bluishvoid-bg/gw/gw.json --endpoint-url "$E" --content-type application/json --cache-control "public, max-age=3600" --only-show-errors
          aws s3 cp out/sky s3://bluishvoid-bg/gw/sky/ --recursive --endpoint-url "$E" --content-type image/png --cache-control "public, max-age=86400" --only-show-errors
