name: HF RADAR CURRENTS

# Measured surface currents near US coasts (IOOS HF radar via NOAA NDBC's OPeNDAP) -> R2 hfr/<region>.png + hfr/latest.json for
# WATER's SEA CURRENTS and COAST RADAR CURRENTS (_hfrbake/bake.py). Hourly: the network posts each hour ~1-2 h late.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '25 * * * *'

concurrency:
  group: hfr
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _hfrbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow
      - name: Fetch and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python _hfrbake/bake.py
