name: Kalshi NYC high

# Refreshes /kalshi_ny.json — the live Kalshi KXHIGHNY ladder, our own
# probability for each bracket, the locked daily pick, and the running record.
# Feeds the Belvedere Castle popup on the CITY map.
#
# It runs as a job rather than a browser fetch because Kalshi answers 403 to
# any request carrying an Origin header (our proxy worker is 403'd too), so
# the page cannot reach the market directly. It reads our own repo instead.
#
# The decision for each day is LOCKED at the first run at or after 12:00 ET
# and never rewritten — that is what makes the record an honest forecast
# score rather than hindsight.

on:
  schedule:
    # hourly across the NYC daylight window, in UTC (ET = UTC-4 in season):
    # 12:00–23:00 UTC = 08:00–19:00 ET, then 00:00–04:00 UTC = 20:00–00:00 ET
    - cron: '25 12-23 * * *'
    - cron: '25 0-4 * * *'
    # GitHub queues scheduled runs best-effort and skips most of them under
    # load -- on the first day only 2 of ~7 slots fired. The locks that must
    # not be missed are the first run at/after noon ET (16:00 UTC) and the
    # first at/after 18:00 ET (22:00 UTC), so those windows get a second
    # offset. Each lock is stamped as-of its own hour, so a late run is
    # harmless; a wholly missed window is not.
    - cron: '5 16-23 * * *'
    - cron: '5 0-4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kalshi-nyc
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch market, forecast and observations
        run: python3 _kalshi/kalshi_daily.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- kalshi_ny.json; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kalshi_ny.json
          git commit -m "Kalshi NYC high: refresh market, probabilities and record"
          git push
