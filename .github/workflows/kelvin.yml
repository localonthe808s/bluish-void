# THE KELVIN WAVE AND THE WEST COAST'S WATER (2026-10-17). Bakes cdn enso/kelvin.json daily for the EL NIÑO view: equatorial
# and coastal sea level against normal from NOAA's blended altimetry, the crest tracked, TAO's 20 C isotherm, and the West
# Coast tide gauges against their flood levels. See _ensobake/kelvin.py.
name: Kelvin wave bake

on:
  schedule:
    - cron: '40 14 * * *'      # 14:40Z daily: the altimetry's newest day lands overnight US time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _ensobake/kelvin.py
      - name: Bake
        run: python3 -u _ensobake/kelvin.py out
      - name: Upload to R2
        run: |
          aws s3 cp out/kelvin.json "s3://bluishvoid-bg/enso/kelvin.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --cache-control "public, max-age=3600" --content-type application/json
