name: STORM REPORTS

# The NWS Local Storm Reports of the last 8 days (Iowa Environmental Mesonet) to R2 lsr/recent.json + lsr/days/<date>.json
# for SEVERE's STORM REPORTS 3- and 7-day windows and as the site's memory of them (_lsrbake/bake.py). Every 6 hours: the
# last 24 hours are read live on the page; the bake only has to keep the older days fresh and catch late filings.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 */6 * * *'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _lsrbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python _lsrbake/bake.py
