name: MBARI sightings

# WATER > OCEAN > DEEP-SEA SIGHTINGS: MBARI's public VARS annotations (ROV dives since 2024) -> R2 ocean/mbari_sightings_v1.json
# (_oceanbake/mbari_sightings_bake.py). MBARI publishes annotations long after the dives, so weekly is plenty.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 11 * * 0'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _oceanbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bake and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          python -I _oceanbake/mbari_sightings_bake.py mbari_sightings_v1.json
          test $(stat -c %s mbari_sightings_v1.json) -gt 20000
          aws s3 cp mbari_sightings_v1.json s3://bluishvoid-bg/ocean/mbari_sightings_v1.json --content-type application/json --cache-control "public, max-age=86400" --endpoint-url https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com --only-show-errors
