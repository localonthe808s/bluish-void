name: MIGRATION video

# Captures the last two hours of bird-only radar frames (Iowa State's unfiltered N0Q mosaic minus NOAA MRMS rain) to R2 and
# bakes the most recent night into the MIGRATION tab's looping videos (_migvid/bake.py). MRMS keeps only ~2 hours, so this
# runs every 30 minutes: a late or skipped run is caught up by the next one. Frames are kept 3 days, videos two generations.
#
# Uses the same R2 secrets as goes-video.yml: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.

on:
  workflow_dispatch: {}
  # Started at :07/:37 by the Kalshi cron worker (_kalshi/cron-worker, 2026-10-23): GitHub's own schedule ran 8 of ~40 times
  # on 10-23 and left 100- and 220-minute holes in the night. This hourly schedule is only a fallback.
  schedule:
    - cron: '52 * * * *'

concurrency:
  group: migration-video
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _migvid
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python packages
        timeout-minutes: 3
        run: python -m pip install numpy pillow scipy imageio-ffmpeg
      - name: Capture and bake
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python _migvid/bake.py
