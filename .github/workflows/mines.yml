name: Active mines

# GEOLOGY > THE ROCK > ACTIVE MINES: MSHA's mine list (refreshed weekly by MSHA) -> R2 under/mines_active_v1.json (_subbake/mines/msha_bake.py).

on:
  workflow_dispatch: {}
  schedule:
    - cron: '20 9 * * 1'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _subbake/mines
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bake and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          python -I _subbake/mines/msha_bake.py mines_active_v1.json
          test $(stat -c %s mines_active_v1.json) -gt 1000000
          aws s3 cp mines_active_v1.json s3://bluishvoid-bg/under/mines_active_v1.json --content-type application/json --cache-control "public, max-age=86400" --endpoint-url https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com --only-show-errors
