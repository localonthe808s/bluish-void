name: NGWMN well logs (missing)

# WELLS: the USGS National Ground-Water Monitoring Network logs the bake machine could not fetch (its IP was blocked by
# www.usgs.gov on 2026-11-08). Fetched politely from GitHub's runner, uploaded as an artifact for the local wells bake.

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _subbake/wells
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: python -I _subbake/wells/ngwmn_fetch_missing.py ngwmn_out
      - uses: actions/upload-artifact@v4
        with:
          name: ngwmn-logs
          path: ngwmn_out
          retention-days: 7
