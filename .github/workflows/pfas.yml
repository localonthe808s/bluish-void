name: PFAS in tap water

# EPA's drinking-water PFAS detections, one row per public water system, to R2 pfas/pfas_v1.json for WATER > RIVERS >
# PFAS IN TAP WATER (_pfasbake/bake.py). Weekly: the survey's results are published in quarterly batches.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '37 10 * * 1'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _pfasbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: python _pfasbake/bake.py pfas_v1.json
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp pfas_v1.json "s3://bluishvoid-bg/pfas/pfas_v1.json" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=3600" --only-show-errors
