name: Polar caps

# The cloud globe's poles (_goesvid/polarbake.py): NASA GIBS daily true color for both caps, and over the open Southern Ocean the
# current clouds from the AMRDC Antarctic infrared composite (AMRC, SSEC, UW-Madison), to R2 goes/video/WORLD/polar_{n,s}.png.
# worldbake.py (goes-video.yml, every 10 min) blends them in where no geostationary satellite sees. Hourly: the composite is hourly.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '35 * * * *'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _goesvid
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow opencv-python-headless
      - name: Bake and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python _goesvid/polarbake.py
