name: Pollution layers

# MORE POLLUTION (_polbake/bake.py) to R2 pol/*_v1.json for WATER > RIVERS (algal blooms, red tide, spills, PFAS sources) and
# LAND > POLLUTION (toxic releases, serious violators, landfills, chemical plants). Blooms and spills change daily; the rest
# is refreshed weekly (Monday run, or any manual run).

on:
  workflow_dispatch: {}
  schedule:
    - cron: '41 9 * * *'
    - cron: '7 11 * * 1'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _polbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: |
          if [ "${{ github.event.schedule }}" = "41 9 * * *" ]; then python _polbake/bake.py out fast; else python _polbake/bake.py out; fi
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          for f in out/*_v1.json; do
            aws s3 cp "$f" "s3://bluishvoid-bg/pol/$(basename "$f")" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --content-type application/json --cache-control "public, max-age=3600" --only-show-errors
          done
