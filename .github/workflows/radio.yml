name: Radio stations (Radio Browser)

# _radiobake/bake.py -> R2 radio/stations_v1.json for the map's RADIO view: every geolocated station in Radio Browser whose own
# stream is HTTPS and passed its last check (UK stations left out). Weekly; the page asks for ?w=<week>, so each week is a new
# address at the edge. Each run also checks every stream (two failed weeks running = off the map; OUR PICKS only warned about) and
# writes the run summary: dead picks, stations dropped, stream addresses that changed.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _radiobake   # cone mode keeps the root files too: index.html carries OUR PICKS for the health check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FCC license lists (who holds each US license; curl, the FCC refuses Python's client)
        run: |
          mkdir -p fcc
          for b in fm am; do curl -s -L -m 600 --retry 3 -A "Mozilla/5.0" -o fcc/$b.txt "https://transition.fcc.gov/fcc-bin/${b}q?list=4&size=9&status=LIC" || true; done
          wc -l fcc/*.txt || true
      - name: Last week's stream check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: aws s3 cp "s3://bluishvoid-bg/radio/health_v1.json" prev_health.json --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors || echo '{}' > prev_health.json
      - name: Bake
        env:
          FCC_DIR: fcc
          HEALTH_PREV: prev_health.json
        run: |
          pip install --quiet timezonefinder
          python _radiobake/bake.py out
      - name: Health report
        if: always()
        run: cat out/health.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          E="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          python3 -c "import json; d=json.load(open('out/stations_v1.json')); assert d['n'] > 3000, d['n']"
          aws s3 cp out/stations_v1.json "s3://bluishvoid-bg/radio/stations_v1.json" --endpoint-url "$E" --content-type application/json --cache-control "public, max-age=86400" --only-show-errors
          aws s3 cp out/health_v1.json "s3://bluishvoid-bg/radio/health_v1.json" --endpoint-url "$E" --content-type application/json --cache-control "no-store" --only-show-errors
