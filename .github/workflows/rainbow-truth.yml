# DID THE SKY MAKE A RAINBOW? (2026-11-07). Once a night, after sunset in New York, looks back over the day's low-sun hours in
# 10-minute steps (sun 0.5-42 deg up, radar rain opposite the sun, the sun out) from archived radar and airport reports, and appends
# one row to R2 sky/rainbow_truth.jsonl -- the check on the rainbow calls in sky/rainbow_log.jsonl. See _maplab/rainbow_truth.py.
name: Rainbow truth

on:
  schedule:
    - cron: '30 2 * * *'      # 10:30 PM New York in winter, 9:30 PM in summer: after every sunset of the year
  workflow_dispatch:
    inputs:
      date:
        description: YYYY-MM-DD (default today in New York)
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the day
        run: |
          pip install --quiet pillow
          python3 -u _maplab/rainbow_truth.py ${{ github.event.inputs.date }} row.jsonl
      - name: Append to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://bluishvoid-bg/sky/rainbow_truth.jsonl" t.jsonl --endpoint-url "$EP" || touch t.jsonl
          cat row.jsonl >> t.jsonl
          aws s3 cp t.jsonl "s3://bluishvoid-bg/sky/rainbow_truth.jsonl" --endpoint-url "$EP" \
            --content-type application/x-ndjson --cache-control "no-store"
          wc -l t.jsonl
