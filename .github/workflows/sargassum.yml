name: SARGASSUM

# USF/AOML 7-day floating-algae composite -> R2 sargassum/latest.{png,json} for WATER's SARGASSUM switch (_sargbake/bake.py). Daily.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 15 * * *'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _sargbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow scipy
      - name: Fetch and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python _sargbake/bake.py
      - name: Monthly history (the running month re-read; older months kept)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python _sargbake/monthly.py
