name: Snow

# WATER > SNOW: NOHRSC snowfall (24 h, 72 h, 7 days, season) and SNODAS snow on the ground, as map pictures plus every ski
# resort's numbers, to R2 snow/v1/ (_snowbake/snow_bake.py). NOHRSC's 12Z analysis lands about 16Z; a second run in the
# evening catches late updates and the newest SNODAS day.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '25 17 * * *'
    - cron: '25 1 * * *'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _snowbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow tifffile
      - name: Bake and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python _snowbake/snow_bake.py
