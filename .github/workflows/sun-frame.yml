name: Refresh sun frame

# Keeps cdn.bluishvoid.com/sun/current.jpg pointed at SDO's latest AIA 171 Å
# frame, self-hosted on R2 for the same reason the moon is: sdo.gsfc.nasa.gov
# is a NASA GSFC endpoint, and those have a history of lapsed certificates and
# outages that the site's Sun should not inherit.
#
# Uses the same three repo secrets as moon-frame.yml:
#   R2_ACCOUNT_ID          – Cloudflare account id (the R2 S3 endpoint host)
#   R2_ACCESS_KEY_ID       – R2 API token access key (write to bluishvoid-bg)
#   R2_SECRET_ACCESS_KEY   – R2 API token secret
#
# Note on freshness: the zone rewrites short Cache-Control values up to 4 hours
# (measured — R2 stores max-age=900 and the edge serves 14400, while `immutable`
# assets pass through untouched). A 4-hour browser cache would make a half-hour
# refresh pointless, so the lab requests this with a 15-minute rotating query
# string rather than relying on the header. Keep the two in step if either
# cadence changes.

on:
  schedule:
    - cron: '*/30 * * * *'    # the corona is worth watching more often than the Moon
  workflow_dispatch: {}

concurrency:
  group: sun-frame
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest SDO AIA 171 frame and upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # -k: GSFC's cert lapses periodically; the payload is validated below
          curl -fsSk --retry 3 --retry-delay 5 -o sun.jpg \
            "https://sdo.gsfc.nasa.gov/assets/img/latest/latest_512_0171.jpg"
          # Publish only a real, plausible JPEG. SDO occasionally serves a
          # placeholder or a truncated frame during downlink gaps, and pushing
          # that would blank the Sun on the site until the next run.
          file sun.jpg | grep -q 'JPEG'
          test "$(stat -c%s sun.jpg)" -gt 15000
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('sun.jpg'); im.verify()
          im = Image.open('sun.jpg')
          assert im.size == (512, 512), 'unexpected frame size %s' % (im.size,)
          # a downlink-gap placeholder is near-uniform; a real corona is not
          g = im.convert('L')
          lo, hi = g.getextrema()
          assert hi - lo > 60, 'frame looks blank (extrema %d..%d)' % (lo, hi)
          print('frame ok', im.size, 'contrast', hi - lo)
          PY
          aws s3 cp sun.jpg "s3://bluishvoid-bg/sun/current.jpg" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "image/jpeg" \
            --cache-control "public, max-age=900" \
            --only-show-errors
          echo "Published sun/current.jpg"
