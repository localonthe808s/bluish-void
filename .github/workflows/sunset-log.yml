# THE SUNSET LOG (2026-09-26). Twice a day, records the live site's own sunrise/sunset scores for the next 5 days (every
# lead time, full breakdown) and appends them to R2 sunset/log.jsonl, so the score can be checked against what the sky did
# and its weights refit. See _maplab/sunset_log.py.
name: Sunset log

on:
  schedule:
    - cron: '15 12 * * *'     # after sunrise in New York
    - cron: '15 0 * * *'      # after sunset in New York
  workflow_dispatch:

permissions:
  contents: read

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Headless browser
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Read the live site's scores
        run: python3 -u _maplab/sunset_log.py out
      - name: Append to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://bluishvoid-bg/sunset/log.jsonl" log.jsonl --endpoint-url "$EP" || touch log.jsonl
          cat out/rows.jsonl >> log.jsonl
          aws s3 cp log.jsonl "s3://bluishvoid-bg/sunset/log.jsonl" --endpoint-url "$EP" \
            --content-type application/x-ndjson --cache-control "no-store"
          wc -l log.jsonl
