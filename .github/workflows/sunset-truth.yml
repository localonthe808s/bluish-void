# THE SUNSET TRUTH (2026-09-26). Started by the cron worker (bluish-void-kalshi-cron) two minutes before New York's sunset;
# photographs the west-facing cameras through the peak and records how coloured the sky got, to check the site's
# predictions (sunset-log.yml) against. See _maplab/sunset_truth.py and _maplab/sunset_cams.json.
name: Sunset truth

on:
  workflow_dispatch:
    inputs:
      city:
        description: nyc or la
        default: nyc

permissions:
  contents: read

jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - name: Watch the sunset
        env:
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          CITY: ${{ inputs.city || 'nyc' }}
        run: python3 -u _maplab/sunset_truth.py out
      - name: Append to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://bluishvoid-bg/sunset/truth.jsonl" truth.jsonl --endpoint-url "$EP" || touch truth.jsonl
          cat out/truth.jsonl >> truth.jsonl
          aws s3 cp truth.jsonl "s3://bluishvoid-bg/sunset/truth.jsonl" --endpoint-url "$EP" --content-type application/x-ndjson --cache-control "no-store"
          D=$(python3 -c "import json;print(json.loads(open('out/truth.jsonl').read())['date'])")
          if [ -f out/frames/peak.jpg ]; then aws s3 cp out/frames/peak.jpg "s3://bluishvoid-bg/sunset/frames/${{ inputs.city || 'nyc' }}-$D.jpg" --endpoint-url "$EP" --content-type image/jpeg; fi
