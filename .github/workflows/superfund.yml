name: Superfund sites

# The National Priorities List joined to each site's contaminants, remedies, acreage and reuse, to R2
# superfund/superfund_v1.json for WATER > RIVERS > SUPERFUND SITES (_superfundbake/bake.py). Monthly: the list changes a few
# times a year and the contaminant reports once.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 11 3 * *'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _superfundbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: python _superfundbake/bake.py superfund_v1.json
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp superfund_v1.json "s3://bluishvoid-bg/superfund/superfund_v1.json" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=3600" --only-show-errors
