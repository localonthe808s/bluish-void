name: SARGASSO SEA

# NOAA CoastWatch surface currents + gap-filled chlorophyll -> R2 surf/{currents,chl}.png + latest.json for WATER's SARGASSO SEA
# and OCEAN COLOR switches (_surfbake/bake.py). Daily, after both datasets' overnight updates. The static layers (the CBD boundary,
# the garbage patch survey, the microplastics samples) are _surfbake/static.py, run by hand.

# Twice a day since 2026-10-28: the currents are NOAA RTOFS now (_surfbake/rtofs.py). 07:35 UTC, after the nowcast lands (~06:50):
# the last 24 hours; 14:41 UTC, after the forecast to +24 h lands (~12:50): today's.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '35 7 * * *'
    - cron: '41 14 * * *'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _surfbake
            _sargbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow scipy h5py
      - name: Fetch and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python _surfbake/bake.py
