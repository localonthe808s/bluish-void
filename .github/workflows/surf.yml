name: SARGASSO SEA

# NOAA CoastWatch surface currents + gap-filled chlorophyll -> R2 surf/{currents,chl}.png + latest.json for WATER's SARGASSO SEA
# and OCEAN COLOR switches (_surfbake/bake.py). Daily, after both datasets' overnight updates. The static layers (the CBD boundary,
# the garbage patch survey, the microplastics samples) are _surfbake/static.py, run by hand.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '41 14 * * *'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _surfbake
            _sargbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow scipy
      - name: Fetch and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: python _surfbake/bake.py
