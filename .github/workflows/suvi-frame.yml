name: Refresh solar nav thumbnails

# Keeps two nav-rail icons current on cdn.bluishvoid.com:
#   solar/suvi304.jpg  – GOES SUVI 304 Å composite       (SOLAR IMAGER)
#   solar/enlil.jpg    – WSA-ENLIL ecliptic density disc  (SOLAR WIND)
#
# Why self-host: SWPC publishes the SUVI composite at ~1.17 MB and ENLIL only
# inside a 960x600 four-panel dashboard. Both are fine for the widgets, which
# load them on demand, but absurd for 32px nav icons on mobile. This republishes
# each at 256px / ~13 KB — all a porthole needs even at 3x DPR — and crops ENLIL
# down to just its ecliptic disc.
#
# Uses the same three repo secrets as moon-frame.yml:
#   R2_ACCOUNT_ID          – Cloudflare account id (the R2 S3 endpoint host)
#   R2_ACCESS_KEY_ID       – R2 API token access key (write to bluishvoid-bg)
#   R2_SECRET_ACCESS_KEY   – R2 API token secret

on:
  schedule:
    - cron: '43 * * * *'    # hourly; SUVI posts every ~4 min but the sun's
                            # appearance at 32px changes far slower than that
  workflow_dispatch: {}

concurrency:
  group: suvi-frame
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # The ubuntu-24.04 runner's system Python ships neither Pillow nor numpy,
      # and its interpreter is PEP 668 externally-managed, hence the flag.
      - name: Install Pillow + numpy
        run: python3 -m pip install --quiet --break-system-packages pillow numpy

      - name: Fetch the SUVI 304 composite, downscale, upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 5 -o suvi.png \
            "https://services.swpc.noaa.gov/images/animations/suvi/primary/304/latest.png"
          file suvi.png | grep -q 'PNG'
          test "$(stat -c%s suvi.png)" -gt 100000
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('suvi.png').convert('RGB').resize((256, 256), Image.LANCZOS)
          im.save('suvi304.jpg', quality=86, optimize=True)
          PY
          # sanity-check the result before publishing: a real JPEG, plausible size,
          # and actually the orange 304 disc rather than a blank/black frame
          file suvi304.jpg | grep -q 'JPEG'
          test "$(stat -c%s suvi304.jpg)" -gt 4000
          python3 - <<'PY'
          from PIL import Image
          import numpy as np, sys
          a = np.asarray(Image.open('suvi304.jpg')).astype(float)
          mid = a[64:192, 64:192].reshape(-1, 3).mean(axis=0)
          # the disc centre should be bright and red-dominant
          if mid[0] < 90 or mid[0] <= mid[2]:
              sys.exit('centre looks wrong (mean RGB %s) — refusing to publish' % mid.round(1))
          PY
          aws s3 cp suvi304.jpg "s3://bluishvoid-bg/solar/suvi304.jpg" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "image/jpeg" \
            --cache-control "public, max-age=1800" \
            --only-show-errors
          echo "Published solar/suvi304.jpg ($(stat -c%s suvi304.jpg) bytes)"

      - name: Crop the ENLIL ecliptic disc, upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 5 -o enlil.jpg \
            "https://services.swpc.noaa.gov/images/animations/enlil/latest.jpg"
          file enlil.jpg | grep -q 'JPEG'
          python3 - <<'PY'
          from PIL import Image
          import numpy as np, sys
          im = Image.open('enlil.jpg').convert('RGB')
          a = np.asarray(im).astype(int)
          sat = a.max(axis=2) - a.min(axis=2)
          mask = (sat > 60) & (a.max(axis=2) > 60)
          # top-left panel = plasma density in the ecliptic plane. x>=55 skips the
          # colour-bar strip, which would otherwise drag the centre left and leave a
          # black sliver in the crop.
          sub = mask[:310, 55:330]
          ys, xs = np.where(sub)
          if len(ys) < 5000:
              sys.exit('ENLIL panel not found (%d coloured px) — refusing to publish' % len(ys))
          xs = xs + 55
          cx, cy = np.median(xs), np.median(ys)
          r = np.percentile(np.hypot(xs - cx, ys - cy), 98)
          side = r * 2 / 1.44                      # inscribed square, with margin
          crop = im.crop((int(cx - side/2), int(cy - side/2),
                          int(cx + side/2), int(cy + side/2))).resize((256, 256), Image.LANCZOS)
          # no black corners may survive the circular mask
          b = np.asarray(crop.convert('L')).astype(float)
          yy, xx = np.mgrid[0:256, 0:256]
          ring = (np.hypot(xx - 128, yy - 128) >= 115)
          if b[ring].mean() < 60:
              sys.exit('crop edge is dark (%.0f) — refusing to publish' % b[ring].mean())
          crop.save('enlil_icon.jpg', quality=88, optimize=True)
          PY
          test "$(stat -c%s enlil_icon.jpg)" -gt 4000
          aws s3 cp enlil_icon.jpg "s3://bluishvoid-bg/solar/enlil.jpg" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "image/jpeg" \
            --cache-control "public, max-age=1800" \
            --only-show-errors
          echo "Published solar/enlil.jpg ($(stat -c%s enlil_icon.jpg) bytes)"
