name: Volcano cameras

# GEOLOGY > VOLCANOES live cameras: official observatory webcams keyed by GVP number -> R2 volcano/cams_v1.json (_volcbake/vcams_bake.py).
# USGS cameras come and go (a dead camera is dropped after 24 h without a frame), so every 3 hours.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '35 */3 * * *'

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _volcbake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bake and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          python -I _volcbake/vcams_bake.py cams_v1.json
          test $(stat -c %s cams_v1.json) -gt 10000
          aws s3 cp cams_v1.json s3://bluishvoid-bg/volcano/cams_v1.json --content-type application/json --cache-control "public, max-age=1800" --endpoint-url https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com --only-show-errors
