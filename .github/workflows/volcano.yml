# VOLCANOES (2026-11-02): the GEOLOGY tab's third view. Daily: the Smithsonian GVP Holocene volcanoes and big eruptions,
# the weekly activity report, the USGS alert levels -> R2 volcano/latest.json. See _maplab/volcano_bake.py.
name: Volcano bake

on:
  schedule:
    - cron: '40 12 * * *'          # 12:40Z daily (the weekly report lands on Wednesdays, US alerts change any time)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volcano
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bake
        run: python3 -u _maplab/volcano_bake.py out
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp out/volcano/latest.json "s3://bluishvoid-bg/volcano/latest.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type application/json --cache-control "public, max-age=1800"
