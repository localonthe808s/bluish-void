   the frame is not on screen (an IntersectionObserver against the page's viewport, or a hidden browser tab) and is released the
   moment it is seen again -- so every loop in this frame sleeps without each one having to know. */

  oc.setTransform(1, 0, 0, 1, 0, 0); oc.clearRect(0, 0, W, H);
  /* the year's routes, faint, cached until the camera or the filter changes */
  var key = [CAM.lat.toFixed(3), CAM.lon.toFixed(3), CAM.zoom.toFixed(3), W, H, Object.keys(show).filter(function(k){ return show[k]; }).join(','), sel ? sel.b.id + sel.sp : ''].join('|');
  if (key !== FKEY){ FKEY = key; if (!FAINT){ FAINT = document.createElement('canvas'); } FAINT.width = W; FAINT.height = H; var fc = FAINT.getContext('2d'); fc.lineWidth = 1 * DPR; fc.lineJoin = 'round';
    BIRDS.forEach(function(B){ if (!show[B.sp]) return; fc.strokeStyle = COL[B.sp]; fc.globalAlpha = sel ? (sel === B ? 0.9 : 0.05) : 0.13; fc.lineWidth = (sel === B ? 2 : 1) * DPR; fc.beginPath(); var on = false;
      for (var i = 0; i < B.P.length; i++){ proj(B.P[i], _p); if (_p[2] < 0 || (i && B.ph[i] - B.ph[i - 1] > 0.06)){ on = false; if (_p[2] < 0) continue; } if (on) fc.lineTo(_p[0], _p[1]); else { fc.moveTo(_p[0], _p[1]); on = true; } } fc.stroke(); });
    fc.globalAlpha = 1; }
  oc.drawImage(FAINT, 0, 0);
  /* the last 30 days of each bird, and the bird */
  var TR = 30 / 365.25;
  BIRDS.forEach(function(B){ if (!show[B.sp]) return; var h = at(B, P); if (!h) { B.sx = null; return; } proj(h.p, _p); if (_p[2] < 0){ B.sx = null; return; }
    oc.strokeStyle = COL[B.sp]; oc.lineWidth = 1.6 * DPR; var px = _p[0], py = _p[1];
    for (var i = h.i; i >= 0 && B.ph[i] > P - TR; i--){ proj(B.P[i], _q); if (_q[2] < 0) break; oc.globalAlpha = Math.max(0.05, 0.9 * (1 - (P - B.ph[i]) / TR)); oc.beginPath(); oc.moveTo(px, py); oc.lineTo(_q[0], _q[1]); oc.stroke(); px = _q[0]; py = _q[1]; }
    oc.globalAlpha = 1; proj(h.p, _p); B.sx = _p[0]; B.sy = _p[1]; oc.beginPath(); oc.arc(_p[0], _p[1], (sel === B ? 5 : 3) * DPR, 0, 6.2832); oc.fillStyle = COL[B.sp]; oc.fill(); oc.lineWidth = 1 * DPR; oc.strokeStyle = 'rgba(3,5,10,.8)'; oc.stroke();
    if (sel === B){ oc.beginPath(); oc.arc(_p[0], _p[1], 10 * DPR, 0, 6.2832); oc.strokeStyle = '#fff'; oc.lineWidth = 2 * DPR; oc.stroke(); } });
  var d = new Date(Date.UTC(2001, 6, 1) + P * 365 * 86400000); $('#month').textContent = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'][d.getUTCMonth()] + ' ' + d.getUTCDate();
  if (!DRAGT) $('#tpos').value = Math.round(P * 1000);
}

/* ---------- loop ---------- */
var running = false, last = 0, DRAGT = false;
function kick(){ if (!running){ running = true; requestAnimationFrame(tick); } }
function tick(now){ var moving = false;
  if (PLAY && !REDUCED && now - ACT < 600000){ P = (((now - T0) / LOOP) % 1 + 1) % 1; moving = true; }
  if (moving || dirty){ dirty = false; draw(); }
  if (moving) requestAnimationFrame(tick); else running = false; }
function setPlay(on){ PLAY = on; var b = $('#play'); b.classList.toggle('on', on); b.innerHTML = on ? '&#10073;&#10073;&#xFE0E; PAUSE' : '&#9654;&#xFE0E; PLAY'; if (on){ T0 = performance.now() - P * LOOP; ACT = performance.now(); } kick(); }
$('#play').onclick = function(){ setPlay(!PLAY); };
$('#tpos').addEventListener('input', function(){ ACT = performance.now(); DRAGT = true; setPlay(false); P = (+this.value) / 1000; dirty = true; kick(); DRAGT = false; });
if (REDUCED) setPlay(false);

/* ---------- input: drag turns, pinch / ctrl-scroll zooms, tap picks a bird ---------- */
var drag = null, ptrs = {}, pinch = null, cvs = document.getElementById('gl');
cvs.addEventListener('pointerdown', function(e){ ACT = performance.now(); ptrs[e.pointerId] = [e.clientX, e.clientY]; cvs.setPointerCapture(e.pointerId); var ks = Object.keys(ptrs);
  if (ks.length === 2){ var a = ptrs[ks[0]], b = ptrs[ks[1]]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: CAM.zoom }; drag = null; return; } drag = { x: e.clientX, y: e.clientY, lat: CAM.lat, lon: CAM.lon, moved: false }; });
cvs.addEventListener('pointermove', function(e){ if (!ptrs[e.pointerId]) return; ACT = performance.now(); ptrs[e.pointerId] = [e.clientX, e.clientY];
  if (pinch){ var ks = Object.keys(ptrs); if (ks.length === 2){ var a = ptrs[ks[0]], b = ptrs[ks[1]]; CAM.zoom = Math.max(0.9, Math.min(8, pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d)); dirty = true; kick(); } return; }
  if (!drag) return; var dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true; var k = 0.3 / CAM.zoom; CAM.lon = drag.lon - dx * k; CAM.lat = Math.max(-80, Math.min(80, drag.lat + dy * k)); dirty = true; kick(); });
function up(e){ delete ptrs[e.pointerId]; if (pinch){ if (Object.keys(ptrs).length < 2) pinch = null; drag = null; return; } if (drag && !drag.moved) tap(e); drag = null; }
cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', function(e){ delete ptrs[e.pointerId]; drag = null; pinch = null; });
cvs.addEventListener('wheel', function(e){ if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); CAM.zoom = Math.max(0.9, Math.min(8, CAM.zoom * Math.exp(-e.deltaY * 0.004))); dirty = true; kick(); }, { passive: false });
window.addEventListener('keydown', function(e){ var st = 4 / CAM.zoom, k = e.key, used = true; if (k === 'ArrowLeft') CAM.lon -= st; else if (k === 'ArrowRight') CAM.lon += st; else if (k === 'ArrowUp') CAM.lat = Math.min(80, CAM.lat + st); else if (k === 'ArrowDown') CAM.lat = Math.max(-80, CAM.lat - st);
  else if (k === '+' || k === '=') CAM.zoom = Math.min(8, CAM.zoom * 1.2); else if (k === '-') CAM.zoom = Math.max(0.9, CAM.zoom / 1.2); else if (k === ' ') setPlay(!PLAY); else if (k === 'Escape'){ pickOff(); } else used = false; if (used){ e.preventDefault(); dirty = true; kick(); } });

function tap(e){ var r = cvs.getBoundingClientRect(), mx = (e.clientX - r.left) * DPR, my = (e.clientY - r.top) * DPR, best = null, bd = 16 * DPR;
  BIRDS.forEach(function(B){ if (!show[B.sp] || B.sx == null) return; var d = Math.hypot(B.sx - mx, B.sy - my); if (d < bd){ bd = d; best = B; } });
  if (!best){ pickOff(); return; } sel = best; FKEY = ''; var s = SP.filter(function(x){ return x.key === best.sp; })[0], b = best.b;
  var name = /^[A-Za-z][a-z]+$/.test(String(b.label || '')) ? '“' + b.label.toUpperCase() + '”' : 'TAG ' + String(b.label || b.local_id || '').toUpperCase();
  var bits = [(b.sex === 'm' ? 'MALE' : b.sex === 'f' ? 'FEMALE' : null), (b.life_stage ? String(b.life_stage).toUpperCase() : null), 'THIS YEAR: JULY ' + best.y + ' TO JUNE ' + (best.y + 1)].filter(Boolean);
  var far = best.south ? 'FARTHEST SOUTH ' + Math.abs(best.south[0]).toFixed(1) + '°' + (best.south[0] < 0 ? 'S' : 'N') + ' ' + Math.abs(best.south[1]).toFixed(1) + '°' + (best.south[1] < 0 ? 'W' : 'E') : '';
  var c = $('#pick .c'); c.innerHTML = '<div class="t">' + s.common.toUpperCase() + ' · ' + name + '</div><div class="s">' + bits.join(' · ') + '</div><div class="s">ABOUT ' + fmt(best.km) + ' KM THIS YEAR, IN STRAIGHT LINES BETWEEN FIXES' + (far ? ' · ' + far : '') + '</div>'
    + (b.manipulation && !/none/i.test(b.manipulation) ? '<div class="s">MOVED BY THE RESEARCHERS IN A DISPLACEMENT EXPERIMENT, SO ITS ROUTE IS NOT A NATURAL ONE</div>' : '');
  $('#pick').style.display = 'block'; $('#words').classList.add('off'); dirty = true; kick(); }
function pickOff(){ if (!sel) return; sel = null; FKEY = ''; $('#pick').style.display = 'none'; dirty = true; kick(); }
$('#pick .x').onclick = pickOff; $('#words .x').onclick = function(){ $('#words').classList.add('off'); };

function size(){ DPR = Math.min(2, window.devicePixelRatio || 1); W = Math.round(cvs.clientWidth * DPR); H = Math.round(cvs.clientHeight * DPR); cvs.width = W; cvs.height = H; ov.width = W; ov.height = H; FKEY = ''; dirty = true; kick(); }
window.addEventListener('resize', size); size();
window._fly = { state: function(){ return { birds: BIRDS.length, sp: SP.length, P: P }; }, setP: function(p){ setPlay(false); P = p; dirty = true; kick(); }, pick: function(sp){ var B = BIRDS.filter(function(x){ return x.sp === sp && x.sx != null; })[0]; if (B){ var r = cvs.getBoundingClientRect(); tap({ clientX: r.left + B.sx / DPR, clientY: r.top + B.sy / DPR }); } } };
})();
</script>
