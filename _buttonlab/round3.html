<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, indexifembedded"><!-- a lab, not a page: kept out of search -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button Lab Round Three</title>
<!-- BUTTON LAB, ROUND THREE (user 2026-11-04: "try more shapes, i dont like skeumorphic shapes and the handdrawn, they should look
     clean"). Flat, precise, vector: shapes borrowed from cartography and data graphics (print marks, scale bars, survey lines, gauges,
     charts, leader lines), never a pill, never a texture, never a physical imitation. Orange and white only. -->
<style>
  :root { --or: 234,88,12; --ord: #9a3412; --map: #0f1720; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0f14; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgb(var(--or)); padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  header h1 { margin: 0; font: 900 .95rem system-ui, sans-serif; letter-spacing: .16em; }
  header .sub { font: 700 .62rem system-ui, sans-serif; letter-spacing: .12em; opacity: .85; }
  header nav { margin-left: auto; display: flex; gap: 14px; }
  header nav a { color: #fff; font: 800 .56rem system-ui, sans-serif; letter-spacing: .12em; opacity: .85; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
  .fam { margin: 0 0 22px; }
  .fam .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 0 2px 8px; }
  .fam .head b { font: 900 .9rem system-ui, sans-serif; letter-spacing: .12em; }
  .fam .head span { font: 600 .74rem/1.4 system-ui, sans-serif; color: rgba(255,255,255,.72); }
  .bar { background: rgb(var(--or)); padding: 18px 18px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; }
  .row.tight { gap: 0; }
  .lab { font: 800 .52rem system-ui, sans-serif; letter-spacing: .14em; opacity: .8; margin-right: 4px; white-space: nowrap; }
  .map { position: relative; min-height: 150px; overflow: hidden; padding: 18px 18px 58px;
    background: radial-gradient(ellipse 30% 40% at 22% 70%, rgba(37,99,235,.55), transparent 70%), radial-gradient(ellipse 25% 30% at 70% 30%, rgba(22,101,52,.55), transparent 70%), var(--map); }
  .map .low { position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; }
  .map .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #f97316; box-shadow: 0 0 0 2px #fff; }
  .b { appearance: none; border: none; background: none; color: #fff; cursor: pointer; font: 900 .6rem system-ui, sans-serif; letter-spacing: .13em; text-transform: uppercase; padding: 9px 14px; line-height: 1; white-space: nowrap; position: relative; transition: background .15s, color .15s, box-shadow .15s, border-color .15s; }
  .b:focus-visible { outline: 2px solid #fde68a; outline-offset: 4px; }
  .b.on { color: var(--ord); }
  .map .b:not(.on) { background-color: rgba(var(--or),.96); }

  /* 1 · CROP MARKS: the printer's trim marks at the four corners, outside the word; picked fills the trim box */
  .f-crop .b { margin: 6px; }
  .f-crop .b::before { content: ''; position: absolute; inset: -6px; pointer-events: none;
    background: linear-gradient(#fff,#fff) 0 0 / 7px 1.5px, linear-gradient(#fff,#fff) 0 0 / 1.5px 7px, linear-gradient(#fff,#fff) 100% 0 / 7px 1.5px, linear-gradient(#fff,#fff) 100% 0 / 1.5px 7px,
                linear-gradient(#fff,#fff) 0 100% / 7px 1.5px, linear-gradient(#fff,#fff) 0 100% / 1.5px 7px, linear-gradient(#fff,#fff) 100% 100% / 7px 1.5px, linear-gradient(#fff,#fff) 100% 100% / 1.5px 7px; background-repeat: no-repeat; }
  .f-crop .b.on { background: #fff; }

  /* 2 · GRATICULE: rules that run past the corners, like a map grid crossing at the box */
  .f-grat .b { margin: 6px 7px; }
  .f-grat .b::before { content: ''; position: absolute; left: -7px; right: -7px; top: 0; bottom: 0; border-top: 1.5px solid rgba(255,255,255,.85); border-bottom: 1.5px solid rgba(255,255,255,.85); pointer-events: none; }
  .f-grat .b::after { content: ''; position: absolute; top: -6px; bottom: -6px; left: 0; right: 0; border-left: 1.5px solid rgba(255,255,255,.85); border-right: 1.5px solid rgba(255,255,255,.85); pointer-events: none; }
  .f-grat .b.on { background: #fff; }

  /* 3 · SCALE BAR: the alternating bar from a map's scale, under the word; picked, the full bar */
  .f-scale .b { padding: 8px 4px 12px; margin: 0 8px; }
  .f-scale .b::after { content: ''; position: absolute; left: 4px; right: 4px; bottom: 2px; height: 3px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 8px, transparent 8px 16px); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.55); }
  .f-scale .b.on { color: #fff; }
  .f-scale .b.on::after { height: 5px; background: repeating-linear-gradient(90deg, #fff 0 8px, var(--ord) 8px 16px); box-shadow: 0 0 0 1px #fff; }
  .f-scale .map .b:not(.on) { background-color: transparent; text-shadow: 0 1px 3px rgba(0,0,0,.8); }

  /* 4 · POINTER: a block whose picked state grows a notch pointing down at what it opens */
  .f-point .b { background: rgba(255,255,255,.14); }
  .f-point .b.on { background: #fff; }
  .f-point .b.on::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid #fff; }
  .f-point .row.tight { gap: 2px; }

  /* 5 · QUARTER: square blocks with one rounded corner, all facing the same way */
  .f-quart .b { border: 1.5px solid rgba(255,255,255,.85); border-radius: 12px 0 0 0; }
  .f-quart .b.on { background: #fff; border-color: #fff; }
  .f-quart .row.tight .b + .b { margin-left: -1.5px; }

  /* 6 · MISREGISTER: a flat block with its outline printed 3 px off, like a two-color print out of register */
  .f-mis .b { margin: 0 3px 3px 0; }
  .f-mis .b::before { content: ''; position: absolute; inset: 0; transform: translate(3px,3px); border: 1.5px solid #fff; pointer-events: none; }
  .f-mis .b:not(.on) { background: rgba(255,255,255,.12); }
  .f-mis .b.on { background: #fff; }
  .f-mis .b.on::before { border-color: rgba(0,0,0,.35); }

  /* 7 · BOUNDARY: a dashed survey line when off, solid ground when picked */
  .f-bound .b { border: 1.5px dashed rgba(255,255,255,.85); }
  .f-bound .b.on { background: #fff; border-style: solid; border-color: #fff; }
  .f-bound .row.tight .b + .b { margin-left: -1.5px; }

  /* 8 · WATER LEVEL: a gauge; off, a low fill at the bottom; picked, the fill rises to the top */
  .f-level .b { border: 1.5px solid rgba(255,255,255,.85); background: linear-gradient(to top, rgba(255,255,255,.3) 0 22%, transparent 22%); transition: background-size .25s; }
  .f-level .b.on { background: linear-gradient(to top, #fff 0 100%, transparent 100%); border-color: #fff; }
  .f-level .row.tight .b + .b { margin-left: -1.5px; }
  .f-level .map .b:not(.on) { background: linear-gradient(to top, rgba(255,255,255,.3) 0 22%, rgba(var(--or),.96) 22%); }

  /* 9 · BAR CHART: each word over a bar; the picked bar is full height */
  .f-chart .b { padding: 8px 6px 16px; margin: 0 4px; }
  .f-chart .b::after { content: ''; position: absolute; left: 6px; right: 6px; bottom: 2px; height: 4px; background: rgba(255,255,255,.45); transition: height .2s, background .2s; }
  .f-chart .b.on { color: #fff; }
  .f-chart .b.on::after { height: 10px; background: #fff; }
  .f-chart .row.tabs { align-items: flex-end; border-bottom: 1.5px solid rgba(255,255,255,.7); }
  .f-chart .map .b:not(.on) { background-color: transparent; text-shadow: 0 1px 3px rgba(0,0,0,.8); }

  /* 10 · LEADER LINE: the line a map uses to tie a label to its place; a dot at the end, thick when picked */
  .f-lead .b { padding-left: 28px; }
  .f-lead .b::before { content: ''; position: absolute; left: 4px; top: 50%; width: 18px; height: 1.5px; background: rgba(255,255,255,.8); }
  .f-lead .b::after { content: ''; position: absolute; left: 0; top: 50%; width: 6px; height: 6px; margin-top: -2.25px; border-radius: 50%; border: 1.5px solid #fff; background: transparent; }
  .f-lead .b.on { background: none; color: #fff; }
  .f-lead .b.on::before { height: 3px; margin-top: -.75px; background: #fff; }
  .f-lead .b.on::after { background: #fff; width: 8px; height: 8px; margin-top: -3.5px; left: -1px; }
  .f-lead .map .b:not(.on) { background-color: transparent; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .f-lead .map .b.on { text-shadow: 0 1px 3px rgba(0,0,0,.8); }

  /* 11 · DIAMOND KEY: a legend diamond beside the word, outline off, solid on */
  .f-dia .b { padding-left: 26px; }
  .f-dia .b::before { content: ''; position: absolute; left: 8px; top: 50%; width: 8px; height: 8px; margin-top: -5px; transform: rotate(45deg); border: 1.5px solid #fff; transition: background .15s; }
  .f-dia .b.on { color: #fff; }
  .f-dia .b.on::before { background: #fff; }
  .f-dia .map .b:not(.on) { background-color: transparent; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .f-dia .map .b.on { text-shadow: 0 1px 3px rgba(0,0,0,.8); }

  /* 12 · RING: a precise ellipse around the picked word, like a circled place on a printed map */
  .f-ring .b::before { content: ''; position: absolute; inset: -3px -8px; border-radius: 50%; border: 1.5px solid transparent; transition: border-color .15s, inset .15s; }
  .f-ring .b.on { color: #fff; }
  .f-ring .b.on::before { border-color: #fff; inset: -4px -10px; }
  .f-ring .map .b:not(.on) { background-color: transparent; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .f-ring .map .b.on { text-shadow: 0 1px 3px rgba(0,0,0,.8); }

  /* 13 · NESTED: two precise outlines a few pixels apart, like contour lines; picked fills the inner one */
  .f-nest .b { margin: 5px; outline: 1.5px solid rgba(255,255,255,.85); outline-offset: 4px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.85); }
  .f-nest .b.on { background: #fff; box-shadow: none; outline-color: #fff; }

  /* 14 · STEPS: bars of three heights under the word, like a stepped profile; the picked one rises */
  .f-step .b { padding: 8px 6px 15px; margin: 0 4px; }
  .f-step .b::after { content: ''; position: absolute; left: 6px; right: 6px; bottom: 2px; height: 8px;
    background: linear-gradient(90deg, rgba(255,255,255,.5) 0 30%, transparent 30% 35%, rgba(255,255,255,.5) 35% 65%, transparent 65% 70%, rgba(255,255,255,.5) 70%) bottom / 100% 3px no-repeat; transition: background-size .2s; }
  .f-step .b.on { color: #fff; }
  .f-step .b.on::after { background: linear-gradient(90deg, #fff 0 30%, transparent 30% 35%, #fff 35% 65%, transparent 65% 70%, #fff 70%) bottom / 100% 3px no-repeat,
    linear-gradient(90deg, transparent 0 35%, #fff 35% 65%, transparent 65%) bottom / 100% 8px no-repeat; }
  .f-step .map .b:not(.on) { background-color: transparent; text-shadow: 0 1px 3px rgba(0,0,0,.8); }

  /* 15 · RAIL: the tabs sit on one thick rail; the picked one breaks the rail and lifts out of it */
  .f-rail .row.tabs { gap: 0; box-shadow: inset 0 -4px 0 #fff; }
  .f-rail .b { padding: 10px 14px 12px; }
  .f-rail .b.on { background: #fff; box-shadow: 0 4px 0 var(--ord); }
  .f-rail .row:not(.tabs) .b { box-shadow: inset 0 -3px 0 rgba(255,255,255,.5); }
  .f-rail .row:not(.tabs) .b.on { box-shadow: inset 0 -3px 0 var(--ord); }

  /* 16 · CUT: a flat block with a single straight corner cut, all cut the same way, like a sheet of a map series */
  .f-cut .b { background: rgba(255,255,255,.16); clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); padding-right: 18px; }
  .f-cut .b.on { background: #fff; }
  .f-cut .row.tight { gap: 3px; }

  footer { max-width: 1180px; margin: 0 auto; padding: 0 16px 40px; font: 600 .7rem/1.5 system-ui, sans-serif; color: rgba(255,255,255,.55); }
  @media (max-width: 640px) { .bar { padding: 14px 12px; } header nav { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>BLUISH · BUTTONS, ROUND THREE</h1>
  <span class="sub">CLEAN AND FLAT · SHAPES BORROWED FROM MAPS AND CHARTS · NO PILLS, NO TEXTURE, NO HAND-DRAWN LINES</span>
  <nav><a href="./">ROUND ONE</a><a href="round2.html">ROUND TWO</a><a href="round4.html">ROUND FOUR →</a></nav>
</header>
<main id="main"></main>
<footer>Tap anything: the states are live. Each family is shown as a tab row (one picked), a row of switches (several on) and floating over a map.</footer>
<script>
  var FAM = [
    ['crop', 'CROP MARKS', 'A printer’s trim marks at the four corners, just outside the word. Picked, the trim box fills in.'],
    ['grat', 'GRATICULE', 'Lines that run past the corners, like map grid lines crossing at the box.'],
    ['scale', 'SCALE BAR', 'The alternating bar from a map’s scale, under the word. Picked, it turns solid and two-tone.'],
    ['point', 'POINTER', 'A flat block; the picked one grows a notch pointing down at what it opens.'],
    ['quart', 'QUARTER', 'Square blocks with one rounded corner, every one facing the same way.'],
    ['mis', 'MISREGISTER', 'A flat block with its outline printed 3 px off, like a two-color print out of register.'],
    ['bound', 'BOUNDARY', 'A dashed survey line when off; solid ground when picked.'],
    ['level', 'WATER LEVEL', 'A gauge. Off, a low fill sits at the bottom; picked, it rises to the top.'],
    ['chart', 'BAR CHART', 'Each word over a bar on a baseline; the picked bar stands tallest.'],
    ['lead', 'LEADER LINE', 'The line a map uses to tie a label to its place, ending in a dot. Picked, the line thickens and the dot fills.'],
    ['dia', 'DIAMOND KEY', 'A legend diamond beside the word: outline when off, solid when on.'],
    ['ring', 'RING', 'A precise ellipse around the picked word, like a circled place on a printed map.'],
    ['nest', 'NESTED', 'Two precise outlines a few pixels apart, like contour lines. Picked, the inner one fills.'],
    ['step', 'STEPS', 'A stepped profile under the word; the middle step rises when picked.'],
    ['rail', 'RAIL', 'The tabs sit on one thick rail; the picked one becomes a solid block on it.'],
    ['cut', 'CUT CORNER', 'A flat block with one straight corner cut, all the same way, like the sheets of a map series.']
  ];
  var TABS = ['FOLIAGE', 'SPECIES', 'TREE RINGS', 'HEIGHT', 'FOREST LOSS', 'PESTS'];
  var SW = [['7-DAY OUTLOOK', 1], ['MODELS', 1], ['WIND ODDS', 0], ['RECON', 0], ['WAVES', 0], ['OCEAN HEAT', 1]];
  var MP = [['LEGEND', 0], ['PLATE EDGES', 1], ['TOXIC SITES', 0]];
  var btn = function(label, on){ return '<button type="button" class="b' + (on ? ' on' : '') + '">' + label + '</button>'; };
  var TIGHT = { quart: 1, bound: 1, level: 1, point: 1, cut: 1 };
  document.getElementById('main').innerHTML = FAM.map(function(F, i){ var f = F[0];
    return '<section class="fam f-' + f + '"><div class="head"><b>' + (i + 1) + ' · ' + F[1] + '</b><span>' + F[2] + '</span></div><div class="bar">'
      + '<div class="row tabs' + (TIGHT[f] ? ' tight' : '') + '" data-one="1">' + TABS.map(function(t, k){ return btn(t, k === 1); }).join('') + '</div>'
      + '<div class="row"><span class="lab">SWITCHES</span>' + SW.map(function(c){ return btn(c[0], c[1]); }).join('') + '</div></div>'
      + '<div class="map"><span class="dot" style="left:30%;top:62%"></span><span class="dot" style="left:64%;top:48%"></span><span class="dot" style="left:82%;top:30%"></span><div class="row">'
      + MP.map(function(c){ return btn(c[0], c[1]); }).join('') + '</div><div class="low">' + btn('CLICK THE MAP TO ZOOM WITH SCROLL', 0) + '</div></div></section>'; }).join('');
  document.getElementById('main').addEventListener('click', function(e){ var b = e.target.closest('.b'); if (!b) return; var row = b.parentNode;
    if (row.getAttribute('data-one')) row.querySelectorAll('.b').forEach(function(x){ x.classList.toggle('on', x === b); }); else b.classList.toggle('on'); });
</script>
</body>
</html>
