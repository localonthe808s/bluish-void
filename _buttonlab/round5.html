<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, indexifembedded"><!-- a lab, not a page: kept out of search -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button Lab Round Five</title>
<!-- BUTTON LAB, ROUND FIVE (user 2026-11-04: "i like 16 and 1", then "make more designs in lab first"): variations on round four's RING and OVERLAP. Built on round four;
     ROUND FOUR (user 2026-11-04: "12 isnt bad, show more like those, leave out hard corners"). Round three's RING
     (a clean ellipse around the picked word) in sixteen variations. Every mark is a precise SVG curve: ellipses, arcs, lenses,
     waves. No corners anywhere, no textures, no wobble. Orange and white only. -->
<style>
  :root { --or: 234,88,12; --ord: #9a3412; --map: #0f1720; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0f14; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgb(var(--or)); padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  header h1 { margin: 0; font: 900 .95rem system-ui, sans-serif; letter-spacing: .16em; }
  header .sub { font: 700 .62rem system-ui, sans-serif; letter-spacing: .12em; opacity: .85; }
  header nav { margin-left: auto; display: flex; gap: 14px; }
  header nav a { color: #fff; font: 800 .56rem system-ui, sans-serif; letter-spacing: .12em; opacity: .85; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
  .fam { margin: 0 0 22px; }
  .fam .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 0 2px 8px; }
  .fam .head b { font: 900 .9rem system-ui, sans-serif; letter-spacing: .12em; }
  .fam .head span { font: 600 .74rem/1.4 system-ui, sans-serif; color: rgba(255,255,255,.72); }
  .bar { background: rgb(var(--or)); padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; }
  .lab { font: 800 .52rem system-ui, sans-serif; letter-spacing: .14em; opacity: .8; margin-right: 2px; white-space: nowrap; }
  .map { position: relative; min-height: 160px; overflow: hidden; padding: 24px 24px 62px;
    background: radial-gradient(ellipse 30% 40% at 22% 70%, rgba(37,99,235,.55), transparent 70%), radial-gradient(ellipse 25% 30% at 70% 30%, rgba(22,101,52,.55), transparent 70%), var(--map); }
  .map .low { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; }
  .map .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #f97316; box-shadow: 0 0 0 2px #fff; }
  .b { appearance: none; border: none; background: none; color: #fff; cursor: pointer; font: 900 .6rem system-ui, sans-serif; letter-spacing: .13em; text-transform: uppercase; padding: 9px 12px; line-height: 1; white-space: nowrap; position: relative; isolation: isolate; }
  .b .t { position: relative; z-index: 1; transition: color .15s; }
  .b svg.m { position: absolute; left: -14px; top: -10px; overflow: visible; pointer-events: none; z-index: 0; }
  .b svg.m * { transition: opacity .18s; }
  .b:focus-visible { outline: none; }
  .b:focus-visible .t { text-decoration: underline; text-underline-offset: 4px; }
  .map .b .t { text-shadow: 0 1px 3px rgba(0,0,0,.85); }
  .fill .b.on .t { color: var(--ord); text-shadow: none; }
  footer { max-width: 1180px; margin: 0 auto; padding: 0 16px 40px; font: 600 .7rem/1.5 system-ui, sans-serif; color: rgba(255,255,255,.55); }
  @media (max-width: 640px) { .bar { padding: 16px 14px; } .row { gap: 14px 16px; } header nav { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>BLUISH · BUTTONS, ROUND FIVE</h1>
  <span class="sub">MORE LIKE 1 AND 16: THE RING AND THE OVERLAP · CURVES ONLY · TAP ANYTHING</span>
  <nav><a href="./">ONE</a><a href="round2.html">TWO</a><a href="round3.html">THREE</a><a href="round4.html">FOUR</a><a href="round6.html">SIX →</a></nav>
</header>
<main id="main"></main>
<footer>Each family is shown as a tab row (one picked), a row of switches (several on) and floating over a map. Every mark is drawn to fit its word.</footer>
<script>
(function(){
  var W = '#fff', OD = '#9a3412', OR = 'rgb(234,88,12)';
  /* each mark gets the button's size; (0,0) is the button's top-left, and the svg reaches 14 px out on the sides and 10 above and below */
  var E = function(cx, cy, rx, ry, at){ return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" ' + (at || '') + '/>'; };
  var arc = function(cx, cy, rx, ry, a0, a1){ var p = function(a){ a = a * Math.PI / 180; return (cx + rx * Math.cos(a)).toFixed(1) + ' ' + (cy + ry * Math.sin(a)).toFixed(1); };
    var large = Math.abs(a1 - a0) > 180 ? 1 : 0; return 'M' + p(a0) + ' A' + rx + ' ' + ry + ' 0 ' + large + ' 1 ' + p(a1); };
  var S = function(on, off){ return 'fill="none" stroke="#fff" stroke-width="' + (on ? 1.6 : 1.2) + '"' + (off ? ' opacity="' + off + '"' : ''); };
  var uid = 0;
  var R = function(w, h, k){ k = k || 1; return [w / 2 + 6 * k, h / 2 + 4 * k]; };
  var FAM = [
    ['ov', 'OVERLAP', 'Round four’s 16, the baseline: two rings side by side, overlapping behind the picked word.', function(w, h, on){ return on ? E(w / 2 - 6, h / 2, w / 2, h / 2 + 4, S(1)) + E(w / 2 + 6, h / 2, w / 2, h / 2 + 4, S(1, .6)) : ''; }],
    ['ring', 'RING', 'Round four’s 1, the baseline: one clean ellipse around the picked word.', function(w, h, on){ return on ? E(w / 2, h / 2, w / 2 + 6, h / 2 + 4, S(1)) : ''; }],
    ['split', 'SPLIT', 'Every word sits in one faint ring; picking it splits the ring in two, sliding apart.', function(w, h, on){ var d = on ? 6 : 0; return E(w / 2 - d, h / 2, w / 2 + (on ? 0 : 6), h / 2 + 4, on ? S(1) : S(0, .3)) + (on ? E(w / 2 + d, h / 2, w / 2, h / 2 + 4, S(1, .6)) : ''); }],
    ['ovfill', 'FILLED OVERLAP', 'The two rings, with the lens where they cross filled in white.', function(w, h, on){ if (!on) return ''; var id = 'c' + (++uid);
      return '<defs><clipPath id="' + id + '">' + E(w / 2 - 7, h / 2, w / 2, h / 2 + 4) + '</clipPath></defs>' + E(w / 2 + 7, h / 2, w / 2, h / 2 + 4, 'fill="rgba(255,255,255,.28)" clip-path="url(#' + id + ')"') + E(w / 2 - 7, h / 2, w / 2, h / 2 + 4, S(1)) + E(w / 2 + 7, h / 2, w / 2, h / 2 + 4, S(1)); }],
    ['ovv', 'VERTICAL OVERLAP', 'The two rings offset up and down instead of side by side.', function(w, h, on){ return on ? E(w / 2, h / 2 - 2.5, w / 2 + 6, h / 2 + 3, S(1)) + E(w / 2, h / 2 + 2.5, w / 2 + 6, h / 2 + 3, S(1, .6)) : ''; }],
    ['ovd', 'DIAGONAL OVERLAP', 'The rings offset on a slant, one up and left, one down and right.', function(w, h, on){ return on ? E(w / 2 - 4, h / 2 - 2, w / 2 + 3, h / 2 + 3, S(1)) + E(w / 2 + 4, h / 2 + 2, w / 2 + 3, h / 2 + 3, S(1, .6)) : ''; }],
    ['tri', 'THREE RINGS', 'Three rings, offset like a fan; a layer on top of a layer on top of the map.', function(w, h, on){ return on ? [-8, 0, 8].map(function(d, i){ return E(w / 2 + d, h / 2 + (i === 1 ? -1.5 : 1), w / 2 - 2, h / 2 + 4, S(i === 1, [.55, 1, .55][i])); }).join('') : ''; }],
    ['chain', 'LINKED', 'Two rings pulled further apart, overlapping only at the middle, like links of a chain.', function(w, h, on){ return on ? E(w / 2 - 11, h / 2, w / 2 + 3, h / 2 + 4, S(1)) + E(w / 2 + 11, h / 2, w / 2 + 3, h / 2 + 4, S(1)) : ''; }],
    ['size', 'BIG AND SMALL', 'A large ring around the word and a small one overlapping its edge.', function(w, h, on){ var r = R(w, h); return on ? E(w / 2, h / 2, r[0], r[1], S(1)) + E(w / 2 + r[0] - 3, h / 2 - r[1] + 5, 9, 7, S(1, .7)) : ''; }],
    ['ecc', 'ECCENTRIC', 'Two rings that touch at one side and open at the other, like a moon drawn against its planet.', function(w, h, on){ var r = R(w, h); return on ? E(w / 2, h / 2, r[0], r[1], S(1)) + E(w / 2 - 6, h / 2, r[0] - 6, r[1] - 2, S(1, .55)) : ''; }],
    ['tint', 'TINTED OVERLAP', 'The two rings, one of them filled with a pale tint, the other an outline.', function(w, h, on){ return on ? E(w / 2 - 6, h / 2, w / 2, h / 2 + 4, 'fill="rgba(255,255,255,.24)"') + E(w / 2 + 6, h / 2, w / 2, h / 2 + 4, S(1)) : ''; }],
    ['ghostov', 'GHOST OVERLAP', 'Every word gets the overlapping pair faintly; the picked pair turns solid.', function(w, h, on){ return E(w / 2 - 6, h / 2, w / 2, h / 2 + 4, on ? S(1) : S(0, .25)) + E(w / 2 + 6, h / 2, w / 2, h / 2 + 4, on ? S(1, .6) : S(0, .18)); }],
    ['heavy', 'HEAVY RING', 'The ring at a heavier stroke, closer to the weight of the letters.', function(w, h, on){ return on ? E(w / 2, h / 2, w / 2 + 6, h / 2 + 4, 'fill="none" stroke="#fff" stroke-width="2.6"') : ''; }],
    ['hair', 'HAIRLINE RING', 'A hairline ring on every word, the picked one a touch heavier and larger.', function(w, h, on){ return E(w / 2, h / 2, w / 2 + (on ? 7 : 5), h / 2 + (on ? 5 : 3), on ? 'fill="none" stroke="#fff" stroke-width="1.5"' : 'fill="none" stroke="rgba(255,255,255,.4)" stroke-width=".8"'); }],
    ['wide', 'WIDE RING', 'A looser, flatter ellipse that reaches well past the word.', function(w, h, on){ return on ? E(w / 2, h / 2, w / 2 + 10, h / 2 + 3, S(1)) : ''; }],
    ['mix', 'RING AND OVERLAP TOGETHER', 'A system: tabs (pick one) get the single ring; switches (on and off) get the overlapping pair. Two kinds of control that read differently.', null]
  ];
  var TABS = ['FOLIAGE', 'SPECIES', 'TREE RINGS', 'HEIGHT', 'FOREST LOSS', 'PESTS'];
  var SW = [['7-DAY OUTLOOK', 1], ['MODELS', 1], ['WIND ODDS', 0], ['RECON', 0], ['WAVES', 0], ['OCEAN HEAT', 1]];
  var MP = [['LEGEND', 0], ['PLATE EDGES', 1], ['TOXIC SITES', 0]];
  var BY = {}; FAM.forEach(function(F){ BY[F[0]] = F; });
  var btn = function(f, label, on){ return '<button type="button" class="b' + (on ? ' on' : '') + '" data-f="' + f + '"><span class="t">' + label + '</span></button>'; };
  var paint = function(b){ var F = BY[b.getAttribute('data-f')], w = b.offsetWidth, h = b.offsetHeight, m = b.querySelector('svg.m');
    if (!m){ m = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); m.setAttribute('class', 'm'); b.insertBefore(m, b.firstChild); }
    m.setAttribute('width', w + 28); m.setAttribute('height', h + 20); m.setAttribute('viewBox', '-14 -10 ' + (w + 28) + ' ' + (h + 20)); m.innerHTML = F[3](w, h, b.classList.contains('on')); };
  var main = document.getElementById('main');
  main.innerHTML = FAM.map(function(F, i){ var f = F[0];
    return '<section class="fam' + (F[4] ? ' fill' : '') + '"><div class="head"><b>' + (i + 1) + ' · ' + F[1] + '</b><span>' + F[2] + '</span></div><div class="bar">'
      + '<div class="row" data-one="1">' + TABS.map(function(t, k){ return btn(f === 'mix' ? 'ring' : f, t, k === 1); }).join('') + '</div>'
      + '<div class="row"><span class="lab">SWITCHES</span>' + SW.map(function(c){ return btn(f === 'mix' ? 'ov' : f, c[0], c[1]); }).join('') + '</div></div>'
      + '<div class="map"><span class="dot" style="left:30%;top:62%"></span><span class="dot" style="left:64%;top:48%"></span><span class="dot" style="left:82%;top:30%"></span><div class="row">'
      + MP.map(function(c){ return btn(f === 'mix' ? 'ov' : f, c[0], c[1]); }).join('') + '</div><div class="low">' + btn(f === 'mix' ? 'ring' : f, 'CLICK THE MAP TO ZOOM WITH SCROLL', 0) + '</div></div></section>'; }).join('');
  var all = function(){ main.querySelectorAll('.b').forEach(paint); };
  main.addEventListener('click', function(e){ var b = e.target.closest('.b'); if (!b) return; var row = b.parentNode;
    if (row.getAttribute('data-one')) row.querySelectorAll('.b').forEach(function(x){ x.classList.toggle('on', x === b); paint(x); }); else { b.classList.toggle('on'); paint(b); } });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(all);
  window.addEventListener('resize', function(){ clearTimeout(window._rz); window._rz = setTimeout(all, 120); });
})();
</script>
</body>
</html>
