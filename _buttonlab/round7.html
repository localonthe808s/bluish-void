<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, indexifembedded"><!-- a lab, not a page: kept out of search -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button Lab Round Seven</title>
<!-- BUTTON LAB, ROUND SEVEN (user 2026-11-04: "sorry i meant this one": round five's 2, the single RING): sixteen takes on the ring. Built on round five, which was built on round four;
     ROUND FOUR (user 2026-11-04: "12 isnt bad, show more like those, leave out hard corners"). Round three's RING
     (a clean ellipse around the picked word) in sixteen variations. Every mark is a precise SVG curve: ellipses, arcs, lenses,
     waves. No corners anywhere, no textures, no wobble. Orange and white only. -->
<style>
  :root { --or: 234,88,12; --ord: #9a3412; --map: #0f1720; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0f14; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgb(var(--or)); padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  header h1 { margin: 0; font: 900 .95rem system-ui, sans-serif; letter-spacing: .16em; }
  header .sub { font: 700 .62rem system-ui, sans-serif; letter-spacing: .12em; opacity: .85; }
  header nav { margin-left: auto; display: flex; gap: 14px; }
  header nav a { color: #fff; font: 800 .56rem system-ui, sans-serif; letter-spacing: .12em; opacity: .85; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
  .fam { margin: 0 0 22px; }
  .fam .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 0 2px 8px; }
  .fam .head b { font: 900 .9rem system-ui, sans-serif; letter-spacing: .12em; }
  .fam .head span { font: 600 .74rem/1.4 system-ui, sans-serif; color: rgba(255,255,255,.72); }
  .bar { background: rgb(var(--or)); padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; }
  .lab { font: 800 .52rem system-ui, sans-serif; letter-spacing: .14em; opacity: .8; margin-right: 2px; white-space: nowrap; }
  .map { position: relative; min-height: 160px; overflow: hidden; padding: 24px 24px 62px;
    background: radial-gradient(ellipse 30% 40% at 22% 70%, rgba(37,99,235,.55), transparent 70%), radial-gradient(ellipse 25% 30% at 70% 30%, rgba(22,101,52,.55), transparent 70%), var(--map); }
  .map .low { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; }
  .map .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #f97316; box-shadow: 0 0 0 2px #fff; }
  .b { appearance: none; border: none; background: none; color: #fff; cursor: pointer; font: 900 .6rem system-ui, sans-serif; letter-spacing: .13em; text-transform: uppercase; padding: 9px 12px; line-height: 1; white-space: nowrap; position: relative; isolation: isolate; }
  .b .t { position: relative; z-index: 1; transition: color .15s; }
  .b svg.m { position: absolute; left: -14px; top: -10px; overflow: visible; pointer-events: none; z-index: 0; }
  .b svg.m * { transition: opacity .18s; }
  .b:focus-visible { outline: none; }
  .b:focus-visible .t { text-decoration: underline; text-underline-offset: 4px; }
  .map .b .t { text-shadow: 0 1px 3px rgba(0,0,0,.85); }
  .b svg.m .ar { transform-box: fill-box; transform-origin: center; opacity: 0; }
  [data-f=draw] svg.m .ar { opacity: 1; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .35s ease-out; }
  [data-f=draw].on svg.m .ar { stroke-dashoffset: 0; }
  [data-f=grow] svg.m .ar { transform: scale(.55); transition: transform .25s cubic-bezier(.3,1.4,.5,1), opacity .15s; }
  [data-f=grow].on svg.m .ar { transform: scale(1); opacity: 1; }
  [data-f=pulse].on svg.m .ar { opacity: 1; animation: bvPulse .45s cubic-bezier(.3,1.4,.5,1); }
  @keyframes bvPulse { 0% { transform: scale(1.25); opacity: 0; } 60% { transform: scale(.96); opacity: 1; } 100% { transform: scale(1); } }
  [data-f=hover] svg.m .ar { transition: opacity .15s; }
  [data-f=hover]:not(.on):hover svg.m .ar { opacity: .4; }
  [data-f=hover].on svg.m .ar { opacity: 1; }
  .dim .b:not(.on) .t { opacity: .62; } .dim .b:not(.on):hover .t { opacity: 1; }
  .fill .b.on .t { color: var(--ord); text-shadow: none; }
  footer { max-width: 1180px; margin: 0 auto; padding: 0 16px 40px; font: 600 .7rem/1.5 system-ui, sans-serif; color: rgba(255,255,255,.55); }
  @media (max-width: 640px) { .bar { padding: 16px 14px; } .row { gap: 14px 16px; } header nav { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>BLUISH · BUTTONS, ROUND SEVEN</h1>
  <span class="sub">SIXTEEN TAKES ON THE SINGLE RING · TAP ANYTHING, THE LAST FOUR MOVE</span>
  <nav><a href="./">ONE</a><a href="round2.html">TWO</a><a href="round3.html">THREE</a><a href="round4.html">FOUR</a><a href="round5.html">FIVE</a><a href="round6.html">SIX</a><a href="round8.html">EIGHT →</a></nav>
</header>
<main id="main"></main>
<footer>Each family is shown as a tab row (one picked), a row of switches (several on) and floating over a map. Every mark is drawn to fit its word.</footer>
<script>
(function(){
  var W = '#fff', OD = '#9a3412', OR = 'rgb(234,88,12)';
  /* each mark gets the button's size; (0,0) is the button's top-left, and the svg reaches 14 px out on the sides and 10 above and below */
  var E = function(cx, cy, rx, ry, at){ return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" ' + (at || '') + '/>'; };
  var arc = function(cx, cy, rx, ry, a0, a1){ var p = function(a){ a = a * Math.PI / 180; return (cx + rx * Math.cos(a)).toFixed(1) + ' ' + (cy + ry * Math.sin(a)).toFixed(1); };
    var large = Math.abs(a1 - a0) > 180 ? 1 : 0; return 'M' + p(a0) + ' A' + rx + ' ' + ry + ' 0 ' + large + ' 1 ' + p(a1); };
  var S = function(on, off){ return 'fill="none" stroke="#fff" stroke-width="' + (on ? 1.6 : 1.2) + '"' + (off ? ' opacity="' + off + '"' : ''); };
  var uid = 0;
  var R = function(w, h, k){ k = k || 1; return [w / 2 + 6 * k, h / 2 + 4 * k]; };
  var uid = 0;
  var RG = function(w, h, px, py, at){ return E(w / 2, h / 2, w / 2 + px, h / 2 + py, at || S(1)); };
  var FAM = [
    ['ring', 'RING', 'The one you picked, as the baseline: a 1.6 px ellipse 6 px past the word on each side.', function(w, h, on){ return on ? RG(w, h, 6, 4) : ''; }],
    ['snug', 'SNUG', 'Drawn close around the word, barely clearing the letters.', function(w, h, on){ return on ? RG(w, h, 3, 2) : ''; }],
    ['roomy', 'ROOMY', 'More air between the word and the ring.', function(w, h, on){ return on ? RG(w, h, 10, 6) : ''; }],
    ['round', 'ROUNDER', 'A taller ellipse, so the ends are fuller and rounder.', function(w, h, on){ return on ? RG(w, h, 5, 8) : ''; }],
    ['squ', 'SUPERELLIPSE', 'Flatter along the top and bottom, still fully round at the ends: between an ellipse and a stadium, with no straight lines.', function(w, h, on){ if (!on) return ''; var a = w / 2 + 7, b = h / 2 + 4, n = 3.2, P = [];
      for (var k = 0; k < 96; k++){ var t = k / 96 * 2 * Math.PI, c = Math.cos(t), sn = Math.sin(t); P.push((w / 2 + a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n)).toFixed(2) + ' ' + (h / 2 + b * Math.sign(sn) * Math.pow(Math.abs(sn), 2 / n)).toFixed(2)); }
      return '<path d="M' + P.join(' L') + 'Z" ' + S(1) + '/>'; }],
    ['thin', 'THIN', 'The ring at a 1 px hairline.', function(w, h, on){ return on ? RG(w, h, 6, 4, 'fill="none" stroke="#fff" stroke-width="1"') : ''; }],
    ['med', 'MEDIUM', 'The ring at 2.2 px, closer to the weight of the letters.', function(w, h, on){ return on ? RG(w, h, 6, 4, 'fill="none" stroke="#fff" stroke-width="2.2"') : ''; }],
    ['weigh', 'WEIGHTED', 'Thin across the top, heavier along the bottom, so the ring seems to sit on the line.', function(w, h, on){ if (!on) return ''; var rx = w / 2 + 6, ry = h / 2 + 4, cx = w / 2, cy = h / 2;
      return '<path d="M' + (cx - rx) + ' ' + cy + ' A' + rx + ' ' + ry + ' 0 0 1 ' + (cx + rx) + ' ' + cy + '" fill="none" stroke="#fff" stroke-width="1"/><path d="M' + (cx + rx) + ' ' + cy + ' A' + rx + ' ' + ry + ' 0 0 1 ' + (cx - rx) + ' ' + cy + '" fill="none" stroke="#fff" stroke-width="2.4"/>'; }],
    ['tint', 'FAINT FILL', 'The ring with the lightest white wash inside it.', function(w, h, on){ return on ? RG(w, h, 6, 4, 'fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="1.6"') : ''; }],
    ['ghost', 'WHISPER OFF', 'Every word keeps a barely-there ring, so you can see what is clickable; the picked ring is solid.', function(w, h, on){ return RG(w, h, 6, 4, on ? S(1) : 'fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1"'); }],
    ['dim', 'DIM THE REST', 'The ring stays the same; the words that are not picked drop back a little, so the picked one stands forward.', function(w, h, on){ return on ? RG(w, h, 6, 4) : ''; }, 'dim'],
    ['low', 'SITS LOW', 'The ring shifted 2 px down, so the word rides near its top like a label on a bead.', function(w, h, on){ return on ? E(w / 2, h / 2 + 2, w / 2 + 6, h / 2 + 4, S(1)) : ''; }],
    ['draw', 'DRAWS ITSELF', 'Picking draws the ring around the word in a third of a second, like a pen circling it.', 'anim'],
    ['grow', 'GROWS IN', 'Picking grows the ring out from the word.', 'anim'],
    ['pulse', 'PULSES ONCE', 'The ring lands a little large and settles in once.', 'anim'],
    ['hover', 'HOVER PREVIEW', 'Hovering shows the ring faintly before you pick.', 'anim']
  ];
  var TABS = ['FOLIAGE', 'SPECIES', 'TREE RINGS', 'HEIGHT', 'FOREST LOSS', 'PESTS'];
  var SW = [['7-DAY OUTLOOK', 1], ['MODELS', 1], ['WIND ODDS', 0], ['RECON', 0], ['WAVES', 0], ['OCEAN HEAT', 1]];
  var MP = [['LEGEND', 0], ['PLATE EDGES', 1], ['TOXIC SITES', 0]];
  var BY = {}; FAM.forEach(function(F){ BY[F[0]] = F; });
  var btn = function(f, label, on){ return '<button type="button" class="b' + (on ? ' on' : '') + '" data-f="' + f + '"><span class="t">' + label + '</span></button>'; };
  var paint = function(b){ var F = BY[b.getAttribute('data-f')], w = b.offsetWidth, h = b.offsetHeight, m = b.querySelector('svg.m');
    if (!m){ m = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); m.setAttribute('class', 'm'); b.insertBefore(m, b.firstChild); }
    m.setAttribute('width', w + 28); m.setAttribute('height', h + 20); m.setAttribute('viewBox', '-14 -10 ' + (w + 28) + ' ' + (h + 20)); if (F[3] === 'anim'){ if (!m.querySelector('.ar') || m.getAttribute('data-w') != w){ m.innerHTML = E(w / 2, h / 2, w / 2 + 6, h / 2 + 4, 'class="ar" pathLength="1" fill="none" stroke="#fff" stroke-width="1.6"'); m.setAttribute('data-w', w); } return; }
    m.innerHTML = F[3](w, h, b.classList.contains('on'), !!b.closest('.map')); };
  var main = document.getElementById('main');
  main.innerHTML = FAM.map(function(F, i){ var f = F[0];
    return '<section class="fam' + (F[4] === 1 ? ' fill' : F[4] === 'dim' ? ' dim' : '') + '"><div class="head"><b>' + (i + 1) + ' · ' + F[1] + '</b><span>' + F[2] + '</span></div><div class="bar">'
      + '<div class="row" data-one="1">' + TABS.map(function(t, k){ return btn(f, t, k === 1); }).join('') + '</div>'
      + '<div class="row"><span class="lab">SWITCHES</span>' + SW.map(function(c){ return btn(f, c[0], c[1]); }).join('') + '</div></div>'
      + '<div class="map"><span class="dot" style="left:30%;top:62%"></span><span class="dot" style="left:64%;top:48%"></span><span class="dot" style="left:82%;top:30%"></span><div class="row">'
      + MP.map(function(c){ return btn(f, c[0], c[1]); }).join('') + '</div><div class="low">' + btn(f, 'CLICK THE MAP TO ZOOM WITH SCROLL', 0) + '</div></div></section>'; }).join('');
  var all = function(){ main.querySelectorAll('.b').forEach(paint); };
  main.addEventListener('click', function(e){ var b = e.target.closest('.b'); if (!b) return; var row = b.parentNode;
    if (row.getAttribute('data-one')) row.querySelectorAll('.b').forEach(function(x){ x.classList.toggle('on', x === b); paint(x); }); else { b.classList.toggle('on'); paint(b); } });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(all);
  window.addEventListener('resize', function(){ clearTimeout(window._rz); window._rz = setTimeout(all, 120); });
})();
</script>
</body>
</html>
