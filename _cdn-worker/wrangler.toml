# Cloudflare Worker: a tile the bake never wrote answers 204, not R2's 27 KB HTML 404 (cdn.bluishvoid.com tile folders).
# Deploy from THIS folder only:  cd _cdn-worker && npx wrangler deploy
# (the repo-root wrangler.toml is the CORS proxy, _tiles-worker/ is tiles.bluishvoid.com)
#
# Why (user 2026-10-19: "do the cloudflare fix"): the baked pyramids (seafloor, relief, rivers, coast, foliage, ...) have
# no complete index of which tiles exist, so a map asks for some that were never written. R2's custom domain answers those
# with an HTML 404 page, a red console line each (30-40 a LOCAL visit). Every other response passes through untouched.
# Undo: delete the worker (or its routes) in the dashboard; the bucket answers 404 again.
name = "bluish-cdn-tiles"
main = "index.js"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "cdn.bluishvoid.com/bathy/*", zone_name = "bluishvoid.com" },
  { pattern = "cdn.bluishvoid.com/coast/*", zone_name = "bluishvoid.com" },
  { pattern = "cdn.bluishvoid.com/depth/*", zone_name = "bluishvoid.com" },
  { pattern = "cdn.bluishvoid.com/desert/*", zone_name = "bluishvoid.com" },
  { pattern = "cdn.bluishvoid.com/foliage/*", zone_name = "bluishvoid.com" },
  { pattern = "cdn.bluishvoid.com/relief/*", zone_name = "bluishvoid.com" },
  { pattern = "cdn.bluishvoid.com/rivers/*", zone_name = "bluishvoid.com" },
  { pattern = "cdn.bluishvoid.com/roads/*", zone_name = "bluishvoid.com" },
  { pattern = "cdn.bluishvoid.com/seafloor/*", zone_name = "bluishvoid.com" }
]
