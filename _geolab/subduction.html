<script>
/* SLEEP WHEN UNSEEN (perf 2026-11-22, user: "do 1 2 3 4 5"): measured in the dashboard, this frame kept animating at ~55-60 frames
   a second while another SPACE tab was showing or the widget was scrolled off-screen. Every requestAnimationFrame now waits while
   the frame is not on screen (an IntersectionObserver against the page's viewport, or a hidden browser tab) and is released the
   moment it is seen again -- so every loop in this frame sleeps without each one having to know. */
(function(){
  var R = window.requestAnimationFrame.bind(window), C = window.cancelAnimationFrame.bind(window), held = [], asleep = false, seen = true;
  window.requestAnimationFrame = function(f){ if (asleep){ held.push(f); return -held.length; } return R(f); };
  window.cancelAnimationFrame = function(id){ if (id < 0){ held[-id - 1] = null; return; } return C(id); };
  function set(){ var s = !seen || document.hidden; if (s === asleep) return; asleep = s; if (!s){ var q = held; held = []; q.forEach(function(f){ if (f) R(f); }); } }
  window.__bvAsleep = function(){ return asleep; };
  function watch(){ try { new IntersectionObserver(function(es){ seen = es[es.length - 1].isIntersecting; set(); }, { rootMargin: '120px' }).observe(document.documentElement); } catch(_){} }
  document.addEventListener('visibilitychange', set);
  if (document.documentElement) watch(); else document.addEventListener('DOMContentLoaded', watch);
})();
</script>

<title>BLUISH · SUBDUCTION</title>
<!--
  SUBDUCTION (GEOLOGY, 2026-11-22; user: "can we visualize earthquake data below the earth like this?" -> "geology, start with tonga").
  A block of the Earth under one subduction zone: every M4+ quake the USGS has located since 1973 at its true depth, and the
  sinking plate itself from USGS Slab2 (Hayes et al. 2018). Data: _slabbake/slab_bake.py -> slab/<zone>_v1.{bin,json}.
  The slab is a MODEL (soft lines, faint surface); the quakes are measured (crisp dots) -- edges encode certainty.
  Drawn on the whole globe, true to scale (user 2026-11-22: "put it on a circular globe").
-->
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{ background:#04060c; color:#e6edf7; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }

  #year.on{ opacity:1; }
  #bar{ position:absolute; left:0; right:0; bottom:0; z-index:3; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
        padding:10px 14px 12px; background:linear-gradient(to bottom, rgba(4,6,12,0), rgba(4,6,12,.85) 40%); }
  #legend{ display:flex; gap:6px; flex-wrap:wrap; }

  .chip i{ width:8px; height:8px; border-radius:50%; display:inline-block; }

         background:#05DB32; color:#000; text-align:center; font:700 .64rem/1.45 system-ui,sans-serif; letter-spacing:.1em; box-shadow:0 6px 24px rgba(0,0,0,.45); }
  #pick b{ display:block; font-size:.95rem; font-weight:850; letter-spacing:.05em; margin-bottom:3px; }
  #pick a{ color:#000; font-weight:850; }
  #pick .x{ position:absolute; right:10px; top:8px; border:0; background:transparent; font:800 1.1rem/1 system-ui,sans-serif; color:#000; }

  @media (max-width:640px){ #words .s{ display:none; } #words .t{ font-size:.78rem; } #note{ display:none; } .chip{ padding:6px 8px; } .chip span{ display:none; } }

<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="load">LOADING 50 YEARS OF EARTHQUAKES</div>
  <div id="words"><div class="t"></div><div class="s"></div><div class="n"></div></div>
  <div id="year"></div>
  <div id="pick"><button class="x" type="button" aria-label="Close">&times;</button><div class="c"></div></div>
  <div id="bar">
    <div id="legend"></div>
    <div id="ctl"><span id="note">TRUE TO SCALE · DRAG TO TURN · TAP A QUAKE</span><button id="slabbtn" class="pill on" type="button">SLAB</button><button id="play" class="pill" type="button">&#9654;&#xFE0E; 1973 TO NOW</button></div>
  </div>

<script>
(function(){
/* ON THE GLOBE (user 2026-11-22: "could you try putting it on a circular globe? ... it would help with understanding where below it is"):
   the whole Earth to true scale (radius 6,371 km, depth NOT stretched), the quakes at their true depth inside it. The camera opens over
   the zone like a map, then turns the globe until the zone sits on its edge, looking along the trench, so the slab shows in profile
   diving toward the center. Faint rings: 660 km (where quakes stop) and the core. */
var ZONE = (location.search.match(/zone=([a-z]+)/) || [0, 'tonga'])[1];
var RE = 6371, D2R = Math.PI / 180;
var BANDS = [ { k:'s', c:'#fb923c', name:'0–70 KM' }, { k:'m', c:'#facc15', name:'70–300 KM' }, { k:'d', c:'#38bdf8', name:'300+ KM' } ];
var ZD = { tonga: { places: [ ['FIJI', 178.1, -17.8], ['TONGA', 184.8, -21.2], ['SAMOA', 188.2, -13.9], ['KERMADEC ISLANDS', 182.1, -29.3], ['NEW ZEALAND', 175.4, -38.6],
                              ['TONGA TRENCH', 186.9, -23.0, 1], ['KERMADEC TRENCH', 183.6, -32.5, 1], ['AUSTRALIA', 134, -25], ['HAWAII', -155.5, 19.6] ],
                    s: 'THE PACIFIC PLATE SINKING UNDER THE AUSTRALIAN PLATE. EVERY DOT IS AN EARTHQUAKE OF MAGNITUDE 4 OR MORE: SHALLOW ONES WHERE THE PLATES GRIND AT THE TRENCH, DEEP ONES INSIDE THE OLD SEA FLOOR AS IT SINKS INTO THE MANTLE, STILL BREAKING 700 KM DOWN.',
                    open: { lat: -23, lon: 182, roll: 0, zoom: 1.05 }, view: { from: [-23, 183], brg: 30, dist: 90, zoom: 3 } } };
var Z0 = ZD[ZONE] || ZD.tonga;
function dest(lat, lon, brg, d){ var la = lat * D2R, lo = lon * D2R, b = brg * D2R, dd = d * D2R, la2 = Math.asin(Math.sin(la) * Math.cos(dd) + Math.cos(la) * Math.sin(dd) * Math.cos(b));
  return [la2 / D2R, (lo + Math.atan2(Math.sin(b) * Math.sin(dd) * Math.cos(la), Math.cos(dd) - Math.sin(la) * Math.sin(la2))) / D2R]; }
function targetView(){ var v = Z0.view, c = dest(v.from[0], v.from[1], v.brg, v.dist), t = { lat: c[0], lon: c[1], roll: 0, zoom: v.zoom };
  /* roll so the zone points straight down the screen: the globe's edge runs across, the slab dives up toward the center */
  var c0_ = Math.cos(t.lon * D2R), s0_ = Math.sin(t.lon * D2R), cf_ = Math.cos(t.lat * D2R), sf_ = Math.sin(t.lat * D2R), A = FOC[0] * c0_ + FOC[1] * s0_, x = FOC[1] * c0_ - FOC[0] * s0_, y = cf_ * FOC[2] - sf_ * A;
  t.roll = -Math.PI / 2 - Math.atan2(y, x); return t; }

var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), W = 0, H = 0, DPR = 1;
var Mt, N = 0, EX_, EY_, EZ_, DEP, MAG, T, BAND, SX, SY, SV, slabG, SL = null, coast = [], land = [], place = [], grat = [];
var CAM = { lat: Z0.open.lat, lon: Z0.open.lon, roll: Z0.open.roll, zoom: Z0.open.zoom }, ACT = performance.now(), dirty = true, show = { s: 1, m: 1, d: 1 }, slabOn = true;
var PLAY = null, cutT = Infinity, pickI = -1, intro = null, FOC = null;

function fmt(n){ return n.toLocaleString('en-US'); }
function dateOf(t){ var d = new Date(Date.UTC(1973, 0, 1) + t * 1000); return d.getUTCDate() + ' ' + ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function yearOf(t){ return new Date(Date.UTC(1973, 0, 1) + t * 1000).getUTCFullYear(); }
function E(lon, lat, dep){ var r = RE - dep, f = lat * D2R, l = lon * D2R; return [r * Math.cos(f) * Math.cos(l), r * Math.cos(f) * Math.sin(l), r * Math.sin(f), dep]; }

Promise.all([fetch('slab/' + ZONE + '_v1.json').then(function(r){ return r.json(); }), fetch('slab/' + ZONE + '_v1.bin').then(function(r){ return r.arrayBuffer(); }), fetch('slab/land110.json').then(function(r){ return r.json(); })]).then(function(a){
  Mt = a[0]; var buf = a[1], o = Mt.off, b = Mt.box; N = Mt.n;
  var lon = new Int16Array(buf, o.lon, N), lat = new Int16Array(buf, o.lat, N), dep = new Uint16Array(buf, o.dep, N), mag = new Uint8Array(buf, o.mag, N);
  EX_ = new Float32Array(N); EY_ = new Float32Array(N); EZ_ = new Float32Array(N); DEP = new Float32Array(N); MAG = new Float32Array(N); T = new Uint32Array(buf, o.t, N); BAND = new Uint8Array(N);
  SX = new Float32Array(N); SY = new Float32Array(N); SV = new Uint8Array(N);
  for (var i = 0; i < N; i++){ DEP[i] = dep[i] / 10; MAG[i] = mag[i] / 10; var p = E(b[0] + lon[i] / 1000, b[1] + lat[i] / 1000, DEP[i]); EX_[i] = p[0]; EY_[i] = p[1]; EZ_[i] = p[2]; BAND[i] = DEP[i] < 70 ? 0 : DEP[i] < 300 ? 1 : 2; }
  var S = Mt.slab; slabG = { g: new Int16Array(buf, o.slab, S.nx * S.ny), nx: S.nx, ny: S.ny, st: S.step };
  var c = new Int16Array(buf, o.coast), q = 0; Mt.coast.forEach(function(n){ var r = []; for (var k = 0; k < n; k++, q++) r.push(E(b[0] + c[2*q] / 1000, b[1] + c[2*q+1] / 1000, 0)); coast.push(r); });
  land = a[2].map(function(r){ return r.map(function(p){ return E(p[0], p[1], 0); }); });
  for (var la = -60; la <= 60; la += 30){ var g = []; for (var lo = -180; lo <= 180; lo += 3) g.push(E(lo, la, 0)); grat.push(g); }
  for (var lo2 = -180; lo2 < 180; lo2 += 30){ var g2 = []; for (var la2 = -84; la2 <= 84; la2 += 3) g2.push(E(lo2, la2, 0)); grat.push(g2); }
  place = Z0.places.map(function(p){ var e = E(p[1], p[2], 0); return { n: p[0], e: e, tr: p[3] }; });
  FOC = E((b[0] + b[2]) / 2 + 1.5, (b[1] + b[3]) / 2 + 1, 330);
  buildSlab(); words(); legend(); document.getElementById('load').style.display = 'none';
  intro = { t0: performance.now() + 700, from: { lat: CAM.lat, lon: CAM.lon, roll: CAM.roll, zoom: CAM.zoom }, to: targetView(), dur: 5200 }; kick();
}).catch(function(e){ document.getElementById('load').textContent = 'COULD NOT LOAD THE EARTHQUAKES'; });

function words(){ var w = document.getElementById('words'), dp = Mt.deepest, bg = Mt.biggest;
  w.querySelector('.t').textContent = Mt.name; w.querySelector('.s').textContent = Z0.s;
  w.querySelector('.n').textContent = fmt(N) + ' EARTHQUAKES SINCE 1973 · DEEPEST ' + Math.round(dp.dep) + ' KM · BIGGEST M' + bg.mag.toFixed(1) + ', ' + Math.round(bg.dep) + ' KM DOWN, ' + yearOf(bg.t); }
function legend(){ var L = document.getElementById('legend'); L.innerHTML = '';
  BANDS.forEach(function(B, i){ var bt = document.createElement('button'); bt.type = 'button'; bt.className = 'chip' + (show[B.k] ? '' : ' off');
    bt.innerHTML = '<i style="background:' + B.c + '"></i>' + B.name + ' <span>' + fmt(Mt.bands[i]) + '</span>';
    bt.onclick = function(){ show[B.k] = !show[B.k]; legend(); dirty = true; kick(); }; L.appendChild(bt); }); }
document.getElementById('slabbtn').onclick = function(){ slabOn = !slabOn; this.classList.toggle('on', slabOn); dirty = true; kick(); };
function playOff(){ PLAY = null; cutT = Infinity; var pb = document.getElementById('play'); pb.classList.remove('on'); pb.innerHTML = '&#9654;&#xFE0E; 1973 TO NOW'; }
document.getElementById('play').onclick = function(){
  if (PLAY){ playOff(); document.getElementById('year').classList.remove('on'); dirty = true; kick(); return; }
  PLAY = { t0: performance.now(), dur: 22000 }; this.classList.add('on'); this.innerHTML = '&#10073;&#10073;&#xFE0E; STOP'; document.getElementById('year').classList.add('on'); kick(); };

/* ---- the slab (a model: soft lines): down-dip lines every degree of latitude, depth contours every 100 km ---- */
function slabE(i, j){ var d = slabG.g[j * slabG.nx + i]; if (d < 0) return null; var b = Mt.box; return E(b[0] + i * slabG.st, b[1] + j * slabG.st, d); }
function buildSlab(){
  var nx = slabG.nx, ny = slabG.ny, dip = [], con = [], quads = [];
  for (var j = 0; j < ny; j += 10){ var run = []; for (var i = 0; i < nx; i++){ var p = slabE(i, j); if (p) run.push(p); else if (run.length){ if (run.length > 2) dip.push(run); run = []; } } if (run.length > 2) dip.push(run); }
  for (var L = 100; L <= 600; L += 100){ var run2 = [];
    for (var j2 = 0; j2 < ny; j2++){ var hit = null;
      for (var i2 = nx - 1; i2 > 0; i2--){ var a = slabG.g[j2 * nx + i2], c = slabG.g[j2 * nx + i2 - 1]; if (a >= 0 && c >= 0 && a < L && c >= L){ var f = (L - a) / (c - a), b = Mt.box; hit = E(b[0] + (i2 - f) * slabG.st, b[1] + j2 * slabG.st, L); break; } }
      if (hit) run2.push(hit); else if (run2.length){ if (run2.length > 2) con.push(run2); run2 = []; } }
    if (run2.length > 2) con.push(run2); }
  for (var j3 = 0; j3 < ny - 3; j3 += 3) for (var i3 = 0; i3 < nx - 3; i3 += 3){ var A = slabE(i3, j3), B = slabE(i3 + 3, j3), C = slabE(i3 + 3, j3 + 3), D = slabE(i3, j3 + 3); if (A && B && C && D) quads.push([A, B, C, D]); }
  SL = { dip: dip, con: con, quads: quads };
}

/* ---- camera: orthographic globe; zoom slides the frame from the whole Earth onto the zone ---- */
var c0, s0, cf, sf, cr, sr, sc, ox, oy, fx = 0, fy = 0, RPX;
function rot(X, Y, Zz, out){ var A = X * c0 + Y * s0, x = Y * c0 - X * s0, y = cf * Zz - sf * A, z = sf * Zz + cf * A; out[0] = x * cr - y * sr; out[1] = x * sr + y * cr; out[2] = z; return out; }
var _r = [0, 0, 0];
function cam(){ c0 = Math.cos(CAM.lon * D2R); s0 = Math.sin(CAM.lon * D2R); cf = Math.cos(CAM.lat * D2R); sf = Math.sin(CAM.lat * D2R); cr = Math.cos(CAM.roll); sr = Math.sin(CAM.roll);
  var phone = W < 640 * DPR, top = (phone ? 70 : 100) * DPR, bot = 64 * DPR; RPX = Math.min(W, H - top - bot) * 0.46; sc = CAM.zoom * RPX / RE; ox = W / 2; oy = top + (H - top - bot) / 2;
  rot(FOC[0], FOC[1], FOC[2], _r); var k = Math.min(1, (CAM.zoom - 1) / 1.2); fx = _r[0] * k; fy = _r[1] * k; oy += k * (H - top - bot) * 0.3; }
function P(e, out){ rot(e[0], e[1], e[2], out); out[0] = ox + (out[0] - fx) * sc; out[1] = oy - (out[1] - fy) * sc; return out; }
var _p = [0, 0, 0];
function path(pts, front){ ctx.beginPath(); var on = false;
  for (var i = 0; i < pts.length; i++){ P(pts[i], _p); if (front && _p[2] < 0){ on = false; continue; } if (on) ctx.lineTo(_p[0], _p[1]); else { ctx.moveTo(_p[0], _p[1]); on = true; } } }
function ring(r, dash, col, w){ var cx = ox - fx * sc, cy = oy + fy * sc; ctx.beginPath(); ctx.arc(cx, cy, r * sc, 0, 6.2832); ctx.setLineDash(dash || []); ctx.strokeStyle = col; ctx.lineWidth = w * DPR; ctx.stroke(); ctx.setLineDash([]); }

function draw(now){
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); if (!Mt) return; cam();
  var cx = ox - fx * sc, cy = oy + fy * sc, R = RE * sc;
  /* the Earth: a dark disc, the core inside, a lit limb */
  var gr = ctx.createRadialGradient(cx - R * .25, cy - R * .3, R * .1, cx, cy, R); gr.addColorStop(0, '#13233a'); gr.addColorStop(1, '#0a1322');
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.fillStyle = gr; ctx.fill();
  rot(FOC[0], FOC[1], FOC[2], _r); var edge = Math.max(0, 1 - Math.abs(_r[2]) / (RE * 0.5)), ang = Math.atan2(-_r[1], _r[0]);
  if (edge > 0.02){ ctx.globalAlpha = edge;
    /* the cutaway: a wedge of the inside under the zone, as if the near side were sliced away there */
    var wa = 0.55; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, ang - wa, ang + wa); ctx.closePath(); var wg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    wg.addColorStop(0, 'rgba(251,146,60,.16)'); wg.addColorStop(1220 / RE, 'rgba(251,146,60,.13)'); wg.addColorStop(3480 / RE, 'rgba(234,88,12,.08)'); wg.addColorStop(3481 / RE, 'rgba(56,189,248,.035)'); wg.addColorStop(1, 'rgba(56,189,248,.07)'); ctx.fillStyle = wg; ctx.fill();
    [[3480, 'rgba(251,146,60,.4)', [2, 4]], [1220, 'rgba(251,146,60,.35)', [2, 4]], [RE - 660, 'rgba(56,189,248,.55)', [4, 4]]].forEach(function(q){ ctx.beginPath(); ctx.arc(cx, cy, q[0] * sc, ang - wa, ang + wa); ctx.setLineDash(q[2].map(function(v){ return v * DPR; })); ctx.strokeStyle = q[1]; ctx.lineWidth = 1 * DPR; ctx.stroke(); });
    ctx.setLineDash([]); ctx.strokeStyle = 'rgba(125,211,252,.25)'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang - wa) * R, cy + Math.sin(ang - wa) * R); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang + wa) * R, cy + Math.sin(ang + wa) * R); ctx.stroke();
    ctx.globalAlpha = 1; }
  /* graticule + land, front side only */
  ctx.strokeStyle = 'rgba(148,163,184,.10)'; ctx.lineWidth = 1 * DPR; grat.forEach(function(g){ path(g, true); ctx.stroke(); });
  ctx.strokeStyle = 'rgba(125,211,252,.45)'; land.forEach(function(r){ path(r, true); ctx.stroke(); });
  if (CAM.zoom > 1.8){ ctx.strokeStyle = 'rgba(125,211,252,.8)'; coast.forEach(function(r){ path(r, true); ctx.stroke(); }); }
  ring(RE, null, 'rgba(125,211,252,.55)', 1.2);
  /* the slab */
  if (slabOn && SL){
    ctx.beginPath(); SL.quads.forEach(function(q){ for (var i = 0; i < 4; i++){ P(q[i], _p); if (i) ctx.lineTo(_p[0], _p[1]); else ctx.moveTo(_p[0], _p[1]); } ctx.closePath(); }); ctx.fillStyle = 'rgba(94,234,212,.08)'; ctx.fill();
    ctx.strokeStyle = 'rgba(153,246,228,.32)'; ctx.lineWidth = 1 * DPR; SL.dip.forEach(function(r){ path(r); ctx.stroke(); });
    ctx.strokeStyle = 'rgba(153,246,228,.16)'; SL.con.forEach(function(r){ path(r); ctx.stroke(); });

  /* the quakes (measured: crisp). Hidden once well round the far side. */
  var cut = cutT, flash = PLAY ? 86400 * 365 * 0.8 : 0, zmin = -0.2 * RE, rs = Math.max(0.7, Math.min(1.6, Math.sqrt(CAM.zoom) * 0.6));
  for (var bi = 2; bi >= 0; bi--){ if (!show[BANDS[bi].k]) continue; ctx.fillStyle = BANDS[bi].c;
    for (var i = 0; i < N; i++){ if (BAND[i] !== bi) continue; SV[i] = 0; if (T[i] > cut) continue;
      rot(EX_[i], EY_[i], EZ_[i], _p); if (_p[2] < zmin) continue; var x = ox + (_p[0] - fx) * sc, y = oy - (_p[1] - fy) * sc; SX[i] = x; SY[i] = y; SV[i] = 1;
      var r = (0.45 + (MAG[i] - 4) * 0.5) * DPR * rs; if (flash && cut - T[i] < flash) r *= 1 + 1.6 * (1 - (cut - T[i]) / flash);
      ctx.globalAlpha = MAG[i] >= 6 ? 0.95 : 0.5; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); } }
  ctx.globalAlpha = 1;
  /* ring names, set by the zone's side of the globe */
  var lab = function(rk, txt, col, da){ var a = ang + da, x = cx + Math.cos(a) * rk * sc, y = cy + Math.sin(a) * rk * sc; if (x < 20 || x > W - 20 || y < 20 || y > H - 20) return; ctx.strokeText(txt, x, y); ctx.fillStyle = col; ctx.fillText(txt, x, y); };
  ctx.font = '700 ' + (9 * DPR) + 'px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (edge > 0.3){ halo(); ctx.globalAlpha = edge; var da = 260 / (RE * sc / DPR); lab(RE - 660 - 70, '660 KM · NO EARTHQUAKE GOES DEEPER', 'rgba(125,211,252,.9)', da); if (W > 640 * DPR) lab(3480 + 140, 'THE CORE STARTS 2,900 KM DOWN', 'rgba(251,146,60,.85)', -da * .6); ctx.globalAlpha = 1; }
  /* places on the surface (front side) */
  var boxes = [];
  place.forEach(function(q){ P(q.e, _p); if (_p[2] < RE * 0.2) return;   /* names near the edge would sit on the cross-section */ ctx.font = (q.tr ? '700 ' : '800 ') + (9 * DPR) + 'px system-ui,sans-serif'; var w = ctx.measureText(q.n).width;
    var bx = [_p[0] - w / 2 - 3, _p[1] - 14 * DPR, w + 6, 11 * DPR]; if (bx[0] < 0 || bx[0] + bx[2] > W || boxes.some(function(o){ return bx[0] < o[0] + o[2] && o[0] < bx[0] + bx[2] && bx[1] < o[1] + o[3] && o[1] < bx[1] + bx[3]; })) return; boxes.push(bx);
    ctx.strokeText(q.n, _p[0], _p[1] - 8 * DPR); ctx.fillStyle = q.tr ? 'rgba(251,146,60,.95)' : 'rgba(255,255,255,.9)'; ctx.fillText(q.n, _p[0], _p[1] - 8 * DPR); });
  if (pickI >= 0 && SV[pickI]){ ctx.strokeStyle = '#05DB32'; ctx.lineWidth = 2 * DPR; ctx.beginPath(); ctx.arc(SX[pickI], SY[pickI], 9 * DPR, 0, 6.2832); ctx.stroke(); }
}
function halo(){ ctx.lineWidth = 3 * DPR; ctx.strokeStyle = 'rgba(4,6,12,.85)'; ctx.lineJoin = 'round'; }

/* ---- the loop: runs while something moves, sleeps after two idle minutes ---- */
var running = false, last = 0, drag = null, ptrs = {}, pinch = null;
function kick(){ if (!running){ running = true; requestAnimationFrame(tick); } }
function ease(k){ return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
function tick(now){
  var moving = false;
  if (intro){ var k = Math.max(0, Math.min(1, (now - intro.t0) / intro.dur)), e = ease(k), A = intro.from, B = intro.to, dl = ((B.lon - A.lon + 540) % 360) - 180;
    CAM.lat = A.lat + (B.lat - A.lat) * e; CAM.lon = A.lon + dl * e; var dr = ((B.roll - A.roll + 3 * Math.PI) % (2 * Math.PI)) - Math.PI; CAM.roll = A.roll + dr * e; CAM.zoom = A.zoom * Math.pow(B.zoom / A.zoom, ease(Math.max(0, (k - .25) / .75)));
    if (k >= 1){ intro = null; Z0.sway = now; } moving = true; }
  if (PLAY){ var f = Math.min(1, (now - PLAY.t0) / PLAY.dur); cutT = f * T[N - 1]; document.getElementById('year').textContent = yearOf(cutT);
    if (f >= 1){ playOff(); setTimeout(function(){ document.getElementById('year').classList.remove('on'); }, 1500); } moving = true; }
  /* a slow sway round the view, so the depth reads in 3D; sleeps two minutes after the last touch */
  if (!drag && !intro && Z0.sway && now - ACT < 120000){ CAM.lon += Math.cos((now - Z0.sway) / 9000) * 0.0011 * Math.min(50, now - (last || now)); moving = true; }
  last = now;
  if (moving || dirty){ dirty = false; draw(now); }
  if (moving) requestAnimationFrame(tick); else { running = false; last = 0; }
}

/* ---- input: drag turns the globe, pinch / ctrl-scroll zooms, a tap picks a quake ---- */
cv.addEventListener('pointerdown', function(e){ ACT = performance.now(); intro = null; Z0.sway = 0; ptrs[e.pointerId] = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId);
  var ks = Object.keys(ptrs); if (ks.length === 2){ var a = ptrs[ks[0]], b = ptrs[ks[1]]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: CAM.zoom }; drag = null; return; }
  drag = { x: e.clientX, y: e.clientY, lat: CAM.lat, lon: CAM.lon, moved: false }; kick(); });
cv.addEventListener('pointermove', function(e){ ACT = performance.now(); if (!ptrs[e.pointerId]) return; ptrs[e.pointerId] = [e.clientX, e.clientY];
  if (pinch){ var ks = Object.keys(ptrs); if (ks.length === 2){ var a = ptrs[ks[0]], b = ptrs[ks[1]]; CAM.zoom = Math.max(1, Math.min(8, pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d)); dirty = true; kick(); } return; }
  if (!drag) return; var dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  var k = 0.28 / CAM.zoom; CAM.lon = drag.lon - (dx * cr + dy * sr) * k; CAM.lat = Math.max(-89, Math.min(89, drag.lat + (dy * cr - dx * sr) * k)); dirty = true; kick(); });
function up(e){ delete ptrs[e.pointerId]; if (pinch){ if (Object.keys(ptrs).length < 2) pinch = null; drag = null; return; } if (drag && !drag.moved) pickAt(e); drag = null; kick(); }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', function(e){ delete ptrs[e.pointerId]; drag = null; pinch = null; });
cv.addEventListener('wheel', function(e){ if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); ACT = performance.now(); CAM.zoom = Math.max(1, Math.min(8, CAM.zoom * Math.exp(-e.deltaY * 0.004))); dirty = true; kick(); }, { passive: false });
cv.addEventListener('dblclick', function(){ intro = { t0: performance.now(), from: { lat: CAM.lat, lon: CAM.lon, roll: CAM.roll, zoom: CAM.zoom }, to: targetView(), dur: 1600 }; kick(); });

function pickAt(e){
  var r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) * DPR, my = (e.clientY - r.top) * DPR, bi = -1, bd = (12 * DPR) * (12 * DPR);
  for (var i = 0; i < N; i++){ if (!SV[i] || !show[BANDS[BAND[i]].k]) continue; var dx = SX[i] - mx, dy = SY[i] - my, d = dx * dx + dy * dy - MAG[i] * 4 * DPR; if (d < bd){ bd = d; bi = i; } }
  pickI = bi; dirty = true; kick(); var card = document.getElementById('pick');
  if (bi < 0){ card.style.display = 'none'; return; }
  var lat = Math.asin(EZ_[bi] / (RE - DEP[bi])) / D2R, lon = Math.atan2(EY_[bi], EX_[bi]) / D2R, sd = slabAt(lon, lat), dep = DEP[bi], where;
  if (dep >= 300) where = 'DEEP INSIDE THE SINKING PACIFIC PLATE, WHERE THE PRESSURE SHOULD MAKE ROCK FLOW, NOT BREAK';
  else if (sd != null && Math.abs(dep - sd) <= 25) where = dep < 60 ? 'ON THE FAULT BETWEEN THE TWO PLATES, WHERE THE BIG TRENCH QUAKES HAPPEN' : 'IN THE SINKING PLATE, AS IT BENDS AND HEATS';
  else if (sd != null && dep < sd - 25) where = 'IN THE PLATE ABOVE, OVER THE SINKING ONE';
  else if (sd != null) where = 'BELOW THE TOP OF THE SINKING PLATE';
  else where = dep < 70 ? 'OUTSIDE THE SLAB: THE PLATE BENDING BEFORE IT DIVES, OR THE CRUST ABOVE' : 'BEYOND THE MODELED SLAB';
  card.querySelector('.c').innerHTML = '<b>M' + MAG[bi].toFixed(1) + ' · ' + Math.round(dep) + ' KM DOWN</b>' + dateOf(T[bi]) + ' · ' + Math.abs(lat).toFixed(2) + '°' + (lat < 0 ? 'S' : 'N') + ' ' + Math.abs(lon).toFixed(2) + '°' + (lon < 0 ? 'W' : 'E') +
    '<br>' + where + (sd != null ? ' · THE SLAB TOP IS ' + sd + ' KM DOWN HERE' : '') + '<br><span class="u">FINDING THE USGS EVENT PAGE</span>';
  card.style.display = 'block';
  var t = Date.UTC(1973, 0, 1) + T[bi] * 1000, iso = function(ms){ return new Date(ms).toISOString().slice(0, 19); };
  fetch('https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=' + iso(t - 3000) + '&endtime=' + iso(t + 3000) + '&latitude=' + lat.toFixed(3) + '&longitude=' + lon.toFixed(3) + '&maxradiuskm=60&minmagnitude=' + (MAG[bi] - .15).toFixed(2))
    .then(function(r){ return r.json(); }).then(function(j){ var u = card.querySelector('.u'); if (!u || pickI !== bi) return; var f = j.features && j.features[0];
      u.innerHTML = f ? '<a href="' + f.properties.url + '" target="_blank" rel="noopener">USGS EVENT PAGE &#8599;&#xFE0E;</a>' + (f.properties.place ? ' · ' + f.properties.place.toUpperCase() : '') : ''; }).catch(function(){ var u = card.querySelector('.u'); if (u) u.textContent = ''; });
}
function slabAt(lon, lat){ var b = Mt.box; if (lon < 0) lon += 360; var i = Math.round((lon - b[0]) / slabG.st), j = Math.round((lat - b[1]) / slabG.st); if (i < 0 || j < 0 || i >= slabG.nx || j >= slabG.ny) return null; var d = slabG.g[j * slabG.nx + i]; return d < 0 ? null : d; }
document.querySelector('#pick .x').onclick = function(){ document.getElementById('pick').style.display = 'none'; pickI = -1; dirty = true; kick(); };

function size(){ DPR = Math.min(2, window.devicePixelRatio || 1); W = Math.round(cv.clientWidth * DPR); H = Math.round(cv.clientHeight * DPR); cv.width = W; cv.height = H; dirty = true; kick(); }
window.addEventListener('resize', size); size();
window._slab = { CAM: CAM, kick: function(){ dirty = true; kick(); }, view: function(brg, dist, zoom){ intro = null; Z0.sway = 0; Z0.view.brg = brg; Z0.view.dist = dist; Z0.view.zoom = zoom; var t = targetView(); CAM.lat = t.lat; CAM.lon = t.lon; CAM.roll = t.roll; CAM.zoom = t.zoom; dirty = true; kick(); }, stopIntro: function(){ intro = null; Z0.sway = 0; } };
})();
</script>
