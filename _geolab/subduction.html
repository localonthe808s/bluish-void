/* SLEEP WHEN UNSEEN (perf 2026-11-22, user: "do 1 2 3 4 5"): measured in the dashboard, this frame kept animating at ~55-60 frames
   a second while another SPACE tab was showing or the widget was scrolled off-screen. Every requestAnimationFrame now waits while
   the frame is not on screen (an IntersectionObserver against the page's viewport, or a hidden browser tab) and is released the
   moment it is seen again -- so every loop in this frame sleeps without each one having to know. */
(function(){
  var R = window.requestAnimationFrame.bind(window), C = window.cancelAnimationFrame.bind(window), held = [], asleep = false, seen = true;
  window.requestAnimationFrame = function(f){ if (asleep){ held.push(f); return -held.length; } return R(f); };
  window.cancelAnimationFrame = function(id){ if (id < 0){ held[-id - 1] = null; return; } return C(id); };
  function set(){ var s = !seen || document.hidden; if (s === asleep) return; asleep = s; if (!s){ var q = held; held = []; q.forEach(function(f){ if (f) R(f); }); } }
  window.__bvAsleep = function(){ return asleep; };
  function watch(){ try { new IntersectionObserver(function(es){ seen = es[es.length - 1].isIntersecting; set(); }, { rootMargin: '120px' }).observe(document.documentElement); } catch(_){} }
  document.addEventListener('visibilitychange', set);
  if (document.documentElement) watch(); else document.addEventListener('DOMContentLoaded', watch);

  for (var x = x0; x <= x1; x += 5){ var pv = v2ll(slicePt(x, 0)), lon = pv[1] < b[0] ? pv[1] + 360 : pv[1], i = Math.round((lon - b[0]) / sl.st), j = Math.round((pv[0] - b[1]) / sl.st), d = (i >= 0 && j >= 0 && i < sl.nx && j < sl.ny) ? sl.g[j * sl.nx + i] : -1;
    if (d < 0){ on = false; continue; } var X = ox + (x - x0) * sc, Y = oy + d * sc; if (on) c.lineTo(X, Y); else { c.moveTo(X, Y); on = true; } } c.stroke();
  var Sn = G.S, n = 0;
  for (var k = 0; k < ZONE.n; k++){ if (ZONE.T[k] > cutT) continue; var p = [ZONE.P[3*k], ZONE.P[3*k+1], ZONE.P[3*k+2]], off = dot(p, Sn); if (Math.abs(off - sv * RE) > 40) continue;
    var bi = ZONE.I[3*k]; if (!show[BANDS[bi].k]) continue; var xx = Math.atan2(dot(p, Dv), dot(p, Qv)) * RE; if (xx < x0 || xx > x1) continue; n++;
    var rr = Math.max(1, (0.6 + (ZONE.MAG[k] - 4) * 0.8) * DPR); c.fillStyle = 'rgba(' + BANDS[bi].c.join(',') + ',.75)'; c.fillRect(ox + (xx - x0) * sc - rr, oy + ZONE.DEP[k] * sc - rr, 2 * rr, 2 * rr); }
  if (VOLC) VOLC.forEach(function(v){ var p = v.p; if (Math.abs(dot(p, Sn) - sv * RE) > 50) return; var xx = Math.atan2(dot(p, Dv), dot(p, Qv)) * RE; if (xx < x0 || xx > x1) return; var X = ox + (xx - x0) * sc, s = 4 * DPR;
    c.beginPath(); c.moveTo(X, oy - 1); c.lineTo(X + s, oy + s * 1.4); c.lineTo(X - s, oy + s * 1.4); c.closePath(); c.fillStyle = '#ff7340'; c.fill(); if (v.slab != null){ c.setLineDash([2 * DPR, 2 * DPR]); c.strokeStyle = 'rgba(255,115,64,.6)'; c.beginPath(); c.moveTo(X, oy + s); c.lineTo(X, oy + v.slab * sc); c.stroke(); c.setLineDash([]); } });
  c.textAlign = 'center'; c.fillStyle = 'rgba(230,237,247,.55)'; c.fillText(fmt(x1 - x0) + ' KM ACROSS · OCEAN SIDE LEFT', ox + (x1 - x0) * sc / 2, h - 6 * DPR);
  $('#slicebox .b').textContent = n + ' QUAKES WITHIN 40 KM';
  dirty = true; kick(); }
document.getElementById('slpos').addEventListener('input', function(){ ACT = performance.now(); drawSlice(); });

/* ================= tour ================= */
var STEPS = [
  { h: 'THE SINKING PLATES', c: 'THE SEA FLOOR IS MADE AT MID-OCEAN RIDGES AND DESTROYED HERE: AT SUBDUCTION ZONES ONE PLATE DIVES UNDER ANOTHER AND SINKS INTO THE MANTLE. THE DOTS ARE THE EARTHQUAKES THEY MAKE.', go: function(){ if (cur) worldView(); } },
  { h: 'THE TONGA TRENCH', c: 'THE PACIFIC PLATE BENDS DOWN INTO A TRENCH 10.8 KM DEEP. THE SHALLOW ORANGE QUAKES ARE THE TWO PLATES GRINDING PAST EACH OTHER: THE BIG, TSUNAMI-MAKING EARTHQUAKES HAPPEN THERE.', go: function(){ show = { s: 1, m: 1, d: 1 }; legend(); openZone('ker', function(){ setFocus('ker'); flyTo(faceView('ker'), 2600); }); } },
  { h: 'THE DIVE', c: 'CUT THE EARTH OPEN AND THE QUAKES TRACE THE SINKING PLATE ITSELF, A SHEET OF OLD, COLD SEA FLOOR SLIDING DOWN INTO THE HOT MANTLE AT AN ANGLE.', go: function(){ openZone('ker', function(){ setFocus('ker'); flyTo(profileView(), 3200, function(){ SWAY = performance.now(); }); }); } },
  { h: 'THE DEEP-QUAKE PUZZLE', c: 'BELOW ABOUT 300 KM THE ROCK SHOULD BE TOO HOT AND SQUEEZED TO SNAP, YET TONGA HAS MORE DEEP EARTHQUAKES THAN ANYWHERE. THE SINKING PLATE STAYS COLD INSIDE; ITS MINERALS MAY COLLAPSE INTO DENSER FORMS AND SLIP.', go: function(){ show = { s: 0, m: 0, d: 1 }; legend(); dirty = true; kick(); } },
  { h: 'THE FLOOR AT 660 KM', c: 'THE QUAKES STOP AT ABOUT 700 KM, WHERE THE MANTLE CHANGES TO DENSER MINERALS. THE PLATE ITSELF KEEPS SINKING, SOME OF IT ALL THE WAY TO THE CORE, BUT IT NO LONGER BREAKS.', go: function(){ show = { s: 1, m: 1, d: 1 }; legend(); dirty = true; kick(); } },
  { h: 'WHY THE VOLCANOES ARE THERE', c: 'WHEN THE PLATE REACHES ABOUT 100 KM DOWN IT SWEATS OUT WATER, WHICH MELTS THE MANTLE ABOVE IT. THE MELT RISES AND BUILDS THE VOLCANO ARC: EACH LINE RUNS FROM A VOLCANO DOWN TO THE PLATE BELOW IT.', go: function(){ OPT.volc = true; pills(); dirty = true; kick(); } }
];
function startTour(){ TOUR = { i: -1 }; $('#zones').classList.remove('on'); nextStep(); pills(); }
function nextStep(){ if (!TOUR) return; TOUR.i++; if (TOUR.i >= STEPS.length){ endTour(); return; } var s = STEPS[TOUR.i], t = $('#tour'); t.style.display = 'block'; t.querySelector('b').textContent = (TOUR.i + 1) + ' / ' + STEPS.length + ' · ' + s.h; t.querySelector('.c').textContent = s.c;
  t.querySelector('[data-t="next"]').textContent = TOUR.i === STEPS.length - 1 ? 'DONE' : 'NEXT'; s.go(); }
function endTour(){ if (!TOUR) return; TOUR = null; $('#tour').style.display = 'none'; pills(); }
document.querySelector('#tour').addEventListener('click', function(e){ var b = e.target.closest('[data-t]'); if (!b) return; ACT = performance.now(); if (b.getAttribute('data-t') === 'next') nextStep(); else endTour(); });

/* ================= input ================= */
var drag = null, ptrs = {}, pinch = null, cvs = document.getElementById('gl');
cvs.addEventListener('pointerdown', function(e){ ACT = performance.now(); fly = null; SWAY = 0; ptrs[e.pointerId] = [e.clientX, e.clientY]; cvs.setPointerCapture(e.pointerId);
  var ks = Object.keys(ptrs); if (ks.length === 2){ var a = ptrs[ks[0]], b = ptrs[ks[1]]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: CAM.zoom }; drag = null; return; }
  drag = { x: e.clientX, y: e.clientY, lat: CAM.lat, lon: CAM.lon, moved: false }; kick(); });
cvs.addEventListener('pointermove', function(e){ ACT = performance.now(); if (!ptrs[e.pointerId]) return; ptrs[e.pointerId] = [e.clientX, e.clientY];
  if (pinch){ var ks = Object.keys(ptrs); if (ks.length === 2){ var a = ptrs[ks[0]], b = ptrs[ks[1]]; CAM.zoom = Math.max(0.8, Math.min(9, pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d)); dirty = true; kick(); } return; }
  if (!drag) return; var dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  var k = 0.3 / CAM.zoom, cr = Math.cos(CAM.roll), sr = Math.sin(CAM.roll); CAM.lon = drag.lon - (dx * cr - dy * sr) * k; CAM.lat = Math.max(-85, Math.min(85, drag.lat + (dy * cr + dx * sr) * k)); dirty = true; kick(); });
function up(e){ delete ptrs[e.pointerId]; if (pinch){ if (Object.keys(ptrs).length < 2) pinch = null; drag = null; return; } if (drag && !drag.moved) tap(e); drag = null; kick(); }
cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', function(e){ delete ptrs[e.pointerId]; drag = null; pinch = null; });
cvs.addEventListener('wheel', function(e){ if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); ACT = performance.now(); CAM.zoom = Math.max(0.8, Math.min(9, CAM.zoom * Math.exp(-e.deltaY * 0.004))); dirty = true; kick(); }, { passive: false });
cvs.addEventListener('dblclick', function(){ if (cur && G) flyTo(profileView(), 1600, function(){ SWAY = performance.now(); }); });

function tap(e){
  var r = cvs.getBoundingClientRect(), mx = (e.clientX - r.left) * DPR, my = (e.clientY - r.top) * DPR, best = null, bd = 14 * DPR;
  var cand = function(p, info){ if (!seen(p)) return; proj(p, _p); if (_p[2] <= 0) return; var d = Math.hypot(_p[0] - mx, _p[1] - my) - (info.mag || 4) * 0.6 * DPR; if (d < bd){ bd = d; best = info; best.p = p; } };
  if (OPT.live && LIVE) LIVE.forEach(function(q){ cand(q.p, { kind: 'live', q: q, mag: q.mag + 1 }); });
  var focus = ZONE && ZONE.z === cur && FOCK > .5;
  if (focus) for (var i = 0; i < ZONE.n; i++){ if (ZONE.T[i] > cutT || !show[BANDS[ZONE.I[3*i]].k]) continue; cand([ZONE.P[3*i], ZONE.P[3*i+1], ZONE.P[3*i+2]], { kind: 'q', s: ZONE, i: i, mag: ZONE.MAG[i] }); }
  if (!best && OPT.volc && VOLC) VOLC.forEach(function(v){ cand(v.p, { kind: 'v', v: v, mag: 6 }); });
  if (!best && !focus && ZJ){ var hit = null, hd = 40 * DPR;
    Object.keys(ZJ.zones).forEach(function(z){ var m = ZJ.zones[z], p = ll(m.mid[1], m.mid[0], RE); if (!seen(p)) return; proj(p, _p); var d = Math.hypot(_p[0] - mx, _p[1] - my); if (d < hd){ hd = d; hit = z; } });
    if (hit){ endTour(); focusZone(hit); return; } }
  pickI = best; card(best); dirty = true; kick(); }
function card(b){ var el = $('#pick'), c = el.querySelector('.c'); $('#words').style.visibility = b ? 'hidden' : ''; if (!b){ el.style.display = 'none'; return; } el.style.display = 'block';
  if (b.kind === 'v'){ var v = b.v; c.innerHTML = '<b>' + v.name.toUpperCase() + '</b>' + (v.elev != null ? fmt(v.elev) + ' M HIGH · ' : '') + (v.last != null ? 'LAST ERUPTED ' + (v.last < 0 ? Math.abs(v.last) + ' BCE' : v.last) : '') +
      '<br>' + (v.slab != null ? 'THE SINKING PLATE IS ' + v.slab + ' KM BELOW IT: WATER SWEATED OUT OF THE PLATE MELTS THE MANTLE ABOVE, AND THE MELT RISES HERE' : 'NO MODELED SLAB DIRECTLY BELOW'); return; }
  if (b.kind === 'live'){ var q = b.q, ago = Math.round((Date.now() - q.t) / 3600000); c.innerHTML = '<b>M' + q.mag.toFixed(1) + ' · ' + Math.round(q.dep) + ' KM DOWN · ' + (ago < 48 ? ago + ' HOURS AGO' : Math.round(ago / 24) + ' DAYS AGO') + '</b>' + (q.place || '').toUpperCase() + '<br><a href="' + q.url + '" target="_blank" rel="noopener">USGS EVENT PAGE &#8599;&#xFE0E;</a>'; return; }
  var s = b.s, i = b.i, lat = s.LAT[i], lon = ((s.LON[i] + 540) % 360) - 180, dep = s.DEP[i], sd = slabAt(s.LON[i], lat), where;
  if (dep >= 300) where = 'DEEP INSIDE THE SINKING PLATE, WHERE THE PRESSURE SHOULD MAKE ROCK FLOW, NOT BREAK';
  else if (sd != null && Math.abs(dep - sd) <= 25) where = dep < 60 ? 'ON THE FAULT BETWEEN THE TWO PLATES, WHERE THE BIG TRENCH QUAKES HAPPEN' : 'IN THE SINKING PLATE, AS IT BENDS AND HEATS';
  else if (sd != null && dep < sd - 25) where = 'IN THE PLATE ABOVE, OVER THE SINKING ONE';
  else if (sd != null) where = 'BELOW THE TOP OF THE SINKING PLATE';
  else where = dep < 70 ? 'OUTSIDE THE SLAB: THE PLATE BENDING BEFORE IT DIVES, OR THE CRUST ABOVE' : 'BEYOND THE MODELED SLAB';
  c.innerHTML = '<b>M' + s.MAG[i].toFixed(1) + ' · ' + Math.round(dep) + ' KM DOWN</b>' + dateOf(s.T[i]) + ' · ' + Math.abs(lat).toFixed(2) + '°' + (lat < 0 ? 'S' : 'N') + ' ' + Math.abs(lon).toFixed(2) + '°' + (lon < 0 ? 'W' : 'E') +
    '<br>' + where + (sd != null ? ' · THE SLAB TOP IS ' + sd + ' KM DOWN HERE' : '') + '<br><span class="u">FINDING THE USGS EVENT PAGE</span>';
  var t = Date.UTC(1973, 0, 1) + s.T[i] * 1000, iso = function(ms){ return new Date(ms).toISOString().slice(0, 19); }, me = b;
  fetch('https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=' + iso(t - 3000) + '&endtime=' + iso(t + 3000) + '&latitude=' + lat.toFixed(3) + '&longitude=' + lon.toFixed(3) + '&maxradiuskm=60&minmagnitude=' + (s.MAG[i] - .15).toFixed(2))
    .then(function(r){ return r.json(); }).then(function(j){ var u = c.querySelector('.u'); if (!u || pickI !== me) return; var f = j.features && j.features[0];
      u.innerHTML = f ? '<a href="' + f.properties.url + '" target="_blank" rel="noopener">USGS EVENT PAGE &#8599;&#xFE0E;</a>' + (f.properties.place ? ' · ' + f.properties.place.toUpperCase() : '') : ''; }).catch(function(){ var u = c.querySelector('.u'); if (u) u.textContent = ''; }); }
function slabAt(lon, lat){ if (!ZONE) return null; var sl = ZONE.slab, b = sl.box; if (lon < b[0]) lon += 360; var i = Math.round((lon - b[0]) / sl.st), j = Math.round((lat - b[1]) / sl.st); if (i < 0 || j < 0 || i >= sl.nx || j >= sl.ny) return null; var d = sl.g[j * sl.nx + i]; return d < 0 ? null : d; }
document.querySelector('#pick .x').onclick = function(){ $('#pick').style.display = 'none'; $('#words').style.visibility = ''; pickI = null; dirty = true; kick(); };

function size(){ DPR = Math.min(2, window.devicePixelRatio || 1); var c = document.getElementById('gl'); W = Math.round(c.clientWidth * DPR); H = Math.round(c.clientHeight * DPR); c.width = W; c.height = H; ov.width = W; ov.height = H; dirty = true; kick(); if (OPT.slice) drawSlice(); }
window.addEventListener('resize', size); size();
window._slab = { pv: function(o){ Object.assign(PV, o); var t = profileView(); CAM.lat = t.lat; CAM.lon = t.lon; CAM.roll = t.roll; CAM.zoom = t.zoom; FOCK = 1; CUT = 1; fly = null; SWAY = 0; dirty = true; kick(); }, CAM: CAM, focus: focusZone, world: worldView, opt: OPT, kick: function(){ dirty = true; kick(); }, state: function(){ return { cur: cur, zone: !!ZONE, fk: FOCK, cut: CUT, fly: !!fly, G: G }; },
  stop: function(){ fly = null; SWAY = 0; }, profile: function(){ return profileView(); }, set: function(c){ Object.assign(CAM, c); dirty = true; kick(); }, setFK: function(k, c){ FOCK = k; CUT = c; dirty = true; kick(); } };
})();
</script>
