# Cloudflare Worker: the clock for the Kalshi daily job.
#
# Separate from the repo-root wrangler.toml, which belongs to the CORS proxy
# (bluish-void-proxy). A wrangler.toml describes exactly one worker, so this one
# lives in its own directory and is deployed from here:
#
#   cd _kalshi/cron-worker
#   wrangler secret put GH_TOKEN     # fine-grained PAT, Actions: read+write
#   wrangler deploy
#
# No route is declared — this worker is never meant to serve bluishvoid.com
# traffic. It runs on its cron triggers and keeps its workers.dev URL only as a
# status page.

name = "bluish-void-kalshi-cron"
main = "kalshi-cron.js"
compatibility_date = "2026-09-01"

# Cron triggers are UTC. Eastern is UTC-4 in season, so:
#   12:00-23:00 UTC = 08:00-19:00 ET   (covers the noon lock at 16:00 UTC)
#   00:00-04:00 UTC = 20:00-00:00 ET   (covers the 6pm final at 22:00 UTC)
#
# EVERY 15 MINUTES, since 2026-09-05. It was hourly because the job took ~20
# minutes and could not safely be asked for more; parallelising the rain step
# (66 serial requests -> a pool of 4) brought a full run to about 5 minutes, so
# four runs an hour no longer overlap.
#
# The offsets are 5,20,35,50 rather than 0,15,30,45 to stay off the top of the
# hour, where every cron on the platform fires at once.
#
# This does NOT quadruple the price trail: kalshi_daily appends a trail row only
# when the hour changes, so the record stays one row per hour and the SYSTEM
# box's RUNS light keeps counting the same thing. What it buys is a fresher
# ladder on the panel -- the 25-minute-old quote that made a 40c ask read as
# real when the market had already moved to 35c.
#
# Two expressions keeps this inside the free plan's cron-trigger limit.
[triggers]
crons = [
  "5,20,35,50 12-23 * * *",
  "5,20,35,50 0-4 * * *"
]
