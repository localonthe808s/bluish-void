<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Front Scene Lab</title>
<style>
  :root { --bg:#16181d; --panel:#1f2228; --ink:#e7e9ee; --dim:#8a90a0; --line:#2e323b; --acc:#2B22F4; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:600 12px system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(22,24,29,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  h1 { font:800 12px system-ui,sans-serif; letter-spacing:.14em; margin:0 12px 0 0; }
  label { display:inline-flex; align-items:center; gap:6px; color:var(--dim); letter-spacing:.06em; }
  select, button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; }
  button.on { background:var(--acc); border-color:var(--acc); }
  input[type=range] { width:110px; accent-color:var(--acc); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(640px,1fr)); gap:18px; padding:16px; }
  figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; }
  figcaption { color:var(--dim); letter-spacing:.08em; margin:0 0 8px; font-size:11px; }
  canvas { display:block; border-radius:7px; max-width:100%; }
  .pair { display:inline-flex; border-radius:7px; overflow:hidden; }
  .pair canvas { border-radius:0; }
  #msg { color:#f39a5b; }
  @media (max-width:700px){ #grid { grid-template-columns:1fr; padding:16px; } }
</style>
</head>
<body>
<header>
  <h1>FRONT SCENE LAB</h1>
  <label>time <input id="night" type="range" min="0" max="1" step="0.05" value="1"><span id="nightv">night</span></label>
  <label>rain <select id="rain"><option value="">unknown</option><option value="0">dry</option><option value="1">light</option><option value="2" selected>moderate</option><option value="3">heavy</option></select></label>
  <label>strength <input id="str" type="range" min="0.1" max="1" step="0.05" value="0.8"></label>
  <label>size <select id="scale"><option value="1">card (1x)</option><option value="1.6">phone</option><option value="2.8" selected>tab (2.8x)</option></select></label>
  <label>city <input id="mi" type="range" min="0" max="600" step="10" value="180"><span id="miv">180 mi</span></label>
  <button id="flash">lightning</button>
  <button id="reload">reload code</button>
  <span id="msg"></span>
</header>
<section id="proto" style="padding:16px 16px 0;">
  <figure style="max-width:1300px;">
    <figcaption>CLOUD PROTOTYPE &middot; GPU, light marched through a 2D density field &middot; <span id="glst"></span> &middot; <span id="fps"></span></figcaption>
    <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:0 0 10px;color:#8a90a0;">
      <label>stage <select id="pstage"><option value="1">towering cumulus</option><option value="2">young cumulonimbus</option><option value="3" selected>mature cumulonimbus</option></select></label>
      <label>life <input id="page" type="range" min="0" max="1" step="0.01" value="0.55"> <button id="pplay" class="on">play</button></label>
      <label>detail <select id="pppu"><option value="2">low (2 px/unit)</option><option value="3" selected>mid (3)</option><option value="4.5">high (4.5)</option></select></label>
    </div>
    <canvas id="pc"></canvas>
  </figure>
</section>
<div id="grid"></div>
<script>
/* THE LAB (user 2026-09-25: "open a lab and focus on these for a bit, so we dont keep loading the site everytime").
   It runs the SHIPPED drawing code: on load (and on "reload code") it fetches ../index.html, cuts out bvSceneTex,
   bvFrontScene (+ .set) and bvLandAt, and evaluates them here. Edit index.html, press reload -- no site boot. */
var SRC = {};
function extract(html){
  var cut = function(from, to){ var a = html.indexOf(from); if (a < 0) throw new Error('not found: ' + from); var b = html.indexOf(to, a); if (b < 0) throw new Error('no end: ' + to); return html.slice(a, html.indexOf('\n', b + to.length - 1) + 1) + '\n'; };   /* through the END of the marker, which may span lines */
  return cut('    function bvSceneTex(){', '    bvFrontScene.set = function')
       + cut('    function bvLandAt(lon, lat){', '  return !!B.d;\n    };');
}
function load(){
  var msg = document.getElementById('msg'); msg.textContent = 'loading code...';
  return fetch('../index.html?x=' + Date.now()).then(function(r){ return r.text(); }).then(function(html){
    var code = extract(html);
    /* bvLandAt keeps its land file on bvStormPlan.base -- a stub object is all it needs here */
    (0, eval)('var bvStormPlan = window.bvStormPlan || function(){}; window.bvStormPlan = bvStormPlan;\n' + code
      + '\nwindow.bvFrontScene = bvFrontScene; window.bvLandAt = bvLandAt; window.bvSceneTex = bvSceneTex;');
    bvLandAt.ready();
    msg.textContent = ''; return true;
  }).catch(function(e){ msg.textContent = 'code load failed: ' + e.message; });
}
/* tonight's real cut (2026-09-25 occluded front off New York): NW -> SE, the front 289 km out over the Atlantic */
var SEA_GEO = { home: [-73.984, 40.754], ax: [0.62, -0.78], fkm: 289 };
var CASES = [
  { k: 'COLD',  t: 'COLD FRONT' },
  { k: 'WARM',  t: 'WARM FRONT', dir: 1 },
  { k: 'STNRY', t: 'STATIONARY FRONT' },
  { k: 'OCFNT', t: 'OCCLUDED FRONT' },
  { k: 'OCFNT', t: 'OCCLUDED FRONT, CUT CROSSING THE SEA (tonight’s geometry)', geo: true },
  { k: 'COLD',  t: 'COLD FRONT, CUT CROSSING THE SEA', geo: true },
  { k: 'TROF',  t: 'TROUGH', dir: 1 },
  { k: 'PAIR',  t: 'ONE STORM: COLD + WARM (the two halves)' }
];
var flash = false;
function V(id){ return document.getElementById(id).value; }
function build(){
  if (!window.bvFrontScene) return;
  if (bvFrontScene.stop) bvFrontScene.stop();
  bvFrontScene.state = {};                                  /* fresh parcels each rebuild */
  var night = +V('night'), rain = V('rain') === '' ? null : +V('rain'), str = +V('str'), sc = +V('scale'), mi = +V('mi');
  document.getElementById('nightv').textContent = night > 0.66 ? 'night' : night > 0.33 ? 'dusk' : 'day';
  document.getElementById('miv').textContent = mi + ' mi';
  var grid = document.getElementById('grid'); grid.innerHTML = '';
  CASES.forEach(function(c, i){
    var fig = document.createElement('figure'), cap = document.createElement('figcaption'); cap.textContent = c.t; fig.appendChild(cap); grid.appendChild(fig);
    var base = { site: 'lab' + i, scale: sc, night: night, rain: rain, strength: str, flash: flash, speed: 0.8, mph: 25,
                 pin: { dir: c.dir || -1, mi: mi, name: 'NEW YORK' }, ends: ['NW', 'SE'] };
    if (c.geo) base.geo = SEA_GEO;
    if (c.k === 'PAIR'){
      var wrap = document.createElement('div'); wrap.className = 'pair'; fig.appendChild(wrap);
      var L = document.createElement('canvas'), R = document.createElement('canvas'); wrap.appendChild(L); wrap.appendChild(R);
      var hs = Math.min(sc, 1.4);
      bvFrontScene(L, 'COLD', Object.assign({}, base, { storm: 'L', scale: hs, ends: ['W', ''], pin: { dir: -1, mi: mi, name: 'NEW YORK' } }));
      bvFrontScene(R, 'WARM', Object.assign({}, base, { storm: 'R', scale: hs, ends: ['', 'E'], pin: null }));
      return;
    }
    var cv = document.createElement('canvas'); fig.appendChild(cv);
    bvFrontScene(cv, c.k, base);
  });
}
['night', 'rain', 'str', 'scale', 'mi'].forEach(function(id){ document.getElementById(id).addEventListener('input', build); });
document.getElementById('flash').onclick = function(){ flash = !flash; this.classList.toggle('on', flash); build(); };
document.getElementById('reload').onclick = function(){ load().then(build); };
load().then(function(){ /* give the land file a moment so the sea cases draw water on the first pass */ setTimeout(build, 400); });
</script>
<script src="../cloud_gl.js?v=24"></script>
<script>
/* the prototype: the current tower's LIFE (drawCb: climb to .42, anvil spreads .40-.70, decays after .72) driving the GPU cloud */
(function(){
  var cv = document.getElementById('pc'), W = 224, H = 104, SC = 2.8, dpr = Math.min(2, devicePixelRatio || 1) * SC, t = 0, last = 0, fr = [], play = true;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W * SC + 'px'; cv.style.height = H * SC + 'px';
  var g = cv.getContext('2d');
  document.getElementById('glst').textContent = 'WebGL ' + bvCloudGL.status();
  var ease = function(x){ x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  document.getElementById('pplay').onclick = function(){ play = !play; this.classList.toggle('on', play); };
  function frame(now){
    requestAnimationFrame(frame);
    var dt = Math.min(0.06, (now - (last || now)) / 1000) || 0.016; last = now; fr.push(now); while (fr.length && now - fr[0] > 1000) fr.shift();
    t += dt;
    var ageEl = document.getElementById('page'), a = +ageEl.value;
    if (play){ a = (a + dt / 24) % 1; ageEl.value = a; }
    var night = +document.getElementById('night').value, stage = +document.getElementById('pstage').value;
    var rainSel = document.getElementById('rain').value, rain = rainSel === '' ? 0.8 : [0, .35, .75, 1.1][+rainSel];
    var grow = ease(a / 0.42), spread = stage >= 2 ? ease((a - 0.40) / 0.30) : 0, die = ease((a - 0.72) / 0.28);
    var ground = 18, base = 47, fullH = stage >= 3 ? 48 : stage === 2 ? 41 : 24;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    var sky = g.createLinearGradient(0, 0, 0, H - ground);
    if (night > 0.5){ sky.addColorStop(0, '#0b0d14'); sky.addColorStop(1, '#23202a'); } else { sky.addColorStop(0, '#6f93bd'); sky.addColorStop(1, '#c9d5de'); }
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    var eg = g.createLinearGradient(0, H - ground, 0, H); eg.addColorStop(0, night > 0.5 ? '#101210' : '#6f7d63'); eg.addColorStop(1, night > 0.5 ? '#050605' : '#3c4535');
    g.fillStyle = eg; g.fillRect(0, H - ground, W, ground);
    var cx = 120 - 15 * a, hw = (stage >= 3 ? 16 : stage === 2 ? 13 : 10) * (0.55 + 0.45 * grow);
    /* the cloud's shadow on the ground, under the sun's side */
    if (1 - die > 0.05){ var sg = g.createRadialGradient(cx - 10, H - ground + 3, 0, cx - 10, H - ground + 3, hw * 1.8); sg.addColorStop(0, 'rgba(0,0,0,' + (0.28 * (1 - die) * grow).toFixed(3) + ')'); sg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = sg; g.save(); g.scale(1, 0.18); g.beginPath(); g.arc(cx - 10, (H - ground + 3) / 0.18, hw * 1.8, 0, 6.3); g.fill(); g.restore(); }
    bvCloudGL(g, { W: W, H: H, ppu: +document.getElementById('pppu').value, t: t, cx: cx, base: base + die * 6, h: Math.max(6, fullH * (0.16 + 0.84 * grow)) * (1 - die * 0.25),
                   hw: hw, lean: stage >= 2 ? 1 : 0.5, anvil: spread * (1 - die * 0.5), anvR: (stage >= 3 ? 70 : 32) * spread + 1, anvL: (stage >= 3 ? 32 : 15) * spread + 1,
                   rain: stage >= 1 ? ease((a - 0.30) / 0.2) * (1 - die * 0.7) * rain : 0, night: night, flash: 0, ground: ground, dens: 1 - die * 0.85 });
    document.getElementById('fps').textContent = fr.length + ' fps';
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
