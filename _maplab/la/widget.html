<!-- THE LOS ANGELES WIDGET, IN ITS CHROME (2026-09-19, user: "make the lab look like what
     the widget will look like so all the tabs exist in place").

     The control block below is THE CITY widget's, style for style: the frosted rows, the
     orange tabs that turn the site's blue when lit, the grey info bar, the orange reading
     strip flush on the map, the 1.1405 body with its squared top and rounded bottom, the
     time chip and the attribution. Row for row it maps onto New York's:

         cap    FALL FOLIAGE                  ->  none: the marine layer has its own
                                                  CLOUD widget below this one
         row 1  KOKX / MRMS 3 / MRMS 12       ->  ONE view: THE MARINE LAYER, SF to Baja (LA has rain
                                                  34 days a year; three radar cards were empty most of it)
                CITY MAP                      ->  CITY MAP
         row 2  the lit view's own products   ->  the map's row only: TRAFFIC / SURF / GEOLOGY
                                                  (no FLOODING, no TREES -- user, for now)

     The map is the live lab in an iframe (../index.html?embed=1&view=la); the tabs drive
     it by postMessage and it still pans and zooms. WHAT IS A STILL HERE AND LIVE IN THE

     no strikes, no warnings, no arrivals board. The strips say so rather than inventing

<body>
<div class="wrap">
  <p class="note"><b>THE BASIN · WIDGET PREVIEW</b> &nbsp; the Los Angeles widget in THE CITY's chrome. CITY MAP is the live lab:
    drag to pan, scroll or double-click to zoom. The radar and satellite views loop: the satellite from the frames GIBS holds, the radar from the sweeps the service names.</p>

  <div id="cw-tabs" class="row"></div>
  <div id="cw-tabs-prod" class="row"></div>
  <div id="cw-info"></div>
  <div id="cw-wide-tag"><span id="cw-wide-tag-main"></span><span id="cw-wide-tag-sub"></span><span id="cw-wide-tag-info"></span></div>
  <div id="cw-body">
    <iframe id="lab" title="the basin map"></iframe>
    <!-- the src is set from script with a cache-buster: this is a preview of a lab that changes
         every few minutes, and a stale frame has twice now been measured as if it were the new
         one. Pages caches index.html hard; the widget must not inherit that. -->
    <script>document.getElementById('lab').src = '../index.html?embed=1&view=la&traffic=1&cb=' + Date.now();</script>
    <div id="cw-zoom">
      <button data-zoom="1.8" title="Zoom in">+</button>
      <button data-zoom="0.5556" title="Zoom out">−</button>
      <button data-zoom="0" class="home" title="Back to the whole basin">HOME</button>
    </div>
    <div id="cw-time"></div>
    <div id="cw-attrib"></div>
  </div>
</div>

<script>
/* THE 12-HOUR BOX came in from 15.5 to 12.6 degrees (user: "is the 12 hr zoomed too far out?
   maybe bring it in just a little"): Cape Mendocino and the tip of Baja were scenery, and at
   the wider scale a whole half-day of weather was a finger's width from the city.
   a wide box at the widget's aspect, from a centre and a width in degrees of longitude.
   Both wide views sit WEST of the city: Los Angeles' weather arrives off the Pacific, so a
   box centred on downtown would spend half its width on a desert the storms have not
   reached yet. */
function box(lon, lat, wDeg){
  var R = 6378137, PI = Math.PI;
  var y = function(la){ return R * Math.log(Math.tan(PI/4 + la*PI/360)); };
  var la = function(Y){ return (2*Math.atan(Math.exp(Y/R)) - PI/2) * 180/PI; };
  var h = (wDeg * PI/180 * R) / 1.1372, Y = y(lat);
  return { w: lon - wDeg/2, e: lon + wDeg/2, s: la(Y - h/2), n: la(Y + h/2) };
}
var BOXWIDE = box(-120.6, 34.3, 12.6);
var GEOCOLOR = 'GOES-West_ABI_GeoColor', RAIN = 'conus_bref_qcd';

/* TWO VIEWS (user 2026-09-20: "remake the 12HR as the marine layer now and remove the 3HR and
   KSOX"). Los Angeles has measurable rain 34 days a year, three quarters of them November to
   March, so a half-hour radar, a 3-hour mosaic and a 12-hour mosaic were three empty cards for
   most of the calendar. The weather this coast has every day is the marine layer, and it gets
   the wide frame to itself: the cloud looping, cut out of the satellite so the map under it
   stays a map, with the rain mosaic over the top on the days there is any. */
var VIEWSET = {
  marine: { label:'MARINE LAYER · SAN FRANCISCO TO BAJA', marine:true, box:BOXWIDE,
            tag:'THE MARINE LAYER · GOES WEST',
            sub:'THE CLOUD LOOPS THE LAST HOUR, ABOUT 50 MIN BEHIND THE CLOCK · ANY RAIN IS THE NEWEST MRMS MOSAIC, LAID OVER IT',
            attrib:'NASA GIBS · NOAA GOES-West · NOAA MRMS' },
  map:    { label:'CITY MAP', layers:true, attrib:'' }
};
var ORDER = ['marine', 'map'];
/* IT OPENS ON TRAFFIC (user 2026-09-20): the city map's TRAFFIC tab is lit at launch, and the lab
   is booted with `&traffic=1` to match, so the two never disagree on the first paint. */
var st = { view:'map', geo:false, traffic:true, surf:false, swellDir:null, rail:null };
/* THE RAIL STANDS DOWN WHEN THE TRAFFIC COMES UP (user 2026-09-19: "have train view off by
   default when turning on the traffic tab, let them turn it on"). Four Metro colours over a
   road map coloured green to crimson is two networks arguing; the roads are the subject once
   TRAFFIC is lit. null means "whatever this view wants" -- on for the bare city map, off once
   traffic is on -- and the button writes a real true/false over it. Lighting or dousing
   TRAFFIC clears that choice, so each visit starts from the sensible default.
   THE BOARD IS NOT THE LINES. The 17th Street departures stay in the bar either way: knowing
   the next train is useful whether or not its route is painted on the map. */
function railOn(){ return st.rail === null ? !st.traffic : st.rail; }
function send(){
  /* every view but the map is a fixed frame, as in the widget: no pan, no zoom */
  var v = VIEWSET[st.view], m = { view:'la', geo: st.view === 'map' && st.geo, lock: st.view !== 'map', traffic: st.view === 'map' && st.traffic, surf: st.view === 'map' && st.surf, swellDir: (st.view === 'map' && st.surf) ? st.swellDir : null,
      /* THE RAIL BELONGS TO THE CITY MAP (user 2026-09-19: "dont show the train lines on the
         weather views either, just neighborhoods"). On a radar or satellite frame four Metro
         colours are just four more lines over the thing you came to look at; the names are
         what place the weather. The toggle still governs the map itself. */
      rail: st.view === 'map' && railOn(),
      /* the cloud under the sweep: every remaining view but the map is a radar one */
      };
  if (v.box) m.box = v.box;
  if (v.marine){ m.sat = GEOCOLOR; m.cloud = true; m.rain = true; m.radarSid = 'conus'; m.radarLayer = RAIN; }
  document.getElementById('lab').contentWindow.postMessage({ lab:m }, '*');
}
/* THE READING LINE: what the lab's weather reads say, in words. The numbers are the
   MODEL'S (Open-Meteo), posted up from the map frame, and the line says so. In the widget
   the storm motion is measured off the radar loop; the steering wind is its fallback. */
var READS = null, FRONTS = null;
window.addEventListener('message', function(ev){
  if (ev.data && ev.data.labReads){ READS = ev.data.labReads; paint(); }
  if (ev.data && ev.data.labFronts){ FRONTS = ev.data.labFronts; paint(); }
  if (ev.data && 'labFrontTap' in ev.data){ FRONTTAP = ev.data.labFrontTap; if (FRONTTAP) st.frontOff = false; paint(); }
});
/* WHAT A FRONT IS, CUT THROUGH THE AIR (user 2026-09-20, after the fault cutaways: "could you
   make the same visuals for pressure fronts in weather? thats very helpful"). The same lesson
   as the faults: the line on the map is a convention, and the thing itself is only visible
   from the SIDE. A front is the edge of a wedge of cold air lying on the ground; every kind
   is a different answer to "which air is advancing, and so which way does the warm air get
   lifted". Cold air blue, warm air peach, the boundary in the map's own colour for that kind,
   cloud and rain where the lifting puts them. Drawn only for the kinds the NWS analysis has
   IN FRAME right now; a button opens all five for the (common, here) day when there is none. */
var FRONT_KINDS = ['COLD', 'WARM', 'STNRY', 'OCFNT', 'TROF'];
var FRONT_TXT = {
  COLD:  ['COLD FRONT', '#2563eb', 'Cold air is heavy. It drives under the warm air like a wedge and shoves it straight up, fast.',
          'A narrow band of hard showers or storms, then cooler, drier, clearer air behind it.', 'ON THE MAP · BLUE, TRIANGLES POINT THE WAY IT IS GOING'],
  WARM:  ['WARM FRONT', '#dc2626', 'Warm air is light. It cannot push the cold air out of the way, so it slides up over it on a long gentle ramp.',
          'High thin cloud first, then hours of steady light rain well ahead of the line, then milder air.', 'ON THE MAP · RED, HALF-CIRCLES POINT THE WAY IT IS GOING'],
  STNRY: ['STATIONARY FRONT', '#2563eb', 'Neither air mass is winning, so the boundary sits where it is. The winds blow along it, not across it.',
          'Cloud and on-and-off rain over the same places, sometimes for days.', 'ON THE MAP · BLUE TRIANGLES ONE SIDE, RED HALF-CIRCLES THE OTHER'],
  OCFNT: ['OCCLUDED FRONT', '#2B22F4', 'A cold front has caught up with the warm front ahead of it. The two cold air masses meet on the ground and the warm air is lifted clear off it.',
          'A storm past its peak: a wide shield of cloud and rain, weakening.', 'ON THE MAP · TRIANGLES AND HALF-CIRCLES ON THE SAME SIDE'],
  TROF:  ['TROUGH', '#a9742f', 'Not a front: the air is the same on both sides. It is a line where the pressure dips, so surface air flows in from both sides and has nowhere to go but up.',
          'A line of cloud or showers if the air is moist. Out here, often only a wind shift.', 'ON THE MAP · A DASHED TAN LINE']
};
/* THE FRONT, ALIVE (user 2026-09-20: "lets improve the pressure front visuals, lets make these
   cool and inventive now"). Still the honest picture -- a cut through the air seen from the
   side -- but drawn as MOVING AIR instead of a diagram:
     - the air is streamlines of parcels. Cold air is blue and hugs the ground; warm air is
       amber, and where the front lifts it past the condensation level it turns white. The
       cloud is not painted on: it is made of the lifted warm air, which is what a cloud is.
     - the camera RIDES WITH THE FRONT, so the land scrolls underneath: a small skyline passes
       from warm light, into the rain, and under the cold dome. Warm air is still over the
       ground, so its streaks and the ground move together -- the front is what is travelling.
     - rain fits the kind: hard and narrow at a cold front (with the odd flash), wide and light
       AHEAD of a warm front, broad under an occlusion. A ribbon under the ground carries the
       temperature across the line.
   Kinematic, not a simulation: every parcel rides an analytic streamline over the frontal
   surface, so it cannot wander off and costs nothing. One scene runs at a time, capped at
   30 fps, asleep when off screen or hidden; its state is kept per kind so a card that is
   re-rendered picks up where it was instead of reseeding. */
function bvFrontScene(cv, kind, opts){
  opts = opts || {};
  var W = 224, H = 104, G = 86, dpr = Math.min(2, window.devicePixelRatio || 1);
  var SC = opts.scale || 1;                              // three cards across: the same scene, drawn a little smaller
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = Math.round(W * SC) + 'px'; cv.style.height = Math.round(H * SC) + 'px';
  var g = cv.getContext('2d');
  var S = bvFrontScene.state || (bvFrontScene.state = {}), key = kind + '|' + (opts.site || '') + (opts.storm ? '|storm' : '');
  var rnd = function(){ S._seed = ((S._seed || 9301) * 1103515245 + 12345) & 0x7fffffff; return S._seed / 0x7fffffff; };
  var COLC = { COLD:'#3b82f6', WARM:'#ef4444', STNRY:'#3b82f6', OCFNT:'#2B22F4', TROF:'#d8a25c' };
  /* the frontal surface: height of the cold air above the ground at x, per kind */
  var xn = 128, xs = 58, xc = 112;
  var surf = function(x, t){
    if (kind === 'COLD')  return x < xn ? 44 * Math.sqrt(Math.min(1, (xn - x) / 70)) + Math.max(0, xn - 70 - x) * 0.10 : 0;
    if (kind === 'WARM')  return x > xs ? Math.min(66, (x - xs) * 0.34) : 0;
    if (kind === 'STNRY'){ var n2 = xn - 10 + 4 * Math.sin(t * 0.7); return x < n2 ? 40 * Math.sqrt(Math.min(1, (n2 - x) / 120)) : 0; }
    if (kind === 'OCFNT') return x < xc ? 18 + 36 * Math.sqrt(Math.min(1, (xc - x) / 120)) : 18 + Math.min(44, (x - xc) * 0.30);
    return 0;
  };
  var LCL = 30;                                           // lifted this far, a warm parcel condenses
  /* WHAT IS TRUE OF THIS FRONT, NOW (user 2026-09-20: "do 1 and 3, then 2 and 5"). The first
     scene was a textbook: every cold front got a storm tower, hard rain and lightning whether
     or not the real one had a drop in it. These come from the caller and are re-read every
     frame (bvFrontScene.set), so a card can be corrected without restarting its air:
       rain     0 dry .. 3 heavy, off the radar along the line. Undefined = not known.
       strength 0..1, from the measured temperature difference across it.
       flash    true only when the lightning network has strikes near the line.
       speed    a factor on the front's travel, from its measured motion.
       night    0 day .. 1 night, from the sun's altitude where the city is.
       pin      { dir:-1|+1, mi, name }: the city, on its true side, at its true distance.
       ends     [left, right] compass letters for the two ends of the cut.
       occl     'warm' | 'cold' when it can be told which air is the colder. */
  var O = function(){ return (st && st.o) || opts; };
  var st = S[key];
  if (!st){
    st = S[key] = { t: 0, off: 0, warm: [], cold: [], rain: [], flash: 0, nextFlash: 3 + rnd() * 3 };
    for (var i = 0; i < 96; i++) st.warm.push({ x: rnd() * (W + 40) - 20, b: 3 + Math.pow(rnd(), 1.7) * 58, s: 0.75 + rnd() * 0.5 });
    for (i = 0; i < 30; i++) st.cold.push({ p: rnd() * 6.283, r: 0.3 + rnd() * 0.7, s: 0.7 + rnd() * 0.6, x: rnd() * W, b: 2 + rnd() * 30 });
    for (i = 0; i < 46; i++) st.rain.push({ u: rnd(), v: rnd(), s: 0.8 + rnd() * 0.5 });
    /* the land: a strip of silhouettes one tile wide, repeated */
    st.land = [];
    if (opts.site === 'la'){
      for (i = 0; i < 9; i++) st.land.push({ x: i * 26 + rnd() * 10, palm: rnd() < 0.55, h: 5 + rnd() * 5, w: 6 + rnd() * 8 });
    } else {
      for (i = 0; i < 16; i++) st.land.push({ x: i * 14 + rnd() * 4, h: 4 + Math.pow(rnd(), 2) * 13, w: 5 + rnd() * 6, spire: rnd() < 0.14 });
    }
  }
  st.o = opts;
  /* ONE STORM, TWO PANELS (user 2026-09-20: "what if its a complicated mixture"): a cold front and
     a warm front that belong to one low are drawn as ONE cut, west to east -- this scene twice,
     butted edge to edge, storm:'L' the cold front and storm:'R' the warm. What has to agree across
     the seam is shared: one strip of land, one scroll, one sky. The warm air between them streams
     away from the seam both ways, which is the truth seen from the storm: the cold front is
     catching the warm air up, and the warm air is catching the warm front up. */
  var SH = null;
  if (opts.storm){
    SH = S['stormshare|' + (opts.site || '')] || (S['stormshare|' + (opts.site || '')] = { land: st.land, off: 0 });
    st.land = SH.land;

   an empty list for every line when this was built. It is asked first every time, and the day
   it answers with trains this board should be rebuilt on it -- until then a scheduled time is
   never dressed up as a live one. */
var SCHED = null, STATION = { id:'80138S', name:'17th Street / SMC', routes:['E'], kind:'metro' }, LIVE = null;   // = DEFAULT_STATION
var LINE_COL = { A:'#0072BC', B:'#EB131B', C:'#58A738', D:'#A05DA5', E:'#FDB913', K:'#E56DB1' };
fetch('rail_sched.json').then(function(r){ return r.json(); }).then(function(j){ SCHED = j; paint(); }).catch(function(){});

function laNow(){
  /* the clock on the platform: Los Angeles time, whatever the reader's is */
  var p = {}; new Intl.DateTimeFormat('en-US', { timeZone:'America/Los_Angeles', weekday:'short', hour:'numeric', minute:'numeric', hourCycle:'h23' })
    .formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
  var ymd = function(t){ return new Intl.DateTimeFormat('en-CA', { timeZone:'America/Los_Angeles' }).format(t).replace(/-/g, ''); };
  return { min: (+p.hour % 24) * 60 + (+p.minute), today: ymd(new Date()), yday: ymd(new Date(Date.now() - 864e5)) };
}
function clock(min){ var h = Math.floor(min / 60) % 24, m = min % 60; return (h % 12 || 12) + ':' + ('0' + m).slice(-2) + (h < 12 ? ' AM' : ' PM'); }
/* THE LAYOUT IS NEW YORK'S (index.html, mtaPanelRender), centred (user 2026-09-19: "visualize
   the train times better like NYC ... center and match its layout"): a header row -- the
   station, its lines as bullets, a small grey tag saying where the times come from, a close
   -- then the direction groups SIDE BY SIDE, each a small grey label over a bullet and its
   clock times, bars between, NOW in green, no AM/PM inside the hour. New York's tag reads
   LIVE · MTA; this one reads TIMETABLE, because that is what it is. Four groups at most, the
   soonest first ("you dont need to show them all"). */
var DEFAULT_STATION = { id:'80138S', name:'17th Street / SMC', routes:['E'], kind:'metro' };
var DARK_TEXT = { E:1 };                       // the E Line's gold wants dark lettering, as New York's yellows do
function bullet(rt, px){
  px = px || 17;
  var col = LINE_COL[rt] || '#5b647a', wide = rt.length > 1;
  return '<span style="display:inline-flex;align-items:center;justify-content:center;min-width:' + px + 'px;height:' + px + 'px;'
    + 'border-radius:' + (wide ? Math.round(px / 2) + 'px' : '50%') + ';padding:0 ' + (wide ? '5px' : '0') + ';'
    + 'background:' + col + ';color:' + (DARK_TEXT[rt] ? '#1b2340' : '#fff') + ';vertical-align:middle;'
    + 'font:700 ' + Math.round(px * 0.59) + 'px system-ui,sans-serif;letter-spacing:0;flex-shrink:0;">' + rt + '</span>';
}
function board(){
  /* ONE BAND ACROSS THE WHOLE BAR (user 2026-09-19: "use the space better"). The first cut
     stacked four short rows in the middle of a 1,150 px bar and left both sides empty. Now the
     station is the first column and every direction is a column of its own, equal widths, so
     the board spans the bar and is two rows tall instead of four. The source note rides under
     the station name rather than taking a row. A station with few directions has room, so it
     shows MORE trains (six, across ninety minutes) rather than more air. */
  var sd = SCHED && SCHED[STATION.id], isDefault = STATION.id === DEFAULT_STATION.id;
  var lines = (STATION.routes || []).filter(function(r, k, a){ return a.indexOf(r) === k; });
  var station = function(sub){
    return '<div class="st">'
      + '<div style="display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;">'
      + '<span style="font:800 13px system-ui,sans-serif;letter-spacing:.03em;">' + STATION.name.toUpperCase() + '</span>'
      + '<span style="display:inline-flex;gap:3px;align-items:center;">' + lines.map(function(r){ return bullet(r); }).join('') + '</span></div>'
      + '<div style="font:600 8px system-ui,sans-serif;color:#5b647a;letter-spacing:.08em;margin-top:5px;">TIMETABLE · '
      + (STATION.kind === 'commuter' ? 'METROLINK' : 'LA METRO') + ' · SCHEDULED, NOT LIVE</div>'
      + '<div style="font:600 8px system-ui,sans-serif;color:#8a91a5;letter-spacing:.08em;margin-top:2px;">' + sub + '</div></div>';
  };
  var wrap = function(cols, inner){
    return '<div class="tb" style="--n:' + cols + ';">' + inner
      + (isDefault ? '' : '<button id="cw-la-x" style="position:absolute;right:-4px;top:-4px;background:none;border:none;font:700 13px system-ui,sans-serif;color:#1b2340;cursor:pointer;padding:0 2px;">✕</button>')
      + '</div>';
  };
  /* with the lines switched off there is no station on the map to tap, so do not ask */
  var tapHint = railOn() ? 'TAP A STATION ON THE MAP FOR ITS OWN' : 'TRAIN LINES ARE OFF \u00b7 TURN THEM ON TO TAP A STATION';
  var lone = function(t){ return wrap(1, station(tapHint) + '<div class="dir solo" style="font:600 10px system-ui,sans-serif;color:#5b647a;letter-spacing:0;">' + t + '</div>'); };
  if (!SCHED) return lone('READING THE TIMETABLE…');
  if (!sd) return lone('NO TIMETABLE FOR THIS STATION');
  /* the timetable is stored PER DATE (Metro's calendar changes daily); a date it does not
     hold means the bake has gone stale, and the board says that rather than guessing */
  var now = laNow(), of = function(r, ds){ var ix = r.d[ds]; return ix == null ? null : r.t[ix]; };
  if (!sd.rows.some(function(r){ return of(r, now.today); })) return lone('THE TIMETABLE ON FILE DOES NOT REACH TODAY · IT NEEDS RE-BAKING');
  var hm = function(min){ var h = Math.floor(min / 60) % 24; return (h % 12 || 12) + ':' + ('0' + (min % 60)).slice(-2); };
  var rows = sd.rows.map(function(r){
    /* today's service day, and the tail of yesterday's that runs past midnight */
    var t = (of(r, now.yday) || []).filter(function(x){ return x >= now.min + 1440; }).map(function(x){ return x - 1440; })
      .concat((of(r, now.today) || []).filter(function(x){ return x >= now.min; })).sort(function(a, b){ return a - b; });
    return t.length ? { r: r, t: t, wait: t[0] - now.min } : null;
  }).filter(Boolean).sort(function(a, b){ return a.wait - b.wait; });
  if (!rows.length) return lone('NO MORE TRAINS TONIGHT ON THE TIMETABLE');
  var shown = rows.slice(0, 4), more = rows.length - shown.length, roomy = shown.length <= 2;
  var cols = shown.map(function(o){
    var soon = o.t.filter(function(x){ return x - now.min <= (roomy ? 90 : 60); }).slice(0, roomy ? 6 : 4);
    var times = soon.length
      ? soon.map(function(x){ return x - now.min < 1 ? '<span style="color:#65a30d;">NOW</span>' : hm(x); }).join('<span style="opacity:.4;"> | </span>')
      : '<span style="color:#5b647a;font-weight:600;">FIRST TRAIN ' + clock(o.t[0]) + '</span>';
    return '<div class="dir' + (shown.length === 1 ? ' solo' : '') + '">'
      + '<div style="font:700 8px system-ui,sans-serif;color:#8a91a5;letter-spacing:.1em;margin-bottom:4px;">TO ' + o.r.h.toUpperCase() + '</div>'
      + '<div style="display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;">' + bullet(o.r.r)
      + '<span style="font:600 12.5px system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:0;">' + times + '</span></div></div>';
  }).join('');
  return wrap(shown.length, station((more > 0 ? more + ' MORE DIRECTION' + (more > 1 ? 'S' : '') + ' HERE · ' : '') + tapHint) + cols);
}
setInterval(function(){ if (st.view === 'map' && !st.geo) paint(); }, 30000);
function chip(r, c){ return '<span class="chip" style="background:' + c + '">' + r + '</span>'; }
function paint(){
  var v = VIEWSET[st.view];
  Object.keys(VIEWSET).forEach(function(k){

    add('SURF', st.surf, function(){ st.surf = !st.surf; SURFTAP = null; st.swellDir = null; if (st.surf){ st.geo = false; st.traffic = false; INCIDENT = null; ROCK = null; } paint(); send(); });
    add('GEOLOGY', st.geo, function(){ st.geo = !st.geo; ROCK = null; if (st.geo){ st.surf = false; st.traffic = false; INCIDENT = null; } paint(); send(); });   // the rock stands alone
  }

  var info = document.getElementById('cw-info'), tag = document.getElementById('cw-wide-tag');
  if (v.layers){

      var fcv = document.querySelector('#cw-info .flt-cv'), f0 = ROCK && ROCK.fault;

    }, 0);

      ? '<b>THE ROCK UNDER THE BASIN</b> &nbsp;·&nbsp; Macrostrat units, with USGS Quaternary faults: heaviest where the ground has broken in historic time, dashed where the survey infers the trace. Hatched where the ground is soft enough to amplify shaking. Every earthquake USGS has logged in the last 24 hours gets its diamond, from the same feed and in the same hand as the EARTHQUAKES widget. A quiet day is a quiet map. The basin&rsquo;s destructive ones &mdash; Northridge 1994, Sylmar 1971, Long Beach 1933 &mdash; are in the record, not on this map. Tap any of it.'
      : ((st.traffic && INCIDENT ? incidentBand() : board() + (st.traffic ? trafficLine() : ''))

  } else {

    document.getElementById('cw-wide-tag-info').innerHTML = readsLine(v);

    b.onclick = function(){ var v = b.getAttribute('data-swell'); st.swellDir = v === '' ? null : +v; SURFTAP = null; paint(); send(); };
  });
  var sxb = document.getElementById('cw-la-sx');
  if (sxb) sxb.onclick = function(){ SURFTAP = null; paint(); };
  var rxb = document.getElementById('cw-la-rx');
  if (rxb) rxb.onclick = function(){ ROCK = null; ROCKSEQ++; paint(); };
  var ixb = document.getElementById('cw-la-ix');
  if (ixb) ixb.onclick = function(){ INCIDENT = null; paint(); };
  var xb = document.getElementById('cw-la-x');
  if (xb) xb.onclick = function(){ STATION = DEFAULT_STATION; paint(); };
  /* the buttons belong to the map: a fixed frame has nothing to zoom */
  document.getElementById('cw-zoom').style.display = v.layers ? 'flex' : 'none';
  document.getElementById('cw-time').textContent = v.layers ? '' : 'LOOPING \u00b7 THE LAST HOUR';
  document.getElementById('cw-time').style.display = v.layers ? 'none' : '';
  document.getElementById('cw-attrib').textContent = '© OpenStreetMap · Protomaps · USGS 3DEP · NOAA NCEI · LA Metro · Metrolink'
    + (v.attrib ? ' · ' + v.attrib : '') + (st.view === 'map' && st.geo ? ' · Macrostrat · USGS Qfaults' : '')
    + (st.view === 'map' && st.traffic ? ' · © TomTom · Caltrans' : '')
    + (st.view === 'map' && st.surf ? ' · NOAA NDBC · Scripps CDIP · NOAA CO-OPS · NWS' : '');
}
[].slice.call(document.querySelectorAll('#cw-zoom button')).forEach(function(b){
  b.onclick = function(){ document.getElementById('lab').contentWindow.postMessage({ labZoom: +b.getAttribute('data-zoom') }, '*'); };

  /* tapping the lit view returns to the bare map, as it does in New York */
