<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE BASIN · widget preview</title>
<!-- THE LOS ANGELES WIDGET, IN ITS CHROME (2026-09-19, user: "make the lab look like what
     the widget will look like so all the tabs exist in place").

     The control block below is THE CITY widget's, style for style: the frosted rows, the
     orange tabs that turn the site's blue when lit, the grey info bar, the orange reading
     strip flush on the map, the 1.1405 body with its squared top and rounded bottom, the
     time chip and the attribution. Row for row it maps onto New York's:

         cap    FALL FOLIAGE                  ->  MARINE LAYER · GOES WEST
         row 1  KOKX · NEXT HALF HOUR         ->  KSOX SANTA ANA MTNS · NEXT HALF HOUR
                MRMS · NEXT 3 HOURS / 12      ->  the same two, boxes centred west of LA
                CITY MAP                      ->  CITY MAP
         row 2  the lit view's own products   ->  the same; the map's row is GEOLOGY only
                                                  (no FLOODING, no TREES -- user, for now)

     The map is the live lab in an iframe (../index.html?embed=1&view=la); the tabs drive
     it by postMessage and it still pans and zooms. WHAT IS A STILL HERE AND LIVE IN THE
     WIDGET: the radar and satellite are one frame, not a loop; there are no lead arcs,
     no strikes, no warnings, no arrivals board. The strips say so rather than inventing
     a storm motion or a minute count. -->
<style>
  @font-face{ font-family:"QelliaRegular"; src:url('../qellia.woff2') format('woff2'); font-display:block; }
  html,body{ margin:0; min-height:100%; }
  body{ font-family:system-ui,sans-serif; color:#1b2340;
        background:linear-gradient(160deg,#dfe6f7 0%,#cdd6f2 38%,#b9c6ee 70%,#a9b9ea 100%) fixed; }
  .wrap{ max-width:1180px; margin:0 auto; padding:18px 0 40px; }
  .note{ margin:0 14px 10px; font:500 11px/1.5 system-ui,sans-serif; color:rgba(27,35,64,.62); }
  .note b{ color:#2B22F4; letter-spacing:.12em; font-weight:900; font-size:10px; }
  .row{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin:0 14px; padding:5px 8px 0;
        background:rgba(255,255,255,.6); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  #cw-tabs-cap{ margin-top:8px; padding:6px 8px 0; border-radius:10px 10px 0 0; }
  #cw-tabs-prod{ padding:5px 8px 6px; }
  .tab{ flex:1 1 120px; padding:7px 12px; border-radius:7px; border:none; font:700 .62rem system-ui,sans-serif;
        letter-spacing:.5px; text-transform:uppercase; cursor:pointer; white-space:nowrap;
        background:rgba(234,88,12,.92); color:rgba(255,255,255,.97); }
  .tab.lit{ background:rgba(43,34,244,.9); }
  .tab.wide{ flex:1 1 100%; width:100%; }
  #cw-info{ margin:0 14px; padding:7px 12px 8px; background:rgba(255,255,255,.6); backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px); border-top:1px solid rgba(27,35,64,.10); color:#1b2340;
            min-height:2.2em; font:600 9px/1.7 system-ui,sans-serif; letter-spacing:.07em; }
  #cw-info b{ font-weight:800; }
  #cw-wide-tag{ margin:0 14px; padding:6px 12px; background:rgba(234,88,12,.95); color:#fff; letter-spacing:.08em;
                text-align:center; line-height:1.4; }
  #cw-wide-tag-main{ font:800 9px system-ui,sans-serif; letter-spacing:.08em; }
  #cw-wide-tag-sub{ font:700 8px system-ui,sans-serif; letter-spacing:.08em; color:rgba(255,255,255,.82); margin-left:10px; }
  #cw-wide-tag-info{ display:none; margin:5px 0 0; padding-top:5px; border-top:1px solid rgba(255,255,255,.25);
                     font:600 8.5px system-ui,sans-serif; letter-spacing:.07em; color:rgba(255,255,255,.9); line-height:1.65; }
  #cw-body{ position:relative; overflow:hidden; aspect-ratio:1100/967; border-radius:0 0 10px 10px; margin:0 14px 8px;
            background:#17457F; }
  #cw-body iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  #cw-time{ position:absolute; right:8px; top:6px; z-index:4; font:700 9px system-ui,sans-serif; letter-spacing:.08em;
            color:rgba(255,255,255,.9); background:rgba(8,12,22,.6); border-radius:6px; padding:3px 8px; pointer-events:none; }
  /* ZOOM, in the GOES viewer's grammar (index.html: 26 px chips, translucent, over the image).
     Dark here rather than light: that viewer's chips sit on a night satellite frame, these sit
     on the orange city. Only on the map view -- the radar and satellite tabs are fixed frames. */
  #cw-zoom{ position:absolute; left:8px; bottom:6px; z-index:5; display:flex; flex-direction:column; gap:4px; }
  #cw-zoom button{ width:26px; height:26px; border-radius:7px; border:none; background:rgba(8,12,22,.62);
                   color:#fff; font:400 15px/1 system-ui,sans-serif; cursor:pointer; padding:0;
                   backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  #cw-zoom button:hover{ background:rgba(8,12,22,.82); }
  #cw-zoom button.home{ font:800 7px/1 system-ui,sans-serif; letter-spacing:.06em; }
  #cw-attrib{ position:absolute; right:8px; bottom:6px; z-index:4; font:500 8px system-ui,sans-serif; color:rgba(30,30,50,.6);
              background:rgba(255,255,255,.6); padding:1px 6px; border-radius:4px; pointer-events:none; }
  /* the train board: one band on a desktop; on a phone the station on top and the directions
     two across -- four equal columns at 430 px crushed every label into a word a line */
  .tb{ position:relative; display:grid; grid-template-columns:minmax(230px,1.25fr) repeat(var(--n),minmax(0,1fr)); align-items:stretch; }
  .tb > div{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2px 10px; min-width:0; }
  .tb > .dir{ border-left:1px solid rgba(27,35,64,.10); }
  @media (max-width:720px){
    .tb{ grid-template-columns:repeat(2,minmax(0,1fr)); row-gap:0; }
    .tb > .st{ grid-column:1 / -1; padding-bottom:8px; }
    .tb > .dir{ border-left:none; border-top:1px solid rgba(27,35,64,.10); padding:7px 6px; }
    .tb > .dir:nth-child(odd){ border-left:1px solid rgba(27,35,64,.10); }
    .tb > .dir:only-of-type, .tb > .dir.solo{ grid-column:1 / -1; }
  }
  .chip{ display:inline-block; min-width:13px; height:13px; line-height:13px; border-radius:50%; color:#fff; text-align:center;
         font:800 8px system-ui,sans-serif; margin:0 1px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="note"><b>THE BASIN · WIDGET PREVIEW</b> &nbsp; the Los Angeles widget in THE CITY's chrome. CITY MAP is the live lab:
    drag to pan, scroll or double-click to zoom. The radar and satellite views loop: the satellite from the frames GIBS holds, the radar from the sweeps the service names.</p>

  <div id="cw-tabs-cap" class="row"></div>
  <div id="cw-tabs" class="row"></div>
  <div id="cw-tabs-prod" class="row"></div>
  <div id="cw-info"></div>
  <div id="cw-wide-tag"><span id="cw-wide-tag-main"></span><span id="cw-wide-tag-sub"></span><span id="cw-wide-tag-info"></span></div>
  <div id="cw-body">
    <iframe id="lab" title="the basin map"></iframe>
    <!-- the src is set from script with a cache-buster: this is a preview of a lab that changes
         every few minutes, and a stale frame has twice now been measured as if it were the new
         one. Pages caches index.html hard; the widget must not inherit that. -->
    <script>document.getElementById('lab').src = '../index.html?embed=1&view=la&cb=' + Date.now();</script>
    <div id="cw-zoom">
      <button data-zoom="1.8" title="Zoom in">+</button>
      <button data-zoom="0.5556" title="Zoom out">−</button>
      <button data-zoom="0" class="home" title="Back to the whole basin">HOME</button>
    </div>
    <div id="cw-time"></div>
    <div id="cw-attrib"></div>
  </div>
</div>

<script>
/* THE 12-HOUR BOX came in from 15.5 to 12.6 degrees (user: "is the 12 hr zoomed too far out?
   maybe bring it in just a little"): Cape Mendocino and the tip of Baja were scenery, and at
   the wider scale a whole half-day of weather was a finger's width from the city.
   a wide box at the widget's aspect, from a centre and a width in degrees of longitude.
   Both wide views sit WEST of the city: Los Angeles' weather arrives off the Pacific, so a
   box centred on downtown would spend half its width on a desert the storms have not
   reached yet. */
function box(lon, lat, wDeg){
  var R = 6378137, PI = Math.PI;
  var y = function(la){ return R * Math.log(Math.tan(PI/4 + la*PI/360)); };
  var la = function(Y){ return (2*Math.atan(Math.exp(Y/R)) - PI/2) * 180/PI; };
  var h = (wDeg * PI/180 * R) / 1.1372, Y = y(lat);
  return { w: lon - wDeg/2, e: lon + wDeg/2, s: la(Y - h/2), n: la(Y + h/2) };
}
var BOX3 = box(-119.05, 34.00, 4.4), BOX12 = box(-120.6, 34.3, 12.6), BOXSAT = box(-119.4, 33.9, 6.0);

var KSOX = [['ksox_sr_bref','REFLECTIVITY'], ['ksox_sr_bvel','VELOCITY'], ['ksox_bdhc','HYDRO'],
            ['ksox_boha','1-HR RAIN'], ['ksox_bdsa','STORM TOTAL']];
var MRMS = [['conus_bref_qcd','REFLECTIVITY'], ['conus_cref_qcd','COMPOSITE'],
            ['conus_neet_v18','ECHO TOPS'], ['conus_pcpn_typ','PRECIP TYPE']];
var SAT  = [['GOES-West_ABI_GeoColor','GEOCOLOR'], ['GOES-West_ABI_Band13_Clean_Infrared','INFRARED'],
            ['GOES-West_ABI_Band2_Red_Visible_1km','VISIBLE']];

var VIEWSET = {
  marine: { cap:true, label:'MARINE LAYER · GOES WEST', prods:SAT, box:BOXSAT,
            tag:'THE MARINE LAYER · GOES WEST', sub:'LOW CLOUD AGAINST THE COAST RANGES · LOOPING THE LAST HOUR · GOES ABI IS 2 KM, OR 1 KM ON VISIBLE',
            attrib:'NASA GIBS · NOAA GOES-West' },
  ksox:   { label:'KSOX SANTA ANA MTNS · NEXT HALF HOUR', prods:KSOX, sid:'ksox',
            tag:'KSOX · SANTA ANA MOUNTAINS', sub:'SUPER-RES, 60 KM FROM DOWNTOWN · LOOPING THE SWEEPS THE SERVICE HOLDS',
            attrib:'NOAA KSOX super-res' },
  mrms3:  { label:'MRMS · NEXT 3 HOURS', prods:MRMS, sid:'conus', box:BOX3,
            tag:'MRMS MOSAIC · NEXT 3 HOURS', sub:'THE BIGHT AND THE CHANNEL ISLANDS · WHAT IS ABOUT TO ARRIVE OFF THE PACIFIC',
            attrib:'NOAA MRMS' },
  mrms12: { label:'MRMS · NEXT 12 HOURS', prods:MRMS, sid:'conus', box:BOX12,
            tag:'MRMS MOSAIC · NEXT 12 HOURS', sub:'SAN FRANCISCO TO BAJA, OUT TO 127° W',
            attrib:'NOAA MRMS' },
  map:    { label:'CITY MAP', layers:true, attrib:'' }
};
var ORDER = ['ksox', 'mrms3', 'mrms12', 'map'];
var st = { view:'map', prod:{}, geo:false, traffic:false, surf:false, swellDir:null, rail:true, marine:false };

function send(){
  /* every view but the map is a fixed frame, as in the widget: no pan, no zoom */
  var v = VIEWSET[st.view], m = { view:'la', geo: st.view === 'map' && st.geo, lock: st.view !== 'map', traffic: st.view === 'map' && st.traffic, surf: st.view === 'map' && st.surf, swellDir: (st.view === 'map' && st.surf) ? st.swellDir : null, rail: st.rail,
      /* the cloud under the sweep, on the radar views only -- the marine view IS the cloud */
      satUnder: st.marine && !!v.sid, satLayer: st.prod.marine || SAT[0][0] };
  if (v.box) m.box = v.box;
  if (v.prods === SAT) m.sat = st.prod[st.view] || SAT[0][0];
  else if (v.prods){ m.radar = true; m.radarSid = v.sid; m.radarLayer = st.prod[st.view] || v.prods[0][0]; }
  document.getElementById('lab').contentWindow.postMessage({ lab:m }, '*');
}
/* THE READING LINE: what the lab's weather reads say, in words. The numbers are the
   MODEL'S (Open-Meteo), posted up from the map frame, and the line says so. In the widget
   the storm motion is measured off the radar loop; the steering wind is its fallback. */
var READS = null, FRONTS = null;
window.addEventListener('message', function(ev){
  if (ev.data && ev.data.labReads){ READS = ev.data.labReads; paint(); }
  if (ev.data && ev.data.labFronts){ FRONTS = ev.data.labFronts; paint(); }
});
function readsLine(v){
  var R = READS; if (!R || !v.prods) return '';
  var lax = R.pt.lax, sea = R.pt.sea, tej = R.pt.tej, out = [];
  if (v.prods === SAT){
    if (R.sst) out.push('SEA ' + Math.round(R.sst.cool) + '°F OFF POINT CONCEPTION · ' + Math.round(R.sst.warm) + '°F IN THE BIGHT');
    var d = lax.temperature_925hPa - lax.temperature_2m;
    out.push('OVER LAX THE AIR AT 925 MB IS ' + Math.abs(d).toFixed(0) + '°F ' + (d >= 0 ? 'WARMER' : 'COOLER') + ' THAN THE SURFACE'
           + (d >= 3 ? ' · A LID ON THE MARINE LAYER' : ''));
  } else {
    /* a weak flow is said out loud: under 10 kt a storm's own growth moves it as much as the
       wind does, and the clocks on the arcs are loose */
    out.push('ARRIVAL TIMES ARE FOR SANTA MONICA');
    out.push(R.steer.kt < 4 ? 'STEERING FLOW NEARLY CALM · NO ARCS' :
      'STEERING FLOW FROM ' + Math.round(R.steer.from) + '° AT ' + Math.round(R.steer.kt) + ' KT (700 MB)'
      + (R.steer.kt < 10 ? ' · WEAK, SO THE CLOCKS ARE LOOSE' : ''));
    out.push('LAX ' + Math.abs(R.grad).toFixed(1) + ' MB ' + (R.grad >= 0 ? 'ABOVE' : 'BELOW') + ' DAGGETT · '
           + (R.santaAna ? 'SANTA ANA BLOWING' : R.grad >= 0 ? 'ONSHORE' : 'OFFSHORE, NOT YET A SANTA ANA'));
    out.push('WATER IN THE AIR OFFSHORE ' + (sea.total_column_integrated_water_vapour / 25.4).toFixed(1) + ' IN');
    out.push('FREEZING LEVEL ' + (Math.round(tej.freezing_level_height * 3.281 / 100) * 100).toLocaleString() + ' FT AT THE GRAPEVINE');
  }
  /* the fronts are the forecasters' own analysis, not the model: said apart, with its hour */
  var fr = '';
  if (FRONTS && FRONTS.at && v.prods !== SAT){
    var t = new Intl.DateTimeFormat('en-US', { timeZone:'America/Los_Angeles', hour:'numeric', minute:'2-digit' }).format(new Date(FRONTS.at));
    var nf = FRONTS.n, nt = FRONTS.trof;
    fr = ' &nbsp;·&nbsp; FRONTS: NWS ANALYSIS OF ' + t + ' · '
       + (nf || nt ? (nf ? nf + (nf === 1 ? ' FRONT' : ' FRONTS') : 'NO FRONT') + (nt ? ' AND ' + nt + (nt === 1 ? ' TROUGH' : ' TROUGHS') : '') + ' IN FRAME'
                   : 'NOTHING IN FRAME')
       + (FRONTS.progs ? ' · DASHED = THE FORECASTERS\u2019 OWN POSITIONS' : '');
  }
  return out.join(' &nbsp;·&nbsp; ') + ' &nbsp;·&nbsp; MODEL READS' + fr;
}
/* THE ROCK AND THE FAULTS, READ OUT -- New York's cwRockTap grammar: a colour chip, ROCK and the
   unit's name, its age, the source; then MADE OF, FORMED, SURVEY, each under a small grey label.
   WHICH MAP SPEAKS. Macrostrat answers every point from several maps at once. Here (checked at
   downtown, Griffith Park, Mt Wilson and Palos Verdes) they are: the USGS 30x60-minute
   quadrangles -- sources other than 7 / 133 / 154, e.g. 112 Los Angeles, 116 Long Beach -- which
   name real units ("Tonalite (Wilson Diorite)", "Old shallow marine deposits on wave-cut
   surface"); 133, the California state map; and 7 / 154, continental maps that only say
   "Quaternary sedimentary". The finest map is the readout; the state map's unit follows as one
   line of context; the continental ones are dropped as noise. (In New York 133 was the fine
   one -- the ranking is by what the map IS here, not by its number.)
   A FAULT is USGS Qfaults: its name and section, when it last moved (the survey's age class,
   spelt out in years), how fast it slips, which way, and how well the trace is located. */
var ROCK = null, ROCKSEQ = 0;
/* WHAT THE GROUND DOES IN A QUAKE. Two numbers, and they answer different questions.
   Vs30 is how fast a shear wave travels through the top 30 m: slow ground is soft ground,
   and soft ground amplifies. The NEHRP class is the building code's name for that band.
   MMI is the hazard itself -- the shaking to expect at 2% in 50 years, a 1-in-2,475-year
   quake -- and across this basin it barely moves, which is the point: all of Los Angeles
   is in the top bracket. */
var NEHRP = { 'E': ['SOFT SOIL', 'THE SOFTEST GROUND THERE IS \u00b7 IT AMPLIFIES SHAKING MOST'],
              'D': ['STIFF SOIL', 'BASIN FILL \u00b7 IT AMPLIFIES SHAKING'],
              'C': ['DENSE SOIL OR SOFT ROCK', 'FIRM GROUND'],
              'B': ['ROCK', 'HARD GROUND \u00b7 IT SHAKES LEAST'] };
var MMI_WORDS = { 7:'VERY STRONG', 8:'SEVERE', 9:'VIOLENT', 10:'EXTREME' };
var ROMAN = { 7:'VII', 8:'VIII', 9:'IX', 10:'X', 11:'XI' };
function shakeLines(sh, lab){
  if (!sh) return [];
  var out = [], n = NEHRP[sh.cls];
  if (n) out.push(lab('GROUND') + n[0] + ' \u00b7 ' + Math.round(sh.vs30) + ' M/S \u00b7 ' + n[1]);
  if (sh.mmi != null){
    var r = Math.round(sh.mmi);
    out.push(lab('EXPECTED SHAKING') + (ROMAN[r] || r) + ' \u00b7 ' + (MMI_WORDS[r] || '') + ' \u00b7 AT 2% IN 50 YEARS');
  }
  return out;
}
function whenWords(t){
  var d = (Date.now() - t) / 1000;
  if (d < 3600) return Math.max(1, Math.round(d / 60)) + ' MIN AGO';
  if (d < 86400) return Math.round(d / 3600) + ' H AGO';
  if (d < 86400 * 60) return Math.round(d / 86400) + ' DAYS AGO';
  return new Date(t).getFullYear();
}
var FAULT_AGE_WORDS = { 'historic': 'IN HISTORIC TIME \u00b7 THE LAST 150 YEARS',
  'latest Quaternary': 'WITHIN 15,000 YEARS', 'late Quaternary': 'WITHIN 130,000 YEARS',
  'undifferentiated Quaternary': 'WITHIN 1.6 MILLION YEARS', 'pre-Quaternary': 'NOT SINCE THE QUATERNARY' };
/* the survey's own word for how the line was arrived at, which is what the dash means */
var FAULT_TRACE_WORDS = { 'Well Constrained': 'WELL CONSTRAINED', 'Moderately Constrained': 'MODERATELY CONSTRAINED',
  'Inferred': 'INFERRED \u00b7 DRAWN DASHED', 'Concealed': 'CONCEALED UNDER YOUNGER GROUND \u00b7 DRAWN DASHED',
  'Accurately Located': 'ACCURATELY LOCATED', 'Approximately Located': 'APPROXIMATELY LOCATED \u00b7 DRAWN DASHED' };
window.addEventListener('message', function(ev){
  if (ev.data && ev.data.labFault){ ROCKSEQ++; ROCK = { fault: ev.data.labFault }; paint(); }
  if (ev.data && ev.data.labQuake){ ROCKSEQ++; ROCK = { quake: ev.data.labQuake }; paint(); }
  if (ev.data && ev.data.labRock){
    var q = ev.data.labRock, seq = ++ROCKSEQ;
    ROCK = { loading: q }; paint();
    fetch('https://macrostrat.org/api/v2/geologic_units/map?lat=' + q.lat.toFixed(5) + '&lng=' + q.lon.toFixed(5) + '&format=json')
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if (seq !== ROCKSEQ) return; ROCK = { at: q, units: ((j && j.success && j.success.data) || []) }; paint(); })
      .catch(function(){ if (seq === ROCKSEQ){ ROCK = { at: q, units: [], failed: true }; paint(); } });
  }
});
function rockBand(){
  var esc = function(t){ return String(t == null ? '' : t).replace(/[&<>]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]; }); };
  var X = '<button id="cw-la-rx" style="position:absolute;right:0;top:-2px;background:none;border:none;font:700 13px system-ui,sans-serif;color:#1b2340;cursor:pointer;padding:0 2px;">\u2715</button>';
  var tag = function(t){ return '<span style="font:600 8px system-ui,sans-serif;color:#5b647a;letter-spacing:.08em;white-space:nowrap;">' + t + '</span>'; };
  var lab = function(t){ return '<span style="font:800 7px system-ui,sans-serif;letter-spacing:.1em;color:#8a91a5;margin-right:6px;">' + t + '</span>'; };
  var head = function(inner){ return '<div style="position:relative;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;">' + inner + X + '</div>'; };
  var line = function(style, inner){ return '<div style="text-align:center;letter-spacing:0;' + style + '">' + inner + '</div>'; };
  var big = function(t){ return '<span style="font:800 12px system-ui,sans-serif;letter-spacing:.03em;">' + esc(t).toUpperCase() + '</span>'; };
  if (ROCK.loading) return head(tag('READING THE ROCK AT ' + ROCK.loading.lat.toFixed(4) + ', ' + ROCK.loading.lon.toFixed(4) + '\u2026'));
  if (ROCK.fault){
    var f = ROCK.fault, sec = f.section && f.section !== f.name ? f.section : '';
    var rate = f.slip_rate && !/unspecified/i.test(f.slip_rate) ? String(f.slip_rate).replace(/^Between /i, '').replace(/ and /i, ' TO ').toUpperCase() : '';
    var sense = f.sense && !/unspecified/i.test(f.sense) && f.sense.length > 3 ? f.sense.toUpperCase() : '';
    var soft = /Inferred|Concealed|Approximate/i.test(f.trace || '') || /Poor/i.test(f.certainty || '');
    var how = FAULT_TRACE_WORDS[f.trace] || (soft ? 'INFERRED OR POORLY LOCATED \u00b7 DRAWN DASHED' : 'WELL LOCATED');
    if (f.scale) how += ' \u00b7 MAPPED AT ' + esc(f.scale);
    if (/Poor/i.test(f.certainty || '')) how += ' \u00b7 POSITION POORLY KNOWN';
    return head('<span style="display:inline-block;width:18px;height:0;border-top:3px ' + (soft ? 'dashed' : 'solid') + ' #B4231F;"></span>'
        + '<span style="font:800 7px system-ui,sans-serif;letter-spacing:.1em;color:#5b647a;">FAULT</span>' + big(f.name || 'UNNAMED FAULT') + tag('USGS QUATERNARY FAULTS'))
      + (sec ? line('font:700 10px system-ui,sans-serif;margin-top:3px;', lab('SECTION') + esc(sec)) : '')
      + line('font:600 9.5px system-ui,sans-serif;color:#3b4460;margin-top:3px;line-height:1.5;',
          [FAULT_AGE_WORDS[f.age] ? lab('LAST MOVED') + FAULT_AGE_WORDS[f.age] : '', rate ? lab('SLIPS') + esc(rate) : '', sense ? lab('MOTION') + esc(sense) : '',
           lab('TRACE') + how].filter(Boolean).join(' &nbsp;\u00b7&nbsp; '));
  }
  if (ROCK.quake){
    var k = ROCK.quake, when = whenWords(k.time), dt = new Date(k.time);
    var qc = k.mag >= 7 ? '#7f1d1d' : k.mag >= 6.5 ? '#dc2626' : k.mag >= 5.5 ? '#ef4444' : k.mag >= 4.5 ? '#f97316'

    if (!isNaN(t)) cols.push(col('SINCE', new Intl.DateTimeFormat('en-US', { timeZone:'America/Los_Angeles', weekday:'short', hour:'numeric', minute:'2-digit' }).format(t).toUpperCase()));
  }
  return '<div class="tb" style="--n:' + Math.max(1, cols.length) + ';"><div class="st">'
    + '<div style="font:800 13px system-ui,sans-serif;letter-spacing:.03em;">' + esc(d.kind) + (d.roads ? ' &nbsp;<span style="font-weight:700;color:#5b647a;">' + esc(d.roads) + '</span>' : '') + '</div>'
    + (d.what && d.what.toUpperCase() !== d.kind ? '<div style="font:600 9px system-ui,sans-serif;color:#1b2340;letter-spacing:.04em;margin-top:4px;">' + esc(d.what).toUpperCase() + '</div>' : '')
    + '<div style="font:600 8px system-ui,sans-serif;color:#5b647a;letter-spacing:.08em;margin-top:5px;">LIVE · ' + esc(d.source).toUpperCase() + '</div></div>'
    + (cols.join('') || '<div class="dir solo"></div>')
    + '<button id="cw-la-ix" style="position:absolute;right:-4px;top:-4px;background:none;border:none;font:700 13px system-ui,sans-serif;color:#1b2340;cursor:pointer;padding:0 2px;">✕</button></div>';
}
/* THE TRAIN BOARD, in the info bar as New York's is: a station's next departures by line and
   direction. 17th Street / SMC is the default (user); tap any station on the map for its own.
   New York's board is live. This one is Metro's PUBLISHED TIMETABLE and says so on its face:
   Metro's one remaining realtime route (api.metro.net .../trip_detail/route_code/<n>) returned
   an empty list for every line when this was built. It is asked first every time, and the day
   it answers with trains this board should be rebuilt on it -- until then a scheduled time is
   never dressed up as a live one. */
var SCHED = null, STATION = { id:'80138S', name:'17th Street / SMC', routes:['E'], kind:'metro' }, LIVE = null;   // = DEFAULT_STATION
var LINE_COL = { A:'#0072BC', B:'#EB131B', C:'#58A738', D:'#A05DA5', E:'#FDB913', K:'#E56DB1' };
fetch('rail_sched.json').then(function(r){ return r.json(); }).then(function(j){ SCHED = j; paint(); }).catch(function(){});
fetch('https://api.metro.net/LACMTA_Rail/trip_detail/route_code/804').then(function(r){ return r.json(); })
  .then(function(j){ LIVE = Array.isArray(j) && j.length ? j.length : 0; paint(); }).catch(function(){ LIVE = null; });
window.addEventListener('message', function(ev){
  if (ev.data && ev.data.labStation){ STATION = ev.data.labStation; INCIDENT = null; paint(); }
});
function laNow(){
  /* the clock on the platform: Los Angeles time, whatever the reader's is */
  var p = {}; new Intl.DateTimeFormat('en-US', { timeZone:'America/Los_Angeles', weekday:'short', hour:'numeric', minute:'numeric', hourCycle:'h23' })
    .formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
  var ymd = function(t){ return new Intl.DateTimeFormat('en-CA', { timeZone:'America/Los_Angeles' }).format(t).replace(/-/g, ''); };
  return { min: (+p.hour % 24) * 60 + (+p.minute), today: ymd(new Date()), yday: ymd(new Date(Date.now() - 864e5)) };
}
function clock(min){ var h = Math.floor(min / 60) % 24, m = min % 60; return (h % 12 || 12) + ':' + ('0' + m).slice(-2) + (h < 12 ? ' AM' : ' PM'); }
/* THE LAYOUT IS NEW YORK'S (index.html, mtaPanelRender), centred (user 2026-09-19: "visualize
   the train times better like NYC ... center and match its layout"): a header row -- the
   station, its lines as bullets, a small grey tag saying where the times come from, a close
   -- then the direction groups SIDE BY SIDE, each a small grey label over a bullet and its
   clock times, bars between, NOW in green, no AM/PM inside the hour. New York's tag reads
   LIVE · MTA; this one reads TIMETABLE, because that is what it is. Four groups at most, the
   soonest first ("you dont need to show them all"). */
var DEFAULT_STATION = { id:'80138S', name:'17th Street / SMC', routes:['E'], kind:'metro' };
var DARK_TEXT = { E:1 };                       // the E Line's gold wants dark lettering, as New York's yellows do
function bullet(rt, px){
  px = px || 17;
  var col = LINE_COL[rt] || '#5b647a', wide = rt.length > 1;
  return '<span style="display:inline-flex;align-items:center;justify-content:center;min-width:' + px + 'px;height:' + px + 'px;'
    + 'border-radius:' + (wide ? Math.round(px / 2) + 'px' : '50%') + ';padding:0 ' + (wide ? '5px' : '0') + ';'
    + 'background:' + col + ';color:' + (DARK_TEXT[rt] ? '#1b2340' : '#fff') + ';vertical-align:middle;'
    + 'font:700 ' + Math.round(px * 0.59) + 'px system-ui,sans-serif;letter-spacing:0;flex-shrink:0;">' + rt + '</span>';
}
function board(){
  /* ONE BAND ACROSS THE WHOLE BAR (user 2026-09-19: "use the space better"). The first cut
     stacked four short rows in the middle of a 1,150 px bar and left both sides empty. Now the
     station is the first column and every direction is a column of its own, equal widths, so
     the board spans the bar and is two rows tall instead of four. The source note rides under
     the station name rather than taking a row. A station with few directions has room, so it
     shows MORE trains (six, across ninety minutes) rather than more air. */
  var sd = SCHED && SCHED[STATION.id], isDefault = STATION.id === DEFAULT_STATION.id;
  var lines = (STATION.routes || []).filter(function(r, k, a){ return a.indexOf(r) === k; });
  var station = function(sub){
    return '<div class="st">'
      + '<div style="display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;">'
      + '<span style="font:800 13px system-ui,sans-serif;letter-spacing:.03em;">' + STATION.name.toUpperCase() + '</span>'
      + '<span style="display:inline-flex;gap:3px;align-items:center;">' + lines.map(function(r){ return bullet(r); }).join('') + '</span></div>'
      + '<div style="font:600 8px system-ui,sans-serif;color:#5b647a;letter-spacing:.08em;margin-top:5px;">TIMETABLE · '
      + (STATION.kind === 'commuter' ? 'METROLINK' : 'LA METRO') + ' · SCHEDULED, NOT LIVE</div>'
      + '<div style="font:600 8px system-ui,sans-serif;color:#8a91a5;letter-spacing:.08em;margin-top:2px;">' + sub + '</div></div>';
  };
  var wrap = function(cols, inner){
    return '<div class="tb" style="--n:' + cols + ';">' + inner
      + (isDefault ? '' : '<button id="cw-la-x" style="position:absolute;right:-4px;top:-4px;background:none;border:none;font:700 13px system-ui,sans-serif;color:#1b2340;cursor:pointer;padding:0 2px;">✕</button>')
      + '</div>';
  };
  var lone = function(t){ return wrap(1, station('TAP A STATION ON THE MAP FOR ITS OWN') + '<div class="dir solo" style="font:600 10px system-ui,sans-serif;color:#5b647a;letter-spacing:0;">' + t + '</div>'); };
  if (!SCHED) return lone('READING THE TIMETABLE…');
  if (!sd) return lone('NO TIMETABLE FOR THIS STATION');
  /* the timetable is stored PER DATE (Metro's calendar changes daily); a date it does not
     hold means the bake has gone stale, and the board says that rather than guessing */
  var now = laNow(), of = function(r, ds){ var ix = r.d[ds]; return ix == null ? null : r.t[ix]; };
  if (!sd.rows.some(function(r){ return of(r, now.today); })) return lone('THE TIMETABLE ON FILE DOES NOT REACH TODAY · IT NEEDS RE-BAKING');
  var hm = function(min){ var h = Math.floor(min / 60) % 24; return (h % 12 || 12) + ':' + ('0' + (min % 60)).slice(-2); };
  var rows = sd.rows.map(function(r){
    /* today's service day, and the tail of yesterday's that runs past midnight */
    var t = (of(r, now.yday) || []).filter(function(x){ return x >= now.min + 1440; }).map(function(x){ return x - 1440; })
      .concat((of(r, now.today) || []).filter(function(x){ return x >= now.min; })).sort(function(a, b){ return a - b; });
    return t.length ? { r: r, t: t, wait: t[0] - now.min } : null;
  }).filter(Boolean).sort(function(a, b){ return a.wait - b.wait; });
  if (!rows.length) return lone('NO MORE TRAINS TONIGHT ON THE TIMETABLE');
  var shown = rows.slice(0, 4), more = rows.length - shown.length, roomy = shown.length <= 2;
  var cols = shown.map(function(o){
    var soon = o.t.filter(function(x){ return x - now.min <= (roomy ? 90 : 60); }).slice(0, roomy ? 6 : 4);
    var times = soon.length
      ? soon.map(function(x){ return x - now.min < 1 ? '<span style="color:#65a30d;">NOW</span>' : hm(x); }).join('<span style="opacity:.4;"> | </span>')
      : '<span style="color:#5b647a;font-weight:600;">FIRST TRAIN ' + clock(o.t[0]) + '</span>';
    return '<div class="dir' + (shown.length === 1 ? ' solo' : '') + '">'
      + '<div style="font:700 8px system-ui,sans-serif;color:#8a91a5;letter-spacing:.1em;margin-bottom:4px;">TO ' + o.r.h.toUpperCase() + '</div>'
      + '<div style="display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;">' + bullet(o.r.r)
      + '<span style="font:600 12.5px system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:0;">' + times + '</span></div></div>';
  }).join('');
  return wrap(shown.length, station((more > 0 ? more + ' MORE DIRECTION' + (more > 1 ? 'S' : '') + ' HERE · ' : '') + 'TAP A STATION ON THE MAP FOR ITS OWN') + cols);
}
setInterval(function(){ if (st.view === 'map' && !st.geo) paint(); }, 30000);
function chip(r, c){ return '<span class="chip" style="background:' + c + '">' + r + '</span>'; }
function paint(){
  var v = VIEWSET[st.view];
  Object.keys(VIEWSET).forEach(function(k){
    document.getElementById('t-' + k).className = 'tab' + (VIEWSET[k].cap ? ' wide' : '') + (k === st.view ? ' lit' : '');
  });
  var row = document.getElementById('cw-tabs-prod'); row.innerHTML = '';
  var add = function(txt, lit, fn){
    var b = document.createElement('button'); b.className = 'tab' + (lit ? ' lit' : ''); b.textContent = txt;
    b.onclick = fn; row.appendChild(b);
  };
  if (v.prods) v.prods.forEach(function(p, i){
    var cur = st.prod[st.view] || v.prods[0][0];
    add(p[1], cur === p[0], function(){ st.prod[st.view] = p[0]; paint(); send(); });
  });
  else {
    /* the map's own layers, as New York's row is FLOODING / TREES / GEOLOGY */
    add('TRAFFIC', st.traffic, function(){ st.traffic = !st.traffic; if (st.traffic){ st.geo = false; st.surf = false; } INCIDENT = null; paint(); send(); });
    add('SURF', st.surf, function(){ st.surf = !st.surf; SURFTAP = null; st.swellDir = null; if (st.surf){ st.geo = false; st.traffic = false; INCIDENT = null; ROCK = null; } paint(); send(); });
    add('GEOLOGY', st.geo, function(){ st.geo = !st.geo; ROCK = null; if (st.geo){ st.surf = false; st.traffic = false; INCIDENT = null; } paint(); send(); });   // the rock stands alone
  }

  var info = document.getElementById('cw-info'), tag = document.getElementById('cw-wide-tag');
  if (v.layers){
    tag.style.display = 'none'; info.style.display = '';
    info.innerHTML = st.surf ? surfBand() + swellDial() : st.geo && ROCK ? rockBand() : st.geo
      ? '<b>THE ROCK UNDER THE BASIN</b> &nbsp;·&nbsp; Macrostrat units, with USGS Quaternary faults: heaviest where the ground has broken in historic time, dashed where the survey infers the trace. Hatched where the ground is soft enough to amplify shaking. Every earthquake USGS has logged in the last 24 hours gets its diamond, from the same feed and in the same hand as the EARTHQUAKES widget. A quiet day is a quiet map. The basin&rsquo;s destructive ones &mdash; Northridge 1994, Sylmar 1971, Long Beach 1933 &mdash; are in the record, not on this map. Tap any of it.'
      : ((st.traffic && INCIDENT ? incidentBand() : board() + (st.traffic ? trafficLine() : ''))
         + (st.traffic ? railToggle() : ''));
  } else {
    info.style.display = 'none'; tag.style.display = '';
    var cur = (v.prods.filter(function(p){ return p[0] === (st.prod[st.view] || v.prods[0][0]); })[0] || v.prods[0])[1];
    document.getElementById('cw-wide-tag-main').textContent = v.tag + ' · ' + cur;
    /* THE MARINE LAYER UNDER THE RADAR, offered on the three radar views (user: "is there a
       way to bring that view into the NEXT HALF HOUR / 3HR / 12HR"). Not on the marine view,
       where it would be the picture under itself. */
    document.getElementById('cw-wide-tag-sub').innerHTML = v.sub   /* our own constant, no markup in it */
      + (v.sid ? ' &nbsp;<button onclick="toggleMarine()" style="cursor:pointer;vertical-align:middle;'
          + 'font:800 8px system-ui,sans-serif;letter-spacing:.09em;padding:3px 9px;border-radius:11px;'
          + (st.marine ? 'background:#fff;color:#C2410C;border:1px solid #fff;'
                       : 'background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.5);')
          + '">MARINE LAYER ' + (st.marine ? 'ON' : 'OFF') + '</button>' : '');
    document.getElementById('cw-wide-tag-info').innerHTML = readsLine(v);
    document.getElementById('cw-wide-tag-info').style.display = READS ? 'block' : 'none';
  }
  [].slice.call(document.querySelectorAll('[data-swell]')).forEach(function(b){
    b.onclick = function(){ var v = b.getAttribute('data-swell'); st.swellDir = v === '' ? null : +v; SURFTAP = null; paint(); send(); };
  });
  var sxb = document.getElementById('cw-la-sx');
  if (sxb) sxb.onclick = function(){ SURFTAP = null; paint(); };
  var rxb = document.getElementById('cw-la-rx');
  if (rxb) rxb.onclick = function(){ ROCK = null; ROCKSEQ++; paint(); };
  var ixb = document.getElementById('cw-la-ix');
  if (ixb) ixb.onclick = function(){ INCIDENT = null; paint(); };
  var xb = document.getElementById('cw-la-x');
  if (xb) xb.onclick = function(){ STATION = DEFAULT_STATION; paint(); };
  /* the buttons belong to the map: a fixed frame has nothing to zoom */
  document.getElementById('cw-zoom').style.display = v.prods ? 'none' : 'flex';
  document.getElementById('cw-time').textContent = v.prods ? 'LATEST FRAME' : '';
  document.getElementById('cw-time').style.display = v.prods ? '' : 'none';
  document.getElementById('cw-attrib').textContent = '© OpenStreetMap · Protomaps · USGS 3DEP · NOAA NCEI · LA Metro · Metrolink'
    + (v.attrib ? ' · ' + v.attrib : '') + (st.view === 'map' && st.geo ? ' · Macrostrat · USGS Qfaults' : '')
    + (st.view === 'map' && st.traffic ? ' · © TomTom · Caltrans' : '')
    + (st.view === 'map' && st.surf ? ' · NOAA NDBC · Scripps CDIP · NOAA CO-OPS · NWS' : '');
}
[].slice.call(document.querySelectorAll('#cw-zoom button')).forEach(function(b){
  b.onclick = function(){ document.getElementById('lab').contentWindow.postMessage({ labZoom: +b.getAttribute('data-zoom') }, '*'); };
});
function tab(k){
  var b = document.createElement('button'); b.id = 't-' + k; b.textContent = VIEWSET[k].label;
  /* tapping the lit view returns to the bare map, as it does in New York */
  b.onclick = function(){ st.view = (st.view === k && k !== 'map') ? 'map' : k; paint(); send(); };
  return b;
}
document.getElementById('cw-tabs-cap').appendChild(tab('marine'));
ORDER.forEach(function(k){ document.getElementById('cw-tabs').appendChild(tab(k)); });
paint();
</script>
