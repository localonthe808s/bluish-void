<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE BASIN · widget preview</title>
<!-- THE LOS ANGELES WIDGET, IN ITS CHROME (2026-09-19, user: "make the lab look like what
     the widget will look like so all the tabs exist in place").

     The control block below is THE CITY widget's, style for style: the frosted rows, the
     orange tabs that turn the site's blue when lit, the grey info bar, the orange reading
     strip flush on the map, the 1.1405 body with its squared top and rounded bottom, the
     time chip and the attribution. Row for row it maps onto New York's:

         cap    FALL FOLIAGE                  ->  MARINE LAYER · GOES WEST
         row 1  KOKX · NEXT HALF HOUR         ->  KSOX SANTA ANA MTNS · NEXT HALF HOUR
                MRMS · NEXT 3 HOURS / 12      ->  the same two, boxes centred west of LA
                CITY MAP                      ->  BASIN MAP
         row 2  the lit view's own products   ->  the same; the map's row is GEOLOGY only
                                                  (no FLOODING, no TREES -- user, for now)

     The map is the live lab in an iframe (../index.html?embed=1&view=la); the tabs drive
     it by postMessage and it still pans and zooms. WHAT IS A STILL HERE AND LIVE IN THE
     WIDGET: the radar and satellite are one frame, not a loop; there are no lead arcs,
     no strikes, no warnings, no arrivals board. The strips say so rather than inventing
     a storm motion or a minute count. -->
<style>
  @font-face{ font-family:"QelliaRegular"; src:url('../qellia.woff2') format('woff2'); font-display:block; }
  html,body{ margin:0; min-height:100%; }
  body{ font-family:system-ui,sans-serif; color:#1b2340;
        background:linear-gradient(160deg,#dfe6f7 0%,#cdd6f2 38%,#b9c6ee 70%,#a9b9ea 100%) fixed; }
  .wrap{ max-width:1180px; margin:0 auto; padding:18px 0 40px; }
  .note{ margin:0 14px 10px; font:500 11px/1.5 system-ui,sans-serif; color:rgba(27,35,64,.62); }
  .note b{ color:#2B22F4; letter-spacing:.12em; font-weight:900; font-size:10px; }
  .row{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin:0 14px; padding:5px 8px 0;
        background:rgba(255,255,255,.6); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  #cw-tabs-cap{ margin-top:8px; padding:6px 8px 0; border-radius:10px 10px 0 0; }
  #cw-tabs-prod{ padding:5px 8px 6px; }
  .tab{ flex:1 1 120px; padding:7px 12px; border-radius:7px; border:none; font:700 .62rem system-ui,sans-serif;
        letter-spacing:.5px; text-transform:uppercase; cursor:pointer; white-space:nowrap;
        background:rgba(234,88,12,.92); color:rgba(255,255,255,.97); }
  .tab.lit{ background:rgba(43,34,244,.9); }
  .tab.wide{ flex:1 1 100%; width:100%; }
  #cw-info{ margin:0 14px; padding:7px 12px 8px; background:rgba(255,255,255,.6); backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px); border-top:1px solid rgba(27,35,64,.10); color:#1b2340;
            min-height:2.2em; font:600 9px/1.7 system-ui,sans-serif; letter-spacing:.07em; }
  #cw-info b{ font-weight:800; }
  #cw-wide-tag{ margin:0 14px; padding:6px 12px; background:rgba(234,88,12,.95); color:#fff; letter-spacing:.08em;
                text-align:center; line-height:1.4; }
  #cw-wide-tag-main{ font:800 9px system-ui,sans-serif; letter-spacing:.08em; }
  #cw-wide-tag-sub{ font:700 8px system-ui,sans-serif; letter-spacing:.08em; color:rgba(255,255,255,.82); margin-left:10px; }
  #cw-wide-tag-info{ display:none; margin:5px 0 0; padding-top:5px; border-top:1px solid rgba(255,255,255,.25);
                     font:600 8.5px system-ui,sans-serif; letter-spacing:.07em; color:rgba(255,255,255,.9); line-height:1.65; }
  #cw-body{ position:relative; overflow:hidden; aspect-ratio:1100/967; border-radius:0 0 10px 10px; margin:0 14px 8px;
            background:#17457F; }
  #cw-body iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  #cw-time{ position:absolute; right:8px; top:6px; z-index:4; font:700 9px system-ui,sans-serif; letter-spacing:.08em;
            color:rgba(255,255,255,.9); background:rgba(8,12,22,.6); border-radius:6px; padding:3px 8px; pointer-events:none; }
  #cw-attrib{ position:absolute; right:8px; bottom:6px; z-index:4; font:500 8px system-ui,sans-serif; color:rgba(30,30,50,.6);
              background:rgba(255,255,255,.6); padding:1px 6px; border-radius:4px; pointer-events:none; }
  .chip{ display:inline-block; min-width:13px; height:13px; line-height:13px; border-radius:50%; color:#fff; text-align:center;
         font:800 8px system-ui,sans-serif; margin:0 1px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="note"><b>THE BASIN · WIDGET PREVIEW</b> &nbsp; the Los Angeles widget in THE CITY's chrome. BASIN MAP is the live lab:
    drag to pan, scroll or double-click to zoom. The radar and satellite views are fixed frames, single here and looping in the widget.</p>

  <div id="cw-tabs-cap" class="row"></div>
  <div id="cw-tabs" class="row"></div>
  <div id="cw-tabs-prod" class="row"></div>
  <div id="cw-info"></div>
  <div id="cw-wide-tag"><span id="cw-wide-tag-main"></span><span id="cw-wide-tag-sub"></span><span id="cw-wide-tag-info"></span></div>
  <div id="cw-body">
    <iframe id="lab" src="../index.html?embed=1&view=la" title="the basin map"></iframe>
    <div id="cw-time"></div>
    <div id="cw-attrib"></div>
  </div>
</div>

<script>
/* a wide box at the widget's aspect, from a centre and a width in degrees of longitude.
   Both wide views sit WEST of the city: Los Angeles' weather arrives off the Pacific, so a
   box centred on downtown would spend half its width on a desert the storms have not
   reached yet. */
function box(lon, lat, wDeg){
  var R = 6378137, PI = Math.PI;
  var y = function(la){ return R * Math.log(Math.tan(PI/4 + la*PI/360)); };
  var la = function(Y){ return (2*Math.atan(Math.exp(Y/R)) - PI/2) * 180/PI; };
  var h = (wDeg * PI/180 * R) / 1.1372, Y = y(lat);
  return { w: lon - wDeg/2, e: lon + wDeg/2, s: la(Y - h/2), n: la(Y + h/2) };
}
var BOX3 = box(-119.05, 34.00, 4.4), BOX12 = box(-121.2, 34.4, 15.5), BOXSAT = box(-119.4, 33.9, 6.0);

var KSOX = [['ksox_sr_bref','REFLECTIVITY'], ['ksox_sr_bvel','VELOCITY'], ['ksox_bdhc','HYDRO'],
            ['ksox_boha','1-HR RAIN'], ['ksox_bdsa','STORM TOTAL']];
var MRMS = [['conus_bref_qcd','REFLECTIVITY'], ['conus_cref_qcd','COMPOSITE'],
            ['conus_neet_v18','ECHO TOPS'], ['conus_pcpn_typ','PRECIP TYPE']];
var SAT  = [['GOES-West_ABI_GeoColor','GEOCOLOR'], ['GOES-West_ABI_Band13_Clean_Infrared','INFRARED'],
            ['GOES-West_ABI_Band2_Red_Visible_1km','VISIBLE']];

var VIEWSET = {
  marine: { cap:true, label:'MARINE LAYER · GOES WEST', prods:SAT, box:BOXSAT,
            tag:'THE MARINE LAYER · GOES WEST', sub:'LOW CLOUD AGAINST THE COAST RANGES · ONE FRAME HERE, A LOOP IN THE WIDGET',
            attrib:'NASA GIBS · NOAA GOES-West' },
  ksox:   { label:'KSOX SANTA ANA MTNS · NEXT HALF HOUR', prods:KSOX, sid:'ksox',
            tag:'KSOX · SANTA ANA MOUNTAINS', sub:'SUPER-RES, 60 KM FROM DOWNTOWN · ONE FRAME HERE, A LOOP WITH MEASURED MOTION IN THE WIDGET',
            attrib:'NOAA KSOX super-res' },
  mrms3:  { label:'MRMS · NEXT 3 HOURS', prods:MRMS, sid:'conus', box:BOX3,
            tag:'MRMS MOSAIC · NEXT 3 HOURS', sub:'THE BIGHT AND THE CHANNEL ISLANDS · WHAT IS ABOUT TO ARRIVE OFF THE PACIFIC',
            attrib:'NOAA MRMS' },
  mrms12: { label:'MRMS · NEXT 12 HOURS', prods:MRMS, sid:'conus', box:BOX12,
            tag:'MRMS MOSAIC · NEXT 12 HOURS', sub:'POINT CONCEPTION TO BAJA, OUT TO 130° W',
            attrib:'NOAA MRMS' },
  map:    { label:'BASIN MAP', layers:true, attrib:'' }
};
var ORDER = ['ksox', 'mrms3', 'mrms12', 'map'];
var st = { view:'map', prod:{}, geo:false };

function send(){
  /* every view but the map is a fixed frame, as in the widget: no pan, no zoom */
  var v = VIEWSET[st.view], m = { view:'la', geo: st.view === 'map' && st.geo, lock: st.view !== 'map' };
  if (v.box) m.box = v.box;
  if (v.prods === SAT) m.sat = st.prod[st.view] || SAT[0][0];
  else if (v.prods){ m.radar = true; m.radarSid = v.sid; m.radarLayer = st.prod[st.view] || v.prods[0][0]; }
  document.getElementById('lab').contentWindow.postMessage({ lab:m }, '*');
}
/* THE READING LINE: what the lab's weather reads say, in words. The numbers are the
   MODEL'S (Open-Meteo), posted up from the map frame, and the line says so. In the widget
   the storm motion is measured off the radar loop; the steering wind is its fallback. */
var READS = null;
window.addEventListener('message', function(ev){
  if (ev.data && ev.data.labReads){ READS = ev.data.labReads; paint(); }
});
function readsLine(v){
  var R = READS; if (!R || !v.prods) return '';
  var lax = R.pt.lax, sea = R.pt.sea, tej = R.pt.tej, out = [];
  if (v.prods === SAT){
    if (R.sst) out.push('SEA ' + Math.round(R.sst.cool) + '°F OFF POINT CONCEPTION · ' + Math.round(R.sst.warm) + '°F IN THE BIGHT');
    var d = lax.temperature_925hPa - lax.temperature_2m;
    out.push('OVER LAX THE AIR AT 925 MB IS ' + Math.abs(d).toFixed(0) + '°F ' + (d >= 0 ? 'WARMER' : 'COOLER') + ' THAN THE SURFACE'
           + (d >= 3 ? ' · A LID ON THE MARINE LAYER' : ''));
  } else {
    out.push(R.steer.kt < 4 ? 'STEERING FLOW NEARLY CALM · NO ARCS' :
      'STEERING FLOW FROM ' + Math.round(R.steer.from) + '° AT ' + Math.round(R.steer.kt) + ' KT (700 MB)');
    out.push('LAX ' + Math.abs(R.grad).toFixed(1) + ' MB ' + (R.grad >= 0 ? 'ABOVE' : 'BELOW') + ' DAGGETT · '
           + (R.santaAna ? 'SANTA ANA BLOWING' : R.grad >= 0 ? 'ONSHORE' : 'OFFSHORE, NOT YET A SANTA ANA'));
    out.push('WATER IN THE AIR OFFSHORE ' + (sea.total_column_integrated_water_vapour / 25.4).toFixed(1) + ' IN');
    out.push('FREEZING LEVEL ' + (Math.round(tej.freezing_level_height * 3.281 / 100) * 100).toLocaleString() + ' FT AT THE GRAPEVINE');
  }
  return out.join(' &nbsp;·&nbsp; ') + ' &nbsp;·&nbsp; MODEL READS';
}
function chip(r, c){ return '<span class="chip" style="background:' + c + '">' + r + '</span>'; }
function paint(){
  var v = VIEWSET[st.view];
  Object.keys(VIEWSET).forEach(function(k){
    document.getElementById('t-' + k).className = 'tab' + (VIEWSET[k].cap ? ' wide' : '') + (k === st.view ? ' lit' : '');
  });
  var row = document.getElementById('cw-tabs-prod'); row.innerHTML = '';
  var add = function(txt, lit, fn){
    var b = document.createElement('button'); b.className = 'tab' + (lit ? ' lit' : ''); b.textContent = txt;
    b.onclick = fn; row.appendChild(b);
  };
  if (v.prods) v.prods.forEach(function(p, i){
    var cur = st.prod[st.view] || v.prods[0][0];
    add(p[1], cur === p[0], function(){ st.prod[st.view] = p[0]; paint(); send(); });
  });
  else add('GEOLOGY', st.geo, function(){ st.geo = !st.geo; paint(); send(); });

  var info = document.getElementById('cw-info'), tag = document.getElementById('cw-wide-tag');
  if (v.layers){
    tag.style.display = 'none'; info.style.display = '';
    info.innerHTML = st.geo
      ? '<b>THE ROCK UNDER THE BASIN</b> &nbsp;·&nbsp; Macrostrat units, with USGS Quaternary faults: heaviest where the ground has broken in historic time, dashed where the survey infers the trace. In the widget a tap names the unit and its age.'
      : '<b>THE BASIN</b> &nbsp;·&nbsp; METRO RAIL ' + chip('A','#0072BC') + chip('B','#EB131B') + chip('C','#58A738') + chip('D','#A05DA5') + chip('E','#FDB913') + chip('K','#E56DB1')
        + ' &nbsp;·&nbsp; METROLINK, DRAWN LIGHTER &nbsp;·&nbsp; zoom in for stations and neighbourhoods. In the widget a tapped station reads its arrivals here.';
  } else {
    info.style.display = 'none'; tag.style.display = '';
    var cur = (v.prods.filter(function(p){ return p[0] === (st.prod[st.view] || v.prods[0][0]); })[0] || v.prods[0])[1];
    document.getElementById('cw-wide-tag-main').textContent = v.tag + ' · ' + cur;
    document.getElementById('cw-wide-tag-sub').textContent = v.sub;
    document.getElementById('cw-wide-tag-info').innerHTML = readsLine(v);
    document.getElementById('cw-wide-tag-info').style.display = READS ? 'block' : 'none';
  }
  document.getElementById('cw-time').textContent = v.prods ? 'LATEST FRAME' : '';
  document.getElementById('cw-time').style.display = v.prods ? '' : 'none';
  document.getElementById('cw-attrib').textContent = '© OpenStreetMap · Protomaps · USGS 3DEP · NOAA NCEI · LA Metro · Metrolink'
    + (v.attrib ? ' · ' + v.attrib : '') + (st.view === 'map' && st.geo ? ' · Macrostrat · USGS Qfaults' : '');
}
function tab(k){
  var b = document.createElement('button'); b.id = 't-' + k; b.textContent = VIEWSET[k].label;
  /* tapping the lit view returns to the bare map, as it does in New York */
  b.onclick = function(){ st.view = (st.view === k && k !== 'map') ? 'map' : k; paint(); send(); };
  return b;
}
document.getElementById('cw-tabs-cap').appendChild(tab('marine'));
ORDER.forEach(function(k){ document.getElementById('cw-tabs').appendChild(tab(k)); });
paint();
</script>
</body>
</html>
