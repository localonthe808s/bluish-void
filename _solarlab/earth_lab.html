<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EARTH VIEW — lab</title>
<style>
  /* LAB ONLY — a mock of an EARTH VIEW tab for the BEHIND THE BLUE widget.
     Geocentric top-down stage: the real Moon and Sun (same Schlyter/J2000
     core the solar map uses via _planetcore.js), the HYG starfield behind,
     and the near-Earth neighbourhood on log-compressed distance rings.
     Present through earthview_preview.html for the full widget chrome. */
  @font-face{
    font-family:"QelliaRegular";
    src:url('https://cdn.bluishvoid.com/qellia.woff2?v=1') format('woff2');
    font-display:swap;
  }
  :root{ --ink:#2B22F4; --ink-dim:rgba(43,34,244,.55); }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    display:flex;flex-direction:column;height:100%;
    background:#070d1d;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #stage{flex:1;min-height:0;position:relative;}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #map text{font-family:'QelliaRegular','Bodoni Moda',Georgia,serif;}
  #map text.data{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}

  /* ── footer HUD: same white in-flow strip idiom as the solar lab ── */
  #hud{
    flex:0 0 auto;background:#fff;color:var(--ink);
    padding:9px 14px 11px;display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  #hud-controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .pill{
    border:1px solid rgba(43,34,244,.22);border-radius:999px;background:rgba(43,34,244,.05);
    color:var(--ink);font-size:.62rem;font-weight:800;letter-spacing:.08em;
    padding:6px 13px;text-transform:uppercase;white-space:nowrap;
  }
  button.pill{cursor:pointer;font-family:inherit;}
  button.pill:hover{background:rgba(43,34,244,.11);}
  #btn-play{background:#2f9e44;border-color:#2f9e44;color:#fff;padding:6px 17px;}
  #btn-play:hover{background:#37a84d;}
  #readout{font-size:.78rem;font-weight:900;letter-spacing:.05em;padding:6px 15px;background:none;border:none;}
  select.pill{appearance:none;-webkit-appearance:none;text-align:center;}
  #facts{display:flex;align-items:stretch;justify-content:center;gap:7px;flex-wrap:wrap;}
  .fact{
    border-radius:12px;background:rgba(43,34,244,.055);border:1px solid rgba(43,34,244,.12);
    padding:6px 12px;min-width:118px;text-align:center;
  }
  .fact .k{font-size:.5rem;font-weight:900;letter-spacing:.16em;color:rgba(43,34,244,.5);text-transform:uppercase;}
  .fact .v{font-size:.7rem;font-weight:850;letter-spacing:.04em;margin-top:2px;}
  .fact .s{font-size:.56rem;font-weight:700;color:rgba(43,34,244,.55);margin-top:1px;}
  #summary{
    font-size:.72rem;font-weight:700;letter-spacing:.02em;color:rgba(43,34,244,.8);
    text-align:center;max-width:860px;line-height:1.45;
  }
  #legend{
    font-size:.5rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:rgba(43,34,244,.38);text-align:center;line-height:1.7;max-width:900px;
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="map" viewBox="-660 -640 1320 1180" preserveAspectRatio="xMidYMid meet" aria-label="Earth view">
    <defs>
      <radialGradient id="spaceGrad" cx="50%" cy="46%" r="75%">
        <stop offset="0%"  stop-color="#0c1430"/>
        <stop offset="55%" stop-color="#091026"/>
        <stop offset="100%" stop-color="#060b19"/>
      </radialGradient>
      <radialGradient id="sunGlow">
        <stop offset="0%"  stop-color="#fff3d8" stop-opacity=".85"/>
        <stop offset="30%" stop-color="#ffd98f" stop-opacity=".38"/>
        <stop offset="70%" stop-color="#f4b95e" stop-opacity=".1"/>
        <stop offset="100%" stop-color="#f4b95e" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="earthGrad" cx="38%" cy="34%" r="80%">
        <stop offset="0%" stop-color="#7fb4e8"/>
        <stop offset="45%" stop-color="#3d7ec4"/>
        <stop offset="80%" stop-color="#1c4e8a"/>
        <stop offset="100%" stop-color="#123763"/>
      </radialGradient>
      <radialGradient id="moonGrad" cx="40%" cy="36%" r="80%">
        <stop offset="0%" stop-color="#e8e6e0"/>
        <stop offset="60%" stop-color="#b8b6b0"/>
        <stop offset="100%" stop-color="#8e8c88"/>
      </radialGradient>
      <!-- true top-down night side: dark falls off from the terminator (x=0)
           toward the anti-sun limb; the lit half stays untouched -->
      <linearGradient id="nightSide" x1="1" y1="0" x2="0" y2="0">
        <stop offset="0%"  stop-color="#03071a" stop-opacity=".12"/>
        <stop offset="22%" stop-color="#03071a" stop-opacity=".58"/>
        <stop offset="100%" stop-color="#03071a" stop-opacity=".86"/>
      </linearGradient>
      <radialGradient id="atmoGlow">
        <stop offset="78%" stop-color="#6fb2ff" stop-opacity="0"/>
        <stop offset="92%" stop-color="#6fb2ff" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#6fb2ff" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="earthClip"><circle r="46"/></clipPath>
      <clipPath id="moonClip"><circle r="18"/></clipPath>
      <!-- explicit filter regions: default regions box-clip small elements -->
      <filter id="softTerm" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="2.4"/>
      </filter>
      <filter id="softTermM" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="1.1"/>
      </filter>
      <linearGradient id="dayRim" x1="0" y1="0" x2="1" y2="0">
        <stop offset="45%" stop-color="#fff6e1" stop-opacity="0"/>
        <stop offset="100%" stop-color="#fff6e1" stop-opacity=".55"/>
      </linearGradient>
    </defs>
    <rect x="-1600" y="-1600" width="3200" height="3200" fill="url(#spaceGrad)"/>
    <g id="gStars"></g>
    <g id="gSun"></g>
    <g id="gRings"></g>
    <g id="gSats"></g>
    <g id="gMoon"></g>
    <g id="gEarth"></g>
  </svg>
</div>

<div id="hud">
  <div id="hud-controls">
    <button class="pill" id="btn-play">&#9654;&#xFE0E; PLAY</button>
    <span class="pill" id="readout">—</span>
    <button class="pill" id="btn-today">TODAY</button>
    <select class="pill" id="speed">
      <option value="0.00694">10 MIN/SEC</option>
      <option value="0.0417" selected>1 HR/SEC</option>
      <option value="0.25">6 HR/SEC</option>
      <option value="1">1 DAY/SEC</option>
    </select>
  </div>
  <div id="facts"></div>
  <div id="summary"></div>
  <div id="legend">
    GEOCENTRIC VIEW &middot; &#9800;&#xFE0E; 0&deg; RIGHT &middot; DISTANCES LOG-COMPRESSED &middot;
    DAY/NIGHT HALVES ARE THE TRUE TOP-DOWN GEOMETRY &middot;
    MOON &amp; SUN: SCHLYTER ELEMENTS (J2000) &middot; EARTH: NASA DSCOVR/EPIC LIVE &middot;
    STARS: HYG CATALOG &middot; <span id="leg-iss">ISS: ORBIT REAL, PHASE ILLUSTRATIVE</span> &middot;
    GEO SATS TRACK EARTH'S REAL ROTATION
  </div>
</div>

<script src="_planetcore.js"></script>
<script src="_starfield.js"></script>
<script>
var LOCATION = { lat: 40.744, lon: -73.9213, tz: 'America/New_York', name: 'NYC' };
var DEG = Math.PI/180;
var MAP_R = 470;
var svgEl = document.getElementById('map');
function mk(tag, attrs, parent){
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in attrs) el.setAttribute(k, attrs[k]);
  (parent || svgEl).appendChild(el);
  return el;
}
/* map direction for an ecliptic longitude (radians): 0 right, CCW */
function dirXY(lonRad, r){ return [r*Math.cos(lonRad), -r*Math.sin(lonRad)]; }

/* ── distance rings: log-compressed km → px ── */
function rKm(km){
  return 70 + (Math.log(km/300) / Math.log(2000000/300)) * 400;
}
var R_ISS = rKm(420), R_GPS = rKm(20200), R_GEO = rKm(35786), R_L = rKm(1500000);

/* ── the real sky behind everything (same polar projection as the map) ── */
(function(){
  var g = document.getElementById('gStars');
  if (typeof STARS === 'undefined') return;
  function starColor(bv){
    if (bv <= 0)   return '#a8c2ff';
    if (bv <= 0.4) return '#e6eeff';
    if (bv <= 0.8) return '#fff4e2';
    if (bv <= 1.2) return '#ffe2b4';
    return '#ffc990';
  }
  for (var i = 0; i < STARS.length; i++){
    var s = STARS[i];
    if (s[2] > 6.0) continue;                      // keep the lab light
    var r = MAP_R * (90 - s[1]) / 90;
    var a = s[0] * DEG;
    var sz = Math.max(0.5, 1.9 - 0.24 * s[2]);
    mk('circle', {cx:(r*Math.cos(a)).toFixed(1), cy:(-r*Math.sin(a)).toFixed(1),
                  r:sz.toFixed(2), fill:starColor(s[3]),
                  opacity:(s[2] < 2 ? .9 : s[2] < 4 ? .55 : .3).toFixed(2)}, g);
  }
})();

/* ── static ring furniture ── */
(function(){
  var g = document.getElementById('gRings');
  var rings = [
    {r:R_ISS, label:'ISS ORBIT · 254 MI · 92.9 MIN',    ang:148},
    {r:R_GPS, label:'GPS · 12,550 MI',                  ang:139},
    {r:R_GEO, label:'GEOSTATIONARY RING · 22,236 MI',   ang:130},
    {r:R_L,   label:'L1 · L2 · ~932,000 MI',            ang:117}
  ];
  rings.forEach(function(rg){
    mk('circle', {r:rg.r, fill:'none', stroke:'rgba(150,172,225,.26)', 'stroke-width':.9,
                  'stroke-dasharray':'3 5', 'vector-effect':'non-scaling-stroke'}, g);
    var p = dirXY(rg.ang*DEG, rg.r);
    var t = mk('text', {x:p[0].toFixed(1), y:p[1].toFixed(1), 'text-anchor':'end', 'class':'data',
      style:'font-size:10.5px;font-weight:800;letter-spacing:.14em;fill:rgba(178,196,240,.6);'}, g);
    t.textContent = rg.label;
  });
})();

/* ── live pieces, updated per frame ── */
var gSun = document.getElementById('gSun'),
    gSats = document.getElementById('gSats'),
    gMoon = document.getElementById('gMoon'),
    gEarth = document.getElementById('gEarth');

/* sun: a warm glow parked at the map edge in the true geocentric direction */
var sunGlow = mk('circle', {r:430, fill:'url(#sunGlow)'}, gSun);
var sunTick = mk('path', {d:'M-9,0 L9,0', stroke:'#ffd98f', 'stroke-width':2,
                          'vector-effect':'non-scaling-stroke', opacity:.9}, gSun);
var sunLab = mk('text', {'text-anchor':'middle',
  style:'font-size:19px;font-weight:850;letter-spacing:.2em;fill:#ffd9a0;'}, gSun);
sunLab.textContent = 'SUN';

/* moon: real orbit ring at the current true distance + a half-lit disc */
var moonRing = mk('circle', {r:395, fill:'none', stroke:'rgba(232,214,180,.3)', 'stroke-width':1,
                             'vector-effect':'non-scaling-stroke'}, gMoon);
var moonG = mk('g', {}, gMoon);
mk('circle', {r:18, fill:'url(#moonGrad)'}, moonG);
/* real surface: a fully-lit frame from NASA SVS's LRO-based moon animation
   (disc ~0.46 of the 730px frame); gradient stays as the onerror fallback */
var moonImgG = mk('g', {'clip-path':'url(#moonClip)'}, moonG);
var moonImg = mk('image', {href:'https://svs.gsfc.nasa.gov/vis/a000000/a005100/a005187/frames/730x730_1x1_30p/moon.1300.jpg',
                           x:-39.1, y:-39.1, width:78.2, height:78.2,
                           preserveAspectRatio:'xMidYMid slice', opacity:0}, moonImgG);
moonImg.addEventListener('load', function(){ moonImg.setAttribute('opacity', 1); });
moonImg.addEventListener('error', function(){ moonImg.remove(); });
var moonNight = mk('g', {'clip-path':'url(#moonClip)'}, moonG);
var moonNightP = mk('path', {d:'M0,-18 A18,18 0 0 0 0,18 L0,-18 Z', fill:'url(#nightSide)',
                             filter:'url(#softTermM)'}, moonNight);
var moonRim = mk('circle', {r:17.2, fill:'none', stroke:'url(#dayRim)', 'stroke-width':1.6, opacity:.85}, moonG);
var moonLab = mk('text', {'text-anchor':'middle',
  style:'font-size:17px;font-weight:850;letter-spacing:.16em;fill:#f4e9d4;'}, gMoon);
var moonSub = mk('text', {'text-anchor':'middle', 'class':'data',
  style:'font-size:10px;font-weight:800;letter-spacing:.12em;fill:rgba(244,233,212,.7);'}, gMoon);

/* satellites */
var issDot = mk('circle', {r:3.4, fill:'#ffd27f', stroke:'#fff', 'stroke-width':.6}, gSats);
var issLab = mk('text', {'text-anchor':'middle', 'class':'data',
  style:'font-size:10px;font-weight:900;letter-spacing:.14em;fill:#ffd27f;'}, gSats);
issLab.textContent = 'ISS';
var GEO_SATS = [ {nm:'GOES-19', lon:-75.2}, {nm:'GOES-18', lon:-137.2} ];
var geoNodes = GEO_SATS.map(function(gs){
  var d2 = mk('circle', {r:2.6, fill:'#8fd4c9', stroke:'#fff', 'stroke-width':.5}, gSats);
  var l2 = mk('text', {'text-anchor':'middle', 'class':'data',
    style:'font-size:9px;font-weight:800;letter-spacing:.1em;fill:rgba(143,212,201,.85);'}, gSats);
  l2.textContent = gs.nm;
  return {dot:d2, lab:l2, lon:gs.lon};
});
var LPTS = [ {nm:'DSCOVR · L1', toSun:1, node:null, lab:null},
             {nm:'JWST · L2',   toSun:-1, node:null, lab:null} ];
LPTS.forEach(function(L){
  L.node = mk('path', {d:'M0,-4 L4,0 L0,4 L-4,0 Z', fill:'#cfd8f4', stroke:'#fff', 'stroke-width':.5}, gSats);
  L.lab = mk('text', {'text-anchor':'middle', 'class':'data',
    style:'font-size:9.5px;font-weight:800;letter-spacing:.1em;fill:rgba(207,216,244,.8);'}, gSats);
  L.lab.textContent = L.nm;
});

/* earth: gradient base, live EPIC photo when it arrives, true night half */
mk('circle', {r:58, fill:'url(#atmoGlow)'}, gEarth);
mk('circle', {r:46, fill:'url(#earthGrad)'}, gEarth);
var earthImgG = mk('g', {'clip-path':'url(#earthClip)'}, gEarth);
var earthImg = null;   // attached on EPIC success
var earthNightG = mk('g', {'clip-path':'url(#earthClip)'}, gEarth);
var earthNightP = mk('path', {d:'M0,-46 A46,46 0 0 0 0,46 L0,-46 Z', fill:'url(#nightSide)',
                              filter:'url(#softTerm)'}, earthNightG);
var earthRim = mk('circle', {r:44.6, fill:'none', stroke:'url(#dayRim)', 'stroke-width':2.6, opacity:.9}, gEarth);
var earthLab = mk('text', {y:70, 'text-anchor':'middle',
  style:'font-size:19px;font-weight:850;letter-spacing:.2em;fill:#dce6f8;'}, gEarth);
earthLab.textContent = 'EARTH';

/* EPIC — CORS-open JSON; jpg not png (218 KB vs 3 MB); disc r = 0.392 of frame */
(function(){
  fetch('https://epic.gsfc.nasa.gov/api/natural').then(function(r){ return r.json(); })
  .then(function(list){
    if (!list || !list.length) return;
    var m = list[list.length - 1];
    var d = m.date.slice(0,10).split('-');
    var url = 'https://epic.gsfc.nasa.gov/archive/natural/' + d[0] + '/' + d[1] + '/' + d[2] +
              '/jpg/' + m.image + '.jpg';
    var half = 46 / 0.392;
    earthImg = mk('image', {href:url, x:-half, y:-half, width:half*2, height:half*2,
                            preserveAspectRatio:'xMidYMid slice', opacity:0}, earthImgG);
    earthImg.addEventListener('load', function(){ earthImg.setAttribute('opacity', 1); });
  }).catch(function(){});
})();

/* ISS live anchor (CORS-open); orbit phase falls back to an illustrative one */
var issAnchor = { ms: Date.now(), ang: 0, live: false };
(function(){
  fetch('https://api.wheretheiss.at/v1/satellites/25544').then(function(r){ return r.json(); })
  .then(function(j){
    if (typeof j.longitude !== 'number') return;
    issAnchor = { ms: Date.now(), ang: localSiderealTime(new Date(), j.longitude), live: true,
                  altKm: j.altitude, velKmh: j.velocity };
    var le = document.getElementById('leg-iss');
    if (le) le.textContent = 'ISS: LIVE (WHERETHEISS.AT)';
    renderFacts();
  }).catch(function(){});
})();
var ISS_PERIOD_MS = 92.9 * 60000;

/* ── astronomy helpers ── */
function sunGeo(dt){ return sunEcliptic(daysSinceJ2000(dt)); }        // .lon rad, .r AU
function moonNow(dt){ return moonEcl(dt); }                           // .lon deg, .dist earth-radii
function elongDeg(dt){
  var e = (moonNow(dt).lon - sunGeo(dt).lon/DEG) % 360;
  return e < 0 ? e + 360 : e;
}
function illumOf(e){ return (1 - Math.cos(e*DEG)) / 2; }
function phaseName(e){
  if (e < 12 || e > 348) return 'NEW';
  if (e < 78)   return 'WAXING CRESCENT';
  if (e < 102)  return 'FIRST QUARTER';
  if (e < 168)  return 'WAXING GIBBOUS';
  if (e < 192)  return 'FULL';
  if (e < 258)  return 'WANING GIBBOUS';
  if (e < 282)  return 'LAST QUARTER';
  return 'WANING CRESCENT';
}
function nextPhase(fromMs, target){       // target 180=full, 0/360=new
  var prev = elongDeg(new Date(fromMs));
  for (var h = 1; h <= 31*24; h++){
    var ms = fromMs + h*3600000;
    var e = elongDeg(new Date(ms));
    var crossed = target === 180 ? (prev < 180 && e >= 180)
                                 : (prev > e);                // wrapped 360→0
    if (crossed) return ms;
    prev = e;
  }
  return null;
}
function fmtMi(mi){ return Math.round(mi).toLocaleString('en-US') + ' MI'; }
function fmtDate(ms){
  return new Date(ms).toLocaleDateString('en-US', {timeZone:LOCATION.tz, month:'short', day:'numeric'}).toUpperCase();
}

/* ── time + render loop ── */
var curMs = Date.now(), playing = false, lastFrame = null;
var speedSel = document.getElementById('speed');

function render(){
  var dt = new Date(curMs);
  var s = sunGeo(dt), sunLonDeg = s.lon/DEG;
  var m = moonNow(dt);
  var e = ((m.lon - sunLonDeg) % 360 + 360) % 360;

  /* sun */
  var sp = dirXY(s.lon, 780);
  sunGlow.setAttribute('cx', sp[0].toFixed(1)); sunGlow.setAttribute('cy', sp[1].toFixed(1));
  var st = dirXY(s.lon, 505);
  sunTick.setAttribute('transform', 'translate(' + st[0].toFixed(1) + ',' + st[1].toFixed(1) +
                       ') rotate(' + (-sunLonDeg).toFixed(1) + ')');
  var sl = dirXY(s.lon, 528);
  sunLab.setAttribute('x', sl[0].toFixed(1)); sunLab.setAttribute('y', (sl[1]+6).toFixed(1));

  /* the true night halves swing with the sun */
  var rot = 'rotate(' + (-sunLonDeg).toFixed(2) + ')';
  earthNightP.setAttribute('transform', rot);
  earthRim.setAttribute('transform', rot);
  moonRim.setAttribute('transform', rot);
  var mDistKm = m.dist * 6378.14, mR = rKm(mDistKm);
  moonRing.setAttribute('r', mR.toFixed(1));
  var mp = dirXY(m.lon*DEG, mR);
  moonG.setAttribute('transform', 'translate(' + mp[0].toFixed(1) + ',' + mp[1].toFixed(1) + ')');
  moonNightP.setAttribute('transform', rot);
  var mlp = dirXY(m.lon*DEG, mR + 34);
  moonLab.setAttribute('x', mlp[0].toFixed(1)); moonLab.setAttribute('y', mlp[1].toFixed(1));
  moonLab.textContent = 'MOON';
  moonSub.setAttribute('x', mlp[0].toFixed(1)); moonSub.setAttribute('y', (mlp[1]+15).toFixed(1));
  moonSub.textContent = Math.round(illumOf(e)*100) + '% ' +
    (e < 180 ? 'WAXING' : 'WANING') + ' · ' + fmtMi(mDistKm*0.621371);

  /* satellites ride Earth's real rotation */
  geoNodes.forEach(function(gn){
    var a = localSiderealTime(dt, gn.lon);
    var p = dirXY(a, R_GEO);
    gn.dot.setAttribute('cx', p[0].toFixed(1)); gn.dot.setAttribute('cy', p[1].toFixed(1));
    var lp = dirXY(a, R_GEO + 14);
    gn.lab.setAttribute('x', lp[0].toFixed(1)); gn.lab.setAttribute('y', (lp[1]+3).toFixed(1));
  });
  var issAng = issAnchor.ang + 2*Math.PI * (curMs - issAnchor.ms) / ISS_PERIOD_MS;
  var ip = dirXY(issAng, R_ISS);
  issDot.setAttribute('cx', ip[0].toFixed(1)); issDot.setAttribute('cy', ip[1].toFixed(1));
  var il = dirXY(issAng, R_ISS + 13);
  issLab.setAttribute('x', il[0].toFixed(1)); issLab.setAttribute('y', (il[1]+3).toFixed(1));

  LPTS.forEach(function(L){
    var a = L.toSun === 1 ? s.lon : s.lon + Math.PI;
    var p = dirXY(a, R_L);
    L.node.setAttribute('transform', 'translate(' + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ')');
    var lp = dirXY(a, R_L + 15);
    L.lab.setAttribute('x', lp[0].toFixed(1)); L.lab.setAttribute('y', (lp[1]+3).toFixed(1));
  });

  /* readout */
  document.getElementById('readout').textContent =
    dt.toLocaleDateString('en-US', {timeZone:LOCATION.tz, month:'short', day:'numeric', year:'numeric'}).toUpperCase() +
    ' · ' + dt.toLocaleTimeString('en-US', {timeZone:LOCATION.tz, hour:'numeric', minute:'2-digit'});
}

function renderFacts(){
  var now = new Date();                       // facts pin to NOW, like the site
  var s = sunGeo(now), m = moonNow(now);
  var e = ((m.lon - s.lon/DEG) % 360 + 360) % 360;
  var illum = Math.round(illumOf(e)*100);
  var mMi = m.dist * 6378.14 * 0.621371;
  var full = nextPhase(now.getTime(), 180), nw = nextPhase(now.getTime(), 0);
  var sunMi = s.r * 92955807.3;
  var lightMin = s.r * 499.004784 / 60;
  var f = document.getElementById('facts');
  function fact(k, v, sub){
    return '<div class="fact"><div class="k">' + k + '</div><div class="v">' + v + '</div>' +
           (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';
  }
  f.innerHTML =
    fact('MOON', illum + '% · ' + phaseName(e), fmtMi(mMi) + ' · FULL ' + (full ? fmtDate(full) : '—')) +
    fact('SUN', s.r.toFixed(3) + ' AU', Math.round(sunMi/1e6).toLocaleString() + 'M MI · LIGHT ' + lightMin.toFixed(1) + ' MIN') +
    fact('ISS', issAnchor.live ? Math.round(issAnchor.altKm*0.621371) + ' MI UP' : '254 MI UP',
         issAnchor.live ? Math.round(issAnchor.velKmh*0.621371).toLocaleString() + ' MPH · LIVE' : '17,100 MPH · 92.9 MIN') +
    fact('JWST', 'L2 · 932,000 MI', 'DOWN-SUN STATION') +
    fact('DSCOVR', 'L1 · 932,000 MI', 'TAKES THE EARTH PHOTO');
  var nextIsFull = full !== null && (nw === null || full < nw);
  document.getElementById('summary').textContent =
    'The Moon is ' + illum + '% lit and ' + (e < 180 ? 'waxing' : 'waning') + ', ' +
    Math.round(mMi/1000) + ',000 miles out — ' +
    (nextIsFull ? 'full on ' + fmtDate(full) : 'new on ' + fmtDate(nw)) + '. ' +
    'The Sun is ' + lightMin.toFixed(1) + ' light-minutes away; JWST and DSCOVR hold station a ' +
    'million miles down-sun and sun-ward, and the geostationary ring turns with the ground below it.';
}

function frame(ts){
  if (playing){
    if (lastFrame !== null) curMs += (ts - lastFrame) * (+speedSel.value) * 86400;
    lastFrame = ts;
    render();
  }
  requestAnimationFrame(frame);
}
document.getElementById('btn-play').addEventListener('click', function(){
  playing = !playing; lastFrame = null;
  this.innerHTML = playing ? '&#10073;&#10073;&#xFE0E; PAUSE' : '&#9654;&#xFE0E; PLAY';
});
document.getElementById('btn-today').addEventListener('click', function(){
  curMs = Date.now(); render();
});
render();
renderFacts();
setInterval(function(){ if (!playing){ curMs = Date.now(); render(); } }, 30000);
setInterval(renderFacts, 60000);
requestAnimationFrame(frame);
</script>
</body>
</html>
