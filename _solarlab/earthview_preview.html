<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EARTH VIEW — widget preview</title>
<style>
  /* Site-chrome mock (same shell as widget_preview.html): how a third
     EARTH VIEW tab would sit on the BEHIND THE BLUE widget, between
     TONIGHT and SOLAR SYSTEM. */
  :root{ --ink:#2B22F4; --ink-dim:rgba(43,34,244,.55); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 20% 0%, #eef3fb 0%, #dde7f6 45%, #cfd9ee 100%);
    padding:40px 16px 80px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .page-note{
    font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(43,34,244,.45);
  }
  .widget{
    width:min(1100px, 96vw);
    background:rgba(255,255,255,.45);
    border:none;border-radius:18px;
    box-shadow:0 18px 50px rgba(43,34,244,.14), 0 0 0 1px rgba(255,255,255,.5) inset;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    min-width:0;overflow:hidden;
  }
  .widget-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;
    background:rgba(255,255,255,.3);
    border-bottom:1px solid rgba(43,34,244,.12);
  }
  .widget-title{
    font-size:.60rem;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(43,34,244,.74);font-weight:850;
  }
  .widget-sub{
    font-size:.72rem;color:var(--ink-dim);white-space:nowrap;text-align:right;
    font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  }
  .widget-body{
    position:relative;height:min(90vh,1020px);background:#0a1122;overflow:hidden;
  }
  .widget-body iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;display:block;
  }
  /* ── sub-section menu bar, CLOUDS-style: flush to the top of the map ── */
  #solar-tab-bar{
    position:absolute;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:3px;
    background:rgba(43,34,244,.92);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-radius:0 0 14px 14px;
    padding:5px 8px 6px;
  }
  .solar-tab{
    flex:1;padding:6px 8px;border-radius:7px;
    background:none;border:1px solid transparent;
    font-family:system-ui,sans-serif;font-size:.66rem;line-height:1;
    font-weight:900;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.7);cursor:pointer;transition:all .18s;
    display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
  }
  .solar-tab:hover{color:#fff;}
  .solar-tab.active{
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
  }
  .solar-tab .dot{
    width:8px;height:8px;border-radius:50%;background:#4ade80;
    box-shadow:0 0 6px #4ade80,0 0 14px rgba(74,222,128,.6);
    flex-shrink:0;animation:solar-pulse 1.8s ease-in-out infinite;display:inline-block;
  }
  @keyframes solar-pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  /* sub-tabs for EARTH VIEW: a slim second row, CLOUDS-widget style */
  #earth-sub-bar{
    position:absolute;top:38px;left:50%;transform:translateX(-50%);z-index:19;
    display:flex;gap:4px;
    background:rgba(43,34,244,.78);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:0 0 11px 11px;
    padding:4px 6px 5px;
  }
  #earth-sub-bar.hidden{display:none;}
  .earth-sub{
    padding:4px 14px;border-radius:6px;
    background:none;border:1px solid transparent;
    font-family:system-ui,sans-serif;font-size:.56rem;line-height:1;
    font-weight:900;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.65);cursor:pointer;transition:all .18s;white-space:nowrap;
  }
  .earth-sub:hover{color:#fff;}
  .earth-sub.active{
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
  }
</style>
</head>
<body>
<div class="page-note">widget preview — an EARTH VIEW tab on BEHIND THE BLUE</div>

<div class="widget" id="solar-widget">
  <div class="widget-head">
    <div class="widget-title">BEHIND THE BLUE</div>
    <span class="widget-sub">NASA &middot; JPL &middot; SWPC</span>
  </div>
  <div class="widget-body">
    <iframe id="solar-frame" src="solar_lab.html" title="Solar system map" style="display:none;"></iframe>
    <iframe id="earth-frame" src="earth_lab.html" title="Earth view"></iframe>
    <iframe id="sat-frame" src="sat_lab.html" title="Satellites" style="display:none;"></iframe>
    <div id="solar-tab-bar">
      <button class="solar-tab" data-tab="tonight"><span class="dot"></span>TONIGHT</button>
      <button class="solar-tab active" data-tab="earth">EARTH VIEW</button>
      <button class="solar-tab" data-tab="compressed">SOLAR SYSTEM</button>
    </div>
    <div id="earth-sub-bar">
      <button class="earth-sub active" data-sub="earth">EARTH</button>
      <button class="earth-sub" data-sub="satellites">SATELLITES</button>
      <button class="earth-sub" data-sub="junk">SPACE JUNK</button>
    </div>
  </div>
</div>

<script>
var solarFrame = document.getElementById('solar-frame');
var earthFrame = document.getElementById('earth-frame');
var satFrame = document.getElementById('sat-frame');
var earthSub = 'earth';
function setActive(tab){
  document.querySelectorAll('.solar-tab').forEach(function(x){
    x.classList.toggle('active', x.getAttribute('data-tab') === tab);
  });
  var onEarth = tab === 'earth';
  document.getElementById('earth-sub-bar').classList.toggle('hidden', !onEarth);
  earthFrame.style.display = (onEarth && earthSub !== 'satellites') ? '' : 'none';
  satFrame.style.display = (onEarth && earthSub === 'satellites') ? '' : 'none';
  solarFrame.style.display = onEarth ? 'none' : '';
}
document.querySelectorAll('.earth-sub').forEach(function(b){
  b.addEventListener('click', function(){
    earthSub = b.getAttribute('data-sub');
    document.querySelectorAll('.earth-sub').forEach(function(x){ x.classList.toggle('active', x === b); });
    setActive('earth');
    try { earthFrame.contentWindow.postMessage({earthJunk: earthSub === 'junk'}, '*'); } catch(e){}
  });
});
/* the solar lab can switch itself (jump-to-planet etc.); keep the highlight
   honest when it does — and surface its frame if EARTH VIEW was up */
window.addEventListener('message', function(e){
  if (!e.data || !e.data.solarTabChanged) return;
  setActive(e.data.solarTabChanged);
});
document.querySelectorAll('.solar-tab').forEach(function(b){
  b.addEventListener('click', function(){
    var tab = b.getAttribute('data-tab');
    setActive(tab);
    if (tab !== 'earth' && tab !== 'satellites') solarFrame.contentWindow.postMessage({solarTab: tab}, '*');
  });
});
</script>
</body>
</html>
