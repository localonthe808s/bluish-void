<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GALAXY · UNIVERSE — our place at larger scales</title>
<!--
  THE GALAXY / UNIVERSE LAB (2026-10-10, user: "create tabs for the galaxy and universe ... show our place in larger
  scales"). The third and fourth rungs after EARTH VIEW and SOLAR SYSTEM: five frames, each drawn from a catalog
  (build_galaxy.py -> galaxy/*.json), never from a painting, with the same stage, font and palette as solar_lab.html.

    NEIGHBORHOOD  1,000 light-years: HYG stars with distances, Gaia DR3 clusters, the Local Bubble shell, the Radcliffe Wave
    MILKY WAY     the disc face-on: 7,167 Gaia clusters, 199 maser parallaxes, spiral arms fitted to the masers, the Sun's orbit
    LOCAL GROUP   100 galaxies within ~5 million light-years (McConnachie 2012)
    LANIAKEA      39,700 galaxies with redshift distances in the supergalactic plane (2MASS Redshift Survey)
    COSMIC WEB    50,000 SDSS galaxies in a thin equatorial stripe, the classic fan

  Conventions: the Galactic Centre is UP in the first two frames and the Sun's rotation runs to the left (looking down
  from the north Galactic pole); every frame marks where we are in gold, shows the previous frame's footprint as a
  faint ring, and labels its scale rings in light-years. Measured points are crisp; modelled shapes (the bar, the arm
  curves beyond their masers, the Local Group's edge) are soft or fade -- edges encode certainty.
  Embedded, the host owns the tab bar: {solarTab:'galaxy'|'universe'} picks a frame, and crossing between the two
  groups on the ladder posts {solarTabChanged} back so the bar follows.
-->
<style>
  @font-face{ font-family:"QelliaRegular"; src:url('https://cdn.bluishvoid.com/qellia.woff2?v=1') format('woff2'); font-display:swap; }
  :root{ --ink:#2B22F4; --ink-dim:rgba(43,34,244,.55); }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:transparent; color:var(--ink);
        overflow:hidden; display:flex; flex-direction:column; height:100vh; }
  #stage{ position:relative; flex:1; min-height:0; order:1; overflow:hidden; background:#0a1122; }
  #stage canvas{ position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  #fade{ pointer-events:none; opacity:0; transition:opacity .45s ease; }
  /* ---- HUD under the map: the ladder of frames (styled like the solar lab's zoom rungs) and the caption ---- */
  #hud{ order:2; display:flex; flex-direction:column; gap:4px; padding:8px 12px 10px; }
  #ladder{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:2px 4px; }
  #ladder button{ border:none; background:transparent; padding:3px 10px; font-size:.62rem; line-height:1.15; border-radius:999px;
                  color:#2B22F4; font-weight:800; letter-spacing:.05em; opacity:.45; transition:opacity .15s; cursor:pointer; font-family:inherit; }
  #ladder button:hover{ opacity:.8; } #ladder button.active{ opacity:1; }
  #ladder .sep{ width:1px; height:12px; background:rgba(43,34,244,.25); margin:0 6px; }
  #caption{ text-align:center; font-size:.62rem; line-height:1.45; color:var(--ink-dim); font-weight:600; letter-spacing:.02em; max-width:900px; margin:0 auto; }
  #credit{ text-align:center; font-size:.52rem; letter-spacing:.1em; text-transform:uppercase; color:rgba(43,34,244,.45); font-weight:800; }
  #credit a{ color:inherit; text-decoration:none; }
  /* embedded on desktop the host pins the map height and sizes the frame to our content, as the other labs do */
  html.fixed-map body{ height:auto; min-height:0; } html.fixed-map #stage{ flex:none; }
  @media (max-width:640px){ #ladder button{ font-size:.56rem; padding:3px 7px; } #caption{ font-size:.58rem; } }
</style>
</head>
<body>
<div id="stage"><canvas id="gal"></canvas><canvas id="fade"></canvas></div>
<div id="hud">
  <div id="ladder">
    <button data-f="neighborhood" data-tab="galaxy">NEIGHBORHOOD</button>
    <button data-f="milkyway" data-tab="galaxy" class="active">MILKY WAY</button>
    <span class="sep"></span>
    <button data-f="localgroup" data-tab="universe">LOCAL GROUP</button>
    <button data-f="laniakea" data-tab="universe">LANIAKEA</button>
    <button data-f="universe" data-tab="universe">COSMIC WEB</button>
  </div>
  <div id="caption"></div>
  <div id="credit"></div>
</div>
<script>
'use strict';
var EMBEDDED = window.self !== window.top;
var GAL_BUILD = '2026-10-10c';                      /* bump when galaxy/*.json changes, so browsers refetch */
var LY_KPC = 3261.56, MLY_MPC = 3.26156;
var stage = document.getElementById('stage'), cv = document.getElementById('gal'), fcv = document.getElementById('fade');
var ctx = cv.getContext('2d');
var DATA = {}, cur = 'milkyway', W = 0, H = 0, DPR = 1;
var FONT = '"QelliaRegular","Bodoni Moda",Georgia,serif';
/* palette: the navy stage, pale blue-white for the universe, gold for us */
var C = { bg:'#0a1122', star:'#e6eefc', faint:'rgba(188,214,239,', blue:'rgba(120,180,255,', gold:'rgba(5,219,50,', white:'rgba(230,240,255,',   /* 'gold' is the accent slot: site green since 2026-10-10 */
          label:'#bcd6ef', title:'#e2eeff', goldS:'#05DB32', green:'#05DB32' };

/* ---- the frames: what each draws, in its own units; every frame gets (ctx, view) with view = {s px/unit, cx, cy} ---- */
var FRAMES = {
  neighborhood: { file:'neighborhood.json', unit:'ly', radius:1000, tab:'galaxy', title:'THE NEIGHBORHOOD',
    caption:'A thousand light-years across. Every naked-eye star with a measured distance, drawn where it really sits in the Galactic plane; the clusters are Gaia’s; the Local Bubble is the hot, nearly empty cavity the Sun has been crossing for a few million years, and the Radcliffe Wave is the 9,000-light-year ribbon of star-forming gas just outside it. The Galactic Centre is up.',
    credit:'HYG v4.1 · Gaia DR3 clusters, Hunt & Reffert 2023 · Local Bubble, Pelgrims+ 2020 · Radcliffe Wave, Alves+ 2020', draw: drawNeighborhood },
  milkyway: { file:'milkyway.json', unit:'kpc', radius:16.5, tab:'galaxy', title:'THE MILKY WAY',
    caption:'The disc face-on, 100,000 light-years across: NASA’s reconstruction of our Galaxy from Spitzer’s infrared survey, with its grid and labels taken off and our measurements laid on it. The green dots are 199 masers whose distances were measured with radio telescopes, the pale dots 7,167 star clusters with Gaia distances. The Sun sits 26,000 light-years out, between the Sagittarius and Perseus arms, and circles the centre once every 230 million years.',
    credit:'picture: NASA/JPL-Caltech/R. Hurt (SSC/Caltech) · maser parallaxes: Reid+ 2019 (BeSSeL / VERA) · clusters: Hunt & Reffert 2023', draw: drawMilkyWay },
  localgroup: { file:'localgroup.json', unit:'kpc', radius:1500, tab:'universe', title:'THE LOCAL GROUP',
    caption:'Five million light-years across: about a hundred galaxies, two of them big. Andromeda is 2.5 million light-years away and closing at 70 miles a second; nearly everything else is a dwarf bound to one of the two. The soft ring is roughly where the group’s gravity gives way to the expansion of space.',
    credit:'McConnachie 2012, the Local Group census · Andromeda’s approach: HST proper motions, van der Marel+ 2012', draw: drawLocalGroup },
  laniakea: { file:'laniakea.json', unit:'Mpc', radius:135, tab:'universe', title:'LANIAKEA',
    caption:'The local universe, 900 million light-years across, seen in the supergalactic plane where most nearby galaxies lie. Every dot is a galaxy with a measured redshift; the Virgo Cluster is our nearest city, and the whole region drifts toward the Great Attractor near the Norma Cluster. The two empty wedges are where our own Milky Way blocks the view.',
    credit:'2MASS Redshift Survey, Huchra+ 2012 · distances from redshift (H₀ = 70) · Laniakea: Tully+ 2014', draw: drawLaniakea },
  universe: { file:'universe.json', unit:'Gly', radius:4.0, tab:'universe', title:'THE COSMIC WEB',
    caption:'Eight billion light-years across. Each dot is one of 50,000 galaxies whose light the Sloan telescope split into a spectrum, drawn by direction and distance in a slice 2.5 degrees thick along the celestial equator; the filaments and voids are real. The far edge is a limit of this survey, not of the universe: the oldest light we can see left 13.8 billion years ago.',
    credit:'SDSS DR18 spectroscopic galaxies · comoving distances, flat ΛCDM', draw: drawUniverse }
};

/* ---- plumbing ---- */
function resize(){
  var r = stage.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
  [cv, fcv].forEach(function(c){ c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); });
  render();
}
function load(f){
  if (DATA[f]) return Promise.resolve(DATA[f]);
  return fetch('galaxy/' + FRAMES[f].file + '?v=' + GAL_BUILD).then(function(r){ return r.json(); }).then(function(j){ DATA[f] = j; return j; });
}
function show(f, viaHost){
  if (!FRAMES[f]) return;
  var prev = cur; cur = f;
  document.querySelectorAll('#ladder button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-f') === f); });
  document.getElementById('caption').textContent = FRAMES[f].caption;
  document.getElementById('credit').textContent = FRAMES[f].credit;
  if (EMBEDDED && !viaHost && FRAMES[prev].tab !== FRAMES[f].tab){ try{ parent.postMessage({solarTabChanged: FRAMES[f].tab}, '*'); }catch(_){} }
  /* cross-fade: the old picture is copied onto the fade canvas and dissolved over the new one */
  if (prev !== f && W){ var fc = fcv.getContext('2d'); fc.clearRect(0, 0, fcv.width, fcv.height); fc.drawImage(cv, 0, 0); fcv.style.transition = 'none'; fcv.style.opacity = 1;
    requestAnimationFrame(function(){ fcv.style.transition = ''; fcv.style.opacity = 0; }); }
  load(f).then(function(){ if (cur === f) render(); });
}
document.querySelectorAll('#ladder button').forEach(function(b){ b.addEventListener('click', function(){ show(b.getAttribute('data-f')); }); });
window.addEventListener('resize', resize);
window.addEventListener('message', function(e){
  if (!e.data) return;
  if (e.data.solarTab === 'galaxy') show(FRAMES[cur].tab === 'galaxy' ? cur : 'milkyway', true);
  if (e.data.solarTab === 'universe') show(FRAMES[cur].tab === 'universe' ? cur : 'universe', true);
  if (e.data.galaxyFrame && FRAMES[e.data.galaxyFrame]) show(e.data.galaxyFrame, true);
  if (typeof e.data.spaceMapH === 'number'){ var h = e.data.spaceMapH | 0; document.documentElement.classList.toggle('fixed-map', h > 0); stage.style.height = h > 0 ? h + 'px' : ''; resize();
    try{ parent.postMessage({spaceHeight: document.body.scrollHeight}, '*'); }catch(_){} }
});
var q = location.search.match(/[?&]frame=([a-z]+)/); if (q && FRAMES[q[1]]) cur = q[1];

/* ---- drawing helpers ---- */
function view(frame, pad){ var R = FRAMES[frame].radius, s = Math.min(W, H) * (0.5 - (pad || 0.06)) / R; return { s:s, cx:W/2, cy:H/2 }; }
function label(x, y, text, o){
  o = o || {}; var size = (o.size || 11), ls = o.ls === undefined ? 0.16 : o.ls;
  ctx.save(); ctx.font = (o.weight || 500) + ' ' + size + 'px ' + FONT; ctx.fillStyle = o.color || C.label; ctx.globalAlpha = o.alpha === undefined ? .85 : o.alpha;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = (size * ls) + 'px';
  if (o.shadow !== false){ ctx.shadowColor = 'rgba(10,17,34,.95)'; ctx.shadowBlur = 4; }
  /* a dark halo under the letters: labels sit on the bright disc of the NASA picture (user: "the text is hard to read") */
  ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(10,17,34,.78)'; ctx.lineWidth = Math.max(2, size * .3); ctx.strokeText(text, x, y);
  ctx.fillText(text, x, y); ctx.restore();
}
/* text laid along a circle (user 2026-10-10: "curve these text lines with the circle"): centred on angDeg (math convention,
   0 = right, 90 = up), letters upright with their tops outward in the upper half, flipped to stay readable in the lower half */
function arcLabel(cx, cy, r, angDeg, text, o){
  o = o || {};
  /* "double up each line so its not as long" (user 2026-10-10): a '|' splits the text into stacked arcs, read outward-in
     in the upper half (tops outward) and inward-out below (tops inward), so the lines read top to bottom either way */
  if (text.indexOf('|') >= 0){ var lines = text.split('|'), lh = (o.size || 9.5) * 1.35, upH = Math.sin(angDeg * Math.PI/180) >= -0.05;
    lines.forEach(function(t, i){ arcLabel(cx, cy, r + (upH ? (lines.length - 1 - i) : i) * lh, angDeg, t, o); }); return; } var size = o.size || 9.5, ls = o.ls === undefined ? 0.14 : o.ls, up = Math.sin(angDeg * Math.PI/180) >= -0.05;
  ctx.save(); ctx.font = (o.weight || 500) + ' ' + size + 'px ' + FONT; ctx.fillStyle = o.color || C.label; ctx.globalAlpha = o.alpha === undefined ? .6 : o.alpha;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(10,17,34,.78)'; ctx.lineWidth = Math.max(2, size * .3);
  var chars = text.split(''), widths = chars.map(function(c){ return ctx.measureText(c).width + size * ls; }), total = widths.reduce(function(a, b){ return a + b; }, 0) - size * ls;
  var arc = total / r, th = angDeg * Math.PI/180 + (up ? arc / 2 : -arc / 2), adv = 0;
  chars.forEach(function(c, i){ var w = widths[i] - size * ls, a = th + (up ? -1 : 1) * (adv + w / 2) / r; adv += widths[i];
    var x = cx + r * Math.cos(a), y = cy - r * Math.sin(a); ctx.save(); ctx.translate(x, y); ctx.rotate(up ? Math.PI/2 - a : -Math.PI/2 - a); ctx.strokeText(c, 0, 0); ctx.fillText(c, 0, 0); ctx.restore(); });
  ctx.restore();
  var mx = cx + r * Math.cos(angDeg * Math.PI/180), my = cy - r * Math.sin(angDeg * Math.PI/180); free(mx, my, total, size * 1.5);
}
function ring(cx, cy, r, color, width, alpha){ ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke(); ctx.restore(); }
function dot(x, y, r, color, alpha){ ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.restore(); }
function glow(x, y, r, color, a0){ var g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color + a0 + ')'); g.addColorStop(.4, color + (a0 * .35) + ')'); g.addColorStop(1, color + '0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2*r, 2*r); }
var PLACED = [];
function free(x, y, w, h){ w = w || 70; h = h || 13; if (PLACED.some(function(p){ return Math.abs(p[0] - x) < (w + p[2]) / 2 && Math.abs(p[1] - y) < (h + p[3]) / 2; })) return false; PLACED.push([x, y, w, h]); return true; }
function scaleRings(v, steps, fmt, ang){ var A = ang === undefined ? 45 : ang; steps.forEach(function(u){ var r = u * v.s; ring(v.cx, v.cy, r, '#bcd6ef', 1, .13); arcLabel(v.cx, v.cy, r + 8, A, fmt(u), {size:9.5, alpha:.55}); }); }
function here(x, y, text, sub){ glow(x, y, 26, C.gold, .35); dot(x, y, 3.2, C.goldS); ring(x, y, 8, C.goldS, 1, .7); label(x, y + 20, text, {color:C.goldS, size:10.5, weight:700, alpha:.95}); free(x, y + 20, 110, 14); if (sub) sub.split('|').forEach(function(t, i){ label(x, y + 33 + i * 12, t, {color:C.goldS, size:8.5, alpha:.7, ls:.12}); free(x, y + 33 + i * 12, t.length * 6, 13); }); }
/* the marker stays on the spot; its words stack somewhere open, joined by a thin leader (user 2026-10-10: "stack these in
   the open space with a line to the center") */
function hereAt(x, y, tx, ty, lines){
  glow(x, y, 26, C.gold, .35); dot(x, y, 3.2, C.goldS); ring(x, y, 8, C.goldS, 1, .7);
  var dx = tx - x, dy = ty - y, L = Math.hypot(dx, dy) || 1, top = ty - 9;
  ctx.save(); ctx.strokeStyle = C.gold + '.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + dx / L * 9, y + dy / L * 9); ctx.lineTo(x + dx / L * (L - 14), y + dy / L * (L - 14)); ctx.stroke(); ctx.restore();
  lines.forEach(function(t, i){ var first = i === 0; label(tx, ty + i * 13, t, {color:C.goldS, size:first ? 10.5 : 8.5, weight:first ? 700 : 500, alpha:first ? .95 : .72, ls:.12}); free(tx, ty + i * 13, t.length * 6.5, 13); });
}
function footprint(x, y, r, text){ ring(x, y, r, C.goldS, 1, .35); if (!text) return; if (r > 34){ arcLabel(x, y, r + 7, 62, text, {color:C.goldS, size:8.5, alpha:.6, ls:.12}); return; } var o = Math.max(r * .7071, 14); label(x + o + 5, y - o - 5, text, {color:C.goldS, size:8.5, alpha:.55, align:'left', ls:.12}); }
function titleCard(f){ label(W/2, 24, FRAMES[f].title, {color:C.title, size:16, weight:500, alpha:.95, ls:.2}); }
function starColor(ci){ /* B-V -> a warm/cool tint */ var t = Math.max(-0.3, Math.min(1.8, ci)); if (t < 0.3) return 'rgb(190,210,255)'; if (t < 0.7) return 'rgb(236,242,255)'; if (t < 1.1) return 'rgb(255,232,190)'; return 'rgb(255,200,150)'; }
/* heliocentric Galactic xy (x to the centre, y along l=90) -> screen: centre UP, l=90 to the LEFT (seen from the north pole) */
function gxy(v, x, y, s){ s = s || v.s; return [v.cx - y * s, v.cy - x * s]; }
function clear(){ ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); }
function render(){ if (!W) return; clear(); PLACED = []; var d = DATA[cur]; if (!d){ label(W/2, H/2, 'LOADING', {size:11, alpha:.5}); return; } FRAMES[cur].draw(d, view(cur)); titleCard(cur); }

/* ---- 1. THE NEIGHBORHOOD ---- */
var CLUSTER_NAMES = { 'Melotte 22':'PLEIADES', 'Melotte 25':'HYADES', 'NGC 2632':'PRAESEPE (M44)', 'Melotte 20':'ALPHA PERSEI', 'Melotte 111':'COMA STAR CLUSTER',
  'IC 2602':'SOUTHERN PLEIADES', 'IC 2391':'OMICRON VELORUM', 'NGC 2516':'NGC 2516', 'NGC 3532':'NGC 3532', 'NGC 6475':'PTOLEMY’S CLUSTER (M7)', 'NGC 6633':'NGC 6633',
  'Collinder 70':'ORION’S BELT', 'NGC 1980':'ORION NEBULA CLUSTER', 'NGC 2451A':'NGC 2451', 'NGC 2547':'NGC 2547', 'NGC 7092':'M39', 'IC 4665':'IC 4665', 'NGC 2232':'NGC 2232', 'Blanco 1':'BLANCO 1', 'NGC 2422':'M47', 'NGC 2287':'M41', 'NGC 6405':'BUTTERFLY CLUSTER (M6)', 'NGC 752':'NGC 752', 'Stock 2':'STOCK 2', 'NGC 2264':'CHRISTMAS TREE CLUSTER', 'NGC 2362':'TAU CANIS MAJORIS', 'IC 348':'IC 348', 'ASCC 19':'ASCC 19', 'UPK 606':'' };
function drawNeighborhood(d, v){
  var s = v.s;
  /* the Radcliffe Wave: a soft ribbon */
  ctx.save(); ctx.strokeStyle = C.blue + '.22)'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
  d.radcliffe.forEach(function(p, i){ var q = gxy(v, p[0], p[1]); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); }); ctx.stroke();
  ctx.strokeStyle = C.blue + '.45)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  /* the Local Bubble shell */
  ctx.save(); ctx.beginPath(); d.bubble.forEach(function(b, i){ var l = b[0] * Math.PI/180, r = b[1]; var q = gxy(v, r * Math.cos(l), r * Math.sin(l)); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); }); ctx.closePath();
  ctx.fillStyle = C.gold + '.05)'; ctx.fill(); ctx.strokeStyle = C.gold + '.18)'; ctx.lineWidth = 10; ctx.stroke(); ctx.strokeStyle = C.gold + '.6)'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.restore();
  /* clusters: soft discs */
  var near = d.clusters.filter(function(c){ return Math.hypot(c[1], c[2]) <= 1040; });
  near.forEach(function(c){ var q = gxy(v, c[1], c[2]); var r = Math.max(2.5, c[6] * s * 0.9); glow(q[0], q[1], r * 2.0, C.blue, .22); dot(q[0], q[1], Math.max(1.4, r * .3), '#cfe2ff', .85); });
  /* stars */
  d.stars.forEach(function(st){ var q = gxy(v, st[0], st[1]); var r = Math.max(.6, 2.6 - st[3] * .38), far = Math.min(1, Math.abs(st[2]) / 600); ctx.globalAlpha = (0.95 - far * .55); ctx.fillStyle = starColor(st[4]); ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, Math.PI*2); ctx.fill(); });
  ctx.globalAlpha = 1;
  /* names: the bright and the near, with a crude collision pass */
  /* words first, so star names yield to them */
  scaleRings(v, [250, 500, 750, 1000], function(u){ return u.toLocaleString() + '|LIGHT-YEARS'; });
  here(v.cx, v.cy, 'THE SUN', 'THE SOLAR SYSTEM WOULD BE SMALLER THAN THIS DOT');
  var bq = gxy(v, 330, 260); label(bq[0], bq[1], 'LOCAL BUBBLE', {color:C.goldS, size:10.5, weight:700, alpha:.85}); label(bq[0], bq[1] + 13, 'THE HOT, NEARLY EMPTY CAVITY WE LIVE IN', {color:C.goldS, size:8, alpha:.6, ls:.12}); free(bq[0], bq[1] + 6, 230, 28);
  var rq = gxy(v, -600, 700); label(rq[0], rq[1], 'RADCLIFFE WAVE', {color:'#9fc5ff', size:10.5, weight:700, alpha:.85}); label(rq[0], rq[1] + 13, '9,000 LIGHT-YEARS OF STAR-FORMING GAS', {color:'#9fc5ff', size:8, alpha:.6, ls:.12}); free(rq[0], rq[1] + 6, 230, 28);
  label(v.cx, 48, '↑ TO THE GALACTIC CENTRE · 26,000 LIGHT-YEARS', {size:9.5, alpha:.55}); free(v.cx, 48, 300, 14);
  label(28, v.cy, '← THE SUN’S ORBIT RUNS THIS WAY · 500,000 MPH', {size:9.5, alpha:.55, align:'left'}); free(170, v.cy, 290, 14);
  /* names: the brightest and the nearest, each only where there is room */
  var cand = d.named.filter(function(n){ var dist = Math.hypot(n[1], n[2], n[3]); return n[4] <= 1.6 || dist <= 12; }).sort(function(a, b){ return a[4] - b[4]; });
  cand.forEach(function(n){ var q = gxy(v, n[1], n[2]); var y = q[1] - 9, t = n[0].toUpperCase(); if (!free(q[0], y, t.length * 6.2 + 10, 13)) return; label(q[0], y, t, {size:9, alpha:.8, ls:.12}); });
  near.forEach(function(c){ var nm = CLUSTER_NAMES[c[0]]; if (nm === undefined && c[4] < 1500) return; if (nm === '') return; var q = gxy(v, c[1], c[2]); var y = q[1] + 12, t = nm || c[0].toUpperCase(); if (!free(q[0], y, t.length * 6 + 10, 13)) return; label(q[0], y, t, {size:8.5, color:'#cfe2ff', alpha:.75, ls:.12}); });
}

/* ---- 2. THE MILKY WAY ---- */
/* THE REAL PICTURE (user 2026-10-10: "make the milky way realer, use a real source"). The disc is NASA/JPL-Caltech's
   face-on Milky Way by Robert Hurt (SSC/Caltech, 2008, public domain), the agency's reconstruction from Spitzer's
   infrared survey of the disc: the "Roadmap to the Milky Way". The published file carries a longitude grid and labels;
   those were removed by inpainting (scratchpad mw_dl, OpenCV top-hat mask) and the clean 2048-px copy lives on the cdn.
   Registration comes from that grid: the Galactic Centre is the picture's centre and the Sun marker sits 1,070 of
   5,600 px straight below it, which the picture calls ~26,000 ly; here that distance is R0 = 8.15 kpc, so the picture is
   scaled to put its Sun on ours. Its longitude 90 is to the left, like this frame. The measurements sit crisp on top. */
function mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function starfield(seed, n){
  var rnd = mulberry(seed);
  for (var i = 0; i < n; i++){ var x = rnd() * W, y = rnd() * H, b = rnd(); var r = b > .97 ? 1.7 : b > .85 ? 1.2 : .75;
    ctx.globalAlpha = .3 + .65 * rnd(); ctx.fillStyle = b > .9 ? '#ffffff' : (rnd() < .5 ? '#dfe8ff' : '#f6efe0'); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;
}
var MW_IMG = { url: 'https://cdn.bluishvoid.com/galaxy/milkyway_hurt.webp', px: 2048, gc: [1024, 1024], sunDy: 1070 * 2048 / 5600, img: null, failed: false };
function milkyWayPicture(){
  if (MW_IMG.img || MW_IMG.failed) return MW_IMG.img;
  var im = new Image(); im.onload = function(){ MW_IMG.img = im; if (cur === 'milkyway') render(); }; im.onerror = function(){ MW_IMG.failed = true; };
  im.src = MW_IMG.url; MW_IMG.img = null; MW_IMG.loading = im; return null;
}
function drawMilkyWay(d, v){
  var s = v.s, R0 = d.R0;
  var G = function(X, Y){ return [v.cx - Y * s, v.cy - X * s]; };   /* galactocentric: centre at (0,0), Sun at (-R0, 0) -> below */
  starfield(20261010, Math.round(W * H / 420));          /* behind the picture: it shows past the disc's feathered edge */
  var pic = milkyWayPicture();
  if (pic){ var k = (R0 * s) / MW_IMG.sunDy, side = MW_IMG.px * k;        /* picture px -> screen px, pinned by the Sun's distance */
    /* composited ADDITIVELY: the picture's black is then transparent, so the starfield behind shows wherever the
       picture is dark (user: "add stars to the borders of the image beyond the galaxy"); a soft radial alpha on an
       offscreen copy hides the square's edge and its jpeg-dark noise */
    if (!MW_IMG.off || MW_IMG.off.width !== Math.round(side * DPR)){ var off = document.createElement('canvas'); off.width = off.height = Math.round(side * DPR); var ox = off.getContext('2d'); ox.setTransform(DPR, 0, 0, DPR, 0, 0);
      ox.drawImage(pic, 0, 0, side, side); ox.globalCompositeOperation = 'destination-in';
      var fa = ox.createRadialGradient(side/2, side/2, side * .40, side/2, side/2, side * .50); fa.addColorStop(0, 'rgba(0,0,0,1)'); fa.addColorStop(1, 'rgba(0,0,0,0)'); ox.fillStyle = fa; ox.fillRect(0, 0, side, side); MW_IMG.off = off; }
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(MW_IMG.off, v.cx - MW_IMG.gc[0] * k, v.cy - MW_IMG.gc[1] * k, side, side); ctx.restore(); }
  else { var g = ctx.createRadialGradient(v.cx, v.cy, 0, v.cx, v.cy, 15 * s); g.addColorStop(0, 'rgba(255,226,180,.3)'); g.addColorStop(.5, 'rgba(130,170,235,.08)'); g.addColorStop(1, 'rgba(120,160,230,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  /* the measurements, crisp on top: Gaia clusters pale (blue when young), masers gold */
  d.clusters.forEach(function(c){ var q = G(c[0], c[1]); var young = c[2] < 7.6; ctx.globalAlpha = young ? .7 : .38; ctx.fillStyle = young ? '#bfe0ff' : '#f2e7cf'; ctx.beginPath(); ctx.arc(q[0], q[1], young ? 1.15 : 0.85, 0, Math.PI*2); ctx.fill(); });
  ctx.globalAlpha = 1;
  d.masers.forEach(function(m){ var q = G(m[1], m[2]); glow(q[0], q[1], 5, C.gold, .5); dot(q[0], q[1], 1.9, C.goldS, .95); });
  /* words */
  scaleRings(v, [5, 10, 15], function(u){ return Math.round(u * LY_KPC / 1000) + ',000' + (u === 15 ? ' LIGHT-YEARS|FROM THE CENTRE' : '|LIGHT-YEARS'); });
  dot(v.cx, v.cy, 2.2, '#ffffff'); glow(v.cx, v.cy, 14, C.white, .5); label(v.cx, v.cy - 14, 'SAGITTARIUS A*', {size:9.5, color:C.title, alpha:.9}); free(v.cx, v.cy - 14, 110, 14); label(v.cx, v.cy + 13, 'A BLACK HOLE OF FOUR MILLION SUNS', {size:8, alpha:.6, ls:.12}); free(v.cx, v.cy + 13, 220, 13);
  /* the Sun, its orbit on the open (fourth-quadrant) side, the previous frame's footprint, the way we face */
  var sun = G(-R0, 0);
  ring(v.cx, v.cy, R0 * s, C.goldS, 1, .22);
  arcLabel(v.cx, v.cy, R0 * s + 9, -38, 'THE SUN’S ORBIT|ONCE EVERY 230 MILLION YEARS', {size:8.5, color:C.goldS, alpha:.7, ls:.12});
  here(sun[0], sun[1], 'THE SUN', '26,000 LIGHT-YEARS FROM THE CENTRE');
  footprint(sun[0], sun[1], 1000 / LY_KPC * s, 'THE NEIGHBORHOOD FRAME'); free(sun[0] + 85, sun[1] - 19, 150, 13);
  var lq = G(-R0, 6.2); label(lq[0], lq[1], '← TOWARD CYGNUS · THE WAY WE ORBIT', {size:8.5, alpha:.55, ls:.12}); free(lq[0], lq[1], 230, 13);
  var rq = G(-R0, -6.2); label(rq[0], rq[1], 'TOWARD VELA →', {size:8.5, alpha:.55, ls:.12}); free(rq[0], rq[1], 100, 13);
  /* arm names at whichever end of the fitted curve lies farther from the Sun's crowd, only where there is room */
  d.arms.forEach(function(a){ if (/far side/.test(a.name)) return; var n = a.pts.length, p0 = a.pts[Math.round(n * .2)], p1 = a.pts[Math.round(n * .8)], far = (Math.hypot(p0[0] + R0, p0[1]) > Math.hypot(p1[0] + R0, p1[1])) ? p0 : p1;
    var q = G(far[0], far[1]); var nm = a.name.toUpperCase().replace(' (ORION)', ' ARM').replace(' (FAR SIDE)', ' ARM, FAR SIDE'); if (nm.indexOf('ARM') < 0) nm += ' ARM';
    var ux = q[0] - v.cx, uy = q[1] - v.cy, L = Math.hypot(ux, uy) || 1; var x = q[0] + ux / L * 14, y = q[1] + uy / L * 14;
    if (!free(x, y, nm.length * 6.5 + 10, 14)) { x = q[0] - ux / L * 14; y = q[1] - uy / L * 14; if (!free(x, y, nm.length * 6.5 + 10, 14)) return; }
    label(x, y, nm, {size:10, color:'#e4eeff', alpha:.95, ls:.14}); });
  label(W - 14, H - 14, 'THE PICTURE: NASA/JPL-CALTECH/R. HURT, FROM SPITZER’S INFRARED SURVEY OF THE DISC · GREEN: MASERS WITH RADIO PARALLAXES · PALE DOTS: GAIA CLUSTERS, BLUE WHEN YOUNG', {size:8, alpha:.5, align:'right', ls:.1});
}

/* ---- 3. THE LOCAL GROUP ---- */
function drawLocalGroup(d, v){
  var s = v.s;
  /* soft zero-velocity surface, ~1 Mpc: the model edge */
  var g = ctx.createRadialGradient(v.cx, v.cy, 700 * s, v.cx, v.cy, 1150 * s); g.addColorStop(0, 'rgba(120,180,255,0)'); g.addColorStop(.75, 'rgba(120,180,255,.07)'); g.addColorStop(1, 'rgba(120,180,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  label(v.cx, v.cy - 1050 * s, 'ROUGHLY WHERE THE GROUP’S GRAVITY GIVES WAY TO EXPANSION', {size:8.5, alpha:.5, ls:.12});
  var big = { 'Andromeda':1, 'Triangulum':1, 'LMC':1, 'SMC':1 };
  var labelMag = -13.2, labels = [];
  d.galaxies.forEach(function(gx){ var q = gxy(v, gx[1], gx[2]); var M = gx[0] === 'Andromeda' ? -21.8 : gx[4]; var r = Math.max(1.2, (M + 6) * -0.55); var isBig = big[gx[0]];
    if (isBig){ glow(q[0], q[1], r * 4, C.white, .5); }
    dot(q[0], q[1], Math.min(r, 9), isBig ? '#f4f7ff' : '#cfe2ff', isBig ? 1 : .85);
    if (M <= labelMag || isBig) labels.push([q[0], q[1] + Math.min(r, 9) + 10, gx[0].toUpperCase(), isBig]); });
  scaleRings(v, [306.6, 613.2, 919.8, 1226.4], function(u){ return Math.round(u / 306.6) + ' MILLION|LIGHT-YEARS'; });
  glow(v.cx, v.cy, 40, C.gold, .4); here(v.cx, v.cy, 'THE MILKY WAY', 'THE SUN IS 26,000 LIGHT-YEARS FROM ITS CENTRE, INSIDE THIS DOT'); footprint(v.cx, v.cy, 16 * s, 'THE MILKY WAY FRAME'); free(v.cx + 85, v.cy - 19, 150, 13);
  labels.sort(function(a, b){ return (b[3] ? 1 : 0) - (a[3] ? 1 : 0); }).forEach(function(l){ if (!free(l[0], l[1], l[2].length * (l[3] ? 7.5 : 6) + 10, 13)) return; label(l[0], l[1], l[2], {size:l[3] ? 10.5 : 8.5, weight:l[3] ? 700 : 500, color:l[3] ? C.title : C.label, alpha:l[3] ? .95 : .75, ls:.12}); });
  /* Andromeda's distance and approach */
  var m31 = d.galaxies.filter(function(x){ return x[0] === 'Andromeda'; })[0];
  if (m31){ var q = gxy(v, m31[1], m31[2]); if (free(q[0], q[1] + 32, 330, 13)) label(q[0], q[1] + 32, '2.5 MILLION LIGHT-YEARS AWAY · CLOSING AT 70 MILES A SECOND', {size:8, alpha:.6, ls:.12});
    ctx.save(); ctx.strokeStyle = C.white + '.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(q[0], q[1]); var t = .09; ctx.lineTo(q[0] + (v.cx - q[0]) * t, q[1] + (v.cy - q[1]) * t); ctx.stroke(); ctx.restore(); }
}

/* ---- 4. LANIAKEA ---- */
function drawLaniakea(d, v){
  var s = v.s;
  /* supergalactic X right, Y up; depth fades with |SGZ| */
  var S = function(x, y){ return [v.cx + x * s, v.cy - y * s]; };
  d.galaxies.forEach(function(g){ var z = Math.abs(g[2]); if (z > 60) return; var q = S(g[0], g[1]); ctx.globalAlpha = .18 + .6 * Math.max(0, 1 - z / 40); ctx.fillStyle = '#d6e6ff'; ctx.fillRect(q[0] - .6, q[1] - .6, 1.2, 1.2); });
  ctx.globalAlpha = 1;
  /* the zone of avoidance: our own disc hides two wedges along +-SGX */
  scaleRings(v, [100 / MLY_MPC, 200 / MLY_MPC, 300 / MLY_MPC, 400 / MLY_MPC], function(u){ return Math.round(u * MLY_MPC / 100) * 100 + ' MILLION|LIGHT-YEARS'; });
  here(v.cx, v.cy, 'THE LOCAL GROUP', 'MILKY WAY + ANDROMEDA, ONE DOT');
  footprint(v.cx, v.cy, 1.5 * s, 'THE LOCAL GROUP FRAME'); free(v.cx + 85, v.cy - 19, 150, 13);
  [1, -1].forEach(function(sg){ var q = S(sg * 110, 0); if (free(q[0], q[1], 190, 13)) label(q[0], q[1], 'HIDDEN BEHIND THE MILKY WAY', {size:8.5, alpha:.45, ls:.12}); });
  /* landmarks, crisp names, the big ones first */
  var BIG = /Virgo|Great Attractor|Perseus|Coma|Shapley/;
  var lms = d.landmarks.slice().sort(function(a, b){ return (BIG.test(b[0]) ? 1 : 0) - (BIG.test(a[0]) ? 1 : 0); });
  lms.forEach(function(l){ if (Math.abs(l[3]) > 90) return; var q = S(l[1], l[2]); if (Math.hypot(q[0] - v.cx, q[1] - v.cy) > 135 * s) return; var big = BIG.test(l[0]); var t = l[0].toUpperCase(), y = q[1] - (big ? 13 : 11);
    if (!free(q[0], y, t.length * (big ? 7 : 6) + 10, 13)) { y = q[1] + (big ? 15 : 13); if (!free(q[0], y, t.length * (big ? 7 : 6) + 10, 13)) return; }
    ring(q[0], q[1], big ? 7 : 5, C.goldS, 1, .75); label(q[0], y, t, {size:big ? 9.5 : 8.5, color:C.goldS, weight:big ? 700 : 500, alpha:big ? .95 : .75, ls:.12});
    if (/Great Attractor/.test(l[0]) && free(q[0], y + 13, 300, 13)) label(q[0], y + 13, 'LANIAKEA’S BASIN: EVERYTHING HERE DRIFTS THIS WAY', {size:8, color:C.goldS, alpha:.6, ls:.12}); });
  label(W - 14, H - 14, 'EACH DOT ONE GALAXY · BRIGHTER = NEARER THE SUPERGALACTIC PLANE · DISTANCES FROM REDSHIFT, SO CLUSTERS SMEAR ALONG THE LINE OF SIGHT', {size:8, alpha:.5, align:'right', ls:.1});
}

/* ---- 5. THE COSMIC WEB ---- */
function drawUniverse(d, v){
  var s = v.s, tab = d.comoving_gly;
  var dc = function(z){ var i = Math.min(tab.length - 2, Math.max(0, Math.floor(z / 0.004))); var t = (z - tab[i][0]) / 0.004; return tab[i][1] + (tab[i+1][1] - tab[i][1]) * t; };
  /* RA 0 to the right, increasing counter-clockwise; distance outward */
  var P = function(ra, g){ var a = ra * Math.PI/180; return [v.cx + g * s * Math.cos(a), v.cy - g * s * Math.sin(a)]; };
  ctx.fillStyle = '#dbe8ff'; var wall = [];
  d.galaxies.forEach(function(g){ var q = P(g[0], dc(g[1])); if (g[0] >= 150 && g[0] <= 212 && g[1] >= 0.070 && g[1] <= 0.090){ wall.push(q); return; }
    ctx.globalAlpha = .55 + .35 * Math.max(0, 1 - g[1] / 0.2); ctx.fillRect(q[0] - .55, q[1] - .55, 1.1, 1.1); });
  /* the Sloan Great Wall is highlighted literally (user: "instead of brushstroking"): the galaxies in it, RA 150-212 at
     z 0.070-0.090, drawn in the accent on top of everything else */
  ctx.globalAlpha = 1; ctx.fillStyle = C.goldS; wall.forEach(function(q){ ctx.fillRect(q[0] - .8, q[1] - .8, 1.6, 1.6); });
  scaleRings(v, [1, 2, 3], function(u){ return u === 3 ? '3 BILLION LIGHT-YEARS|THIS LIGHT LEFT 2.6 BILLION YEARS AGO' : u + ' BILLION|LIGHT-YEARS'; }, 90);
  /* the survey's edge, and the honest note about what lies beyond */
  ring(v.cx, v.cy, 3.95 * s, '#bcd6ef', 1, .18);
  label(v.cx, v.cy + 3.95 * s + 14, 'THIS SURVEY ENDS HERE · THE OBSERVABLE UNIVERSE REACHES 46 BILLION LIGHT-YEARS · THE OLDEST LIGHT IS 13.8 BILLION YEARS OLD', {size:8.5, alpha:.55, ls:.12});
  /* the Sloan Great Wall is an arc of galaxies, RA ~150-210 at z ~0.08: drawn as one, named along it */
  var rw = dc(0.102) * s;                                                  /* the name set back from the wall's far edge (z 0.090) */
  arcLabel(v.cx, v.cy, rw + 10, 181, 'SLOAN GREAT WALL|1.4 BILLION LIGHT-YEARS LONG', {color:C.goldS, size:9, weight:700, alpha:.9, ls:.14});
  /* the two fans and the gap between them, named along their rims */
  arcLabel(v.cx, v.cy, 3.7 * s, 180, 'THE NORTHERN GALACTIC SKY', {size:9, alpha:.85, ls:.14, color:C.green});   /* site green (user 2026-10-10) */
  arcLabel(v.cx, v.cy, 3.7 * s, 0, 'THE SOUTHERN STRIPE', {size:9, alpha:.85, ls:.14, color:C.green});
  arcLabel(v.cx, v.cy, 3 * s + 8, 279, 'NOT SURVEYED|OUR GALAXY IS IN THE WAY', {size:8.5, alpha:.55, ls:.12});   /* on the 3-Gly ring, at the gap's measured centre (empty RA 250-306, 56 deg: the 2-Gly ring was too tight) */
  footprint(v.cx, v.cy, 0.75 * s, 'THE LANIAKEA FRAME');
  var ha = 279 * Math.PI/180, hr = 1.42 * s; hereAt(v.cx, v.cy, v.cx + hr * Math.cos(ha), v.cy - hr * Math.sin(ha) - 20, ['HERE', 'LANIAKEA', 'THE LOCAL GROUP', 'THE MILKY WAY', 'THE SUN']);   /* in the unsurveyed wedge, a ladder of scales */
  label(W - 14, H - 14, 'EACH DOT ONE GALAXY WITH A MEASURED SPECTRUM · A SLICE 2.5° THICK ALONG THE CELESTIAL EQUATOR · DIRECTION = RIGHT ASCENSION', {size:8, alpha:.5, align:'right', ls:.1});
}

/* ---- boot ---- */
if (EMBEDDED) document.documentElement.classList.add('embedded');
document.getElementById('caption').textContent = FRAMES[cur].caption; document.getElementById('credit').textContent = FRAMES[cur].credit;
document.querySelectorAll('#ladder button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-f') === cur); });
resize();
(document.fonts && document.fonts.load ? document.fonts.load('500 12px "QelliaRegular"').catch(function(){}) : Promise.resolve()).then(function(){ return load(cur); }).then(function(){ render(); try{ if (EMBEDDED) parent.postMessage({galaxyReady:true}, '*'); }catch(_){} });
/* warm the other frames in the background so the ladder feels instant */
setTimeout(function(){ Object.keys(FRAMES).forEach(function(f){ if (f !== cur) load(f); }); }, 1500);
</script>
