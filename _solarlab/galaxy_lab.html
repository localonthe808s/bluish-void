<!--
  THE GALAXY / UNIVERSE LAB (2026-10-10, user: "create tabs for the galaxy and universe ... show our place in larger
  scales"). The third and fourth rungs after EARTH VIEW and SOLAR SYSTEM: five frames, each drawn from a catalog
  (build_galaxy.py -> galaxy/*.json), never from a painting, with the same stage, font and palette as solar_lab.html.

    NEIGHBORHOOD  1,000 light-years: HYG stars with distances, Gaia DR3 clusters, the Local Bubble shell, the Radcliffe Wave
    MILKY WAY     the disc face-on: 7,167 Gaia clusters, 199 maser parallaxes, spiral arms fitted to the masers, the Sun's orbit
    LOCAL GROUP   100 galaxies within ~5 million light-years (McConnachie 2012)
    LANIAKEA      39,700 galaxies with redshift distances in the supergalactic plane (2MASS Redshift Survey)
    COSMIC WEB    50,000 SDSS galaxies in a thin equatorial stripe, the classic fan

  Conventions: the Galactic Centre is UP in the first two frames and the Sun's rotation runs to the left (looking down
  from the north Galactic pole); every frame marks where we are in gold, shows the previous frame's footprint as a
  faint ring, and labels its scale rings in light-years. Measured points are crisp; modelled shapes (the bar, the arm
  curves beyond their masers, the Local Group's edge) are soft or fade -- edges encode certainty.
  Embedded, the host owns the tab bar: {solarTab:'galaxy'|'universe'} picks a frame, and crossing between the two
  groups on the ladder posts {solarTabChanged} back so the bar follows.

<script>
/* SLEEP WHEN UNSEEN (perf 2026-11-22, user: "do 1 2 3 4 5"): measured in the dashboard, this frame kept animating at ~55-60 frames
   a second while another SPACE tab was showing or the widget was scrolled off-screen. Every requestAnimationFrame now waits while
   the frame is not on screen (an IntersectionObserver against the page's viewport, or a hidden browser tab) and is released the
   moment it is seen again -- so every loop in this frame sleeps without each one having to know. */
(function(){
  var R = window.requestAnimationFrame.bind(window), C = window.cancelAnimationFrame.bind(window), held = [], asleep = false, seen = true;
  window.requestAnimationFrame = function(f){ if (asleep){ held.push(f); return -held.length; } return R(f); };
  window.cancelAnimationFrame = function(id){ if (id < 0){ held[-id - 1] = null; return; } return C(id); };
  function set(){ var s = !seen || document.hidden; if (s === asleep) return; asleep = s; if (!s){ var q = held; held = []; q.forEach(function(f){ if (f) R(f); }); } }
  window.__bvAsleep = function(){ return asleep; };
  function watch(){ try { new IntersectionObserver(function(es){ seen = es[es.length - 1].isIntersecting; set(); }, { rootMargin: '120px' }).observe(document.documentElement); } catch(_){} }
  document.addEventListener('visibilitychange', set);
  if (document.documentElement) watch(); else document.addEventListener('DOMContentLoaded', watch);
})();
</script>
<script>
'use strict';
var EMBEDDED = window.self !== window.top;
var GAL_BUILD = '2026-11-22q';                      /* bump when galaxy/*.json changes, so browsers refetch */
var LY_KPC = 3261.56, MLY_MPC = 3.26156;
var stage = document.getElementById('stage'), cv = document.getElementById('gal'), fcv = document.getElementById('fade');
var ctx = cv.getContext('2d');
var DATA = {}, cur = 'milkyway', W = 0, H = 0, DPR = 1;
/* fallback without Georgia: Georgia's figures are old-style (numbers sit low, smaller than the capitals; user 2026-10-11
   "adjust number sizes so theyre the same size as letters"). Qellia's own figures are lining; if it arrives late, the
   loadingdone listener below redraws in it. */
var FONT = '"QelliaRegular","Bodoni Moda","Times New Roman",Times,serif';
try { document.fonts.addEventListener('loadingdone', function(){ if (typeof render === 'function' && W) render(); }); } catch(e){}
/* palette: the navy stage, pale blue-white for the universe, gold for us */
var C = { bg:'#000', star:'#e6eefc', faint:'rgba(188,214,239,', blue:'rgba(120,180,255,', gold:'rgba(5,219,50,', white:'rgba(230,240,255,',   /* 'gold' is the accent slot: site green since 2026-10-10 */
          label:'#bcd6ef', title:'#e2eeff', goldS:'#05DB32', green:'#05DB32' };

/* ---- the frames: what each draws, in its own units; every frame gets (ctx, view) with view = {s px/unit, cx, cy} ---- */
var FRAMES = {
  neighborhood: { file:'neighborhood.json', unit:'ly', radius:1000, tab:'galaxy', title:'THE NEIGHBORHOOD',

    credit:'pictures: ESA/Gaia/DPAC, Stefan Payne-Wardenaar (CC BY-SA 3.0 IGO) · maser parallaxes: Reid+ 2019 (BeSSeL / VERA) · clusters: Hunt & Reffert 2023', draw: drawMilkyWay },
  localgroup: { file:'localgroup.json', unit:'kpc', radius:1000, tab:'universe', title:'THE LOCAL GROUP',

  laniakea: { file:'laniakea_cf4.json', unit:'Mpc', radius:135, tab:'universe', title:'LANIAKEA',

    caption:'Every dot is a group of galaxies at a measured distance. The moving specks show which way matter is falling; the green outline, Laniakea, is our supercluster, 100,000 galaxies draining toward the Great Attractor. Newer maps suggest it may be one lobe of the even larger Shapley basin.',

/* ---- plumbing ---- */
/* the caption: the full one on a wide stage, a shorter one under 700 px (review 2026-10-10: seven lines on a phone) */
function setCaption(f){ var F = FRAMES[f]; document.getElementById('caption').textContent = (window.innerWidth < 700 && F.short) ? F.short : F.caption; }
/* LOST CANVAS RECOVERY (2026-10-11, user: "when i leave the site open for a while the behind the blue tab seems to crash when
   i come back"): Chrome frees a background tab's canvas memory; the map came back blank while the HTML caption and strip
   were fine. Any lost context (the map, the fade layer, the cached Milky Way picture, the Radcliffe gas) is rebuilt and
   the frame redrawn when the context is restored or the page is shown again. (No preventDefault on contextlost: for a
   2D canvas that would BLOCK the restore.) */
function ctxLost(c){ try { var g = c && c.getContext('2d'); return !!(g && g.isContextLost && g.isContextLost()); } catch(e){ return false; } }
function recoverCanvas(force){
  if (force || (RW_GAS && ctxLost(RW_GAS.cv))) RW_GAS = null;
  if (force || (MW_IMG.off && ctxLost(MW_IMG.off))) MW_IMG.off = null;
  if (force || ctxLost(cv) || ctxLost(fcv)){ ctx = cv.getContext('2d'); resize(); } else render();
}
[cv, fcv].forEach(function(c){ c.addEventListener('contextrestored', function(){ recoverCanvas(true); }); });
var hiddenAt = 0;   /* away over a minute: rebuild everything (not every browser reports isContextLost reliably) */
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden'){ hiddenAt = Date.now(); return; }
  var away = hiddenAt ? Date.now() - hiddenAt : 0; setTimeout(function(){ recoverCanvas(away > 60000); }, 120); });
window.addEventListener('pageshow', function(e){ if (e.persisted) recoverCanvas(true); });
function resize(){
  if (FRAMES[cur]) setCaption(cur);
  var r = stage.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
  [cv, fcv].forEach(function(c){ c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); });
  render();
}
function load(f){
  if (DATA[f]) return Promise.resolve(DATA[f]);
  return fetch('galaxy/' + FRAMES[f].file + '?v=' + GAL_BUILD).then(function(r){ return r.json(); }).then(function(j){ DATA[f] = j; return j; });
}
/* MEMORY (perf 2026-11-22, item 1): after visiting every frame the cached canvases held ~234 MB on a retina screen, past what a
   phone's Safari allows (it then blanks canvases). Each frame now keeps only its own: switching frees the others' layers and big
   textures; coming back rebuilds them (each in well under a second). The shared starfield ('sky') stays. */
var FRAME_LAYERS = { milkyway: ['mwdisc'], universe: ['cwg'], localgroup: [], laniakea: [], observable: [], neighborhood: [] };
function freeOtherFrames(f){
  Object.keys(LAYERS).forEach(function(k){ if (k === 'sky') return; if ((FRAME_LAYERS[f] || []).indexOf(k) < 0) delete LAYERS[k]; });
  if (f !== 'laniakea'){ LN_PLANE = null; } if (f !== 'observable'){ OB_PL = null; OB_SH = null; OB_CONE = null; }
  if (f !== 'milkyway'){ MW_IMG.off = null; }
}

  var tr = document.getElementById('travel-row'); if (tr) tr.style.display = TRAVEL_FRAMES[f] ? '' : 'none';
  document.getElementById('credit').textContent = FRAMES[f].credit;
  if (f === 'neighborhood' && N3.introDone && window.n3Idle) setTimeout(window.n3Idle, 0);
  if (f === 'milkyway' && M3.introDone) setTimeout(mwIdle, 0);
  if (f === 'localgroup' && L3.introDone) setTimeout(lgIdle, 0);

  var PR = function(ra, r){ var a = ra * Math.PI / 180, X = r * Math.cos(a), Y = r * Math.sin(a), x1 = X * cp - Y * sp, y1 = X * sp + Y * cp; return [v.cx + x1 * s, v.cy - y1 * ct * s]; };
  var best = null, bd = 8, kind = '';
  d.quasars.forEach(function(q){ var p = PR(q[0], obR(q[1], mt)), dd = Math.abs(p[0] - x) + Math.abs(p[1] - y); if (dd < bd){ bd = dd; best = q; kind = 'Q'; } });
  if (DATA.universe) DATA.universe.galaxies.forEach(function(q){ var p = PR(q[0], obR(q[1], mt)), dd = Math.abs(p[0] - x) + Math.abs(p[1] - y); if (dd < bd){ bd = dd; best = q; kind = 'G'; } });
  var Rc = obR(C9.zcmb, mt), Rs = Rc * s, rr = Math.hypot(x - v.cx, y - v.cy);
  var fmt = function(g){ return g < 1 ? Math.round(g * 1000) + ' MILLION' : g.toFixed(1) + ' BILLION'; };
  if (best){ var z = best[1], lb = C9.lb(z), now = C9.dc(z), then = now / (1 + z), age = C9.age - lb; OBTAP = [x, y];
    return '<span class="k">' + (kind === 'Q' ? 'A QUASAR' : 'A GALAXY') + ' · REDSHIFT ' + z.toFixed(2) + '</span><b>ITS LIGHT LEFT ' + fmt(lb) + ' YEARS AGO</b>WHEN THE UNIVERSE WAS ' + fmt(age) + ' YEARS OLD' +
      '<br>IT WAS ' + fmt(then) + ' LIGHT-YEARS AWAY WHEN THE LIGHT LEFT · IT IS ' + fmt(now) + ' LIGHT-YEARS AWAY NOW' + (kind === 'Q' ? '<br>A GIANT BLACK HOLE FEEDING SO FAST IT OUTSHINES ITS WHOLE GALAXY' : ''); }
  if (Math.abs(rr - Rs) < 16 || rr > Rs){ if (rr > Rs + 30) return null;
    /* the front of the shell at this point: its direction, then the temperature there */
    var u = Math.max(-1, Math.min(1, (x - v.cx) / Rs)), w = Math.max(-1, Math.min(1, -(y - v.cy) / Rs)), r2 = Math.min(1, u * u + w * w), dp = Math.sqrt(1 - r2), y1 = w * ct - dp * st, Zc = w * st + dp * ct, X = u * cp + y1 * sp, Y = -u * sp + y1 * cp;
    var ra = Math.atan2(Y, X) * 180 / Math.PI; if (ra < 0) ra += 360; var dec = Math.asin(Math.max(-1, Math.min(1, Zc))) * 180 / Math.PI, uK = null;
    if (OBS.temp){ var tx = Math.min(359, Math.floor(ra)), ty = Math.min(179, Math.floor(90 - dec)); uK = OBS.temp.data[(ty * 360 + tx) * 4] / 255 * 600 - 300; }
    OBTAP = [x, y];
    return '<span class="k">THE MICROWAVE BACKGROUND · LIGHT FROM 380,000 YEARS AFTER THE BIG BANG</span><b>' + (uK == null ? 'THE OLDEST LIGHT' : Math.abs(uK) < 8 ? 'RIGHT AT THE AVERAGE HERE' : Math.round(Math.abs(uK)) + ' MILLIONTHS OF A DEGREE ' + (uK > 0 ? 'WARMER' : 'COOLER') + ' THAN AVERAGE') + '</b>' +
      'THE WHOLE SKY GLOWS AT 2.725 DEGREES ABOVE ABSOLUTE ZERO; THESE TINY WARM AND COOL PATCHES WERE THE SEEDS THAT GREW INTO GALAXIES AND THE COSMIC WEB · 45 BILLION LIGHT-YEARS AWAY NOW'; }
  if (ct < .25) return null;
  /* the plane point, its radius, and the redshift there (bisection on the radius) */
  var x1 = (x - v.cx) / s, y1b = -(y - v.cy) / s / ct, rad = Math.hypot(x1, y1b), lo = 0, hi = C9.zcmb; for (var k = 0; k < 60; k++){ var mz = (lo + hi) / 2; if (obR(mz, mt) < rad) lo = mz; else hi = mz; } var zt = (lo + hi) / 2;
  if (mt < .5 && Math.abs(rad - d.horizons.hubble) < .5) return '<span class="k">A HORIZON</span><b>THE HUBBLE SPHERE · 14.4 BILLION LIGHT-YEARS</b>GALAXIES PAST IT ARE CARRIED AWAY FASTER THAN LIGHT BY THE EXPANSION OF SPACE · WE STILL SEE MANY OF THEM: THEIR OLD LIGHT WAS ALREADY ON ITS WAY';
  if (mt < .5 && Math.abs(rad - d.horizons.event) < .5) return '<span class="k">A HORIZON</span><b>THE EVENT HORIZON · 16 BILLION LIGHT-YEARS</b>LIGHT GIVEN OFF TODAY BY ANYTHING PAST THIS WILL NEVER REACH US, HOWEVER LONG WE WAIT · THE EXPANSION IS SPEEDING UP';
  var era = OB_ERAS.filter(function(E){ return zt >= E[0] && zt <= E[1]; })[0], lbt = C9.lb(zt); OBTAP = [x, y];
  return '<span class="k">' + (era ? era[2] : 'THE UNIVERSE') + '</span><b>LIGHT FROM HERE LEFT ' + fmt(lbt) + ' YEARS AGO</b>WHEN THE UNIVERSE WAS ' + fmt(C9.age - lbt) + ' YEARS OLD' + (era ? ' · ' + era[3] : '') + ' · REDSHIFT ' + (zt < 10 ? zt.toFixed(2) : Math.round(zt));
}

/* warm the other frames in the background so the ladder feels instant */
/* PREFETCH (perf review 2026-10-11): a desktop fetches every frame 1.5 s after opening (~830 KB compressed); a phone, or
   any browser asking to save data, fetches only the frames next to the one showing, and again after each move */
var LEAN = window.innerWidth < 700 || !!(navigator.connection && navigator.connection.saveData);
function prefetchNear(f){ var K = Object.keys(FRAMES), i = K.indexOf(f); [K[i - 1], K[i + 1]].forEach(function(k){ if (k) load(k); }); }
setTimeout(function(){ if (LEAN) prefetchNear(cur); else Object.keys(FRAMES).forEach(function(f){ if (f !== cur) load(f); }); }, 1500);
