<title>GALAXY · UNIVERSE — our place at larger scales</title>
<!--
  THE GALAXY / UNIVERSE LAB (2026-10-10, user: "create tabs for the galaxy and universe ... show our place in larger
  scales"). The third and fourth rungs after EARTH VIEW and SOLAR SYSTEM: five frames, each drawn from a catalog
  (build_galaxy.py -> galaxy/*.json), never from a painting, with the same stage, font and palette as solar_lab.html.

    NEIGHBORHOOD  1,000 light-years: HYG stars with distances, Gaia DR3 clusters, the Local Bubble shell, the Radcliffe Wave
    MILKY WAY     the disc face-on: 7,167 Gaia clusters, 199 maser parallaxes, spiral arms fitted to the masers, the Sun's orbit
    LOCAL GROUP   100 galaxies within ~5 million light-years (McConnachie 2012)
    LANIAKEA      39,700 galaxies with redshift distances in the supergalactic plane (2MASS Redshift Survey)
    COSMIC WEB    50,000 SDSS galaxies in a thin equatorial stripe, the classic fan

  Conventions: the Galactic Centre is UP in the first two frames and the Sun's rotation runs to the left (looking down
  from the north Galactic pole); every frame marks where we are in gold, shows the previous frame's footprint as a
  faint ring, and labels its scale rings in light-years. Measured points are crisp; modelled shapes (the bar, the arm
  curves beyond their masers, the Local Group's edge) are soft or fade -- edges encode certainty.
  Embedded, the host owns the tab bar: {solarTab:'galaxy'|'universe'} picks a frame, and crossing between the two
  groups on the ladder posts {solarTabChanged} back so the bar follows.
-->
<style>
  @font-face{ font-family:"QelliaRegular"; src:url('https://cdn.bluishvoid.com/qellia.woff2?v=1') format('woff2'); font-display:swap; }
  :root{ --ink:#2B22F4; --ink-dim:rgba(43,34,244,.55); }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:transparent; color:var(--ink);
        overflow:hidden; display:flex; flex-direction:column; height:100vh; }
  #stage{ position:relative; flex:1; min-height:0; order:1; overflow:hidden; background:#000; }   /* black, not navy (user 2026-10-13) */
  #stage canvas{ position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  #fade{ pointer-events:none; opacity:0; transition:opacity .45s ease; }
  /* ---- HUD under the map: the ladder of frames (styled like the solar lab's zoom rungs) and the caption ---- */
  /* the 100 YEARS toggle: on the stage so the embedded page has it too */
  /* the distance toggle lives in the subtext now, above the numbers it opens (user 2026-10-11) */
  #travel-row{ display:flex; justify-content:center; margin-top:4px; }
  /* green when off, blue when on (user 2026-10-11) */
  #century{ border:0; border-radius:999px; padding:7px 15px; font:800 .64rem/1 system-ui,sans-serif; letter-spacing:.14em;
            color:#0a1122; background:#05DB32; cursor:pointer; box-shadow:0 0 0 0 rgba(5,219,50,0); transition:box-shadow .15s; }
  #century:hover{ filter:brightness(1.06); } #century.on{ background:#2B22F4; color:#fff; }   /* on = site blue, no ring (user 2026-10-11) */
  #hud{ order:2; display:flex; flex-direction:column; gap:4px; padding:8px 12px 10px; }
  #ladder{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:2px 4px; }
  #ladder button{ border:none; background:transparent; padding:3px 10px; font-size:.62rem; line-height:1.15; border-radius:999px;
                  color:#2B22F4; font-weight:800; letter-spacing:.05em; opacity:.45; transition:opacity .15s; cursor:pointer; font-family:inherit; }
  #ladder button:hover{ opacity:.8; } #ladder button.active{ opacity:1; }
  #ladder .sep{ width:1px; height:12px; background:rgba(43,34,244,.25); margin:0 6px; }
  #caption{ text-align:center; font-size:.8rem; line-height:1.5; color:var(--ink-dim); font-weight:600; letter-spacing:.02em; max-width:960px; margin:0 auto; }
  /* THE TRAVEL NUMBERS, off the map (user 2026-10-11: "make a normal subtext view for this info ... move the distance into
     there too off the visual"): shown under the ladder while the SINCE toggle is on */
  /* THE TRAVEL STRIP, back on the map along its full bottom, two rows at most (user 2026-10-11: "move distance info back
     into the visual but along the full bottom, avoid needing more than 2 rows") */
  #travel{ display:none; position:absolute; left:0; right:0; bottom:0; z-index:2; padding:16px 18px 9px; text-align:center; pointer-events:none;
           background:linear-gradient(to bottom, rgba(10,17,34,0), rgba(10,17,34,.82) 38%, rgba(10,17,34,.92)); color:#05DB32; }
  #travel.on{ display:block; }
  #travel .r{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #travel .r1{ font-size:.74rem; font-weight:800; letter-spacing:.07em; }
  #travel .r2{ font-size:.66rem; font-weight:600; letter-spacing:.03em; opacity:.85; margin-top:3px; }
  #travel .p1, #travel .p2{ display:none; }
  @media (max-width:640px){ #travel{ padding:14px 10px 7px; } #travel .r1, #travel .r2{ display:none; } #travel .p1, #travel .p2{ display:block; } #travel .p1{ font-size:.66rem; font-weight:800; letter-spacing:.04em; } #travel .p2{ font-size:.54rem; font-weight:700; letter-spacing:.06em; opacity:.85; margin-top:3px; } }
  #credit{ text-align:center; font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:rgba(43,34,244,.45); font-weight:800; }
  #credit a{ color:inherit; text-decoration:none; }
  /* THE HUD IN BLACK, GREEN TYPE (user 2026-10-15: "make this black background with green text replacing the blue") */
  #hud{ background:#000; }
  #ladder button{ color:#05DB32; } #ladder .sep{ background:rgba(5,219,50,.3); }
  #caption{ color:rgba(5,219,50,.82); } #credit{ color:rgba(5,219,50,.55); }
  /* the same soft green pill as SINCE THE FIRST PAINTING; on = an outline, like the solar view's PAUSE */
  #edge{ margin-left:8px; border:0; border-radius:999px; padding:7px 15px; font:800 .64rem/1 system-ui,sans-serif; letter-spacing:.14em; color:#0a1122; background:#05DB32; cursor:pointer; }

  #turn:hover{ filter:brightness(1.06); } #turn.on{ background:transparent; color:#05DB32; box-shadow:inset 0 0 0 1.6px #05DB32; }
  /* a picked star or maser opens as the YOUR SPEED card does (user 2026-11-22): full width at the top, site green, black type */
  #gx-pick{ position:absolute; display:none; z-index:8; left:12px; right:12px; top:var(--gx-pick-top,52px); padding:12px 40px 12px 16px; border-radius:14px;
    background:#05DB32; color:#000; text-align:center; font:700 .64rem/1.45 system-ui,sans-serif; letter-spacing:.1em; box-shadow:0 6px 24px rgba(0,0,0,.45); }
  #gx-pick b{ display:block; font-size:.95rem; font-weight:850; letter-spacing:.05em; margin-bottom:3px; }
  #gx-pick .k{ display:block; font-size:.6rem; font-weight:800; letter-spacing:.14em; opacity:.6; margin-bottom:2px; }
  #gx-pick .x{ position:absolute; top:8px; right:12px; background:none; border:0; color:#000; font:700 14px system-ui,sans-serif; padding:2px 4px; }
  #gx-hint{ position:absolute; left:14px; bottom:12px; font:800 9px system-ui,sans-serif; letter-spacing:.18em; color:rgba(5,219,50,.6); pointer-events:none; display:none; }
  /* sources live in THE COSMOS's SOURCES popup, never on the page (site rule; user 2026-11-22) */
  #credit{ display:none !important; }
  #century.on{ background:#05DB32; color:#000; box-shadow:0 0 12px rgba(5,219,50,.55); }
  /* embedded on desktop the host pins the map height and sizes the frame to our content, as the other labs do */
  html.fixed-map body{ height:auto; min-height:0; } html.fixed-map #stage{ flex:none; }
  @media (max-width:640px){ #ladder button{ font-size:.56rem; padding:3px 7px; } #caption{ font-size:.74rem; } #travel .w{ font-size:.74rem; } }
</style>

<body>
<div id="stage"><canvas id="gal"></canvas><canvas id="fade"></canvas><div id="travel"></div><div id="gx-pick"></div><div id="gx-hint"></div></div>
<div id="hud">
  <div id="ladder">
    <button data-f="neighborhood" data-tab="galaxy">NEIGHBORHOOD</button>
    <button data-f="milkyway" data-tab="galaxy" class="active">MILKY WAY</button>
    <span class="sep"></span>
    <button data-f="localgroup" data-tab="universe">LOCAL GROUP</button>
    <button data-f="laniakea" data-tab="universe">LANIAKEA</button>
    <button data-f="universe" data-tab="universe">COSMIC WEB</button>
    <button data-f="observable" data-tab="universe">OBSERVABLE UNIVERSE</button>
  </div>
  <div id="travel-row"><button id="century" type="button">SINCE THE FIRST PAINTING</button><button id="turn" type="button" style="display:none">TURN THE GALAXY</button><button id="edge" type="button" style="display:none">SEE IT EDGE-ON</button></div>
  <div id="caption"></div>
  <div id="credit"></div>
</div>
<script>
'use strict';
var EMBEDDED = window.self !== window.top;
var GAL_BUILD = '2026-10-11b';                      /* bump when galaxy/*.json changes, so browsers refetch */
var LY_KPC = 3261.56, MLY_MPC = 3.26156;
var stage = document.getElementById('stage'), cv = document.getElementById('gal'), fcv = document.getElementById('fade');
var ctx = cv.getContext('2d');
var DATA = {}, cur = 'milkyway', W = 0, H = 0, DPR = 1;
/* fallback without Georgia: Georgia's figures are old-style (numbers sit low, smaller than the capitals; user 2026-10-11
   "adjust number sizes so theyre the same size as letters"). Qellia's own figures are lining; if it arrives late, the
   loadingdone listener below redraws in it. */
var FONT = '"QelliaRegular","Bodoni Moda","Times New Roman",Times,serif';
try { document.fonts.addEventListener('loadingdone', function(){ if (typeof render === 'function' && W) render(); }); } catch(e){}
/* palette: the navy stage, pale blue-white for the universe, gold for us */
var C = { bg:'#000', star:'#e6eefc', faint:'rgba(188,214,239,', blue:'rgba(120,180,255,', gold:'rgba(5,219,50,', white:'rgba(230,240,255,',   /* 'gold' is the accent slot: site green since 2026-10-10 */
          label:'#bcd6ef', title:'#e2eeff', goldS:'#05DB32', green:'#05DB32' };

/* ---- the frames: what each draws, in its own units; every frame gets (ctx, view) with view = {s px/unit, cx, cy} ---- */
var FRAMES = {
  neighborhood: { file:'neighborhood.json', unit:'ly', radius:1000, tab:'galaxy', title:'THE NEIGHBORHOOD',
    short:'A thousand light-years around the Sun, every star at its measured distance. We live inside the Local Bubble, a cavity blown out by supernovas, beside the Radcliffe Wave, a ribbon of gas where Orion’s stars are being born.',
    caption:'A thousand light-years around the Sun, every star at its measured distance. We live inside the Local Bubble, a cavity blown out by supernovas, beside the Radcliffe Wave, a ribbon of gas where Orion’s stars are being born.',
    credit:'HYG v4.1 · Gaia DR3 clusters, Hunt & Reffert 2023 · Local Bubble, Pelgrims+ 2020 · Radcliffe Wave, Alves+ 2020', draw: drawNeighborhood },
  milkyway: { file:'milkyway.json', unit:'kpc', radius:16.5, tab:'galaxy', title:'THE MILKY WAY',
    short:'Our Galaxy from above: 100,000 light-years of spiral arms, with the Sun about halfway out. One lap of the centre takes 230 million years; last time round, dinosaurs were just appearing.',
    caption:'Our Galaxy from above: 100,000 light-years of spiral arms, with the Sun about halfway out. One lap of the centre takes 230 million years; last time round, dinosaurs were just appearing.',
    credit:'picture: NASA/JPL-Caltech/R. Hurt (SSC/Caltech) · maser parallaxes: Reid+ 2019 (BeSSeL / VERA) · clusters: Hunt & Reffert 2023', draw: drawMilkyWay },
  localgroup: { file:'localgroup.json', unit:'kpc', radius:1000, tab:'universe', title:'THE LOCAL GROUP',
    short:'118 galaxies, two of them giants. Andromeda is falling toward us at 70 miles a second. A merger is likely but not certain, most likely 6 to 8 billion years from now.',
    caption:'118 galaxies, two of them giants. Andromeda is falling toward us at 70 miles a second. A merger is likely but not certain, most likely 6 to 8 billion years from now.',
    credit:'Local Volume Database, Pace 2024 (CC0) · Andromeda’s approach: HST proper motions, van der Marel+ 2012 · centre of mass: Andromeda ~1.5× the Milky Way', draw: drawLocalGroup },
  laniakea: { file:'laniakea_cf4.json', unit:'Mpc', radius:135, tab:'universe', title:'LANIAKEA',
    short:'Every dot is a group of galaxies at a measured distance. The lines show which way matter is falling; the tinted basin, Laniakea, is our supercluster, 100,000 galaxies draining toward the Great Attractor. Newer maps suggest it may be one lobe of the even larger Shapley basin.',
    caption:'Every dot is a group of galaxies at a measured distance. The lines show which way matter is falling; the tinted basin, Laniakea, is our supercluster, 100,000 galaxies draining toward the Great Attractor. Newer maps suggest it may be one lobe of the even larger Shapley basin.',
    credit:'Cosmicflows-4, Tully+ 2023 (55,877 measured distances) · Laniakea: Tully, Courtois, Hoffman & Pomarède 2014; boundary Dupuy & Courtois 2023 · flow: Courtois+ 2023 velocity field', draw: drawLaniakea },
  universe: { file:'universe.json', unit:'Gly', radius:4.0, tab:'universe', title:'THE COSMIC WEB',
    short:'50,000 galaxies mapped by the Sloan telescope in one thin slice of sky. They gather into filaments and walls around vast empty voids: the cosmic web.',
    caption:'50,000 galaxies mapped by the Sloan telescope in one thin slice of sky. They gather into filaments and walls around vast empty voids: the cosmic web.',
    credit:'SDSS DR18 spectroscopic galaxies · comoving distances, flat ΛCDM', draw: drawUniverse },
  observable: { file:'observable.json', unit:'Gly', radius:52, tab:'universe', title:'THE OBSERVABLE UNIVERSE',
    short:'Everything we can ever see: 93 billion light-years across, rimmed by the Big Bang’s afterglow. Space goes on past it, at least 250 times as much of it, but that light hasn’t reached us yet.',
    caption:'Everything we can ever see: 93 billion light-years across, rimmed by the Big Bang’s afterglow. Space goes on past it, at least 250 times as much of it, but that light hasn’t reached us yet.',
    credit:'SDSS DR18 quasars · WMAP 9-year sky (NASA / LAMBDA) · Planck 2018 · Davis & Lineweaver 2004 · Vardanyan, Trotta & Silk 2011', draw: drawObservable }
};

/* ---- plumbing ---- */
/* the caption: the full one on a wide stage, a shorter one under 700 px (review 2026-10-10: seven lines on a phone) */
function setCaption(f){ var F = FRAMES[f]; document.getElementById('caption').textContent = (window.innerWidth < 700 && F.short) ? F.short : F.caption; }
/* LOST CANVAS RECOVERY (2026-10-11, user: "when i leave the site open for a while the behind the blue tab seems to crash when
   i come back"): Chrome frees a background tab's canvas memory; the map came back blank while the HTML caption and strip
   were fine. Any lost context (the map, the fade layer, the cached Milky Way picture, the Radcliffe gas) is rebuilt and
   the frame redrawn when the context is restored or the page is shown again. (No preventDefault on contextlost: for a
   2D canvas that would BLOCK the restore.) */
function ctxLost(c){ try { var g = c && c.getContext('2d'); return !!(g && g.isContextLost && g.isContextLost()); } catch(e){ return false; } }
function recoverCanvas(force){
  if (force || (RW_GAS && ctxLost(RW_GAS.cv))) RW_GAS = null;
  if (force || (MW_IMG.off && ctxLost(MW_IMG.off))) MW_IMG.off = null;
  if (force || ctxLost(cv) || ctxLost(fcv)){ ctx = cv.getContext('2d'); resize(); } else render();
}
[cv, fcv].forEach(function(c){ c.addEventListener('contextrestored', function(){ recoverCanvas(true); }); });
var hiddenAt = 0;   /* away over a minute: rebuild everything (not every browser reports isContextLost reliably) */
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden'){ hiddenAt = Date.now(); return; }
  var away = hiddenAt ? Date.now() - hiddenAt : 0; setTimeout(function(){ recoverCanvas(away > 60000); }, 120); });
window.addEventListener('pageshow', function(e){ if (e.persisted) recoverCanvas(true); });
function resize(){
  if (FRAMES[cur]) setCaption(cur);
  var r = stage.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
  [cv, fcv].forEach(function(c){ c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); });
  render();
}
function load(f){
  if (DATA[f]) return Promise.resolve(DATA[f]);
  return fetch('galaxy/' + FRAMES[f].file + '?v=' + GAL_BUILD).then(function(r){ return r.json(); }).then(function(j){ DATA[f] = j; return j; });
}
function show(f, viaHost){
  if (!FRAMES[f]) return;
  var prev = cur; cur = f;
  document.querySelectorAll('#ladder button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-f') === f); });
  setCaption(f);
  /* only the frames that draw the trip keep the button (user 2026-11-11, on THE OBSERVABLE UNIVERSE: "i dont think this button is worth it here,
     the text moves oddly and you cant see anything change on the map"): THE COSMIC WEB and THE OBSERVABLE UNIVERSE draw nothing for it */
  var tr = document.getElementById('travel-row'); if (tr) tr.style.display = TRAVEL_FRAMES[f] ? '' : 'none';
  document.getElementById('credit').textContent = FRAMES[f].credit;
  if (f === 'neighborhood' && N3.introDone && window.n3Idle) setTimeout(window.n3Idle, 0);   /* back to the frame: the idle turn resumes */
  document.getElementById('turn').style.display = f === 'milkyway' ? '' : 'none'; document.getElementById('edge').style.display = f === 'milkyway' ? '' : 'none'; MWTAP = null; document.getElementById('gx-pick').style.display = 'none';
  var hn = document.getElementById('gx-hint'); hn.style.display = (f === 'neighborhood' || f === 'milkyway') ? 'block' : 'none'; hn.style.bottom = f === 'milkyway' ? '30px' : ''; var crs = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  hn.textContent = f === 'milkyway' ? (crs ? 'TAP ANYWHERE ON THE DISC' : 'TAP ANYWHERE · DRAG TO TILT · DOUBLE-CLICK TO LAY FLAT') : crs ? 'SWIPE SIDEWAYS TO TURN' : 'DRAG TO TURN · DOUBLE-CLICK TO LAY FLAT';
  document.getElementById('stage').style.touchAction = (f === 'neighborhood' || f === 'milkyway') ? 'pan-y' : '';
  if (EMBEDDED && !viaHost && FRAMES[prev].tab !== FRAMES[f].tab){ try{ parent.postMessage({solarTabChanged: FRAMES[f].tab}, '*'); }catch(_){} }
  if (EMBEDDED){ try{ parent.postMessage({galaxyFrameChanged: f}, '*'); }catch(_){} }
  /* cross-fade: the old picture is copied onto the fade canvas and dissolved over the new one */
  if (prev !== f && W){ var fc = fcv.getContext('2d'); fc.clearRect(0, 0, fcv.width, fcv.height); fc.drawImage(cv, 0, 0); fcv.style.transition = 'none'; fcv.style.opacity = 1;
    requestAnimationFrame(function(){ fcv.style.transition = ''; fcv.style.opacity = 0; }); }
  load(f).then(function(){ if (cur === f) render(); });
  if (typeof LEAN !== 'undefined' && LEAN) setTimeout(function(){ prefetchNear(f); }, 600);
}
document.querySelectorAll('#ladder button').forEach(function(b){ b.addEventListener('click', function(){ show(b.getAttribute('data-f')); }); });
window.addEventListener('resize', resize);
window.addEventListener('message', function(e){
  if (!e.data) return;
  if (e.data.solarTab === 'galaxy') show(FRAMES[cur].tab === 'galaxy' ? cur : 'milkyway', true);
  if (e.data.solarTab === 'universe') show(FRAMES[cur].tab === 'universe' ? cur : 'universe', true);
  if (e.data.galaxyFrame && FRAMES[e.data.galaxyFrame]) show(e.data.galaxyFrame, true);
  if (e.data.bvLocation && typeof e.data.bvLocation.lat === 'number'){ GLOC = { lat: e.data.bvLocation.lat, lon: e.data.bvLocation.lon }; UP_TONIGHT = null; if (cur === 'neighborhood') render(); }
  if (typeof e.data.century === 'boolean'){ CENTURY = e.data.century; document.getElementById('century').classList.toggle('on', CENTURY); render(); }
  if (typeof e.data.spaceMapH === 'number'){ var h = e.data.spaceMapH | 0; document.documentElement.classList.toggle('fixed-map', h > 0); stage.style.height = h > 0 ? h + 'px' : ''; resize();
    try{ parent.postMessage({spaceHeight: document.body.scrollHeight}, '*'); }catch(_){} }
});
/* DRAG TO TURN THE NEIGHBORHOOD (item 1): sideways spins it about the Galactic pole, up/down tilts it (touch: sideways only, so a
   vertical swipe still scrolls the page); double-click lays it face-on again. A short tilt plays the first time it opens. */
(function(){
  var st = document.getElementById('stage'), raf = 0, ask = function(){ if (!raf) raf = requestAnimationFrame(function(){ raf = 0; render(); }); };
  /* the Milky Way tilts too (user 2026-11-22, item 1): its own state M3; the neighborhood keeps N3 */
  st.addEventListener('pointerdown', function(e){ if ((cur !== 'neighborhood' && cur !== 'milkyway') || e.target.closest('#gx-pick')) return; var S3 = cur === 'milkyway' ? M3 : N3;
    N3.drag = { x: e.clientX, y: e.clientY, yaw: S3.yaw, tilt: S3.tilt, touch: e.pointerType === 'touch', S: S3, max: cur === 'milkyway' ? 1.48 : 1.25 }; if (S3 === N3) N3.introDone = true; N3.moved = false; N3.touched = performance.now(); });
  window.addEventListener('pointermove', function(e){ if (!N3.drag) return; var D = N3.drag; N3.touched = performance.now(); if (Math.hypot(e.clientX - D.x, e.clientY - D.y) > 4) N3.moved = true; if (!N3.moved) return;
    D.S.yaw = D.yaw + (e.clientX - D.x) * .006; if (!D.touch) D.S.tilt = Math.max(0, Math.min(D.max, D.tilt + (e.clientY - D.y) * .006)); if (D.S === M3) edgeBtn(); ask(); });
  window.addEventListener('pointerup', function(){ N3.drag = null; });

  ctx.save(); ctx.lineWidth = .8; ctx.lineJoin = 'round';
  F.lines.forEach(function(ln){ ctx.strokeStyle = ln.lan ? C.gold + '.17)' : 'rgba(188,214,239,.085)'; ctx.beginPath(); ln.pts.forEach(function(p, i){ var q = S(p[0], p[1]); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); }); ctx.stroke(); });
  ctx.restore();
  /* the groups at their measured distances, bigger with more members, dimmer away from the plane */
  d.groups.forEach(function(g){ var z = Math.abs(g[2]); if (z > 60) return; var q = S(g[0], g[1]); var r = Math.min(2.4, 0.55 + 0.35 * Math.sqrt(g[3])); ctx.globalAlpha = .22 + .6 * Math.max(0, 1 - z / 45); ctx.fillStyle = '#d6e6ff'; ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, Math.PI*2); ctx.fill(); });
  ctx.globalAlpha = 1;
  scaleRings(v, [100 / MLY_MPC, 200 / MLY_MPC, 300 / MLY_MPC, 400 / MLY_MPC], function(u){ return Math.round(u * MLY_MPC / 100) * 100 + ' MILLION|LIGHT-YEARS'; });
  here(v.cx, v.cy, 'THE LOCAL GROUP', 'MILKY WAY + ANDROMEDA, ONE DOT');
  /* the Local Group through the universe: 620 km/s = 1,386,900 mph against the microwave background toward l 271.9 b 29.6 (Planck 2018,
     updated 2026-10-11 from Kogut+ 1993's 627 km/s to l 276 b 30); supergalactic (-0.61, 0.56, -0.56).
     which in supergalactic xyz is (-0.65, 0.56, -0.51): between Virgo (up) and the Great Attractor (left). (Fixed 2026-10-11: the
     old arrow pointed down-right, nearly backwards.) Counting the Sun's motion inside the group: Planck's dipole, 369.8 km/s. */
  if (CENTURY) eonLine(v.cx, v.cy, -0.61, -0.56, 1386900, s / 3.26156e6, 'THE LOCAL GROUP, THROUGH THE UNIVERSE', SPAN_YR > 1e8 ? 'AGAINST THE BIG BANG’S AFTERGLOW, TOWARD VIRGO AND THE GREAT ATTRACTOR. THE FLOW GREW OVER TIME, SO THE REAL PATH WAS SHORTER.' : 'AGAINST THE BIG BANG’S AFTERGLOW, TOWARD VIRGO AND THE GREAT ATTRACTOR.', 'TOWARD VIRGO AND THE GREAT ATTRACTOR', SPAN_YR > 1e8 ? null : [827265, 'WITH THE SUN’S ORBIT, WHICH POINTS PARTLY AGAINST IT']);
  footprint(v.cx, v.cy, 1.5 * s, 'THE LOCAL GROUP FRAME'); claim(v.cx + 85, v.cy - 19, 150, 13);
  [1, -1].forEach(function(sg){ var q = S(sg * 110, 0); if (free(q[0], q[1], 190, 13)) label(q[0], q[1], 'HIDDEN BEHIND THE MILKY WAY', {size:8.5, alpha:.45, ls:.12}); });
  /* landmarks, crisp names, the big ones first */
  var BIG = /Virgo|Great Attractor|Perseus|Coma|Shapley/;
  var lms = d.landmarks.slice().sort(function(a, b){ return (BIG.test(b[0]) ? 1 : 0) - (BIG.test(a[0]) ? 1 : 0); });
  lms.forEach(function(l){ if (Math.abs(l[3]) > 90) return; var q = S(l[1], l[2]); if (Math.hypot(q[0] - v.cx, q[1] - v.cy) > 135 * s) return; var big = BIG.test(l[0]); var t = l[0].toUpperCase(), y = q[1] - (big ? 13 : 11);
    if (/Great Attractor/.test(l[0])){ ring(q[0], q[1], 8, C.goldS, 1.2, .9); label(q[0], q[1] + 17, 'THE GREAT ATTRACTOR', {size:9.5, color:C.goldS, weight:700, alpha:.95, ls:.12}); label(q[0], q[1] + 30, 'NORMA CLUSTER · BEHIND THE MILKY WAY', {size:8, color:C.goldS, alpha:.65, ls:.12}); claim(q[0], q[1] + 23, 220, 28); return; }   /* always named: the flow's target (2026-10-11 review) */
    if (/Virgo/.test(l[0])){ ring(q[0], q[1], 7, C.goldS, 1, .75); label(q[0] - 46, q[1] - 14, t, {size:9.5, color:C.goldS, weight:700, alpha:.95, ls:.12}); claim(q[0] - 46, q[1] - 14, 100, 13); return; }   /* always named: it is our nearest city */
    if (!free(q[0], y, t.length * (big ? 7 : 6) + 10, 13)) { y = q[1] + (big ? 15 : 13); if (!free(q[0], y, t.length * (big ? 7 : 6) + 10, 13)) return; }
    ring(q[0], q[1], big ? 7 : 5, C.goldS, 1, .75); label(q[0], y, t, {size:big ? 9.5 : 8.5, color:C.goldS, weight:big ? 700 : 500, alpha:big ? .95 : .75, ls:.12});
    if (/Great Attractor/.test(l[0]) && free(q[0], y + 13, 300, 13)) label(q[0], y + 13, 'BEHIND THE MILKY WAY · FOUND BY THE GALAXIES FALLING TOWARD IT', {size:8, color:C.goldS, alpha:.6, ls:.12}); });
  legend('DOTS: COSMICFLOWS-4 GROUPS AT MEASURED DISTANCES · LINES: THE MEASURED FLOW (COURTOIS+ 2023) · TINT: LANIAKEA, AS THE COSMICFLOWS TEAM DRAWS IT (DUPUY & COURTOIS 2023)');
}

/* ---- 5. THE COSMIC WEB ---- */
function drawUniverse(d, v){
  var s = v.s, tab = d.comoving_gly;
  var dc = function(z){ var i = Math.min(tab.length - 2, Math.max(0, Math.floor(z / 0.004))); var t = (z - tab[i][0]) / 0.004; return tab[i][1] + (tab[i+1][1] - tab[i][1]) * t; };
  /* RA 0 to the right, increasing counter-clockwise; distance outward */
  var P = function(ra, g){ var a = ra * Math.PI/180; return [v.cx + g * s * Math.cos(a), v.cy - g * s * Math.sin(a)]; };
  ctx.fillStyle = '#dbe8ff'; var wall = [];
  d.galaxies.forEach(function(g){ var q = P(g[0], dc(g[1])); if (g[0] >= 150 && g[0] <= 212 && g[1] >= 0.070 && g[1] <= 0.090){ wall.push(q); return; }
    ctx.globalAlpha = .55 + .35 * Math.max(0, 1 - g[1] / 0.2); ctx.fillRect(q[0] - .55, q[1] - .55, 1.1, 1.1); });
  /* the Sloan Great Wall is highlighted literally (user: "instead of brushstroking"): the galaxies in it, RA 150-212 at
     z 0.070-0.090, drawn in the accent on top of everything else */
  ctx.globalAlpha = 1; ctx.fillStyle = C.goldS; wall.forEach(function(q){ ctx.fillRect(q[0] - .8, q[1] - .8, 1.6, 1.6); });
  scaleRings(v, [1, 2, 3], function(u){ return u === 3 ? '3 BILLION LIGHT-YEARS|THIS LIGHT LEFT 2.6 BILLION YEARS AGO' : u + ' BILLION|LIGHT-YEARS'; }, 90);
  /* the survey's edge, and the honest note about what lies beyond */
  ring(v.cx, v.cy, 3.95 * s, '#bcd6ef', 1, .18);
  label(v.cx, v.cy + 3.95 * s + 14, 'THIS SURVEY ENDS HERE · THE OBSERVABLE UNIVERSE REACHES 46 BILLION LIGHT-YEARS · THE OLDEST LIGHT IS 13.8 BILLION YEARS OLD', {color:'#05DB32', size:8.5, alpha:.62, ls:.12});
  /* the Sloan Great Wall is an arc of galaxies, RA ~150-210 at z ~0.08: drawn as one, named along it */
  var rw = dc(0.102) * s;                                                  /* the name set back from the wall's far edge (z 0.090) */
  arcLabel(v.cx, v.cy, rw + 10, 181, 'SLOAN GREAT WALL|1.4 BILLION LIGHT-YEARS LONG', {color:C.goldS, size:9, weight:700, alpha:.9, ls:.14});
  /* the two fans and the gap between them, named along their rims */
  arcLabel(v.cx, v.cy, 3.7 * s, 180, 'THE NORTHERN GALACTIC SKY', {size:9, alpha:.85, ls:.14, color:C.green});   /* site green (user 2026-10-10) */
  arcLabel(v.cx, v.cy, 3.7 * s, 0, 'THE SOUTHERN STRIPE', {size:9, alpha:.85, ls:.14, color:C.green});
  arcLabel(v.cx, v.cy, 3 * s + 8, 279, 'NOT SURVEYED|OUR GALAXY IS IN THE WAY', {size:8.5, alpha:.55, ls:.12});   /* on the 3-Gly ring, at the gap's measured centre (empty RA 250-306, 56 deg: the 2-Gly ring was too tight) */
  footprint(v.cx, v.cy, 0.75 * s, 'THE LANIAKEA FRAME');
  var ha = 279 * Math.PI/180, hr = 1.42 * s; hereAt(v.cx, v.cy, v.cx + hr * Math.cos(ha), v.cy - hr * Math.sin(ha) - 20, ['HERE', 'LANIAKEA', 'THE LOCAL GROUP', 'THE MILKY WAY', 'THE SUN']);   /* in the unsurveyed wedge, a ladder of scales */
  legend('EACH DOT ONE GALAXY WITH A MEASURED SPECTRUM · A SLICE 2.5° THICK ALONG THE CELESTIAL EQUATOR · DIRECTION = RIGHT ASCENSION');
}

/* ---- 6. THE OBSERVABLE UNIVERSE ---- */
/* (user 2026-10-10: "can the unobservable universe surround the observable cosmic web? ... build it") The convention is
   Gott & Juric's Map of the Universe (2005): everything by comoving distance out to the microwave background, which IS
   the edge of what can be seen; the horizons are Davis & Lineweaver's (2004). Beyond the rim nothing can be drawn from
   data, so the unobservable universe is a darker field with its one known fact on it (Vardanyan, Trotta & Silk 2011). */
function cmbColor(uK){ var t = Math.max(-1, Math.min(1, uK / 220));                                      /* WMAP's blue-cold, red-hot */
  var c = t < 0 ? [40 + 150 * (1 + t), 90 + 140 * (1 + t), 210 + 30 * (1 + t)] : [230 - 10 * t, 230 - 170 * t, 240 - 190 * t];
  return 'rgb(' + c.map(Math.round).join(',') + ')'; }
function drawObservable(d, v){
  var s = v.s, tab = d.comoving_gly, H0 = d.horizons;
  if (!DATA.universe) load('universe').then(function(){ if (cur === 'observable') render(); });
  var dc = function(z){ var i = Math.min(tab.length - 2, Math.max(0, Math.floor(z / 0.02))); var t = (z - tab[i][0]) / 0.02; return tab[i][1] + (tab[i+1][1] - tab[i][1]) * t; };
  var P = function(ra, g){ var a = ra * Math.PI/180; return [v.cx + g * s * Math.cos(a), v.cy - g * s * Math.sin(a)]; };
  /* the unobservable universe: a darker field everywhere beyond the last-scattering rim, no edge, just the field */
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  var fe = ctx.createRadialGradient(v.cx, v.cy, H0.last_scattering * s, v.cx, v.cy, (H0.last_scattering + 5) * s); fe.addColorStop(0, C.bg); fe.addColorStop(1, '#000');
  ctx.fillStyle = fe; ctx.beginPath(); ctx.arc(v.cx, v.cy, (H0.last_scattering + 5) * s, 0, Math.PI*2); ctx.fill();
  /* the core: the cosmic-web frame's galaxies; beyond: the quasars */
  if (DATA.universe){ ctx.fillStyle = '#dbe8ff'; ctx.globalAlpha = .6; DATA.universe.galaxies.forEach(function(g){ var q = P(g[0], dc(g[1])); ctx.fillRect(q[0] - .5, q[1] - .5, 1, 1); }); }
  ctx.fillStyle = '#eef3ff'; d.quasars.forEach(function(g){ var q = P(g[0], dc(g[1])); ctx.globalAlpha = .35 + .5 * Math.max(0, 1 - g[1] / 4); ctx.fillRect(q[0] - .55, q[1] - .55, 1.1, 1.1); });
  ctx.globalAlpha = 1;
  scaleRings(v, [20, 30, 40], function(u){ return u + ' BILLION|LIGHT-YEARS'; }, 292);          /* in the unsurveyed wedge below */
  /* the horizons: short names in the wedge below, the caption carries what they mean */
  ring(v.cx, v.cy, H0.hubble * s, C.goldS, 1, .35); arcLabel(v.cx, v.cy, H0.hubble * s - 9, 278, 'HUBBLE SPHERE', {color:C.goldS, size:8.5, alpha:.8, ls:.12});
  ring(v.cx, v.cy, H0.event * s, C.goldS, 1, .35); arcLabel(v.cx, v.cy, H0.event * s + 8, 278, 'EVENT HORIZON', {color:C.goldS, size:8.5, alpha:.8, ls:.12});
  var fz = d.farthest[0][2]; ring(v.cx, v.cy, fz * s, '#bcd6ef', 1, .22); arcLabel(v.cx, v.cy, fz * s + 8, 218, 'THE FARTHEST GALAXY SEEN · 34 BILLION LIGHT-YEARS AWAY TODAY|MOM-Z14, REDSHIFT 14.44, WEBB 2025', {size:8.5, alpha:.6, ls:.12});
  /* the rim: the microwave background, 360 degrees of WMAP's real sky along the slice */
  var rr = H0.last_scattering * s; ctx.save(); ctx.lineWidth = Math.max(6, 1.6 * s); ctx.lineCap = 'butt';
  for (var i = 0; i < 360; i++){ var a0 = (i - 0.5) * Math.PI/180, a1 = (i + 0.5) * Math.PI/180; ctx.strokeStyle = cmbColor(d.cmb_uK[i]); ctx.globalAlpha = .9; ctx.beginPath(); ctx.arc(v.cx, v.cy, rr, -a1, -a0); ctx.stroke(); }
  ctx.restore();
  arcLabel(v.cx, v.cy, rr - 34, 90, 'THE COSMIC MICROWAVE BACKGROUND · 45 BILLION LIGHT-YEARS AWAY|THE OLDEST LIGHT, 13.8 BILLION YEARS OLD · COLOURED BY WMAP’S REAL SKY IN EACH DIRECTION', {color:C.title, size:8.5, alpha:.85, ls:.12});
  ring(v.cx, v.cy, H0.particle * s, '#bcd6ef', 1, .3); arcLabel(v.cx, v.cy, H0.particle * s + 8, 270, 'THE EDGE OF THE OBSERVABLE UNIVERSE · 46.5 BILLION LIGHT-YEARS', {size:8.5, alpha:.6, ls:.12});
  /* beyond */
  arcLabel(v.cx, v.cy, (H0.particle + 3) * s, 180, 'BEYOND THE HORIZON|LIGHT FROM HERE HAS NOT HAD TIME TO REACH US', {size:9, alpha:.6, ls:.14, color:C.green});
  arcLabel(v.cx, v.cy, (H0.particle + 3) * s, 0, 'SPACE CONTINUES|AT LEAST 250 TIMES THE VOLUME', {size:9, alpha:.6, ls:.14, color:C.green});
  footprint(v.cx, v.cy, 4 * s, '');
  hereAt(v.cx, v.cy, v.cx, v.cy - 10.5 * s, ['HERE', 'THE COSMIC WEB FRAME IS THE SMALL RING']);   /* in the open wedge above */
  legend('INNER DOTS: SDSS GALAXIES · OUTER DOTS: 32,000 SDSS QUASARS IN THE SAME SLICE, TO REDSHIFT 7 · HORIZONS: PLANCK 2018 · THE RIM: WMAP’S 9-YEAR SKY');
}

/* ---- boot ---- */
if (EMBEDDED) document.documentElement.classList.add('embedded');
setCaption(cur); document.getElementById('credit').textContent = FRAMES[cur].credit;
document.querySelectorAll('#ladder button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-f') === cur); });

/* warm the other frames in the background so the ladder feels instant */
/* PREFETCH (perf review 2026-10-11): a desktop fetches every frame 1.5 s after opening (~830 KB compressed); a phone, or
   any browser asking to save data, fetches only the frames next to the one showing, and again after each move */
var LEAN = window.innerWidth < 700 || !!(navigator.connection && navigator.connection.saveData);
function prefetchNear(f){ var K = Object.keys(FRAMES), i = K.indexOf(f); [K[i - 1], K[i + 1]].forEach(function(k){ if (k) load(k); }); }
setTimeout(function(){ if (LEAN) prefetchNear(cur); else Object.keys(FRAMES).forEach(function(f){ if (f !== cur) load(f); }); }, 1500);
