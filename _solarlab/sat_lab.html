<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SATELLITES — lab</title>
<style>
  /* LAB ONLY — a SATELLITES tab mock for BEHIND THE BLUE. Same stage stack
     as earth_lab.html (HYG stars, live EPIC Earth, true night halves); the
     satellites are a baked CelesTrak GP snapshot (_tle.js, build_tle.py)
     propagated from mean elements — a lab propagation, not SGP4. */
  @font-face{
    font-family:"QelliaRegular";
    src:url('https://cdn.bluishvoid.com/qellia.woff2?v=1') format('woff2');
    font-display:swap;
  }
  :root{ --ink:#2B22F4; --ink-dim:rgba(43,34,244,.55); }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    display:flex;flex-direction:column;height:100%;
    background:#070d1d;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #stage{flex:1;min-height:0;position:relative;}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #map text{font-family:'QelliaRegular','Bodoni Moda',Georgia,serif;}
  #map text.data{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}

  #hud{
    flex:0 0 auto;background:#fff;color:var(--ink);
    padding:9px 14px 11px;display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  #hud-controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .pill{
    border:1px solid rgba(43,34,244,.22);border-radius:999px;background:rgba(43,34,244,.05);
    color:var(--ink);font-size:.62rem;font-weight:800;letter-spacing:.08em;
    padding:6px 13px;text-transform:uppercase;white-space:nowrap;
  }
  button.pill{cursor:pointer;font-family:inherit;}
  button.pill:hover{background:rgba(43,34,244,.11);}
  #btn-play{background:#2f9e44;border-color:#2f9e44;color:#fff;padding:6px 17px;}
  #btn-play:hover{background:#37a84d;}
  #readout{font-size:.78rem;font-weight:900;letter-spacing:.05em;padding:6px 15px;background:none;border:none;}
  select.pill{appearance:none;-webkit-appearance:none;text-align:center;}
  #facts{display:flex;align-items:stretch;justify-content:center;gap:7px;flex-wrap:wrap;}
  .fact{
    border-radius:12px;background:rgba(43,34,244,.055);border:1px solid rgba(43,34,244,.12);
    padding:6px 12px;min-width:118px;text-align:center;
  }
  .fact .k{font-size:.5rem;font-weight:900;letter-spacing:.16em;color:rgba(43,34,244,.5);text-transform:uppercase;}
  .fact .v{font-size:.7rem;font-weight:850;letter-spacing:.04em;margin-top:2px;}
  .fact .s{font-size:.56rem;font-weight:700;color:rgba(43,34,244,.55);margin-top:1px;}
  .fact .sw{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0;}
  #summary{
    font-size:.72rem;font-weight:700;letter-spacing:.02em;color:rgba(43,34,244,.8);
    text-align:center;max-width:880px;line-height:1.45;
  }
  #legend{
    font-size:.5rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:rgba(43,34,244,.38);text-align:center;line-height:1.7;max-width:920px;
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="map" viewBox="-660 -640 1320 1180" preserveAspectRatio="xMidYMid meet" aria-label="Satellites">
    <defs>
      <radialGradient id="spaceGrad" cx="50%" cy="46%" r="75%">
        <stop offset="0%"  stop-color="#0c1430"/>
        <stop offset="55%" stop-color="#091026"/>
        <stop offset="100%" stop-color="#060b19"/>
      </radialGradient>
      <radialGradient id="sunGlow">
        <stop offset="0%"  stop-color="#fff3d8" stop-opacity=".85"/>
        <stop offset="30%" stop-color="#ffd98f" stop-opacity=".38"/>
        <stop offset="70%" stop-color="#f4b95e" stop-opacity=".1"/>
        <stop offset="100%" stop-color="#f4b95e" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="earthGrad" cx="38%" cy="34%" r="80%">
        <stop offset="0%" stop-color="#7fb4e8"/>
        <stop offset="45%" stop-color="#3d7ec4"/>
        <stop offset="80%" stop-color="#1c4e8a"/>
        <stop offset="100%" stop-color="#123763"/>
      </radialGradient>
      <linearGradient id="nightSide" x1="1" y1="0" x2="0" y2="0">
        <stop offset="0%"  stop-color="#03071a" stop-opacity=".12"/>
        <stop offset="22%" stop-color="#03071a" stop-opacity=".58"/>
        <stop offset="100%" stop-color="#03071a" stop-opacity=".86"/>
      </linearGradient>
      <radialGradient id="atmoGlow">
        <stop offset="78%" stop-color="#6fb2ff" stop-opacity="0"/>
        <stop offset="92%" stop-color="#6fb2ff" stop-opacity=".28"/>
        <stop offset="100%" stop-color="#6fb2ff" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="earthClip"><circle r="46"/></clipPath>
    </defs>
    <rect x="-1600" y="-1600" width="3200" height="3200" fill="url(#spaceGrad)"/>
    <g id="gStars" opacity=".55"></g>
    <g id="gSun"></g>
    <g id="gRings"></g>
    <g id="gSats"></g>
    <g id="gFeat"></g>
    <g id="gEarth"></g>
  </svg>
</div>

<div id="hud">
  <div id="hud-controls">
    <button class="pill" id="btn-play">&#10073;&#10073;&#xFE0E; PAUSE</button>
    <span class="pill" id="readout">—</span>
    <button class="pill" id="btn-today">NOW</button>
    <select class="pill" id="speed">
      <option value="1">REAL TIME</option>
      <option value="60">1 MIN/SEC</option>
      <option value="600" selected>10 MIN/SEC</option>
      <option value="3600">1 HR/SEC</option>
    </select>
  </div>
  <div id="facts"></div>
  <div id="summary"></div>
  <div id="legend">
    GEOCENTRIC VIEW &middot; SHELL RADIUS = TRUE ALTITUDE (LOG-COMPRESSED) &middot;
    BEARING = TOP-DOWN PROJECTION &middot;
    ELEMENTS: CELESTRAK GP SNAPSHOT <span id="leg-stamp">—</span> &middot;
    LAB MEAN-ELEMENT PROPAGATION, NOT SGP4 &middot;
    STARLINK SAMPLED <span id="leg-sl">—</span> &middot;
    EARTH: NASA DSCOVR/EPIC LIVE &middot; STARS: HYG CATALOG
  </div>
</div>

<script src="_planetcore.js"></script>
<script src="_starfield.js"></script>
<script src="_tle.js"></script>
<script>
var LOCATION = { lat: 40.744, lon: -73.9213, tz: 'America/New_York', name: 'NYC' };
var DEG = Math.PI/180;
var MAP_R = 470;
var EPS = 23.4393 * DEG;
var svgEl = document.getElementById('map');
function mk(tag, attrs, parent){
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in attrs) el.setAttribute(k, attrs[k]);
  (parent || svgEl).appendChild(el);
  return el;
}
function dirXY(lonRad, r){ return [r*Math.cos(lonRad), -r*Math.sin(lonRad)]; }

/* altitude shells: log-compressed km above the surface → px */
function rAlt(altKm){
  var a = Math.max(altKm, 160);
  return 70 + (Math.log(a/150) / Math.log(45000/150)) * 400;
}
var R_GEO = rAlt(35786), R_GPS = rAlt(20180);

/* ── the real sky, dimmed — the satellites are the show here ── */
(function(){
  var g = document.getElementById('gStars');
  if (typeof STARS === 'undefined') return;
  for (var i = 0; i < STARS.length; i++){
    var s = STARS[i];
    if (s[2] > 5.2) continue;
    var r = MAP_R * (90 - s[1]) / 90;
    var a = s[0] * DEG;
    mk('circle', {cx:(r*Math.cos(a)).toFixed(1), cy:(-r*Math.sin(a)).toFixed(1),
                  r:Math.max(0.5, 1.7 - 0.22*s[2]).toFixed(2), fill:'#dfe8ff',
                  opacity:(s[2] < 2 ? .8 : .4).toFixed(2)}, g);
  }
})();

/* ── shell furniture ── */
(function(){
  var g = document.getElementById('gRings');
  var rings = [
    {r:rAlt(550),  label:'LOW EARTH ORBIT · 100–1,200 MI', ang:-47},
    {r:R_GPS,      label:'GPS · 12,550 MI · 12 H',         ang:-63},
    {r:R_GEO,      label:'GEOSTATIONARY BELT · 22,236 MI · 24 H', ang:-29}
  ];
  rings.forEach(function(rg){
    mk('circle', {r:rg.r, fill:'none', stroke:'rgba(150,172,225,.22)', 'stroke-width':.9,
                  'stroke-dasharray':'3 5', 'vector-effect':'non-scaling-stroke'}, g);
    var p = dirXY(rg.ang*DEG, rg.r);
    var t = mk('text', {x:p[0].toFixed(1), y:p[1].toFixed(1), 'text-anchor':'start', 'class':'data',
      style:'font-size:10.5px;font-weight:800;letter-spacing:.14em;fill:rgba(178,196,240,.6);'}, g);
    t.textContent = rg.label;
  });
})();

/* ── sun + earth (same pieces as the earth view) ── */
var gSun = document.getElementById('gSun'), gEarth = document.getElementById('gEarth');
var sunGlow = mk('circle', {r:430, fill:'url(#sunGlow)'}, gSun);
var sunLab = mk('text', {'text-anchor':'middle',
  style:'font-size:19px;font-weight:850;letter-spacing:.2em;fill:#ffd9a0;'}, gSun);
sunLab.textContent = 'SUN';
mk('circle', {r:58, fill:'url(#atmoGlow)'}, gEarth);
mk('circle', {r:46, fill:'url(#earthGrad)'}, gEarth);
var earthImgG = mk('g', {'clip-path':'url(#earthClip)'}, gEarth);
var earthNightG = mk('g', {'clip-path':'url(#earthClip)'}, gEarth);
var earthNightP = mk('path', {d:'M0,-46 A46,46 0 0 0 0,46 L0,-46 Z', fill:'url(#nightSide)'}, earthNightG);
(function(){
  fetch('https://epic.gsfc.nasa.gov/api/natural').then(function(r){ return r.json(); })
  .then(function(list){
    if (!list || !list.length) return;
    var m = list[list.length - 1];
    var d = m.date.slice(0,10).split('-');
    var url = 'https://epic.gsfc.nasa.gov/archive/natural/' + d[0] + '/' + d[1] + '/' + d[2] +
              '/jpg/' + m.image + '.jpg';
    var half = 46 / 0.392;
    var im = mk('image', {href:url, x:-half, y:-half, width:half*2, height:half*2,
                          preserveAspectRatio:'xMidYMid slice', opacity:0}, earthImgG);
    im.addEventListener('load', function(){ im.setAttribute('opacity', 1); });
  }).catch(function(){});
})();

/* ── the satellite engine ────────────────────────────────────────────────
   Mean elements → position: M advances at MEAN_MOTION, small-e Kepler
   solve, perifocal → ECI (equatorial) → ecliptic bearing for the map.
   Radius on the stage is the TRUE current altitude through rAlt, bearing
   is the top-down projected direction — shells stay readable while every
   dot still moves at its real angular rate. */
var MU = 398600.4418;
var GROUP_STYLE = {
  'starlink': {c:'#7fd4c1', r:1.5, op:.75},
  'geo':      {c:'#9db4e8', r:1.7, op:.8},
  'gps-ops':  {c:'#ffd27f', r:2.4, op:.95},
  'visual':   {c:'#e8b8a0', r:1.9, op:.85},
  'stations': {c:'#ffffff', r:2.2, op:.95}
};
var FEATURED = { 'ISS (ZARYA)':'ISS', 'CSS (TIANHE)':'TIANGONG', 'HST':'HUBBLE' };
var sats = [];   // {el, x?, group, a, n(rad/ms), ecc, inc, raan, argp, ma0(rad), epoch}
(function(){
  if (typeof TLE === 'undefined') return;
  var g = document.getElementById('gSats'), gf = document.getElementById('gFeat');
  Object.keys(TLE).forEach(function(grp){
    var st = GROUP_STYLE[grp];
    TLE[grp].forEach(function(t){
      var mm = t[2];                                   // rev/day
      var nRadMs = mm * 2*Math.PI / 86400000;
      var a = Math.pow(MU / Math.pow(mm*2*Math.PI/86400, 2), 1/3);
      var feat = FEATURED[t[0]];
      var dot = mk('circle', {r: feat ? 3.4 : st.r, fill: st.c,
                              opacity: feat ? 1 : st.op,
                              stroke: feat ? '#fff' : 'none', 'stroke-width': feat ? .8 : 0},
                   feat ? gf : g);
      var lab = null;
      if (feat){
        lab = mk('text', {'text-anchor':'middle', 'class':'data',
          style:'font-size:10.5px;font-weight:900;letter-spacing:.14em;fill:' + st.c + ';'}, gf);
        lab.textContent = feat;
      }
      sats.push({el:dot, lab:lab, a:a, n:nRadMs, ecc:t[3], inc:t[4]*DEG,
                 raan:t[5]*DEG, argp:t[6]*DEG, ma0:t[7]*DEG, epoch:t[1]});
    });
  });
})();
function satXY(s, ms){
  var M = s.ma0 + s.n * (ms - s.epoch);
  var E = M, e = s.ecc;
  for (var i = 0; i < 4; i++) E = M + e*Math.sin(E);
  var v = Math.atan2(Math.sqrt(1-e*e)*Math.sin(E), Math.cos(E) - e);
  var r = s.a * (1 - e*Math.cos(E));
  var u = s.argp + v;
  var cu = Math.cos(u), su = Math.sin(u);
  var cO = Math.cos(s.raan), sO = Math.sin(s.raan), ci = Math.cos(s.inc);
  var x = r * (cO*cu - sO*su*ci);
  var y = r * (sO*cu + cO*su*ci);
  var z = r * (su*Math.sin(s.inc));
  var yE = y*Math.cos(EPS) + z*Math.sin(EPS);          // equatorial → ecliptic
  var ang = Math.atan2(yE, x);
  var R = rAlt(r - 6378.14);
  return [R*Math.cos(ang), -R*Math.sin(ang)];
}
function renderSats(ms){
  for (var i = 0; i < sats.length; i++){
    var s = sats[i], p = satXY(s, ms);
    s.el.setAttribute('cx', p[0].toFixed(1));
    s.el.setAttribute('cy', p[1].toFixed(1));
    if (s.lab){ s.lab.setAttribute('x', p[0].toFixed(1)); s.lab.setAttribute('y', (p[1]-8).toFixed(1)); }
  }
}

/* ── time + render ── */
var curMs = Date.now(), playing = true, lastFrame = null;
var speedSel = document.getElementById('speed');
function render(){
  var dt = new Date(curMs);
  var s = sunEcliptic(daysSinceJ2000(dt));
  var sp = dirXY(s.lon, 780);
  sunGlow.setAttribute('cx', sp[0].toFixed(1)); sunGlow.setAttribute('cy', sp[1].toFixed(1));
  var sl = dirXY(s.lon, 528);
  sunLab.setAttribute('x', sl[0].toFixed(1)); sunLab.setAttribute('y', (sl[1]+6).toFixed(1));
  earthNightP.setAttribute('transform', 'rotate(' + (-(s.lon/DEG)).toFixed(2) + ')');
  renderSats(curMs);
  document.getElementById('readout').textContent =
    dt.toLocaleDateString('en-US', {timeZone:LOCATION.tz, month:'short', day:'numeric', year:'numeric'}).toUpperCase() +
    ' · ' + dt.toLocaleTimeString('en-US', {timeZone:LOCATION.tz, hour:'numeric', minute:'2-digit', second:'2-digit'});
}
function renderFacts(){
  var f = document.getElementById('facts');
  var tot = (typeof TLE_TOTALS !== 'undefined') ? TLE_TOTALS : {};
  function sw(grp){ return '<span class="sw" style="background:' + GROUP_STYLE[grp].c + '"></span>'; }
  function fact(k, v, sub){
    return '<div class="fact"><div class="k">' + k + '</div><div class="v">' + v + '</div>' +
           (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';
  }
  f.innerHTML =
    fact('STARLINK', sw('starlink') + (tot.starlink || 0).toLocaleString() + ' FLYING',
         'SHOWING ' + (TLE.starlink || []).length + ' · ~340 MI · 95 MIN') +
    fact('GEO BELT', sw('geo') + (tot.geo || 0) + ' PARKED', '22,236 MI · TURNS WITH EARTH') +
    fact('GPS', sw('gps-ops') + (tot['gps-ops'] || 0) + ' TRACKED', '12,550 MI · TWO LAPS A DAY') +
    fact('BRIGHT SATS', sw('visual') + (tot.visual || 0) + ' VISIBLE CLASS', 'NAKED-EYE CATALOG') +
    fact('CREWED', sw('stations') + 'ISS · TIANGONG', (tot.stations || 0) + ' STATION OBJECTS');
  var stampEl = document.getElementById('leg-stamp');
  if (stampEl && typeof TLE_STAMP !== 'undefined') stampEl.textContent = TLE_STAMP;
  var slEl = document.getElementById('leg-sl');
  if (slEl) slEl.textContent = (TLE.starlink || []).length + ' OF ' + (tot.starlink || 0).toLocaleString();
  document.getElementById('summary').textContent =
    'CelesTrak is tracking ' + (tot.starlink || 0).toLocaleString() + ' Starlink satellites tonight — the teal swarm ' +
    'lapping Earth every ~95 minutes. Gold is the GPS constellation two shells up; the outer ring is ' +
    (tot.geo || 0) + ' geostationary satellites hanging over fixed points on the equator. ' +
    'The ISS and Tiangong ride the low shell with ' + (tot.visual || 0) + ' other naked-eye-class objects.';
}
function frame(ts){
  if (playing){
    if (lastFrame !== null) curMs += (ts - lastFrame) * (+speedSel.value);
    lastFrame = ts;
    render();
  }
  requestAnimationFrame(frame);
}
document.getElementById('btn-play').addEventListener('click', function(){
  playing = !playing; lastFrame = null;
  this.innerHTML = playing ? '&#10073;&#10073;&#xFE0E; PAUSE' : '&#9654;&#xFE0E; PLAY';
});
document.getElementById('btn-today').addEventListener('click', function(){
  curMs = Date.now(); render();
});
render();
renderFacts();
setInterval(function(){ if (!playing){ curMs = Date.now(); render(); } }, 30000);
requestAnimationFrame(frame);
</script>
</body>
</html>
