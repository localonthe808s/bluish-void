<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLAR SYSTEM — widget preview</title>
<style>
  /* Site-chrome mock: .widget / .widget-head / .widget-title / .widget-sub /
     .widget-body copied from index.html; the tab bar clones the CLOUDS
     widget's #cira-tab-bar (flush strip at the top of the map) in the site's
     theme blue instead of CIRA orange. */
  :root{ --ink:#2B22F4; --ink-dim:rgba(43,34,244,.55); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 20% 0%, #eef3fb 0%, #dde7f6 45%, #cfd9ee 100%);
    padding:40px 16px 80px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .page-note{
    font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(43,34,244,.45);
  }
  .widget{
    width:min(1100px, 96vw);
    background:rgba(255,255,255,.45);
    border:none;border-radius:18px;
    box-shadow:0 18px 50px rgba(43,34,244,.14), 0 0 0 1px rgba(255,255,255,.5) inset;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    min-width:0;overflow:hidden;
  }
  .widget-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;
    background:rgba(255,255,255,.3);
    border-bottom:1px solid rgba(43,34,244,.12);
  }
  .widget-title{
    font-size:.60rem;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(43,34,244,.74);font-weight:850;
  }
  .widget-sub{
    font-size:.72rem;color:var(--ink-dim);white-space:nowrap;text-align:right;
    font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  }
  .widget-body{
    position:relative;height:min(90vh,1020px);background:#0a1122;overflow:hidden;
  }
  .widget-body iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;display:block;
  }
  /* ── sub-section menu bar, CLOUDS-style: flush to the top of the map ── */
  #solar-tab-bar{
    position:absolute;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:3px;
    background:rgba(43,34,244,.92);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-radius:0 0 14px 14px;
    padding:5px 8px 6px;
  }
  .solar-tab{
    flex:1;padding:6px 8px;border-radius:7px;
    background:none;border:1px solid transparent;
    font-family:system-ui,sans-serif;font-size:.66rem;line-height:1;
    font-weight:900;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.7);cursor:pointer;transition:all .18s;
    display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
  }
  .solar-tab:hover{color:#fff;}
  .solar-tab.active{
    background:#ea580c;
        color:#fff;
    
  }
  .solar-tab .dot{
    width:8px;height:8px;border-radius:50%;background:#4ade80;
    box-shadow:0 0 6px #4ade80,0 0 14px rgba(74,222,128,.6);
    flex-shrink:0;animation:solar-pulse 1.8s ease-in-out infinite;display:inline-block;
  }
  @keyframes solar-pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .tab-sep{width:1px;height:12px;background:rgba(255,255,255,.2);margin:0 3px;flex-shrink:0;}
</style>
</head>
<body>
<div class="page-note">widget preview — how the lab would sit on bluishvoid.com</div>

<div class="widget" id="solar-widget">
  <div class="widget-head">
    <div class="widget-title">SPACE <span style="font-size:.56rem;letter-spacing:.16em;color:rgba(43,34,244,.64);margin-left:6px;">LIVE</span></div>
    <span class="widget-sub">JPL EPHEMERIS · NASA / ESO IMAGERY</span>
  </div>
  <div class="widget-body">
    <iframe id="solar-frame" src="solar_lab.html" title="Solar system map"></iframe><script>document.getElementById('solar-frame').src = 'solar_lab.html?v=' + Date.now();</script>
    <!-- EARTH VIEW: the geocentric stage, lazy like on the site -->
    <iframe id="earth-frame" data-src="earth_lab.html" title="Earth view" style="display:none;"></iframe>
    <!-- GALAXY / UNIVERSE: one lab (galaxy_lab.html) behind two tabs; its own ladder is hidden here (embedbar=1), the
         rung row below the blue bar drives it -->
    <iframe id="galaxy-frame" data-src="galaxy_lab.html?embedbar=1" title="Galaxy and universe" style="display:none;"></iframe>
    <!-- THE LADDER OF SCALE (2026-10-10): four scales in the blue bar, zooming out left to right; the rungs of the chosen
         scale in a second row -->
    <div id="solar-tab-bar">
      <button class="solar-tab" data-tab="earth"><span class="dot"></span>EARTH</button>
      <button class="solar-tab active" data-tab="solar">SOLAR SYSTEM</button>
      <button class="solar-tab" data-tab="galaxy">GALAXY</button>
      <button class="solar-tab" data-tab="universe">UNIVERSE</button>
    </div>
    <div id="rung-row"></div>
  </div>
</div>

<style>
  #rung-row{ position:absolute; top:34px; left:0; right:0; z-index:19; display:flex; justify-content:center; align-items:center; gap:2px;
             padding:9px 8px 5px; background:linear-gradient(rgba(43,34,244,.55), rgba(43,34,244,0)); pointer-events:none; }
  #rung-row:empty{ display:none; }
  .rung{ pointer-events:auto; border:none; background:transparent; padding:4px 10px; border-radius:999px; font-family:system-ui,sans-serif; font-size:.58rem; line-height:1;
         font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.55); cursor:pointer; transition:color .15s; }
  .rung:hover{ color:#fff; } .rung.active{ color:#fff; text-shadow:0 0 8px rgba(255,255,255,.5); }
  .rung-sep{ width:1px; height:10px; background:rgba(255,255,255,.25); margin:0 4px; }
</style>
<script>
/* the ladder: scale -> rungs -> which frame shows and what it is told */
var SCALES = {
  earth:    [{ id:'tonight', label:'TONIGHT', live:true, frame:'solar', msg:{solarTab:'tonight'} }, { id:'earthview', label:'EARTH VIEW', frame:'earth' }],
  solar:    [],
  galaxy:   [{ id:'neighborhood', label:'NEIGHBORHOOD', frame:'galaxy', msg:{galaxyFrame:'neighborhood'} }, { id:'milkyway', label:'MILKY WAY', frame:'galaxy', msg:{galaxyFrame:'milkyway'} }],
  universe: [{ id:'localgroup', label:'LOCAL GROUP', frame:'galaxy', msg:{galaxyFrame:'localgroup'} }, { id:'laniakea', label:'LANIAKEA', frame:'galaxy', msg:{galaxyFrame:'laniakea'} },
             { id:'universe', label:'COSMIC WEB', frame:'galaxy', msg:{galaxyFrame:'universe'} }, { id:'observable', label:'OBSERVABLE UNIVERSE', frame:'galaxy', msg:{galaxyFrame:'observable'} }]
};
var FR = { solar: document.getElementById('solar-frame'), earth: document.getElementById('earth-frame'), galaxy: document.getElementById('galaxy-frame') };
var frame = FR.solar, rungRow = document.getElementById('rung-row'), curScale = 'solar', curRung = null;
function showFrame(name){ Object.keys(FR).forEach(function(k){ var f = FR[k]; var on = k === name; f.style.display = on ? 'block' : 'none'; if (on && !f.src){ var u = f.getAttribute('data-src'); f.src = u + (u.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now(); } }); }
function tell(name, msg){ var f = FR[name]; var send = function(){ try{ f.contentWindow.postMessage(msg, '*'); }catch(_){} };
  if (f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentWindow && (name !== 'galaxy' || f.contentWindow.FRAMES)) send(); else f.addEventListener('load', function(){ setTimeout(send, 50); }, {once:true}); }
function setScale(scale, rungId){
  curScale = scale;
  document.querySelectorAll('.solar-tab').forEach(function(x){ x.classList.toggle('active', x.getAttribute('data-tab') === scale); });
  var rungs = SCALES[scale]; rungRow.innerHTML = '';
  rungs.forEach(function(r, i){ if (i) { var sp = document.createElement('span'); sp.className = 'rung-sep'; rungRow.appendChild(sp); }
    var b = document.createElement('button'); b.className = 'rung'; b.textContent = r.label; b.setAttribute('data-rung', r.id); b.addEventListener('click', function(){ setRung(r); }); rungRow.appendChild(b); });
  if (!rungs.length){ curRung = null; showFrame('solar'); tell('solar', {solarTab:'compressed'}); return; }
  setRung(rungs.filter(function(r){ return r.id === rungId; })[0] || rungs[0]);
}
function setRung(r){ curRung = r.id; document.querySelectorAll('.rung').forEach(function(x){ x.classList.toggle('active', x.getAttribute('data-rung') === r.id); });
  showFrame(r.frame); if (r.msg) tell(r.frame, r.msg); }
document.querySelectorAll('.solar-tab').forEach(function(b){ b.addEventListener('click', function(){ setScale(b.getAttribute('data-tab')); }); });
/* the labs report back: the galaxy lab names its frame, the solar lab its tab */
window.addEventListener('message', function(e){
  if (!e.data) return;
  /* only the lab on screen may move the bar: a hidden lab's late announcement is noise */
  if (e.data.galaxyFrameChanged && FR.galaxy.style.display === 'none') return;
  if (e.data.solarTabChanged && FR.solar.style.display === 'none') return;
  if (e.data.galaxyFrameChanged){ var id = e.data.galaxyFrameChanged, scale = (SCALES.galaxy.some(function(r){ return r.id === id; })) ? 'galaxy' : 'universe'; if (scale !== curScale || curRung !== id){ curScale = scale; document.querySelectorAll('.solar-tab').forEach(function(x){ x.classList.toggle('active', x.getAttribute('data-tab') === scale); }); if (!document.querySelector('.rung[data-rung="' + id + '"]')) setScale(scale, id); else { curRung = id; document.querySelectorAll('.rung').forEach(function(x){ x.classList.toggle('active', x.getAttribute('data-rung') === id); }); } } }
  if (e.data.solarTabChanged === 'compressed' && curScale !== 'solar') setScale('solar');
});
/* ?tab=earth|solar|galaxy|universe&rung=<id> opens the preview there */
var qs = location.search, startTab = (qs.match(/[?&]tab=([a-z]+)/) || [])[1], startRung = (qs.match(/[?&]rung=([a-z]+)/) || [])[1];
if (startTab && SCALES[startTab]) setTimeout(function(){ setScale(startTab, startRung); }, 300);
</script>
</body>
</html>
