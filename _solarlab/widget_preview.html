<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLAR SYSTEM — widget preview</title>
<style>
  /* Site-chrome mock: .widget / .widget-head / .widget-title / .widget-sub /
     .widget-body copied from index.html; the tab bar clones the CLOUDS
     widget's #cira-tab-bar (flush strip at the top of the map) in the site's
     theme blue instead of CIRA orange. */
  :root{ --ink:#2B22F4; --ink-dim:rgba(43,34,244,.55); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 20% 0%, #eef3fb 0%, #dde7f6 45%, #cfd9ee 100%);
    padding:40px 16px 80px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .page-note{
    font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(43,34,244,.45);
  }
  .widget{
    width:min(1100px, 96vw);
    background:rgba(255,255,255,.45);
    border:none;border-radius:18px;
    box-shadow:0 18px 50px rgba(43,34,244,.14), 0 0 0 1px rgba(255,255,255,.5) inset;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    min-width:0;overflow:hidden;
  }
  .widget-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;
    background:rgba(255,255,255,.3);
    border-bottom:1px solid rgba(43,34,244,.12);
  }
  .widget-title{
    font-size:.60rem;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(43,34,244,.74);font-weight:850;
  }
  .widget-sub{
    font-size:.72rem;color:var(--ink-dim);white-space:nowrap;text-align:right;
    font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  }
  .widget-body{
    position:relative;height:min(90vh,1020px);background:#0a1122;overflow:hidden;
  }
  .widget-body iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;display:block;
  }
  /* ── sub-section menu bar, CLOUDS-style: flush to the top of the map ── */
  #solar-tab-bar{
    position:absolute;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:3px;
    background:rgba(43,34,244,.92);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-radius:0 0 14px 14px;
    padding:5px 8px 6px;
  }
  .solar-tab{
    flex:1;padding:6px 8px;border-radius:7px;
    background:none;border:1px solid transparent;
    font-family:system-ui,sans-serif;font-size:.66rem;line-height:1;
    font-weight:900;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.7);cursor:pointer;transition:all .18s;
    display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
  }
  .solar-tab:hover{color:#fff;}
  .solar-tab.active{
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
  }
  .solar-tab .dot{
    width:8px;height:8px;border-radius:50%;background:#4ade80;
    box-shadow:0 0 6px #4ade80,0 0 14px rgba(74,222,128,.6);
    flex-shrink:0;animation:solar-pulse 1.8s ease-in-out infinite;display:inline-block;
  }
  @keyframes solar-pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .tab-sep{width:1px;height:12px;background:rgba(255,255,255,.2);margin:0 3px;flex-shrink:0;}
</style>
</head>
<body>
<div class="page-note">widget preview — how the lab would sit on bluishvoid.com</div>

<div class="widget" id="solar-widget">
  <div class="widget-head">
    <div class="widget-title">SOLAR SYSTEM <span style="font-size:.56rem;letter-spacing:.16em;color:rgba(43,34,244,.64);margin-left:6px;">LIVE</span></div>
    <span class="widget-sub">JPL EPHEMERIS · NASA / ESO IMAGERY</span>
  </div>
  <div class="widget-body">
    <iframe id="solar-frame" src="solar_lab.html" title="Solar system map"></iframe>
    <div id="solar-tab-bar">
      <button class="solar-tab" data-tab="tonight"><span class="dot"></span>TONIGHT</button>
      <button class="solar-tab active" data-tab="compressed">SOLAR SYSTEM</button>
    </div>
  </div>
</div>

<script>
var frame = document.getElementById('solar-frame');
/* the lab can switch itself (e.g. a jump-to-planet from elsewhere on the
   page); keep the tab highlight honest when it does */
window.addEventListener('message', function(e){
  if (!e.data || !e.data.solarTabChanged) return;
  document.querySelectorAll('.solar-tab').forEach(function(x){
    x.classList.toggle('active', x.getAttribute('data-tab') === e.data.solarTabChanged);
  });
});
document.querySelectorAll('.solar-tab').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.solar-tab').forEach(function(x){ x.classList.toggle('active', x===b); });
    frame.contentWindow.postMessage({solarTab: b.getAttribute('data-tab')}, '*');
  });
});
</script>
</body>
</html>
