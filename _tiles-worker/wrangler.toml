# Cloudflare Worker: the basemap as cached z/x/y tiles (tiles.bluishvoid.com).
# Deploy from THIS folder only:  cd _tiles-worker && npx wrangler deploy
# (the repo-root wrangler.toml is the CORS proxy -- never deploy that by accident)
#
# Why (perf review 2026-10-12): the site read the 10.5 GB basemap PMTiles straight off R2 with HTTP range requests, and
# Cloudflare does not edge-cache ranges of an object that big -- every tile piece was cf-cache-status BYPASS at ~300 ms.
# This worker opens the archive once per isolate, answers /<archive>/{z}/{x}/{y}.mvt, and keeps each tile in the edge
# cache for a year (the archive name carries its build date, so a tile never changes under its URL).
name = "bluish-tiles"
main = "index.js"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false
routes = [ { pattern = "tiles.bluishvoid.com", custom_domain = true } ]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bluishvoid-bg"

[observability]
enabled = true
