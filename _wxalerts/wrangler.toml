# BLUISH weather alerts (2026-10-13, user: "what about common weather alerts, umbrella alert" -> "all five, 8 AM, choose
# more than 1 and home and work"). Its own worker: the Kalshi cron worker already uses 4 of the free plan's 5 cron
# triggers and runs close to its CPU budget. Pushes through the same VAPID key as the Kalshi alerts, so one phone
# subscription (bv-sw.js) carries both. No route: it keeps its workers.dev URL for the page's sign-up calls.
name = "bluish-wx-alerts"
main = "wx-alerts.js"
compatibility_date = "2026-09-04"
workers_dev = true

[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "WX"
id = "04d068735e5746e5a2cc1127a9b9dc66"
