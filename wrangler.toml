# Cloudflare Worker: bluish-void edge cache + CORS proxy (serves proxy.bluishvoid.com/*)
# Deploy:  wrangler deploy
# The route proxy.bluishvoid.com/* is already bound in Cloudflare, so this file
# deliberately does NOT declare routes — `wrangler deploy` just updates the
# worker code and the existing route keeps pointing at it.
#
# NOTE: `name` must match your existing worker or a new one is created instead
# of updating the live one. The dev URL in proxy-worker.js implies it's
# "bluish-void-proxy" — verify against your Cloudflare dashboard before deploying.
name = "bluish-void-proxy"
main = "proxy-worker.js"
compatibility_date = "2024-11-01"
